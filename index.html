uous _____. 模型外的規格、沙盒與驗證保護機制，講義稱 Engineering _____. 畫出 V-Model 四層對應，並解釋測試左移。 同一功能持續改進與每版新增不同功能可否並用？以本複習網站為例。 新創需求尚不明確、三週內要取得使用者回饋。選擇流程並說明代價。 Scrum 會議都正常，但每次改需求都引發大量回歸錯誤。診斷並提出兩項工程改善。"}, {"id": "courses/advanced-software-engineering/reviews/chapter-03", "path": "/ase/tests/3", "title": "第3章期中複習測驗", "short": "需求工程", "desc": "本題庫為依講義重新編寫的 AI 練習題，不代表教師正式考卷。英文敘述、術語填空與圖表判讀參考 EXAM-001 的可見題型。每題 pages 指本章講義 PDF 頁次。", "courseId": "advanced-software-engineering", "sectionId": "reviews", "kind": "quiz", "status": "needs-review", "source": "ASE-003", "pages": 71, "questions": [{"type": "choice", "prompt": "「系統應每月提供藥品費用報表」與「最後工作日依指定格式、資料量與期限產製」主要差別？", "options": ["前者一定 FR，後者一定領域", "後者不用驗收", "前者較高階，後者是詳細系統規格", "只有後者才算需求"], "answer": 2, "explanation": "使用者需求與系統需求按抽象與精確程度區分，不是簡單按功能／非功能區分。", "pages": [8, 9, 11], "level": "理解", "id": "ASE-C3-Q01", "source": "ASE-003"}, {"type": "choice", "prompt": "「使用者可送出取消申請」最直接指定？", "options": ["Functional Requirement", "只有儲存容量", "只有開發語言政策", "沒有任何需求"], "answer": 0, "explanation": "描述系統應提供的服務或行為是 FR。取消是否合法、退款條件仍需另定。", "pages": [15, 16], "level": "理解", "id": "ASE-C3-Q02", "source": "ASE-003"}, {"type": "choice", "prompt": "題目明說公司內規要求所有變更先經 PR 審查，依 NFR 來源分類是？", "options": ["Product", "External", "只有領域物理定律", "Organizational"], "answer": 3, "explanation": "要求來自組織內部工程政策，因此是 Organizational。", "pages": [22, 23, 24], "level": "理解", "id": "ASE-C3-Q03", "source": "ASE-003"}, {"type": "choice", "prompt": "題目要求醫療系統符合 HIPAA 等外部法規，依 NFR 來源分類是？", "options": ["Product", "External", "Organizational", "只要有英文就不是需求"], "answer": 1, "explanation": "題幹指向外部法規，因此選 External。本題不判斷實際法律適用。", "pages": [24], "level": "理解", "id": "ASE-C3-Q04", "source": "ASE-003"}, {"type": "choice", "prompt": "為何要到真實工作場所使用 Ethnography？", "options": ["可自動寫完整程式", "能保證需求不再變", "觀察習以為常而未說出的工作細節", "比所有其他方法永遠便宜"], "answer": 2, "explanation": "民族誌補足訪談未能表達的內隱知識與非正式流程。", "pages": [38, 42, 45], "level": "理解", "id": "ASE-C3-Q05", "source": "ASE-003"}, {"type": "choice", "prompt": "客戶指定區塊鏈，但無法說明原因。訪談較應先做？", "options": ["直接開始寫合約", "以 5 Whys 問出真正的防竄改或稽核需求", "拒絕再談任何需求", "把該要求當作已驗證真理"], "answer": 1, "explanation": "先問問題與業務原因，避免過早錨定特定技術。", "pages": [37, 44], "level": "理解", "id": "ASE-C3-Q06", "source": "ASE-003"}, {"type": "choice", "prompt": "一條需求允許備餐後取消，另一條禁止同一條件取消。哪項檢查最直接？", "options": ["Consistency", "只有 Realism", "只有 Completeness", "只有字體一致"], "answer": 0, "explanation": "同一條件的互相矛盾屬一致性問題；完整性則關心遺漏。", "pages": [16, 54, 56], "level": "理解", "id": "ASE-C3-Q07", "source": "ASE-003"}, {"type": "choice", "prompt": "「介面應極度直覺」主要欠缺哪一項？", "options": ["只有系統邊界", "只有 Stakeholder 名字", "只有資料表數量", "Verifiability"], "answer": 3, "explanation": "沒有可觀察的成功條件或門檻，無法客觀驗收。", "pages": [25, 27, 54], "level": "理解", "id": "ASE-C3-Q08", "source": "ASE-003"}, {"type": "choice", "prompt": "哪一個 NFR 改寫最可驗證？", "options": ["任何網路下一律零延遲", "在指定資料量與負載下，95% 查詢兩秒內完成", "採用最多微服務", "讓使用者感到超級順"], "answer": 1, "explanation": "同時有測試情境、指標與門檻；數值只是本題自編示例。", "pages": [25, 27, 28], "level": "理解", "id": "ASE-C3-Q09", "source": "ASE-003"}, {"type": "choice", "prompt": "變更一項需求前，先查哪些程式、設計與測試會受影響，最需要？", "options": ["只查程式行數", "只查設計師喜好", "Traceability 與 Impact Analysis", "刪除所有舊需求 ID"], "answer": 2, "explanation": "唯一 ID 與追溯鏈支援評估變更影響；不能只改文字而不更新相依工件。", "pages": [57, 58, 59], "level": "理解", "id": "ASE-C3-Q10", "source": "ASE-003"}, {"type": "fill", "prompt": "Detailed technical specifications for engineers are _____ Requirements. Fill in one English word.", "answers": ["System"], "explanation": "與使用者高階需求相較，系統需求提供精確的實作與驗收基準。", "pages": [8, 9], "level": "識記", "id": "ASE-C3-Q11", "source": "ASE-003"}, {"type": "fill", "prompt": "Requirements checks: Validity, _____, Completeness, Realism, Verifiability. 填入「無互相矛盾」的英文。", "answers": ["Consistency"], "explanation": "Consistency 關心條文相容；Completeness 關心是否遺漏。", "pages": [54], "level": "識記", "id": "ASE-C3-Q12", "source": "ASE-003"}, {"type": "fill", "prompt": "現場觀察挖掘習以為常的內隱知識，英文方法是 _____.", "answers": ["Ethnography"], "explanation": "不是只靠訪談問題清單，而是觀察實際工作脈絡。", "pages": [38], "level": "識記", "id": "ASE-C3-Q13", "source": "ASE-003"}, {"type": "fill", "prompt": "User story 的驗收準則格式：Given–When–_____.", "answers": ["Then"], "explanation": "Then 應描述可觀察結果，與前置情境及事件連接。", "pages": [39], "level": "識記", "id": "ASE-C3-Q14", "source": "ASE-003"}, {"type": "fill", "prompt": "Requirements Traceability Matrix 的縮寫為 _____.", "answers": ["RTM"], "explanation": "追溯矩陣將需求連到實作與測試，支援覆蓋與影響分析。", "pages": [57, 70], "level": "識記", "id": "ASE-C3-Q15", "source": "ASE-003"}, {"type": "fill", "prompt": "AI 提議後仍由人審核需求，稱 Human-in-the-_____.", "answers": ["Loop"], "explanation": "人類應驗證規則、領域假設與例外，不能將模擬當成真實訪談。", "pages": [66, 68], "level": "識記", "id": "ASE-C3-Q16", "source": "ASE-003"}, {"type": "written", "prompt": "為校園選課系統各寫一項 FR 與可驗證 NFR，並解釋為何不同。", "model": "FR：系統應允許學生依課號查詢剩餘名額。NFR：在指定資料集與 100 人並行負載、固定測試網路下，95% 查詢於兩秒內返回完整結果。前者定義服務，後者限制服務品質；數值是自訂示例。", "rubric": ["FR 是具體服務", "NFR 有條件、指標與門檻", "說明功能與品質的區別"], "pages": [15, 20, 25, 27], "level": "應用", "id": "ASE-C3-Q17", "source": "ASE-003"}, {"type": "written", "prompt": "審查「系統必須即時完成所有配送；外送員必須接單也可拒絕；任何天候都保證十分鐘到達」。至少指出三種問題。", "model": "即時沒有量測標準→可驗證性；同一條件必須接與可拒絕→一致性；任何天候十分鐘→現實性；也可指出未定義無人接單等例外→完整性。應具體釐清條件與例外。", "rubric": ["至少三種問題", "每種問題對到正確英文檢查項目", "指出需補充的條件或改寫方向"], "pages": [54, 56], "level": "應用", "id": "ASE-C3-Q18", "source": "ASE-003"}, {"type": "written", "prompt": "訪談發現使用者描述的流程與現場不同，如何補強需求擷取？", "model": "安排現場觀察或情境脈絡探詢，記錄實際行為與非正式捷徑，再以訪談詢問原因，必要時用原型共同確認。觀察可揭露內隱知識，但仍要和多方驗證，不能假設一人習慣代表全部規則。", "rubric": ["選擇觀察並說明價值", "說明與訪談或原型互補", "不把單一觀察當全面結論"], "pages": [36, 38, 39, 42], "level": "應用", "id": "ASE-C3-Q19", "source": "ASE-003"}, {"type": "written", "prompt": "需求變更「取消需退款」改為「僅特定時間可退款」，如何使用 RTM？", "model": "沿需求 ID 找出取消政策、狀態機、退款服務與測試。檢查時間邊界與例外、評估成本並核准，再同步改需求、圖、實作與正常／邊界／拒絕退款測試，保留追溯紀錄。", "rubric": ["以需求 ID 查設計／程式／測試", "先影響分析與核准", "同步更新並保留變更紀錄"], "pages": [57, 58], "level": "應用", "id": "ASE-C3-Q20", "source": "ASE-003"}], "trackReading": false, "metadata": {"id": "ASE-REVIEW-03", "title": "第3章期中複習測驗", "course": "advanced-software-engineering", "type": "review" ": "2026-11-06", "sources": ["HS-001", "HS-003"], "tags": ["硬體安全", "課程"]}, "file": "Hardware Security Introduction.pdf", "readKey": "hs-lesson-1", "quizKey": "courses/hardware-security/lessons/01-introduction", "recordChapter": "courses/hardware-security/lessons/01-introduction", "lessonPath": "/hs/lessons/1", "html": "\u003ch1\u003e硬體安全導論與威脅模型\u003c/h1\u003e\n\u003ch2 id=\"p-974bb0bbb807-s1\"\u003e先抓住這門課的問題\u003c/h2\u003e\n\u003cp\u003e密碼演算法在數學上難以破解，不代表執行它的裝置不會洩漏資訊。硬體安全（Hardware Security）把觀察範圍從程式輸入與輸出，擴大到實體裝置的功耗、時間、電磁訊號與異常行為。重點是「實作是否保住了演算法的假設」。\u003ca href=\"#/sources/hs-001\"\u003eHS-001，PDF p.2–8、25–36\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e資訊安全的 CIA 三要素：機密性（Confidentiality）保護資訊不被未授權得知；完整性（Integrity）避免未授權修改；可用性（Availability）確保服務能使用。資產可能是金鑰、韌體、設計 IP，也可能是服務能力。\u003ca href=\"#/sources/hs-001\"\u003eHS-001，PDF p.2–8\u003c/a\u003e\u003c/p\u003e\n\u003ch2 id=\"p-974bb0bbb807-s2\"\u003e威脅模型：先說清楚誰能做什麼\u003c/h2\u003e\n\u003cp\u003e威脅模型（Threat Model）要回答保護什麼、對手想得到什麼、能接觸什麼、具有多少設備與時間。對手只看遠端回應，與能長時間持有實體裝置，是兩種不同假設。安全成本必須與資產價值、實作成本與攻擊者資源一起考量。\u003ca href=\"#/sources/hs-001\"\u003eHS-001，PDF p.9–11\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e自編理解例子\u003c/strong\u003e：校園借用卡的資產是認證金鑰；「知道演算法」不等於「知道金鑰」；「持有一張卡」也不等於「可讀出晶片內全部狀態」。說明防禦效果前，應先界定允許對手觀察與控制的介面。\u003c/p\u003e\n\u003ch2 id=\"p-974bb0bbb807-s3\"\u003e分類有兩條軸，不能混在一起\u003c/h2\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e分類軸\u003c/th\u003e\n\u003cth\u003e類別\u003c/th\u003e\n\u003cth\u003e判讀重點\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e是否改變正常執行\u003c/td\u003e\n\u003ctd\u003e被動 Passive\u003c/td\u003e\n\u003ctd\u003e觀察運算留下的訊號\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e是否改變正常執行\u003c/td\u003e\n\u003ctd\u003e主動 Active\u003c/td\u003e\n\u003ctd\u003e刻意擾動執行或輸入條件\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e接觸程度\u003c/td\u003e\n\u003ctd\u003e侵入式 Invasive\u003c/td\u003e\n\u003ctd\u003e暴露並直接接觸晶片內部結構\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e接觸程度\u003c/td\u003e\n\u003ctd\u003e半侵入式 Semi-invasive\u003c/td\u003e\n\u003ctd\u003e暴露晶片但不直接接觸內部導線\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e接觸程度\u003c/td\u003e\n\u003ctd\u003e非侵入式 Non-invasive\u003c/td\u003e\n\u003ctd\u003e不需暴露晶片內部，可從外部量測或互動\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e被動／主動和侵入程度是不同維度。功耗分析通常是被動側通道；故障注入（Fault Injection）屬於主動擾動。不要把「非侵入」誤認成「被動」或「沒有風險」。\u003ca href=\"#/sources/hs-001\"\u003eHS-001，PDF p.16–24\u003c/a\u003e\u003c/p\u003e\n\u003ch2 id=\"p-974bb0bbb807-s4\"\u003e側通道、SPA 與統計分析\u003c/h2\u003e\n\u003cp\u003e側通道（Side Channel）利用正常功能之外、與內部運算相關的可觀察資訊。相同明文與金鑰決定中間值，中間值與電路切換有關，切換再影響功耗。這條關係不代表每個時間點都能清楚看見秘密。\u003ca href=\"#/sources/hs-001\"\u003eHS-001，PDF p.26–36\u003c/a\u003e\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e方法\u003c/th\u003e\n\u003cth\u003e核心想法\u003c/th\u003e\n\u003cth\u003e需要注意\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e簡單功耗分析 SPA\u003c/td\u003e\n\u003ctd\u003e從少量波形辨認操作或流程差異\u003c/td\u003e\n\u003ctd\u003e很依賴實作知識與可辨識的訊號\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e差分功耗分析 DPA\u003c/td\u003e\n\u003ctd\u003e對多條軌跡依中間值假設分組後比較\u003c/td\u003e\n\u003ctd\u003e需有合適的統計量與資料關聯\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e模板分析 Profiling\u003c/td\u003e\n\u003ctd\u003e用參考裝置學習條件機率分布\u003c/td\u003e\n\u003ctd\u003e參考與目標裝置的分布可能不同\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eDPA 與 CPA 的細節在\u003ca href=\"#/hs/lessons/5\"\u003e第五主題\u003c/a\u003e，模板的額外假設在\u003ca href=\"#/hs/lessons/6\"\u003e第六主題\u003c/a\u003e。這裡的區別是觀察方式與先驗知識，不是保證需要幾條軌跡。\u003ca href=\"#/sources/hs-001\"\u003eHS-001，PDF p.35–36\u003c/a\u003e\u003c/p\u003e\n\u003ch2 id=\"p-974bb0bbb807-s5\"\u003e防禦方法要對照洩漏來源\u003c/h2\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e方法\u003c/th\u003e\n\u003cth\u003e主要方向\u003c/th\u003e\n\u003cth\u003e限制與代價\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e隱藏 Hiding\u003c/td\u003e\n\u003ctd\u003e降低資料與觀測訊號的關聯，例如增加雜訊或打散時間\u003c/td\u003e\n\u003ctd\u003e額外成本；可能仍被平均或重新對齊\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e遮罩 Masking\u003c/td\u003e\n\u003ctd\u003e用隨機分享值改變中間表示\u003c/td\u003e\n\u003ctd\u003e正確性與獨立性假設重要；非所有階數都自動安全\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e分區 Partitioning\u003c/td\u003e\n\u003ctd\u003e隔離敏感區域的電源、時脈或測試介面\u003c/td\u003e\n\u003ctd\u003e需看實際隔離邊界與交互作用\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e抗竄改 Anti-tamper\u003c/td\u003e\n\u003ctd\u003e偵測或提高實體存取成本\u003c/td\u003e\n\u003ctd\u003e效果依威脅模型與環境而定\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e降低功耗洩漏不表示電磁洩漏也完全消失；加入雜訊也不等於已證明沒有洩漏。評估要指出量測管道、模型與條件。\u003ca href=\"#/sources/hs-001\"\u003eHS-001，PDF p.28–43\u003c/a\u003e\u003c/p\u003e\n\u003ch2 id=\"p-974bb0bbb807-s6\"\u003e與後續主題、作業的關係\u003c/h2\u003e\n\u003cp\u003e先用\u003ca href=\"#/hs/lessons/2\"\u003e密碼學與 AES\u003c/a\u003e理解中間值，再用\u003ca href=\"#/hs/lessons/3\"\u003eIC 功耗\u003c/a\u003e理解物理來源，\u003ca href=\"#/hs/lessons/4\"\u003e統計主題\u003c/a\u003e則解釋如何把訊號與雜訊分開。作業一量化特定 AES 中間值的洩漏，作業二比較候選模型與量測資料。\u003ca href=\"#/sources/hs-003\"\u003eHS-001，PDF p.26–36；HS-003，PDF p.28–36\u003c/a\u003e\u003c/p\u003e\n\u003ch2 id=\"p-974bb0bbb807-s7\"\u003e名詞與回想\u003c/h2\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e名詞\u003c/th\u003e\n\u003cth\u003e要能說出的重點\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003eThreat Model\u003c/td\u003e\n\u003ctd\u003e資產、對手能力、接觸範圍與資源\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eSide-channel Leakage\u003c/td\u003e\n\u003ctd\u003e實作所產生、與內部資訊相關的外部訊號\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eHiding／Masking\u003c/td\u003e\n\u003ctd\u003e改變可觀測訊號／改變中間值表示\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eMCU／FPGA／ASIC\u003c/td\u003e\n\u003ctd\u003e軟體執行平台／可重組邏輯／專用積體電路\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e\u003cstrong\u003e自我回想\u003c/strong\u003e：為什麼數學安全與實作安全需要分開？為什麼不能只用「非侵入式」描述完整威脅模型？名詞依 HS-001 PDF p.9–17、37–43 整理。\u003c/p\u003e\n\u003ch2 id=\"p-974bb0bbb807-s8\"\u003e來源與範圍\u003c/h2\u003e\n\u003cp\u003e\u003ca href=\"#/sources/hs-001\"\u003eHS-001\u003c/a\u003e：49 頁講義的主題式整理；物理攻擊案例只整理分類與假設，不逐案例展開。講義末的評分比例是 tentative，不當作本次正式作業規定。\u003c/p\u003e", "text": "# 硬體安全導論與威脅模型\n\n## 先抓住這門課的問題\n密碼演算法在數學上難以破解，不代表執行它的裝置不會洩漏資訊。硬體安全（Hardware Security）把觀察範圍從程式輸入與輸出，擴大到實體裝置的功耗、時間、電磁訊號與異常行為。重點是「實作是否保住了演算法的假設」。[HS-001，PDF p.2–8、25–36](../../../sources/hs-001.md)\n\n資訊安全的 CIA 三要素：機密性（Confidentiality）保護資訊不被未授權得知；完整性（Integrity）避免未授權修改；可用性（Availability）確保服務能使用。資產可能是金鑰、韌體、設計 IP，也可能是服務能力。[HS-001，PDF p.2–8](../../../sources/hs-001.md)\n\n## 威脅模型：先說清楚誰能做什麼\n威脅模型（Threat Model）要回答保護什麼、對手想得到什麼、能接觸什麼、具有多少設備與時間。對手只看遠端回應，與能長時間持有實體裝置，是兩種不同假設。安全成本必須與資產價值、實作成本與攻擊者資源一起考量。[HS-001，PDF p.9–11](../../../sources/hs-001.md)\n\n**自編理解例子**：校園借用卡的資產是認證金鑰；「知道演算法」不等於「知道金鑰」；「持有一張卡」也不等於「可讀出晶片內全部狀態」。說明防禦效果前，應先界定允許對手觀察與控制的介面。\n\n## 分類有兩條軸，不能混在一起\n| 分類軸 | 類別 | 判讀重點 |\n| --- | --- | --- |\n| 是否改變正常執行 | 被動 Passive | 觀察運算留下的訊號 |\n| 是否改變正常執行 | 主動 Active | 刻意擾動執行或輸入條件 |\n| 接觸程度 | 侵入式 Invasive | 暴露並直接接觸晶片內部結構 |\n| 接觸程度 | 半侵入式 Semi-invasive | 暴露晶片但不直接接觸內部導線 |\n| 接觸程度 | 非侵入式 Non-invasive | 不需暴露晶片內部，可從外部量測或互動 |\n\n被動／主動和侵入程度是不同維度。功耗分析通常是被動側通道；故障注入（Fault Injection）屬於主動擾動。不要把「非侵入」誤認成「被動」或「沒有風險」。[HS-001，PDF p.16–24](../../../sources/hs-001.md)\n\n## 側通道、SPA 與統計分析\n側通道（Side Channel）利用正常功能之外、與內部運算相關的可觀察資訊。相同明文與金鑰決定中間值，中間值與電路切換有關，切換再影響功耗。這條關係不代表每個時間點都能清楚看見秘密。[HS-001，PDF p.26–36](../../../sources/hs-001.md)\n\n| 方法 | 核心想法 | 需要注意 |\n| --- | --- | --- |\n| 簡單功耗分析 SPA | 從少量波形辨認操作或流程差異 | 很依賴實作知識與可辨識的訊號 |\n| 差分功耗分析 DPA | 對多條軌跡依中間值假設分組後比較 | 需有合適的統計量與資料關聯 |\n| 模板分析 Profiling | 用參考裝置學習條件機率分布 | 參考與目標裝置的分布可能不同 |\n\nDPA 與 CPA 的細節在[第五主題](05-dpa-cpa.md)，模板的額外假設在[第六主題](06-template-attacks.md)。這裡的區別是觀察方式與先驗知識，不是保證需要幾條軌跡。[HS-001，PDF p.35–36](../../../sources/hs-001.md)\n\n## 防禦方法要對照洩漏來源\n| 方法 | 主要方向 | 限制與代價 |\n| --- | --- | --- |\n| 隱藏 Hiding | 降低資料與觀測訊號的關聯，例如增加雜訊或打散時間 | 額外成本；可能仍被平均或重新對齊 |\n| 遮罩 Masking | 用隨機分享值改變中間表示 | 正確性與獨立性假設重要；非所有階數都自動安全 |\n| 分區 Partitioning | 隔離敏感區域的電源、時脈或測試介面 | 需看實際隔離邊界與交互作用 |\n| 抗竄改 Anti-tamper | 偵測或提高實體存取成本 | 效果依威脅模型與環境而定 |\n\n降低功耗洩漏不表示電磁洩漏也完全消失；加入雜訊也不等於已證明沒有洩漏。評估要指出量測管道、模型與條件。[HS-001，PDF p.28–43](../../../sources/hs-001.md)\n\n## 與後續主題、作業的關係\n先用[密碼學與 AES](02-cryptography.md)理解中間值，再用[IC 功耗](03-ic-power.md)理解物理來源，[統計主題](04-trace-statistics.md)則解釋如何把訊號與雜訊分開。作業一量化特定 AES 中間值的洩漏，作業二比較候選模型與量測資料。[HS-001，PDF p.26–36；HS-003，PDF p.28–36](../../../sources/hs-003.md)\n\n## 名詞與回想\n| 名詞 | 要能說出的重點 |\n| --- | --- |\n| Threat Model | 資產、對手能力、接觸範圍與資源 |\n| Side-channel Leakage | 實作所產生、與內部資訊相關的外部訊號 |\n| Hiding／Masking | 改變可觀測訊號／改變中間值表示 |\n| MCU／FPGA／ASIC | 軟體執行平台／可重組邏輯／專用積體電路 |\n\n**自我回想**：為什麼數學安全與實作安全需要分開？為什麼不能只用「非侵入式」描述完整威脅模型？名詞依 HS-001 PDF p.9–17、37–43 整理。\n\n## 來源與範圍\n[HS-001](../../../sources/hs-001.md)：49 頁講義的主題式整理；物理攻擊案例只整理分類與假設，不逐案例展開。講義末的評分比例是 tentative，不當作本次正式作業規定。\n", "headings": [{"id": "p-974bb0bbb807-s1", "text": "先抓住這門課的問題"}, {"id": "p-974bb0bbb807-s2", "text": "威脅模型：先說清楚誰能做什麼"}, {"id": "p-974bb0bbb807-s3", "text": "分類有兩條軸，不能混在一起"}, {"id": "p-974bb0bbb807-s4", "text": "側通道、SPA 與統計分析"}, {"id": "p-974bb0bbb807-s5", "text": "防禦方法要對照洩漏來源"}, {"id": "p-974bb0bbb807-s6", "text": "與後續主題、作業的關係"}, {"id": "p-974bb0bbb807-s7", "text": "名詞與回想"}, {"id": "p-974bb0bbb807-s8", "text": "來源與範圍"}], "sectionCount": 8, "searchText": "硬體安全導論與威脅模型 先抓住這門課的問題 密碼演算法在數學上難以破解，不代表執行它的裝置不會洩漏資訊。硬體安全（Hardware Security）把觀察範圍從程式輸入與輸出，擴大到實體裝置的功耗、時間、電磁訊號與異常行為。重點是「實作是否保住了演算法的假設」。 HS-001，PDF p.2–8、25–36 資訊安全的 CIA 三要素：機密性（Confidentiality）保護資訊不被未授權得知；完整性（Integrity）避免未授權修改；可用性（Availability）確保服務能使用。資產可能是金鑰、韌體、設計 IP，也可能是服務能力。 HS-001，PDF p.2–8 威脅模型：先說清楚誰能做什麼 威脅模型（Threat Model）要回答保護什麼、對手想得到什麼、能接觸什麼、具有多少設備與時間。對手只看遠端回應 : "needs-review", "created": "2026-11-06", "updated": "2026-11-06", "sources": ["HS-002", "HS-005"], "tags": ["硬體安全", "課程"]}, "file": "Hardware Security Cryptography.pdf", "readKey": "hs-lesson-2", "quizKey": "courses/hardware-security/lessons/02-cryptography", "recordChapter": "courses/hardware-security/lessons/02-cryptography", "lessonPath": "/hs/lessons/2", "html": "\u003ch1\u003e密碼學基礎與 AES\u003c/h1\u003e\n\u003ch2 id=\"p-bd78acbf2de8-s1\"\u003e先分清密碼工具的任務\u003c/h2\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e工具\u003c/th\u003e\n\u003cth\u003e解決的問題\u003c/th\u003e\n\u003cth\u003e不能直接推論\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e對稱式密碼 Symmetric Cryptography\u003c/td\u003e\n\u003ctd\u003e共享祕密金鑰下的資料加解密\u003c/td\u003e\n\u003ctd\u003e金鑰分配已經解決\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e公開金鑰密碼 Public-key Cryptography\u003c/td\u003e\n\u003ctd\u003e用不同但相關的公開與私密金鑰建立機制\u003c/td\u003e\n\u003ctd\u003e公鑰不需驗證來源\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e數位簽章 Digital Signature\u003c/td\u003e\n\u003ctd\u003e驗證訊息完整性與簽署來源\u003c/td\u003e\n\u003ctd\u003e訊息因此變成機密\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e雜湊 Hash Function\u003c/td\u003e\n\u003ctd\u003e把訊息映射為固定長度摘要\u003c/td\u003e\n\u003ctd\u003e摘要本身等於身分認證\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e混合式系統把金鑰建立與大量資料保護分工。這也是\u003ca href=\"#/hs/lessons/7\"\u003eML-KEM\u003c/a\u003e不能直接視為「把整份檔案加密」的原因。\u003ca href=\"#/sources/hs-002\"\u003eHS-002，PDF p.2–14、47–58\u003c/a\u003e\u003c/p\u003e\n\u003ch2 id=\"p-bd78acbf2de8-s2\"\u003eDH、RSA 與 ECC：困難問題不同\u003c/h2\u003e\n\u003cp\u003eDiffie–Hellman 金鑰交換在模數群中，讓雙方各保留私密指數，交換公開值後得到相同結果：\u003ccode\u003eA=g^a mod p\u003c/code\u003e、\u003ccode\u003eB=g^b mod p\u003c/code\u003e、\u003ccode\u003eK=B^a=A^b mod p\u003c/code\u003e。旁觀者能看見 A、B，但求私密指數涉及離散對數問題。基本 DH 本身不認證對方身分。\u003ca href=\"#/sources/hs-002\"\u003eHS-002，PDF p.15–23\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003eRSA 的教材模型用 \u003ccode\u003en=pq\u003c/code\u003e、\u003ccode\u003eφ(n)=(p−1)(q−1)\u003c/code\u003e，選互質的 e 並令 \u003ccode\u003eed≡1 mod φ(n)\u003c/code\u003e；加密 \u003ccode\u003ey=x^e mod n\u003c/code\u003e，解密 \u003ccode\u003ex=y^d mod n\u003c/code\u003e。這是理解數學關係的簡化模型，未包括實務填充與完整協定。\u003ca href=\"#/sources/hs-002\"\u003eHS-002，PDF p.24–30\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e橢圓曲線密碼（ECC）的運算是點加法與純量乘法 \u003ccode\u003eQ=dP\u003c/code\u003e。曲線群有無窮遠點作單位元素；\u003ccode\u003edP\u003c/code\u003e 是重複群運算，不能把它當座標逐項相乘。ECDH 利用 \u003ccode\u003ea(bP)=b(aP)\u003c/code\u003e。有限域的座標運算都受模數限制。\u003ca href=\"#/sources/hs-002\"\u003eHS-002，PDF p.31–43\u003c/a\u003e\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e機制\u003c/th\u003e\n\u003cth\u003e核心關係\u003c/th\u003e\n\u003cth\u003e課內應辨認\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003eDH\u003c/td\u003e\n\u003ctd\u003e指數運算的交換關係\u003c/td\u003e\n\u003ctd\u003e公開值與私密指數不同\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eRSA\u003c/td\u003e\n\u003ctd\u003e模指數與互逆指數\u003c/td\u003e\n\u003ctd\u003ep、q 與 n、e 的公開性不同\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eECC\u003c/td\u003e\n\u003ctd\u003e橢圓曲線群純量乘法\u003c/td\u003e\n\u003ctd\u003e點、純量與有限域元素不同\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e講義中的短金鑰範例與早期金鑰長度建議用於教學，不作當前部署建議。\u003ca href=\"#/sources/hs-002\"\u003eHS-002，PDF p.18、23–43\u003c/a\u003e\u003c/p\u003e\n\u003ch2 id=\"p-bd78acbf2de8-s3\"\u003e簽章、雜湊與隨機性\u003c/h2\u003e\n\u003cp\u003e簽章用私鑰簽署、公開金鑰驗證；驗證需重新計算訊息摘要並檢查簽章關係。教材 p.49 的 valid／invalid 條件標示相反；依驗證語意應為相等時有效、不相等時無效，不照抄排版錯字。\u003ca href=\"#/sources/hs-002\"\u003eHS-002，PDF p.47–54，本文更正說明\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e雜湊的三個性質：原像抗性（Preimage Resistance）難由摘要找原訊息；第二原像抗性（Second-preimage Resistance）難針對已知訊息找同摘要替代品；碰撞抗性（Collision Resistance）難找任意兩個不同訊息有同摘要。理想 n-bit 雜湊的通用碰撞搜尋約為 \u003ccode\u003e2^(n/2)\u003c/code\u003e，與原像搜尋不同。\u003ca href=\"#/sources/hs-002\"\u003eHS-002，PDF p.55–58\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e真正亂數產生器（TRNG）從物理過程取熵；偽亂數產生器（PRNG）從種子決定性展開；密碼學 PRNG 還要滿足不可預測性。看似均勻或通過簡單統計，不足以證明適合密碼用途。一次性密碼本（OTP）還要求真正隨機、與訊息獨立、保密、長度足夠且只用一次。\u003ca href=\"#/sources/hs-002\"\u003eHS-002，PDF p.64–70\u003c/a\u003e\u003c/p\u003e\n\u003ch2 id=\"p-bd78acbf2de8-s4\"\u003eAES 的大小、狀態與回合\u003c/h2\u003e\n\u003cp\u003eAES 是區塊密碼（Block Cipher），\u003cstrong\u003e區塊長度固定 128 bits＝16 bytes\u003c/strong\u003e；金鑰可為 128／192／256 bits，對應 10／12／14 回合。AES-256 不是處理 256-bit 區塊。狀態（State）以 4×4 bytes 表示，教材採欄優先排列，讀圖時不能將列、欄順序互換。\u003ca href=\"#/sources/hs-002\"\u003eHS-002，PDF p.71–76\u003c/a\u003e\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e階段\u003c/th\u003e\n\u003cth\u003e步驟\u003c/th\u003e\n\u003cth\u003e理解方式\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e起始\u003c/td\u003e\n\u003ctd\u003eAddRoundKey\u003c/td\u003e\n\u003ctd\u003e與第一把 round key 做 XOR\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e一般回合\u003c/td\u003e\n\u003ctd\u003eSubBytes → ShiftRows → MixColumns → AddRoundKey\u003c/td\u003e\n\u003ctd\u003e非線性替換、位置重排、欄內混合、加入金鑰\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e最後回合\u003c/td\u003e\n\u003ctd\u003eSubBytes → ShiftRows → AddRoundKey\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e沒有 MixColumns\u003c/strong\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eSubBytes 的 S-box 是非線性、一對一的 byte 替換；ShiftRows 改變 byte 位置；MixColumns 在有限域 \u003ccode\u003eGF(2^8)\u003c/code\u003e 中混合一欄。整數乘法、一般加法不能直接代替其有限域運算。\u003ca href=\"#/sources/hs-002\"\u003eHS-002，PDF p.76–81\u003c/a\u003e\u003c/p\u003e\n\u003ch2 id=\"p-bd78acbf2de8-s5\"\u003e為什麼作業選第一輪 S-box\u003c/h2\u003e\n\u003cp\u003e第一輪 AddRoundKey 後，第 b 個 byte 為 \u003ccode\u003ep_b XOR k_b\u003c/code\u003e，接著 S-box 的輸出為 \u003ccode\u003eS(p_b XOR k_b)\u003c/code\u003e。因此在 MixColumns 擴散前，一個輸出 byte 只涉及一個明文 byte 與一個 key byte。這是兩份作業的中間值來源，不表示整個 AES 能拆成互不相干的十六套加密。\u003ca href=\"#/sources/hs-005\"\u003eHS-002，PDF p.75–81；HS-005，PDF p.4、13\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003ca href=\"#/hs/assignments/1\"\u003e作業一\u003c/a\u003e使用已知實驗金鑰分組；\u003ca href=\"#/hs/assignments/2\"\u003e作業二\u003c/a\u003e則比較候選金鑰的預測與量測。兩者都依賴實作的洩漏關係。\u003ca href=\"#/sources/hs-005\"\u003eHS-005，PDF p.9–15\u003c/a\u003e\u003c/p\u003e\n\u003ch2 id=\"p-bd78acbf2de8-s6\"\u003e演算法與實作的界線\u003c/h2\u003e\n\u003cp\u003e平方乘法（Square-and-multiply）、點倍加法（Double-and-add）與查表式 S-box 都是計算同一數學結果的實作選擇。操作流程、記憶體存取與電路切換可能留下側通道；這不等同密碼數學關係被推翻。Kerckhoffs 原則要求安全性不依賴把演算法藏起來。\u003ca href=\"#/sources/hs-002\"\u003eHS-002，PDF p.28–29、41、77、82–85\u003c/a\u003e\u003c/p\u003e\n\u003ch2 id=\"p-bd78acbf2de8-s7\"\u003e來源與範圍\u003c/h2\u003e\n\u003cp\u003e\u003ca href=\"#/sources/hs-002\"\u003eHS-002\u003c/a\u003e：87 頁講義主題式重整，公式為理解用；未將舊效能表、金鑰建議或量子電腦發展敘述當作現況。\u003ca href=\"#/sources/hs-005\"\u003eHS-005\u003c/a\u003e補上作業模型的教材連結。\u003c/p\u003e", "text": "# 密碼學基礎與 AES\n\n## 先分清密碼工具的任務\n| 工具 | 解決的問題 | 不能直接推論 |\n| --- | --- | --- |\n| 對稱式密碼 Symmetric Cryptography | 共享祕密金鑰下的資料加解密 | 金鑰分配已經解決 |\n| 公開金鑰密碼 Public-key Cryptography | 用不同但相關的公開與私密金鑰建立機制 | 公鑰不需驗證來源 |\n| 數位簽章 Digital Signature | 驗證訊息完整性與簽署來源 | 訊息因此變成機密 |\n| 雜湊 Hash Function | 把訊息映射為固定長度摘要 | 摘要本身等於身分認證 |\n\n混合式系統把金鑰建立與大量資料保護分工。這也是[ML-KEM](07-pqc.md)不能直接視為「把整份檔案加密」的原因。[HS-002，PDF p.2–14、47–58](../../../sources/hs-002.md)\n\n## DH、RSA 與 ECC：困難問題不同\nDiffie–Hellman 金鑰交換在模數群中，讓雙方各保留私密指數，交換公開值後得到相同結果：`A=g^a mod p`、`B=g^b mod p`、`K=B^a=A^b mod p`。旁觀者能看見 A、B，但求私密指數涉及離散對數問題。基本 DH 本身不認證對方身分。[HS-002，PDF p.15–23](../../../sources/hs-002.md)\n\nRSA 的教材模型用 `n=pq`、`φ(n)=(p−1)(q−1)`，選互質的 e 並令 `ed≡1 mod φ(n)`；加密 `y=x^e mod n`，解密 `x=y^d mod n`。這是理解數學關係的簡化模型，未包括實務填充與完整協定。[HS-002，PDF p.24–30](../../../sources/hs-002.md)\n\n橢圓曲線密碼（ECC）的運算是點加法與純量乘法 `Q=dP`。曲線群有無窮遠點作單位元素；`dP` 是重複群運算，不能把它當座標逐項相乘。ECDH 利用 `a(bP)=b(aP)`。有限域的座標運算都受模數限制。[HS-002，PDF p.31–43](../../../sources/hs-002.md)\n\n| 機制 | 核心關係 | 課內應辨認 |\n| --- | --- | --- |\n| DH | 指數運算的交換關係 | 公開值與私密指數不同 |\n| RSA | 模指數與互逆指數 | p、q 與 n、e 的公開性不同 |\n| ECC | 橢圓曲線群純量乘法 | 點、純量與有限域元素不同 |\n\n講義中的短金鑰範例與早期金鑰長度建議用於教學，不作當前部署建議。[HS-002，PDF p.18、23–43](../../../sources/hs-002.md)\n\n## 簽章、雜湊與隨機性\n簽章用私鑰簽署、公開金鑰驗證；驗證需重新計算訊息摘要並檢查簽章關係。教材 p.49 的 valid／invalid 條件標示相反；依驗證語意應為相等時有效、不相等時無效，不照抄排版錯字。[HS-002，PDF p.47–54，本文更正說明](../../../sources/hs-002.md)\n\n雜湊的三個性質：原像抗性（Preimage Resistance）難由摘要找原訊息；第二原像抗性（Second-preimage Resistance）難針對已知訊息找同摘要替代品；碰撞抗性（Collision Resistance）難找任意兩個不同訊息有同摘要。理想 n-bit 雜湊的通用碰撞搜尋約為 `2^(n/2)`，與原像搜尋不同。[HS-002，PDF p.55–58](../../../sources/hs-002.md)\n\n真正亂數產生器（TRNG）從物理過程取熵；偽亂數產生器（PRNG）從種子決定性展開；密碼學 PRNG 還要滿足不可預測性。看似均勻或通過簡單統計，不足以證明適合密碼用途。一次性密碼本（OTP）還要求真正隨機、與訊息獨立、保密、長度足夠且只用一次。[HS-002，PDF p.64–70](../../../sources/hs-002.md)\n\n## AES 的大小、狀態與回合\nAES 是區塊密碼（Block Cipher），**區塊長度固定 128 bits＝16 bytes**；金鑰可為 128／192／256 bits，對應 10／12／14 回合。AES-256 不是處理 256-bit 區塊。狀態（State）以 4×4 bytes 表示，教材採欄優先排列，讀圖時不能將列、欄順序互換。[HS-002，PDF p.71–76](../../../sources/hs-002.md)\n\n| 階段 | 步驟 | 理解方式 |\n| --- | --- | --- |\n| 起始 | AddRoundKey | 與第一把 round key 做 XOR |\n| 一般回合 | SubBytes → ShiftRows → MixColumns → AddRoundKey | 非線性替換、位置重排、欄內混合、加入金鑰 |\n| 最後回合 | SubBytes → ShiftRows → AddRoundKey | **沒有 MixColumns** |\n\nSubBytes 的 S-box 是非線性、一對一的 byte 替換；ShiftRows 改變 byte 位置；MixColumns 在有限域 `GF(2^8)` 中混合一欄。整數乘法、一般加法不能直接代替其有限域運算。[HS-002，PDF p.76–81](../../../sources/hs-002.md)\n\n## 為什麼作業選第一輪 S-box\n第一輪 AddRoundKey 後，第 b 個 byte 為 `p_b XOR k_b`，接著 S-box 的輸出為 `S(p_b XOR k_b)`。因此在 MixColumns 擴散前，一個輸出 byte 只涉及一個明文 byte 與一個 key byte。這是兩份作業的中間值來源，不表示整個 AES 能拆成互不相干的十六套加密。[HS-002，PDF p.75–81；HS-005，PDF p.4、13](../../../sources/hs-005.md)\n\n[作業一](../assignments/assignment-01-snr.md)使用已知實驗金鑰分組；[作業二](../assignments/assignment-02-cpa.md)則比較候選金鑰的預測與量測。兩者都依賴實作的洩漏關係。[HS-005，PDF p.9–15](../../../sources/hs-005.md)\n\n## 演算法與實作的界線\n平方乘法（Square-and-multiply）、點倍加法（Double-and-add）與查表式 S-box 都是計算同一數學結果的實作選擇。操作流程、記憶體存取與電路切換可能留下側通道；這不等同密碼數學關係被推翻。Kerckhoffs 原則要求安全性不依賴把演算法藏起來。[HS-002，PDF p.28–29、41、77、82–85](../../../sources/hs-002.md)\n\n## 來源與範圍\n[HS-002](../../../sources/hs-002.md)：87 頁講義主題式重整，公式為理解用；未將舊效能表、金鑰建議或量子電腦發展敘述當作現況。[HS-005](../../../sources/hs-005.md)補上作業模型的教材連結。\n", "headings": [{"id": "p-bd78acbf2de8-s1", "text": "先分清密碼工具的任務"}, {"id": "p-bd78acbf2de8-s2", "text": "DH、RSA 與 ECC：困難問題不同"}, {"id": "p-bd78acbf2de8-s3", "text": "簽章、雜湊與隨機性"}, {"id": "p-bd78acbf2de8-s4", "text": "AES 的大小、狀態與回合"}, {"id": "p-bd78acbf2de8-s5", "text": "為什麼作業選第一輪 S-box"}, {"id": "p-bd78acbf2de8-s6", "text": "演算法與實作的界線"}, {"id": "p-bd78acbf2de8-s7", "text": "來源與範圍"}], "sectionCount": 7, "searchText": "密碼學基礎與 AES 先分清密碼工具的任務 工具 解決的問題 不能直接推論 對稱式密碼 Symmetric Cryptography 共享祕密金鑰下的資料加解密 金鑰分配已經解決 公開金鑰密碼 Public-key Cryptography 用不同但相關的公開與私密金鑰建立機制 公鑰不需驗證來源 數位簽章 Digital Signature 驗證訊息完整性與簽署來源 訊息因此變成機密 雜湊 Hash Function 把訊息映射為固定長度摘要 摘要本身等於身分認證 混合式系統把金鑰建立與大量資料保護分工。這也是 ML-KEM 不能直接視為「把整份檔案加密」的原因。 HS-002，PDF p.2–14、47–58 DH、RSA 與 ECC：困難問題不同 Diffie–Hellman 金鑰交換在模數群中，讓雙方各保留私密指數，交換公開值後得到相同結果： A=g^a mod p 、 B=g^b mod p 、 K=B^a=A^b mod p 。旁觀者能看見 A、B，但求私密指數涉及離散對數問題。基本 DH 本身不認證對方身分。 HS-002，PDF p.15–23 RSA 的教材模型用 n=pq 、 φ(n)=(p−1)(q−1) ，選互質的 e 並令 ed≡1 mod φ(n) ；加密 y=x^e mod n ，解密 x=y^d mod n 。這是理解數學關係的簡化模型，未包括實務填充與完整協定。 HS-002，PDF p.24–30 橢圓曲線密碼（ECC）的運算是點加法與純量乘法 Q=dP 。曲線群有無窮遠點作單位元素； dP 是重複群運算，不能把它當座標逐項相乘。ECDH 利用 a(bP)=b(aP) 。有限域的座標運算都受模數限制。 HS-002，PDF p.31–43 機制 核心關係 課內應辨認 DH 指數運算的交換關係 公開值與私密指數不同 RSA 模指數與互逆指數 p、q 與 n、e 的公開性不同 ECC 橢圓曲線群純量乘法 點、純量與有限域元素不同 講義中的短金鑰範例與早期金鑰長度建議用於教學，不作當前部署建議。 HS-002，PDF p.18、23–43 簽章、雜湊與隨機性 簽章用私鑰簽署、公開金鑰驗證；驗證需重新計算訊息摘要並檢查簽章關係。教材 p.49 的 valid／invalid 條件標示相反；依驗證語意應為相等時有效、不相等時無效，不照抄排版錯字。 HS-002，PDF p.47–54，本文更正說明 雜湊的三個性質：原像抗性（Preimage Resistance）難由摘要找原訊息；第二原像抗性（Second-preimage Resistance）難針對已知訊息找同摘要替代品；碰撞抗性（Collision Resistance）難找任意兩個不同訊息有同摘要。理想 n-bit 雜湊的通用碰撞搜尋約為 2^(n/2) ，與原像搜尋不同。 HS-002，PDF p.55–58 真正亂數產生器（TRNG）從物理過程取熵；偽亂數產生器（PRNG）從種子決定性展開；密碼學 PRNG 還要滿足不可預測性。看似均勻或通過簡單統計，不足以證明適合密碼用途。一次性密碼本（OTP）還要求真正隨機、與訊息獨立、保密、長度足夠且只用一次。 HS-002，PDF \u003e同一段演算法可由微控制器（MCU）的指令序列、FPGA 的可重組邏輯或 ASIC 的專用電路執行。硬體設計從行為描述、暫存器傳輸層（RTL）、邏輯閘到電晶體，各層保留的資訊不同。只有高階演算法，通常無法精準預測某個時間點的實際電流。\u003ca href=\"#/sources/hs-003\"\u003eHS-003，PDF p.3–12\u003c/a\u003e\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e抽象層\u003c/th\u003e\n\u003cth\u003e主要描述\u003c/th\u003e\n\u003cth\u003e功耗分析的限制\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e行為／RTL\u003c/td\u003e\n\u003ctd\u003e資料操作、暫存器與週期\u003c/td\u003e\n\u003ctd\u003e不含所有實體延遲與寄生效應\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e邏輯閘\u003c/td\u003e\n\u003ctd\u003e布林閘、連線與切換\u003c/td\u003e\n\u003ctd\u003e需更多時序資訊才能分析毛刺\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e電晶體／實體\u003c/td\u003e\n\u003ctd\u003e元件、負載、電壓與時序\u003c/td\u003e\n\u003ctd\u003e精細但建模與運算成本高\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eASIC 的標準元件（Standard Cell）可含組合與循序電路；FPGA 使用可組態資源實作邏輯。不要把 FPGA 直接視為另一個用同樣指令集跑程式的 CPU。\u003ca href=\"#/sources/hs-003\"\u003eHS-003，PDF p.7–12\u003c/a\u003e\u003c/p\u003e\n\u003ch2 id=\"p-31cc0a2ab556-s2\"\u003eCMOS 為什麼會耗電\u003c/h2\u003e\n\u003cp\u003eCMOS 互補的 PMOS／NMOS 網路，在理想穩態下沒有持續的直通路徑，但真實元件仍有漏電（Leakage）。輸出轉換時會對負載電容充放電，切換瞬間也可能出現短路電流。\u003ca href=\"#/sources/hs-003\"\u003eHS-003，PDF p.13–22\u003c/a\u003e\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e功耗來源\u003c/th\u003e\n\u003cth\u003e何時出現\u003c/th\u003e\n\u003cth\u003e與資料的關係\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e靜態功耗 Static Power\u003c/td\u003e\n\u003ctd\u003e即使沒有邏輯切換仍可能存在\u003c/td\u003e\n\u003ctd\u003e受元件狀態與製程等影響\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e充放電功耗 Charging Power\u003c/td\u003e\n\u003ctd\u003e節點電容充放電\u003c/td\u003e\n\u003ctd\u003e切換活動與資料模式相關\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e短路功耗 Short-circuit Power\u003c/td\u003e\n\u003ctd\u003e轉換時上下網路短暫同時導通\u003c/td\u003e\n\u003ctd\u003e與轉換時間與電路條件相關\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e毛刺 Glitch\u003c/td\u003e\n\u003ctd\u003e不同路徑延遲造成暫時切換\u003c/td\u003e\n\u003ctd\u003e實際切換次數可多於功能模型預測\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e「CMOS 靜態功耗低」與「功耗永遠為零」不同；「結果最後沒有變」也不代表中間完全沒有切換。\u003ca href=\"#/sources/hs-003\"\u003eHS-003，PDF p.14–23\u003c/a\u003e\u003c/p\u003e\n\u003ch2 id=\"p-31cc0a2ab556-s3\"\u003e充放電公式怎麼讀\u003c/h2\u003e\n\u003cp\u003e教材的集總電容模型中，完整 \u003ccode\u003e0→1→0\u003c/code\u003e 循環由電源取得的能量為 \u003ccode\u003eC_L V_DD²\u003c/code\u003e；其中充電後存於電容的是 \u003ccode\u003e½ C_L V_DD²\u003c/code\u003e。不要把儲存能量和完整循環消耗混為一談。\u003ca href=\"#/sources/hs-003\"\u003eHS-003，PDF p.19–20\u003c/a\u003e\u003c/p\u003e\n\u003cdiv class=\"formula\"\u003eP_charging ≈ α · f · C_L · V_DD²\u003c/div\u003e\n\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e變數\u003c/th\u003e\n\u003cth\u003e意義／單位\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003eα\u003c/td\u003e\n\u003ctd\u003e平均每週期的 0→1 轉換次數，依教材定義\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003ef\u003c/td\u003e\n\u003ctd\u003e時脈頻率，Hz\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eC_L\u003c/td\u003e\n\u003ctd\u003e負載電容，F\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eV_DD\u003c/td\u003e\n\u003ctd\u003e供應電壓，V\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eP\u003c/td\u003e\n\u003ctd\u003e平均功率，W\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e活動因子若改成「所有邊緣的轉換比例」，公式常數可能不同，所以不能只背 α 的符號。公式也沒有包括所有漏電、短路與毛刺細節。\u003ca href=\"#/sources/hs-003\"\u003eHS-003，PDF p.16–23，公式解讀\u003c/a\u003e\u003c/p\u003e\n\u003ch2 id=\"p-31cc0a2ab556-s4\"\u003eHW 與 HD：兩個不同的模型\u003c/h2\u003e\n\u003cp\u003e漢明重量（Hamming Weight，HW）計算一個位元字中 1 的數量；漢明距離（Hamming Distance，HD）計算兩個值相差幾個位元：\u003ccode\u003eHD(a,b)=HW(a XOR b)\u003c/code\u003e。\u003ca href=\"#/sources/hs-003\"\u003eHS-003，PDF p.28–29\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e自編例子\u003c/strong\u003e：\u003ccode\u003eHW(0011)=2\u003c/code\u003e；由 \u003ccode\u003e0011\u003c/code\u003e 變成 \u003ccode\u003e0101\u003c/code\u003e 時，XOR 是 \u003ccode\u003e0110\u003c/code\u003e，因此 HD＝2。值本身有多少個 1，與從舊值到新值切換幾次，回答的是不同問題。\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e模型\u003c/th\u003e\n\u003cth\u003e需要的資訊\u003c/th\u003e\n\u003cth\u003e簡化假設\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003eHW\u003c/td\u003e\n\u003ctd\u003e被處理的資料值\u003c/td\u003e\n\u003ctd\u003e以 1 的數量近似洩漏\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eHD\u003c/td\u003e\n\u003ctd\u003e舊值與新值，以及可能的暫存器關係\u003c/td\u003e\n\u003ctd\u003e以位元翻轉數近似洩漏\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e兩者通常都忽略各導線不同權重及毛刺。哪個較適合，取決於實作與觀察時間，不是 HW 一定勝過 HD。\u003ca href=\"#/sources/hs-003\"\u003eHS-003，PDF p.28–29\u003c/a\u003e\u003c/p\u003e\n\u003ch2 id=\"p-31cc0a2ab556-s5\"\u003e怎麼看一條功耗軌跡\u003c/h2\u003e\n\u003cp\u003e功耗軌跡（Power Trace）是一段運算隨時間取樣的訊號；第 i 條軌跡包含多個 sample points。觸發位置、取樣率、時脈、對齊與量測管道都會影響波形。sample index 本身沒有秒的單位，缺取樣率時不能自行把第 1000 點換成微秒。\u003ca href=\"#/sources/hs-003\"\u003eHS-003，PDF p.30–36；本文資料解讀\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e教材微控制器的序列執行與硬體 AES 的平行運算圖，是不同平台的例子；圖中的週期數不能直接套用到所有 AES 或 ChipWhisperer Nano。平行運算、其他模組切換、電子雜訊與濾波效應會混合訊號。\u003ca href=\"#/sources/hs-003\"\u003eHS-003，PDF p.31–36\u003c/a\u003e\u003c/p\u003e\n\u003ch2 id=\"p-31cc0a2ab556-s6\"\u003e連回作業\u003c/h2\u003e\n\u003cp\u003e作業一用 HW 類別解釋訊號，模型只是近似；SNR 不高可能涉及模型、時間位置與雜訊。先讀\u003ca href=\"#/hs/lessons/4\"\u003e統計主題\u003c/a\u003e區分變異來源，再看\u003ca href=\"#/hs/assignments/1\"\u003e作業一\u003c/a\u003e的資料欄位與實際儲存圖。\u003ca href=\"#/sources/hs-004\"\u003eHS-003，PDF p.28–36；HS-004，PDF p.9–12\u003c/a\u003e\u003c/p\u003e\n\u003ch2 id=\"p-31cc0a2ab556-s7\"\u003e來源與範圍\u003c/h2\u003e\n\u003cp\u003e\u003ca href=\"#/sources/hs-003\"\u003eHS-003\u003c/a\u003e：36 頁；重點為功耗的物理來源、模型與量測語意，不把教材硬體平台當作使用者裝置實測設定。\u003c/p\u003e", "text": "# IC 設計與功耗來源\n\n## 從運算走到實體電路\n同一段演算法可由微控制器（MCU）的指令序列、FPGA 的可重組邏輯或 ASIC 的專用電路執行。硬體設計從行為描述、暫存器傳輸層（RTL）、邏輯閘到電晶體，各層保留的資訊不同。只有高階演算法，通常無法精準預測某個時間點的實際電流。[HS-003，PDF p.3–12](../../../sources/hs-003.md)\n\n| 抽象層 | 主要描述 | 功耗分析的限制 |\n| --- | --- | --- |\n| 行為／RTL | 資料操作、暫存器與週期 | 不含所有實體延遲與寄生效應 |\n| 邏輯閘 | 布林閘、連線與切換 | 需更多時序資訊才能分析毛刺 |\n| 電晶體／實體 | 元件、負載、電壓與時序 | 精細但建模與運算成本高 |\n\nASIC 的標準元件（Standard Cell）可含組合與循序電路；FPGA 使用可組態資源實作邏輯。不要把 FPGA 直接視為另一個用同樣指令集跑程式的 CPU。[HS-003，PDF p.7–12](../../../sources/hs-003.md)\n\n## CMOS 為什麼會耗電\nCMOS 互補的 PMOS／NMOS 網路，在理想穩態下沒有持續的直通路徑，但真實元件仍有漏電（Leakage）。輸出轉換時會對負載電容充放電，切換瞬間也可能出現短路電流。[HS-003，PDF p.13–22](../../../sources/hs-003.md)\n\n| 功耗來源 | 何時出現 | 與資料的關係 |\n| --- | --- | --- |\n| 靜態功耗 Static Power | 即使沒有邏輯切換仍可能存在 | 受元件狀態與製程等影響 |\n| 充放電功耗 Charging Power | 節點電容充放電 | 切換活動與資料模式相關 |\n| 短路功耗 Short-circuit Power | 轉換時上下網路短暫同時導通 | 與轉換時間與電路條件相關 |\n| 毛刺 Glitch | 不同路徑延遲造成暫時切換 | 實際切換次數可多於功能模型預測 |\n\n「CMOS 靜態功耗低」與「功耗永遠為零」不同；「結果最後沒有變」也不代表中間完全沒有切換。[HS-003，PDF p.14–23](../../../sources/hs-003.md)\n\n## 充放電公式怎麼讀\n教材的集總電容模型中，完整 `0→1→0` 循環由電源取得的能量為 `C_L V_DD²`；其中充電後存於電容的是 `½ C_L V_DD²`。不要把儲存能量和完整循環消耗混為一談。[HS-003，PDF p.19–20](../../../sources/hs-003.md)\n\n\u003cdiv class=\"formula\"\u003eP_charging ≈ α · f · C_L · V_DD²\u003c/div\u003e\n\n| 變數 | 意義／單位 |\n| --- | --- |\n| α | 平均每週期的 0→1 轉換次數，依教材定義 |\n| f | 時脈頻率，Hz |\n| C_L | 負載電容，F |\n| V_DD | 供應電壓，V |\n| P | 平均功率，W |\n\n活動因子若改成「所有邊緣的轉換比例」，公式常數可能不同，所以不能只背 α 的符號。公式也沒有包括所有漏電、短路與毛刺細節。[HS-003，PDF p.16–23，公式解讀](../../../sources/hs-003.md)\n\n## HW 與 HD：兩個不同的模型\n漢明重量（Hamming Weight，HW）計算一個位元字中 1 的數量；漢明距離（Hamming Distance，HD）計算兩個值相差幾個位元：`HD(a,b)=HW(a XOR b)`。[HS-003，PDF p.28–29](../../../sources/hs-003.md)\n\n**自編例子**：`HW(0011)=2`；由 `0011` 變成 `0101` 時，XOR 是 `0110`，因此 HD＝2。值本身有多少個 1，與從舊值到新值切換幾次，回答的是不同問題。\n\n| 模型 | 需要的資訊 | 簡化假設 |\n| --- | --- | --- |\n| HW | 被處理的資料值 | 以 1 的數量近似洩漏 |\n| HD | 舊值與新值，以及可能的暫存器關係 | 以位元翻轉數近似洩漏 |\n\n兩者通常都忽略各導線不同權重及毛刺。哪個較適合，取決於實作與觀察時間，不是 HW 一定勝過 HD。[HS-003，PDF p.28–29](../../../sources/hs-003.md)\n\n## 怎麼看一條功耗軌跡\n功耗軌跡（Power Trace）是一段運算隨時間取樣的訊號；第 i 條軌跡包含多個 sample points。觸發位置、取樣率、時脈、對齊與量測管道都會影響波形。sample index 本身沒有秒的單位，缺取樣率時不能自行把第 1000 點換成微秒。[HS-003，PDF p.30–36；本文資料解讀](../../../sources/hs-003.md)\n\n教材微控制器的序列執行與硬體 AES 的平行運算圖，是不同平台的例子；圖中的週期數不能直接套用到所有 AES 或 ChipWhisperer Nano。平行運算、其他模組切換、電子雜訊與濾波效應會混合訊號。[HS-003，PDF p.31–36](../../../sources/hs-003.md)\n\n## 連回作業\n作業一用 HW 類別解釋訊號，模型只是近似；SNR 不高可能涉及模型、時間位置與雜訊。先讀[統計主題](04-trace-statistics.md)區分變異來源，再看[作業一](../assignments/assignment-01-snr.md)的資料欄位與實際儲存圖。[HS-003，PDF p.28–36；HS-004，PDF p.9–12](../../../sources/hs-004.md)\n\n## 來源與範圍\n[HS-003](../../../sources/hs-003.md)：36 頁；重點為功耗的物理來源、模型與量測語意，不把教材硬體平台當作使用者裝置實測設定。\n", "headings": [{"id": "p-31cc0a2ab556-s1", "text": "從運算走到實體電路"}, {"id": "p-31cc0a2ab556-s2", "text": "CMOS 為什麼會耗電"}, {"id": "p-31cc0a2ab556-s3", "text": "充放電公式怎麼讀"}, {"id": "p-31cc0a2ab556-s4", "text": "HW 與 HD：兩個不同的模型"}, {"id": "p-31cc0a2ab556-s5", "text": "怎麼看一條功耗軌跡"}, {"id": "p-31cc0a2ab556-s6", "text": "連回作業"}, {"id": "p-31cc0a2ab556-s7", "text": "來源與範圍"}], "sectionCount": 7, "searchText": "IC 設計與功耗來源 從運算走到實體電路 同一段演算法可由微控制器（MCU）的指令序列、FPGA 的可重組邏輯或 ASIC 的專用電路執行。硬體設計從行為描述、暫存器傳輸層（RTL）、邏輯閘到電晶體，各層保留的資訊不同。只有高階演算法，通常無法精準預測某個時間點的實際電流。 HS-003，PDF p.3–12 抽象層 主要描述 功耗分析的限制 行為／RTL 資料操作、暫存器與週期 不含所有實體延遲與寄生效應 邏輯閘 布林閘、連線與切換 需更多時序資訊才能分析毛刺 電晶體／實體 元件、負載、電壓與時序 精細但建模與運算成本高 ASIC 的標準元件（Standard Cell）可含組合與循序電路；FPGA 使用可組態資源實作邏輯。不要把 FPGA 直接視為另一個用同樣指令集跑程式的 CPU。 HS-003，PDF p.7–12 CMOS 為什麼會耗電 CMOS 互補的 PMOS／NMOS 網路，在理想穩態下沒有持續的直通路徑，但真實元件仍有漏電（Leakage）。輸出轉換時會對負載電容充放電，切換瞬間也可能出現短路電流。 HS-003，PDF p.13–22 功耗來源 何時出現 與資料的關係 靜態功耗 Static Power 即使沒有邏輯切換仍可能存在 受元件狀態與製程等影響 充放電功耗 Charging Power 節點電容充放電 切換活動與資料模式相關 短路功耗 Short-circuit Power 轉換時上下網路短暫同時導通 與轉換時間與電路條件相關 毛刺 Glitch 不同路徑延遲造成暫時切換 實際切換次數可多於功能模型預測 「CMOS 靜態功耗低」與「功耗永遠為零」不同；「結果最後沒有變」也不代表中間完全沒有切換。 HS-003，PDF p.14–23 充放電公式怎麼讀 教材的集總電容模型中，完整 0→1→0 循環由電源取得的能量為 C_L V_DD² ；其中充電後存於電容的是 ½ C_L V_DD² 。不要把儲存能量和完整循環消耗混為一談。 HS-003，PDF p.19–20 P_charging ≈ α · f · C_L · V_DD² 變數 意義／單位 α 平均每週期的 0→1 轉換次數，依教材定義 f 時脈頻率，Hz C_L 負載電容，F V_DD 供應電壓，V P 平均功率，W 活動因子若改成「所有邊緣的轉換比例」，公式常數可能不同，所以不能只背 α 的符號。公式也沒有包括所有漏電、短路與毛刺細節。 HS-003，PDF p.16–23，公式解讀 HW 與 HD：兩個不同的模型 漢明重量（Hamming Weight，HW）計算一個位元字中 1 的數量；漢明距離（Hamming Distance，HD）計算兩個值相差幾個位元： HD(a,b)=HW(a XOR b) 。 HS-003，PDF p.28–29 自編例子 ： HW(0011)=2 ；由 0011 變成 0101 時，XOR 是 0110 ，因此 HD＝2。值本身有多少個 1，與從舊值到新值切換幾次，回答的是不同問題。 模型 需要的資訊 簡化假設 HW 被處理的資料值 以 1 的數量近似洩漏 HD 舊值與新值，以及可能的暫存器關係 以位元翻轉數近似洩漏 兩者通常都忽略各導線不同權重及毛刺。哪個較適合，取決於實作與觀察時間，不是 HW 一定勝過 HD。 HS-003，PDF p.28–29 怎麼看一條功耗軌跡 功耗軌跡（Power Trace）是一段運算隨時間取樣的訊號；第 i 條軌跡包含多個 sample points。觸發位置、取樣率、時脈、對齊與量測管道都會影響波形。sample index 本身沒有秒的單位，缺取樣率時不能自行把第 1000 點換成微秒。 HS-003，PDF p.30–36；本文資料解讀 教材微控制器的序列執行與硬體 AES 的平行運算圖，是不同平台的例子；圖中的週期數不能直接套用到所有 AES 或 ChipWhisperer Nano。平行運算、其他模組切換、電子雜訊與濾波效應會混合訊號。 HS-003，PDF p.31–36 連回作業 作業一用 HW 類別解釋訊號，模型只是近似；SNR 不高可能涉及模型、時間位置與雜訊。先讀 統計主題 區分變異來源，再看 作業一 的資料欄位與實際儲存圖。 HS-003，PDF p.28–36；HS-004，PDF p.9–12 來源與範圍 HS-003 ：36 頁；重點為功耗的物理來源、模型與量測語意，不把教材硬體平台當作使用者裝置實測設定。 "}, {"id": "courses/hardware-security/lessons/04-trace-statistics", "path": "/hs/lessons/4", "title": "功耗軌跡、SNR 與統計", "short": "功耗軌跡、SNR 與統計", "desc": "條件變異、相關性與統計信心", "courseId": "hardware-security", "sectionId": "lessons", "kind": "lesson", "status": "needs-review", "source": "HS-004", "pages": 28, "questions": [], "trackReading": true, "metadata": {"id": "hs-04-trace-statistics", "title": "功耗軌跡、SNR 與統計", "course": "hardware-security", "type": "lesson", "status": "needs-review", "created": "2026-11-06", "updated": "2026-11-06", "sources": ["HS-004", "HS-005", "HS-008", "HS-009"], "tags": ["硬體安全", "課程"]}, "file": "Hardware Security-Characteristics of power traces-2020.pdf", "readKey": "hs-lesson-4", "quizKey": "courses/hardware-security/lessons/04-trace-statistics", "recordChapter": "courses/hardware-security/lessons/04-trace-statistics", "lessonPath": "/hs/lessons/4", "html": "\u003ch1\u003e功耗軌跡、SNR 與統計\u003c/h1\u003e\n\u003ch2 id=\"p-3f3426804ea8-s1\"\u003e先把訊號與雜訊的定義說清楚\u003c/h2\u003e\n\u003cp\u003e教材把量測 L 分成操作相關、資料相關、電子雜訊與常數等成分。「雜訊」是相對於目前想解釋的目標；與其他資料有關的切換，對本次模型而言仍可能是干擾。\u003ca href=\"#/sources/hs-004\"\u003eHS-004，PDF p.3–9\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e同一時間點在多條 trace 上形成一個隨機變數。單條 trace 沿時間有高低起伏，不能直接拿這個起伏當作跨 trace 的洩漏變異。教材也展示功耗與 HW 可能呈反向關係，因此 HW 越大不一定量測值越高。\u003ca href=\"#/sources/hs-004\"\u003eHS-004，PDF p.4–8\u003c/a\u003e\u003c/p\u003e\n\u003ch2 id=\"p-3f3426804ea8-s2\"\u003e條件平均與 SNR 的直覺\u003c/h2\u003e\n\u003cp\u003e固定 sample j，依中間值標籤 X 分類：每類的平均反映可解釋的差異，每類內的變動則是同標籤下仍不能解釋的部分。教材的訊雜比（Signal-to-Noise Ratio，SNR）為：\u003c/p\u003e\n\u003cdiv class=\"formula\"\u003eSNR_j = Var(E[L_j ∣ X]) / E[Var(L_j ∣ X)]\u003c/div\u003e\n\n\u003cp\u003e分子是\u003cstrong\u003e類別平均之間的變異\u003c/strong\u003e；分母是\u003cstrong\u003e類別內變異的平均\u003c/strong\u003e。比值無單位。分組能明顯分開而組內又集中，SNR 才會高；不是把整條 trace 的最大值除以最小值。\u003ca href=\"#/sources/hs-004\"\u003eHS-004，PDF p.9–12\u003c/a\u003e\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e概念\u003c/th\u003e\n\u003cth\u003e在作業一的對應\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003eX\u003c/td\u003e\n\u003ctd\u003e第一輪某個 S-box 輸出的 HW，0 至 8\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eL_j\u003c/td\u003e\n\u003ctd\u003e所有軌跡在 sample j 的量測值\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eE[L_j ∣ X=h]\u003c/td\u003e\n\u003ctd\u003eHW＝h 這一組的平均量測\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eVar(L_j ∣ X=h)\u003c/td\u003e\n\u003ctd\u003e同一 HW 組內的變異\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e此表將教材公式套用到題目標籤，題目見 \u003ca href=\"#/sources/hs-009\"\u003eHS-009\u003c/a\u003e，實際 Notebook 估計見\u003ca href=\"#/hs/assignments/1\"\u003e作業一\u003c/a\u003e。\u003c/p\u003e\n\u003ch2 id=\"p-3f3426804ea8-s3\"\u003e分組權重不能一律當九分之一\u003c/h2\u003e\n\u003cp\u003e若每組樣本數為 n_h，總數 N，經驗權重 \u003ccode\u003ew_h=n_h/N\u003c/code\u003e。在已納入的組別上，總平均 \u003ccode\u003eμ=Σ w_h μ_h\u003c/code\u003e；訊號項 \u003ccode\u003eΣ w_h(μ_h−μ)²\u003c/code\u003e；雜訊項 \u003ccode\u003eΣ w_h σ_h²\u003c/code\u003e。均勻隨機 byte 的 HW 並非九類等機率，中間 HW 類別通常較多。\u003ca href=\"#/sources/hs-008\"\u003eHS-004，PDF p.10；HS-008，cell 22，ID 7aa13ab9\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e這是母體公式的經驗估計。原 Notebook 略過少於兩筆的組別、使用 \u003ccode\u003eddof=0\u003c/code\u003e 並重新正規化保留組別的權重；分母為零時輸出 0 是程式的數值處理，不能解讀為理論 SNR 確定為零。有限樣本、缺類別與不平衡都要交代。\u003ca href=\"#/sources/hs-008\"\u003eHS-008，cell 22\u003c/a\u003e\u003c/p\u003e\n\u003ch2 id=\"p-3f3426804ea8-s4\"\u003eSNR 依你選的分組而定\u003c/h2\u003e\n\u003cp\u003e教材同一個觀測時刻用完整 byte 的 HW 與單一 LSB 分組，得到不同 SNR。只分一個 bit，其他 bit 的影響可能留在組內變異。因此比較 SNR 時，要一起說明 X、樣本與 sample 位置。\u003ca href=\"#/sources/hs-004\"\u003eHS-004，PDF p.11–12\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003eDPA 講義談「理想可利用訊號的 SNR」時把物理訊號分解固定；作業估計的是\u003cstrong\u003e相對特定 HW 標籤的條件變異比\u003c/strong\u003e。兩種定義脈絡要分開，不能一邊換分組、一邊宣稱結果必然不變。\u003ca href=\"#/sources/hs-005\"\u003eHS-005，PDF p.23–25；HS-004，PDF p.9–12，本文辨析\u003c/a\u003e\u003c/p\u003e\n\u003ch2 id=\"p-3f3426804ea8-s5\"\u003e協方差與 Pearson 相關係數\u003c/h2\u003e\n\u003cp\u003e協方差（Covariance）描述共同變動方向；Pearson 相關係數把它除以兩邊標準差：\u003c/p\u003e\n\u003cdiv class=\"formula\"\u003eρ(X,Y) = Cov(X,Y) / (σ_X σ_Y)\u003c/div\u003e\n\n\u003cp\u003e相關係數無單位，介於 −1 和 1；只有兩邊變異不為零時才有定義。負相關也能反映線性關係；相關接近零只表示線性關係弱，不能證明完全獨立。相鄰 sample 常有相關性，但不代表每一個相鄰點都帶來新的獨立證據。\u003ca href=\"#/sources/hs-004\"\u003eHS-004，PDF p.13–16；相關與獨立性為公式解讀\u003c/a\u003e\u003c/p\u003e\n\u003ch2 id=\"p-3f3426804ea8-s6\"\u003e多變量、特徵與統計信心\u003c/h2\u003e\n\u003cp\u003e多變量高斯模型（Multivariate Gaussian Model）用平均向量 m 表示各觀測點中心，用共變異數矩陣 C 表示各點變異與共同變動。這是\u003ca href=\"#/hs/lessons/6\"\u003e模板分析\u003c/a\u003e的基礎。選擇有關聯的點、避免大量冗餘維度，有助於估計；積分、平方和等壓縮也可能移除重要資訊，應依資料評估。\u003ca href=\"#/sources/hs-004\"\u003eHS-004，PDF p.16–20\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e信賴區間（Confidence Interval）依抽樣模型描述不確定性。常見平均誤差隨 \u003ccode\u003e1/√N\u003c/code\u003e 縮小，需要相應獨立性與分布條件；樣本數加倍不表示誤差就減半。第一類錯誤是拒絕其實成立的虛無假設。教材 Fisher 轉換以 \u003ccode\u003eatanh(r)\u003c/code\u003e 近似分析相關係數的不確定性，不是「超過某條固定線就一定成功」。\u003ca href=\"#/sources/hs-004\"\u003eHS-004，PDF p.21–28\u003c/a\u003e\u003c/p\u003e\n\u003ch2 id=\"p-3f3426804ea8-s7\"\u003e看圖時的四個問題\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e橫軸是 sample index 還是實際時間？單位有沒有提供？\u003c/li\u003e\n\u003cli\u003e分組變數是 HW、單一 bit，還是其他中間值？\u003c/li\u003e\n\u003cli\u003e高峰來自組間差異，還是分母很小的數值不穩定？\u003c/li\u003e\n\u003cli\u003e曲線是當次重算，還是 Notebook 保存的歷史輸出？\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e以上為自編閱讀檢查，對應 HS-004 PDF p.9–16 與 HS-008 cell 22。\u003c/p\u003e\n\u003ch2 id=\"p-3f3426804ea8-s8\"\u003e來源與範圍\u003c/h2\u003e\n\u003cp\u003e\u003ca href=\"#/sources/hs-004\"\u003eHS-004\u003c/a\u003e：28 頁；以 SNR、相關與統計假設為主。\u003ca href=\"#/sources/hs-005\"\u003eHS-005\u003c/a\u003e用於 SNR 脈絡辨析，\u003ca href=\"#/sources/hs-008\"\u003eHS-008\u003c/a\u003e用於作業估計方式。\u003c/p\u003e", "text": "# 功耗軌跡、SNR 與統計\n\n## 先把訊號與雜訊的定義說清楚\n教材把量測 L 分成操作相關、資料相關、電子雜訊與常數等成分。「雜訊」是相對於目前想解釋的目標；與其他資料有關的切換，對本次模型而言仍可能是干擾。[HS-004，PDF p.3–9](../../../sources/hs-004.md)\n\n同一時間點在多條 trace 上形成一個隨機變數。單條 trace 沿時間有高低起伏，不能直接拿這個起伏當作跨 trace 的洩漏變異。教材也展示功耗與 HW 可能呈反向關係，因此 HW 越大不一定量測值越高。[HS-004，PDF p.4–8](../../../sources/hs-004.md)\n\n## 條件平均與 SNR 的直覺\n固定 sample j，依中間值標籤 X 分類：每類的平均反映可解釋的差異，每類內的變動則是同標籤下仍不能解釋的部分。教材的訊雜比（Signal-to-Noise Ratio，SNR）為：\n\n\u003cdiv class=\"formula\"\u003eSNR_j = Var(E[L_j ∣ X]) / E[Var(L_j ∣ X)]\u003c/div\u003e\n\n分子是**類別平均之間的變異**；分母是**類別內變異的平均**。比值無單位。分組能明顯分開而組內又集中，SNR 才會高；不是把整條 trace 的最大值除以最小值。[HS-004，PDF p.9–12](../../../sources/hs-004.md)\n\n| 概念 | 在作業一的對應 |\n| --- | --- |\n| X | 第一輪某個 S-box 輸出的 HW，0 至 8 |\n| L_j | 所有軌跡在 sample j 的量測值 |\n| E[L_j ∣ X=h] | HW＝h 這一組的平均量測 |\n| Var(L_j ∣ X=h) | 同一 HW 組內的變異 |\n\n此表將教材公式套用到題目標籤，題目見 [HS-009](../../../sources/hs-009.md)，實際 Notebook 估計見[作業一](../assignments/assignment-01-snr.md)。\n\n## 分組權重不能一律當九分之一\n若每組樣本數為 n_h，總數 N，經驗權重 `w_h=n_h/N`。在已納入的組別上，總平均 `μ=Σ w_h μ_h`；訊號項 `Σ w_h(μ_h−μ)²`；雜訊項 `Σ w_h σ_h²`。均勻隨機 byte 的 HW 並非九類等機率，中間 HW 類別通常較多。[HS-004，PDF p.10；HS-008，cell 22，ID 7aa13ab9](../../../sources/hs-008.md)\n\n這是母體公式的經驗估計。原 Notebook 略過少於兩筆的組別、使用 `ddof=0` 並重新正規化保留組別的權重；分母為零時輸出 0 是程式的數值處理，不能解讀為理論 SNR 確定為零。有限樣本、缺類別與不平衡都要交代。[HS-008，cell 22](../../../sources/hs-008.md)\n\n## SNR 依你選的分組而定\n教材同一個觀測時刻用完整 byte 的 HW 與單一 LSB 分組，得到不同 SNR。只分一個 bit，其他 bit 的影響可能留在組內變異。因此比較 SNR 時，要一起說明 X、樣本與 sample 位置。[HS-004，PDF p.11–12](../../../sources/hs-004.md)\n\nDPA 講義談「理想可利用訊號的 SNR」時把物理訊號分解固定；作業估計的是**相對特定 HW 標籤的條件變異比**。兩種定義脈絡要分開，不能一邊換分組、一邊宣稱結果必然不變。[HS-005，PDF p.23–25；HS-004，PDF p.9–12，本文辨析](../../../sources/hs-005.md)\n\n## 協方差與 Pearson 相關係數\n協方差（Covariance）描述共同變動方向；Pearson 相關係數把它除以兩邊標準差：\n\n\u003cdiv class=\"formula\"\u003eρ(X,Y) = Cov(X,Y) / (σ_X σ_Y)\u003c/div\u003e\n\n相關係數無單位，介於 −1 和 1；只有兩邊變異不為零時才有定義。負相關也能反映線性關係；相關接近零只表示線性關係弱，不能證明完全獨立。相鄰 sample 常有相關性，但不代表每一個相鄰點都帶來新的獨立證據。[HS-004，PDF p.13–16；相關與獨立性為公式解讀](../../../sources/hs-004.md)\n\n## 多變量、特徵與統計信心\n多變量高斯模型（Multivariate Gaussian Model）用平均向量 m 表示各觀測點中心，用共變異數矩陣 C 表示各點變異與共同變動。這是[模板分析](06-template-attacks.md)的基礎。選擇有關聯的點、避免大量冗餘維度，有助於估計；積分、平方和等壓縮也可能移除重要資訊，應依資料評估。[HS-004，PDF p.16–20](../../../sources/hs-004.md)\n\n信賴區間（Confidence Interval）依抽樣模型描述不確定性。常見平均誤差隨 `1/√N` 縮小，需要相應獨立性與分布條件；樣本數加倍不表示誤差就減半。第一類錯誤是拒絕其實成立的虛無假設。教材 Fisher 轉換以 `atanh(r)` 近似分析相關係數的不確定性，不是「超過某條固定線就一定成功」。[HS-004，PDF p.21–28](../../../sources/hs-004.md)\n\n## 看圖時的四個問題\n1. 橫軸是 sample index 還是實際時間？單位有沒有提供？\n2. 分組變數是 HW、單一 bit，還是其他中間值？\n3. 高峰來自組間差異，還是分母很小的數值不穩定？\n4. 曲線是當次重算，還是 Notebook 保存的歷史輸出？\n\n以上為自編閱讀檢查，對應 HS-004 PDF p.9–16 與 HS-008 cell 22。\n\n## 來源與範圍\n[HS-004](../../../sources/hs-004.md)：28 頁；以 SNR、相關與統計假設為主。[HS-005](../../../sources/hs-005.md)用於 SNR 脈絡辨析，[HS-008](../../../sources/hs-008.md)用於作業估計方式。\n", "headings": [{"id": "p-3f3426804ea8-s1", "text": "先把訊號與雜訊的定義說清楚"}, {"id": "p-3f3426804ea8-s2", "text": "條件平均與 SNR 的直覺"}, {"id": "p-3f3426804ea8-s3", "text": "分組權重不能一律當九分之一"}, {"id": "p-3f3426804ea8-s4", "text": "SNR 依你選的分組而定"}, {"id": "p-3f3426804ea8-s5", "text": "協方差與 Pearson 相關係數"}, {"id": "p-3f3426804ea8-s6", "text": "多變量、特徵與統計信心"}, {"id": "p-3f3426804ea8-s7", "text": "看圖時的四個問題"}, {"id": "p-3f3426804ea8-s8", "text": "來源與範圍"}], "sectionCount": 8, "searchText": "功耗軌跡、SNR 與統計 先把訊號與雜訊的定義說清楚 教材把量測 L 分成操作相關、資料相關、電子雜訊與常數等成分。「雜訊」是相對於目前想解釋的目標；與其他資料有關的切換，對本次模型而言仍可能是干擾。 HS-004，PDF p.3–9 同一時間點在多條 trace 上形成一個隨機變數。單條 trace 沿時間有高低起伏，不能直接拿這個起伏當作跨 trace 的洩漏變異。教材也展示功耗與 HW 可能呈反向關係，因此 HW 越大不一定量測值越高。 HS-004，PDF p.4–8 條件平均與 SNR 的直覺 固定 sample j，依中間值標籤 X 分類：每類的平均反映可解釋的差異，每類內的變動則是同標籤下仍不能解釋的部分。教材的訊雜比（Signal-to-Noise Ratio，SNR）為： SNR_j = Var(E[L_j ∣ X]) / E[Var(L_j ∣ X)] 分子是 類別平均之間的變異 ；分母是 類別內變異的平均 。比值無單位。分組能明顯分開而組內又集中，SNR 才會高；不是把整條 trace 的最大值除以最小值。 HS-004，PDF p.9–12 概念 在作業一的對應 X 第一輪某個 S-box 輸出的 HW，0 至 8 L_j 所有軌跡在 sample j 的量測值 E[L_j ∣ X=h] HW＝h 這一組的平均量測 Var(L_j ∣ X=h) 同一 HW 組內的變異 此表將教材公式套用到題目標籤，題目見 HS-009 ，實際 Notebook 估計見 作業一 。 分組權重不能一律當九分之一 若每組樣本數為 n_h，總數 N，經驗權重 w_h=n_h/N 。在已納入的組別上，總平均 μ=Σ w_h μ_h ；訊號項 Σ w_h(μ_h−μ)² ；雜訊項 Σ w_h σ_h² 。均勻隨機 byte 的 HW 並非九類等機率，中間 HW 類別通常較多。 HS-004，PDF p.10；HS-008，cell 22，ID 7aa13ab9 這是母體公式的經驗估計。原 Notebook 略過少於兩筆的組別、使用 ddof=0 並重新正規化保留組別的權重；分母為零時輸出 0 是程式的數值處理，不能解讀為理論 SNR 確定為零。有限樣本、缺類別與不平衡都要交代。 HS-008，cell 22 SNR 依你選的分組而定 教材同一個觀測時刻用完整 byte 的 HW 與單一 LSB 分組，得到不同 SNR。只分一個 bit，其他 bit 的影響可能留在組內變異。因此比較 SNR 時，要一起說明 X、樣本與 sample 位置。 HS-004，PDF p.11–12 DPA 講義談「理想可利用訊號的 SNR」時把物理訊號分解固定；作業估計的是 相對特定 HW 標籤的條件變異比 。兩種定義脈絡要分開，不能一邊換分組、一邊宣稱結果必然不變。 HS-005，PDF p.23–25；HS-004，PDF p.9–12，本文辨析 協方差與 Pearson 相關係數 協方差（Covariance）描述共同變動方向；Pearson 相關係數把它除以兩邊標準差： ρ(X,Y) = Cov(X,Y) / (σ_X σ_Y) 相關係數無單位，介於 −1 和 1；只有兩邊變異不為零時才有定義。負相關也能反映線性關係；相關接近零只表示線性關係弱，不能證明完全獨立。相鄰 sample 常有相關性，但不代表每一個相鄰點都帶來新的獨立證據。 HS-004，PDF p.13–16；相關與獨立性為公式解讀 多變量、特徵與統計信心 多變量高斯模型（Multivariate Gaussian Model）用平均向量 m 表示各觀測點中心，用共變異數矩陣 C 表示各點變異與共同變動。這是 模板分析 的基礎。選擇有關聯的點、避免大量冗餘維度，有助於估計；積分、平方和等壓縮也可能移除重要資訊，應依資料評估。 HS-004，PDF p.16–20 信賴區間（Confidence Interval）依抽樣模型描述不確定性。常見平均誤差隨 1/√N 縮小，需要相應獨立性與分布條件；樣本數加倍不表示誤差就減半。第一類錯誤是拒絕其實成立的虛無假設。教材 Fisher 轉換以 atanh(r) 近似分析相關係數的不確定性，不是「超過某條固定線就一定成功」。 HS-004，PDF p.21–28 看圖時的四個問題 橫軸是 sample index 還是實際時間？單位有沒有提供？ 分組變數是 HW、單一 bit，還是其他中間值？ 高峰來自組間差異，還是分母很小的數值不穩定？ 曲線是當次重算，還是 Notebook 保存的歷史輸出？ 以上為自編閱讀檢查，對應 HS-004 PDF p.9–16 與 HS-008 cell 22。 來源與範圍 HS-004 ：28 頁；以 SNR、相關與統計假設為主。 HS-005 用於 SNR 脈絡辨析， HS-008 用於作業估計方式。 "}, {"id": "courses/hardware-security/lessons/05-dpa-cpa", "path": "/hs/lessons/5", "title": "DPA、CPA 與洩漏模型", "short": "DPA、CPA 與洩漏模型", "desc": "模型吻合、曲線判讀與樣本數", "courseId": "hardware-security", "sectionId": "lessons", "kind": "lesson", "status": "needs-review", "source": "HS-005", "pages": 38, "questions": [], "trackReading": true, "metadata": {"id": "hs-05-dpa-cpa", "title": "DPA、CPA 與洩漏模型", "course": "hardware-security", "type": "lesson", "status": "needs-review", "created": "2026-11-06", "updated": "2026-11-06", "sources": ["HS-005", "HS-004", "HS-008", "HS-009"], "tags": ["硬體安全", "課程"]}, "file": "Hardware Security-DPA-2020.pdf", "readKey": "hs-lesson-5", "quizKey": "courses/hardware-security/lessons/05-dpa-cpa", "recordChapter": "courses/hardware-security/lessons/05-dpa-cpa", "lessonPath": "/hs/lessons/5", "html": "\u003ch1\u003eDPA、CPA 與洩漏模型\u003c/h1\u003e\n\u003ch2 id=\"p-2fa7773e198f-s1\"\u003e核心想法：讓模型與量測互相對照\u003c/h2\u003e\n\u003cp\u003e差分功耗分析（Differential Power Analysis，DPA）利用多次運算的統計差異判斷中間值假設。相關功耗分析（Correlation Power Analysis，CPA）則用預測洩漏與實際量測的 Pearson 相關作比較。課程關心的是實作洩漏與模型是否吻合。\u003ca href=\"#/sources/hs-005\"\u003eHS-005，PDF p.3–14\u003c/a\u003e\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e面向\u003c/th\u003e\n\u003cth\u003e傳統差分平均\u003c/th\u003e\n\u003cth\u003eCPA\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e模型輸出\u003c/td\u003e\n\u003ctd\u003e常用某個 bit 將軌跡分成兩組\u003c/td\u003e\n\u003ctd\u003e可用 HW 等多值預測\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e比較量\u003c/td\u003e\n\u003ctd\u003e兩組平均波形之差\u003c/td\u003e\n\u003ctd\u003e預測值與每個 sample 的相關\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e判讀重點\u003c/td\u003e\n\u003ctd\u003e正確分組的差異是否可辨\u003c/td\u003e\n\u003ctd\u003e正確假設的相關是否與其他假設區分\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e兩種方式都可能受錯位、雜訊、資料不足與模型不合影響。不是只看到一個高峰就完成所有驗證。\u003ca href=\"#/sources/hs-005\"\u003eHS-005，PDF p.4–15、23–38\u003c/a\u003e\u003c/p\u003e\n\u003ch2 id=\"p-2fa7773e198f-s2\"\u003eAES 第一輪模型為何能逐 byte 討論\u003c/h2\u003e\n\u003cp\u003e課內的軟體 AES 例子選第一輪 \u003ccode\u003eS(p_b XOR k_b)\u003c/code\u003e，在此處尚未進行 MixColumns，所以模型依賴一個已知明文 byte 與一個候選 key byte。把其結果映射到 HW，是「中間值模型」加上「功耗模型」兩個不同步驟。\u003ca href=\"#/sources/hs-005\"\u003eHS-005，PDF p.4、9–14\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e把 S-box 值本身、S-box 輸出的 HW，以及某一個輸出 bit 當作三種不同標籤；不能在圖說中互換。作業二使用的脈絡見\u003ca href=\"#/hs/assignments/2\"\u003e作業二頁\u003c/a\u003e。\u003c/p\u003e\n\u003ch2 id=\"p-2fa7773e198f-s3\"\u003e相關曲線的每個方向代表什麼\u003c/h2\u003e\n\u003cp\u003e在固定 byte 與固定假設下，相關曲線沿 sample index 展開，反映該假設在哪些時刻與量測吻合。把每個候選跨 sample 的最大絕對相關整理成分數，則是另一層彙整。正、負相關的符號與量測方向有關，選擇絕對值時必須在軸標與文字中明示。\u003ca href=\"#/sources/hs-005\"\u003eHS-005，PDF p.12–16、23–25，本文圖表解讀\u003c/a\u003e\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e圖形\u003c/th\u003e\n\u003cth\u003e改變的量\u003c/th\u003e\n\u003cth\u003e能回答的問題\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003ecorrelation vs. sample point\u003c/td\u003e\n\u003ctd\u003e時間／sample index\u003c/td\u003e\n\u003ctd\u003e哪個時間區域與某個假設相關？\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003emaximum correlation vs. number of traces\u003c/td\u003e\n\u003ctd\u003e使用軌跡數 N\u003c/td\u003e\n\u003ctd\u003e增加資料後，假設是否逐漸可區分？\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e這兩類圖是作業二的明確要求，不是從講義自行推定的交件格式。\u003ca href=\"#/sources/hs-009\"\u003eHS-009，作業二原題\u003c/a\u003e\u003c/p\u003e\n\u003ch2 id=\"p-2fa7773e198f-s4\"\u003e模型吻合與 SNR 是不同因素\u003c/h2\u003e\n\u003cp\u003e教材在加性雜訊且訊號與雜訊滿足所列獨立性假設時，寫出：\u003c/p\u003e\n\u003cdiv class=\"formula\"\u003eρ(H,L) = ρ(H,P_exp) / √(1 + 1/SNR)\u003c/div\u003e\n\n\u003cp\u003eH 是模型預測，P_exp 是所關心的實際訊號，L 是含雜訊量測。雜訊降低時，相關上限仍受模型吻合程度限制；錯誤模型不是只靠更多樣本就一定能補救。反過來，模型合適也可能被量測雜訊淹沒。\u003ca href=\"#/sources/hs-005\"\u003eHS-005，PDF p.23–29\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e教材的「約 20 條」「160 條」等是特定實驗比較，不是通用需求。題目說 200 條應足夠，是作業的預期條件，不能預先寫成使用者已成功的實驗結論。\u003ca href=\"#/sources/hs-009\"\u003eHS-005，PDF p.15、33–36；HS-009\u003c/a\u003e\u003c/p\u003e\n\u003ch2 id=\"p-2fa7773e198f-s5\"\u003e換平台時，不能照搬模型\u003c/h2\u003e\n\u003cp\u003eMCU 的序列運算、平行硬體 AES、暫存器重用與最後一輪中間值，具有不同的資料關係。HD 模型要知道舊值與新值；平行運算的其他 S-box 可能變成目前 byte 模型的干擾。零值模型則針對教材特定實作，不是所有 S-box 都自帶相同零值特徵。\u003ca href=\"#/sources/hs-005\"\u003eHS-005，PDF p.16–22、26–31\u003c/a\u003e\u003c/p\u003e\n\u003ch2 id=\"p-2fa7773e198f-s6\"\u003e常見判讀錯誤\u003c/h2\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e容易誤解\u003c/th\u003e\n\u003cth\u003e正確理解\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e最大峰就是正確金鑰\u003c/td\u003e\n\u003ctd\u003e需比較其他候選、不同 byte 與額外驗證\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eN 增加，正確分數一定單調上升\u003c/td\u003e\n\u003ctd\u003e有限樣本的估計會波動；看可分離性與穩定性\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e相關接近 0 等於沒有任何洩漏\u003c/td\u003e\n\u003ctd\u003e只針對目前線性模型、時間區域與資料量\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eSNR 峰值 sample 必是 CPA 唯一最佳位置\u003c/td\u003e\n\u003ctd\u003e分組、模型與樣本不同，兩者不保證逐點等價\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e一個 byte 成功等於 128-bit key 全部成功\u003c/td\u003e\n\u003ctd\u003e十六個 byte 都需要對應證據\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e前兩項對應 HS-005 PDF p.23–36 的模型與估計限制；後三項為與 HS-004 PDF p.9–16、HS-009 原題的綜合理解。\u003c/p\u003e\n\u003ch2 id=\"p-2fa7773e198f-s7\"\u003e與兩份作業的差別\u003c/h2\u003e\n\u003cp\u003e\u003ca href=\"#/hs/assignments/1\"\u003e作業一\u003c/a\u003e已知實驗金鑰，用 HW 分組量化洩漏；\u003ca href=\"#/hs/assignments/2\"\u003e作業二\u003c/a\u003e比較候選假設與量測。第一份保存了 SNR 圖，不等於第二份已產生 CPA 圖或恢復結果。\u003ca href=\"#/sources/hs-008\"\u003eHS-008，cell 12、22；HS-009\u003c/a\u003e\u003c/p\u003e\n\u003ch2 id=\"p-2fa7773e198f-s8\"\u003e來源與範圍\u003c/h2\u003e\n\u003cp\u003e\u003ca href=\"#/sources/hs-005\"\u003eHS-005\u003c/a\u003e：38 頁，整理模型、公式假設與圖表語意。未執行硬體量測、未重跑使用者資料。\u003ca href=\"#/sources/hs-004\"\u003eHS-004\u003c/a\u003e、\u003ca href=\"#/sources/hs-008\"\u003eHS-008\u003c/a\u003e、\u003ca href=\"#/sources/hs-009\"\u003eHS-009\u003c/a\u003e供相互定位。\u003c/p\u003e", "text": "# DPA、CPA 與洩漏模型\n\n## 核心想法：讓模型與量測互相對照\n差分功耗分析（Differential Power Analysis，DPA）利用多次運算的統計差異判斷中間值假設。相關功耗分析（Correlation Power Analysis，CPA）則用預測洩漏與實際量測的 Pearson 相關作比較。課程關心的是實作洩漏與模型是否吻合。[HS-005，PDF p.3–14](../../../sources/hs-005.md)\n\n| 面向 | 傳統差分平均 | CPA |\n| --- | --- | --- |\n| 模型輸出 | 常用某個 bit 將軌跡分成兩組 | 可用 HW 等多值預測 |\n| 比較量 | 兩組平均波形之差 | 預測值與每個 sample 的相關 |\n| 判讀重點 | 正確分組的差異是否可辨 | 正確假設的相關是否與其他假設區分 |\n\n兩種方式都可能受錯位、雜訊、資料不足與模型不合影響。不是只看到一個高峰就完成所有驗證。[HS-005，PDF p.4–15、23–38](../../../sources/hs-005.md)\n\n## AES 第一輪模型為何能逐 byte 討論\n課內的軟體 AES 例子選第一輪 `S(p_b XOR k_b)`，在此處尚未進行 MixColumns，所以模型依賴一個已知明文 byte 與一個候選 key byte。把其結果映射到 HW，是「中間值模型」加上「功耗模型」兩個不同步驟。[HS-005，PDF p.4、9–14](../../../sources/hs-005.md)\n\n把 S-box 值本身、S-box 輸出的 HW，以及某一個輸出 bit 當作三種不同標籤；不能在圖說中互換。作業二使用的脈絡見[作業二頁](../assignments/assignment-02-cpa.md)。\n\n## 相關曲線的每個方向代表什麼\n在固定 byte 與固定假設下，相關曲線沿 sample index 展開，反映該假設在哪些時刻與量測吻合。把每個候選跨 sample 的最大絕對相關整理成分數，則是另一層彙整。正、負相關的符號與量測方向有關，選擇絕對值時必須在軸標與文字中明示。[HS-005，PDF p.12–16、23–25，本文圖表解讀](../../../sources/hs-005.md)\n\n| 圖形 | 改變的量 | 能回答的問題 |\n| --- | --- | --- |\n| correlation vs. sample point | 時間／sample index | 哪個時間區域與某個假設相關？ |\n| maximum correlation vs. number of traces | 使用軌跡數 N | 增加資料後，假設是否逐漸可區分？ |\n\n這兩類圖是作業二的明確要求，不是從講義自行推定的交件格式。[HS-009，作業二原題](../../../sources/hs-009.md)\n\n## 模型吻合與 SNR 是不同因素\n教材在加性雜訊且訊號與雜訊滿足所列獨立性假設時，寫出：\n\n\u003cdiv class=\"formula\"\u003eρ(H,L) = ρ(H,P_exp) / √(1 + 1/SNR)\u003c/div\u003e\n\nH 是模型預測，P_exp 是所關心的實際訊號，L 是含雜訊量測。雜訊降低時，相關上限仍受模型吻合程度限制；錯誤模型不是只靠更多樣本就一定能補救。反過來，模型合適也可能被量測雜訊淹沒。[HS-005，PDF p.23–29](../../../sources/hs-005.md)\n\n教材的「約 20 條」「160 條」等是特定實驗比較，不是通用需求。題目說 200 條應足夠，是作業的預期條件，不能預先寫成使用者已成功的實驗結論。[HS-005，PDF p.15、33–36；HS-009](../../../sources/hs-009.md)\n\n## 換平台時，不能照搬模型\nMCU 的序列運算、平行硬體 AES、暫存器重用與最後一輪中間值，具有不同的資料關係。HD 模型要知道舊值與新值；平行運算的其他 S-box 可能變成目前 byte 模型的干擾。零值模型則針對教材特定實作，不是所有 S-box 都自帶相同零值特徵。[HS-005，PDF p.16–22、26–31](../../../sources/hs-005.md)\n\n## 常見判讀錯誤\n| 容易誤解 | 正確理解 |\n| --- | --- |\n| 最大峰就是正確金鑰 | 需比較其他候選、不同 byte 與額外驗證 |\n| N 增加，正確分數一定單調上升 | 有限樣本的估計會波動；看可分離性與穩定性 |\n| 相關接近 0 等於沒有任何洩漏 | 只針對目前線性模型、時間區域與資料量 |\n| SNR 峰值 sample 必是 CPA 唯一最佳位置 | 分組、模型與樣本不同，兩者不保證逐點等價 |\n| 一個 byte 成功等於 128-bit key 全部成功 | 十六個 byte 都需要對應證據 |\n\n前兩項對應 HS-005 PDF p.23–36 的模型與估計限制；後三項為與 HS-004 PDF p.9–16、HS-009 原題的綜合理解。\n\n## 與兩份作業的差別\n[作業一](../assignments/assignment-01-snr.md)已知實驗金鑰，用 HW 分組量化洩漏；[作業二](../assignments/assignment-02-cpa.md)比較候選假設與量測。第一份保存了 SNR 圖，不等於第二份已產生 CPA 圖或恢復結果。[HS-008，cell 12、22；HS-009](../../../sources/hs-008.md)\n\n## 來源與範圍\n[HS-005](../../../sources/hs-005.md)：38 頁，整理模型、公式假設與圖表語意。未執行硬體量測、未重跑使用者資料。[HS-004](../../../sources/hs-004.md)、[HS-008](../../../sources/hs-008.md)、[HS-009](../../../sources/hs-009.md)供相互定位。\n", "headings": [{"id": "p-2fa7773e198f-s1", "text": "核心想法：讓模型與量測互相對照"}, {"id": "p-2fa7773e198f-s2", "text": "AES 第一輪模型為何能逐 byte 討論"}, {"id": "p-2fa7773e198f-s3", "text": "相關曲線的每個方向代表什麼"}, {"id": "p-2fa7773e198f-s4", "text": "模型吻合與 SNR 是不同因素"}, {"id": "p-2fa7773e198f-s5", "text": "換平台時，不能照搬模型"}, {"id": "p-2fa7773e198f-s6", "text": "常見判讀錯誤"}, {"id": "p-2fa7773e198f-s7", "text": "與兩份作業的差別"}, {"id": "p-2fa7773e198f-s8", "text": "來源與範圍"}], "sectionCount": 8, "searchText": "DPA、CPA 與洩漏模型 核心想法：讓模型與量測互相對照 差分功耗分析（Differential Power Analysis，DPA）利用多次運算的統計差異判斷中間值假設。相關功耗分析（Correlation Power Analysis，CPA）則用預測洩漏與實際量測的 Pearson 相關作比較。課程關心的是實作洩漏與模型是否吻合。 HS-005，PDF p.3–14 面向 傳統差分平均 CPA 模型輸出 常用某個 bit 將軌跡分成兩組 可用 HW 等多值預測 比較量 兩組平均波形之差 預測值與每個 sample 的相關 判讀重點 正確分組的差異是否可辨 正確假設的相關是否與其他假設區分 兩種方式都可能受錯位、雜訊、資料不足與模型不合影響。不是只看到一個高峰就完成所有驗證。 HS-005，PDF p.4–15、23–38 AES 第一輪模型為何能逐 b  "2026-11-06", "updated": "2026-11-06", "sources": ["HS-006", "HS-004", "HS-005"], "tags": ["硬體安全", "課程"]}, "file": "Hardware Security Template Attacks.pdf", "readKey": "hs-lesson-6", "quizKey": "courses/hardware-security/lessons/06-template-attacks", "recordChapter": "courses/hardware-security/lessons/06-template-attacks", "lessonPath": "/hs/lessons/6", "html": "\u003ch1\u003e模板攻擊與機率判讀\u003c/h1\u003e\n\u003ch2 id=\"p-67ccc3045ee1-s1\"\u003e先分清模板分析多知道了什麼\u003c/h2\u003e\n\u003cp\u003e模板攻擊（Template Attack）屬於剖析式方法（Profiling）：先在可控制的參考裝置建立不同中間值的量測分布，再用目標觀測比較哪一種分布較合理。參考裝置的可取得性、可控制性，以及能否代表目標裝置，是額外假設。\u003ca href=\"#/sources/hs-006\"\u003eHS-006，PDF p.3–10\u003c/a\u003e\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e階段\u003c/th\u003e\n\u003cth\u003e輸入\u003c/th\u003e\n\u003cth\u003e產物\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e剖析 Profiling\u003c/td\u003e\n\u003ctd\u003e已知類別的多次參考量測\u003c/td\u003e\n\u003ctd\u003e各類別平均向量與共變異數矩陣\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e比較／推論\u003c/td\u003e\n\u003ctd\u003e目標量測的特徵向量\u003c/td\u003e\n\u003ctd\u003e在各類別模型下的似然與排序\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e模板不是一張固定波形圖片，也不是把兩條線目測疊起來。它同時描述訊號中心與隨機變動。\u003ca href=\"#/sources/hs-006\"\u003eHS-006，PDF p.7–10\u003c/a\u003e\u003c/p\u003e\n\u003ch2 id=\"p-67ccc3045ee1-s2\"\u003e平均向量與共變異數矩陣\u003c/h2\u003e\n\u003cp\u003e選 d 個關注點（Points of Interest，POIs），每次觀測變成 d 維向量 t。某個類別 h 的模板為 \u003ccode\u003e(m_h,C_h)\u003c/code\u003e：m_h 長度 d，C_h 為 d×d 矩陣；對角線是各點變異，非對角線是兩點的共變異數。\u003ca href=\"#/sources/hs-006\"\u003eHS-006，PDF p.8–9；HS-004，PDF p.16\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e自編理解例子\u003c/strong\u003e：兩個觀測點總是一起升降，不能把它們當兩份完全獨立的證據；C 描述這種共同變動。只比每個點離平均多遠，會漏掉方向與尺度。\u003c/p\u003e\n\u003ch2 id=\"p-67ccc3045ee1-s3\"\u003e最大似然：越大越合理\u003c/h2\u003e\n\u003cp\u003e多變量高斯的對數似然可寫為：\u003c/p\u003e\n\u003cdiv class=\"formula\"\u003elog p(t ∣ h) = −½[(t−m_h)ᵀ C_h⁻¹(t−m_h) + log det C_h + d log(2π)]\u003c/div\u003e\n\n\u003cp\u003e在候選 h 之間選\u003cstrong\u003e最大的 log p\u003c/strong\u003e，等價於選最大的 p，因為 log 是單調遞增函數。取 log 是為了把乘法變加法並改善數值穩定性，不是改變優劣方向。\u003ca href=\"#/sources/hs-006\"\u003eHS-004，PDF p.16；HS-006，PDF p.10–11、15\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e講義 p.11 的簡記含 \u003ccode\u003e|ln p|\u003c/code\u003e，不應泛化成「最小絕對對數值」。機率密度可大於 1，log 密度也可為正；普遍正確的判準仍是最大似然／最大對數似然。p.15 範例的 −5.98 比 −49.54 大，因此前者較合理。\u003ca href=\"#/sources/hs-006\"\u003eHS-006，PDF p.10–11、15，本文數學辨析\u003c/a\u003e\u003c/p\u003e\n\u003ch2 id=\"p-67ccc3045ee1-s4\"\u003e為什麼不能隨意省掉 C\u003c/h2\u003e\n\u003cp\u003e教材的 reduced template 只保留平均向量並比較歐氏距離。這可視為各類別具有共同且等向性共變異數等條件下的簡化；若類別的散布大小、方向不同，只比平均距離可能與完整似然給出不同結果。\u003ca href=\"#/sources/hs-006\"\u003eHS-006，PDF p.12；由高斯公式推得的條件說明\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e估計 C 需要足夠樣本；POI 太多、樣本太少或特徵高度重複，可能使矩陣難以反轉。更多維度不一定更準，應與\u003ca href=\"#/hs/lessons/4\"\u003e統計主題\u003c/a\u003e的點間相關一起理解。\u003ca href=\"#/sources/hs-004\"\u003eHS-004，PDF p.13–20；本文估計限制\u003c/a\u003e\u003c/p\u003e\n\u003ch2 id=\"p-67ccc3045ee1-s5\"\u003e教材 MOV 與 key schedule 圖怎麼看\u003c/h2\u003e\n\u003cp\u003eMOV 範例依搬移 byte 的 HW 形成九種分布，再選五個 POI。這裡的「九」來自 8-bit HW 的 0 至 8，而非只有九種 byte 值。「五」是該例選取的維度，不是模板分析的固定參數。\u003ca href=\"#/sources/hs-006\"\u003eHS-006，PDF p.13–15\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e金鑰擴展（Key Schedule）本身也處理與金鑰相關的中間值。教材以多個 HW 條件縮小候選集合，圖中的剩餘候選數只屬於該例的觀測與假設，不能當通用保證。\u003ca href=\"#/sources/hs-006\"\u003eHS-006，PDF p.16–17\u003c/a\u003e\u003c/p\u003e\n\u003ch2 id=\"p-67ccc3045ee1-s6\"\u003e合併多條觀測與 Bayes 關係\u003c/h2\u003e\n\u003cp\u003e條件獨立的量測可將似然相乘，或把 log 似然相加；後驗機率還要結合先驗並正規化。必須先交代獨立性與類別定義，不能把強相關的重複特徵當作無限增加的獨立證據。\u003ca href=\"#/sources/hs-006\"\u003eHS-006，PDF p.18–19\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e更多有效資料通常有助於辨別，但有限樣本下，正確候選的後驗不必每加入一條 trace 就單調增加。模型偏移或不合適的模板也可能累積錯誤證據。這是機率判讀限制，不是使用者已觀察到的實測現象。\u003ca href=\"#/sources/hs-006\"\u003eHS-006，PDF p.18–19，本文解讀\u003c/a\u003e\u003c/p\u003e\n\u003ch2 id=\"p-67ccc3045ee1-s7\"\u003e與 CPA 的比較\u003c/h2\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e比較\u003c/th\u003e\n\u003cth\u003eCPA\u003c/th\u003e\n\u003cth\u003eTemplate\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e主要模型\u003c/td\u003e\n\u003ctd\u003e預測洩漏與量測的線性相關\u003c/td\u003e\n\u003ctd\u003e類別條件下的量測分布\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e剖析階段\u003c/td\u003e\n\u003ctd\u003e課內基本例不需另建參考模板\u003c/td\u003e\n\u003ctd\u003e需參考量測建立模板\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e描述變動\u003c/td\u003e\n\u003ctd\u003e通常用單點相關\u003c/td\u003e\n\u003ctd\u003e可包含多點共變異數\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e失效來源\u003c/td\u003e\n\u003ctd\u003e模型不合、雜訊、錯位\u003c/td\u003e\n\u003ctd\u003e另有剖析不足、裝置差異、分布假設不合\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e比較依 HS-005 PDF p.9–14、HS-006 PDF p.7–12 重整。現在兩份作業要求 SNR 與 CPA，未將模板分析另當第三份作業。\u003c/p\u003e\n\u003ch2 id=\"p-67ccc3045ee1-s8\"\u003e來源與範圍\u003c/h2\u003e\n\u003cp\u003e\u003ca href=\"#/sources/hs-006\"\u003eHS-006\u003c/a\u003e：19 頁；搭配\u003ca href=\"#/sources/hs-004\"\u003eHS-004\u003c/a\u003e的多變量公式與\u003ca href=\"#/sources/hs-005\"\u003eHS-005\u003c/a\u003e的 CPA 模型比較。\u003c/p\u003e", "text": "# 模板攻擊與機率判讀\n\n## 先分清模板分析多知道了什麼\n模板攻擊（Template Attack）屬於剖析式方法（Profiling）：先在可控制的參考裝置建立不同中間值的量測分布，再用目標觀測比較哪一種分布較合理。參考裝置的可取得性、可控制性，以及能否代表目標裝置，是額外假設。[HS-006，PDF p.3–10](../../../sources/hs-006.md)\n\n| 階段 | 輸入 | 產物 |\n| --- | --- | --- |\n| 剖析 Profiling | 已知類別的多次參考量測 | 各類別平均向量與共變異數矩陣 |\n| 比較／推論 | 目標量測的特徵向量 | 在各類別模型下的似然與排序 |\n\n模板不是一張固定波形圖片，也不是把兩條線目測疊起來。它同時描述訊號中心與隨機變動。[HS-006，PDF p.7–10](../../../sources/hs-006.md)\n\n## 平均向量與共變異數矩陣\n選 d 個關注點（Points of Interest，POIs），每次觀測變成 d 維向量 t。某個類別 h 的模板為 `(m_h,C_h)`：m_h 長度 d，C_h 為 d×d 矩陣；對角線是各點變異，非對角線是兩點的共變異數。[HS-006，PDF p.8–9；HS-004，PDF p.16](../../../sources/hs-006.md)\n\n**自編理解例子**：兩個觀測點總是一起升降，不能把它們當兩份完全獨立的證據；C 描述這種共同變動。只比每個點離平均多遠，會漏掉方向與尺度。\n\n## 最大似然：越大越合理\n多變量高斯的對數似然可寫為：\n\n\u003cdiv class=\"formula\"\u003elog p(t ∣ h) = −½[(t−m_h)ᵀ C_h⁻¹(t−m_h) + log det C_h + d log(2π)]\u003c/div\u003e\n\n在候選 h 之間選**最大的 log p**，等價於選最大的 p，因為 log 是單調遞增函數。取 log 是為了把乘法變加法並改善數值穩定性，不是改變優劣方向。[HS-004，PDF p.16；HS-006，PDF p.10–11、15](../../../sources/hs-006.md)\n\n講義 p.11 的簡記含 `\\|ln p\\|`，不應泛化成「最小絕對對數值」。機率密度可大於 1，log 密度也可為正；普遍正確的判準仍是最大似然／最大對數似然。p.15 範例的 −5.98 比 −49.54 大，因此前者較合理。[HS-006，PDF p.10–11、15，本文數學辨析](../../../sources/hs-006.md)\n\n## 為什麼不能隨意省掉 C\n教材的 reduced template 只保留平均向量並比較歐氏距離。這可視為各類別具有共同且等向性共變異數等條件下的簡化；若類別的散布大小、方向不同，只比平均距離可能與完整似然給出不同結果。[HS-006，PDF p.12；由高斯公式推得的條件說明](../../../sources/hs-006.md)\n\n估計 C 需要足夠樣本；POI 太多、樣本太少或特徵高度重複，可能使矩陣難以反轉。更多維度不一定更準，應與[統計主題](04-trace-statistics.md)的點間相關一起理解。[HS-004，PDF p.13–20；本文估計限制](../../../sources/hs-004.md)\n\n## 教材 MOV 與 key schedule 圖怎麼看\nMOV 範例依搬移 byte 的 HW 形成九種分布，再選五個 POI。這裡的「九」來自 8-bit HW 的 0 至 8，而非只有九種 byte 值。「五」是該例選取的維度，不是模板分析的固定參數。[HS-006，PDF p.13–15](../../../sources/hs-006.md)\n\n金鑰擴展（Key Schedule）本身也處理與金鑰相關的中間值。教材以多個 HW 條件縮小候選集合，圖中的剩餘候選數只屬於該例的觀測與假設，不能當通用保證。[HS-006，PDF p.16–17](../../../sources/hs-006.md)\n\n## 合併多條觀測與 Bayes 關係\n條件獨立的量測可將似然相乘，或把 log 似然相加；後驗機率還要結合先驗並正規化。必須先交代獨立性與類別定義，不能把強相關的重複特徵當作無限增加的獨立證據。[HS-006，PDF p.18–19](../../../sources/hs-006.md)\n\n更多有效資料通常有助於辨別，但有限樣本下，正確候選的後驗不必每加入一條 trace 就單調增加。模型偏移或不合適的模板也可能累積錯誤證據。這是機率判讀限制，不是使用者已觀察到的實測現象。[HS-006，PDF p.18–19，本文解讀](../../../sources/hs-006.md)\n\n## 與 CPA 的比較\n| 比較 | CPA | Template |\n| --- | --- | --- |\n| 主要模型 | 預測洩漏與量測的線性相關 | 類別條件下的量測分布 |\n| 剖析階段 | 課內基本例不需另建參考模板 | 需參考量測建立模板 |\n| 描述變動 | 通常用單點相關 | 可包含多點共變異數 |\n| 失效來源 | 模型不合、雜訊、錯位 | 另有剖析不足、裝置差異、分布假設不合 |\n\n比較依 HS-005 PDF p.9–14、HS-006 PDF p.7–12 重整。現在兩份作業要求 SNR 與 CPA，未將模板分析另當第三份作業。\n\n## 來源與範圍\n[HS-006](../../../sources/hs-006.md)：19 頁；搭配[HS-004](../../../sources/hs-004.md)的多變量公式與[HS-005](../../../sources/hs-005.md)的 CPA 模型比較。\n", "headings": [{"id": "p-67ccc3045ee1-s1", "text": "先分清模板分析多知道了什麼"}, {"id": "p-67ccc3045ee1-s2", "text": "平均向量與共變異數矩陣"}, {"id": "p-6

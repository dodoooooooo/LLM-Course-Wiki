基本例不需另建參考模板 需參考量測建立模板 描述變動 通常用單點相關 可包含多點共變異數 失效來源 模型不合、雜訊、錯位 另有剖析不足、裝置差異、分布假設不合 比較依 HS-005 PDF p.9–14、HS-006 PDF p.7–12 重整。現在兩份作業要求 SNR 與 CPA，未將模板分析另當第三份作業。 來源與範圍 HS-006 ：19 頁；搭配 HS-004 的多變量公式與 HS-005 的 CPA 模型比較。 "}, {"id": "courses/hardware-security/lessons/07-pqc", "path": "/hs/lessons/7", "title": "後量子密碼與 ML-KEM", "short": "後量子密碼與 ML-KEM", "desc": "標準、格、NTT 與金鑰封裝", "courseId": "hardware-security", "sectionId": "lessons", "kind": "lesson", "status": "needs-review", "source": "HS-007", "pages": 36, "questions": [], "trackReading": true, "metadata": {"id": "hs-07-pqc", "title": "後量子密碼與 ML-KEM", "course": "hardware-security", "type": "lesson", "status": "needs-review", "created": "2026-11-06", "updated": "2026-11-06", "sources": ["HS-007", "HS-001", "EXT-001", "EXT-002", "EXT-003"], "tags": ["硬體安全", "課程"]}, "file": "Hardware Security PQC.pdf", "readKey": "hs-lesson-7", "quizKey": "courses/hardware-security/lessons/07-pqc", "recordChapter": "courses/hardware-security/lessons/07-pqc", "lessonPath": "/hs/lessons/7", "html": "\u003ch1\u003e後量子密碼與 ML-KEM\u003c/h1\u003e\n\u003ch2 id=\"p-5008399e6d94-s1\"\u003ePQC 的問題與邊界\u003c/h2\u003e\n\u003cp\u003e後量子密碼（Post-Quantum Cryptography，PQC）希望在傳統電腦上執行，並抵抗已知量子演算法的攻擊；它不是量子通訊，也不是使用量子硬體來加密。安全性依賴所採困難問題與分析，不代表已證明任何未來攻擊都無效。\u003ca href=\"#/sources/hs-007\"\u003eHS-007，PDF p.2–11\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003eShor 演算法針對因數分解與離散對數，影響 RSA、DH、ECC 的核心假設；Grover 對通用搜尋提供平方根級加速，與 Shor 的效果不同。不能用「有量子電腦，所以所有密碼都立刻失效」概括。\u003ca href=\"#/sources/hs-007\"\u003eHS-007，PDF p.3–6\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e先蒐集、未來解密（Harvest Now, Decrypt Later）關係到長期機密資料。教材的量子硬體預測與競賽時間表是歷史背景，不能據此斷言哪一年一定出現特定能力。\u003ca href=\"#/sources/hs-007\"\u003eHS-007，PDF p.4–9\u003c/a\u003e\u003c/p\u003e\n\u003ch2 id=\"p-5008399e6d94-s2\"\u003e標準名稱與任務不要混用\u003c/h2\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e標準\u003c/th\u003e\n\u003cth\u003e演算法\u003c/th\u003e\n\u003cth\u003e任務\u003c/th\u003e\n\u003cth\u003e主要基礎\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003eFIPS 203\u003c/td\u003e\n\u003ctd\u003eML-KEM\u003c/td\u003e\n\u003ctd\u003e建立共享祕密的金鑰封裝\u003c/td\u003e\n\u003ctd\u003eModule-LWE／模組格\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eFIPS 204\u003c/td\u003e\n\u003ctd\u003eML-DSA\u003c/td\u003e\n\u003ctd\u003e數位簽章\u003c/td\u003e\n\u003ctd\u003e模組格\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eFIPS 205\u003c/td\u003e\n\u003ctd\u003eSLH-DSA\u003c/td\u003e\n\u003ctd\u003e無狀態雜湊式數位簽章\u003c/td\u003e\n\u003ctd\u003e雜湊；源自 SPHINCS+\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e以上依講義 p.11，另核對 NIST 官方標準頁。三份均於 2024-08-13 發布；本文只補查這三份，不把它們說成完整的當前 PQC 清單。\u003ca href=\"#/sources/hs-010-standards\"\u003eHS-007，PDF p.11；EXT-001～003\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e講義 p.7 的家族與候選例子是歷史分類清單，不是可直接採用的推薦清單；候選名稱、標準名稱與安全狀態要分開。這裡不提供部署選型建議。\u003c/p\u003e\n\u003ch2 id=\"p-5008399e6d94-s3\"\u003e雜湊式簽章：一次性與樹\u003c/h2\u003e\n\u003cp\u003eLamport 一次性簽章（One-time Signature，OTS）為每個訊息位元準備兩個祕密值，公開其雜湊；簽署依位元選擇揭露其中一個。重用會揭露更多材料，因此「一次性」是機制的重要條件。\u003ca href=\"#/sources/hs-007\"\u003eHS-007，PDF p.12–14\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003eMerkle 樹把許多一次性驗證公鑰承諾到一個根；驗證時提供認證路徑（Authentication Path）。WOTS 以雜湊鏈減少大小，完整機制還有校驗等細節；不要把課堂簡圖當成完整規格。無狀態架構不等於任意重用同一把 OTS 金鑰。\u003ca href=\"#/sources/hs-007\"\u003eHS-007，PDF p.15–18\u003c/a\u003e\u003c/p\u003e\n\u003ch2 id=\"p-5008399e6d94-s4\"\u003e格、SVP、CVP 與 LWE\u003c/h2\u003e\n\u003cp\u003e格（Lattice）是基底向量整數線性組合形成的點集合。最短向量問題（SVP）尋找格中的最短\u003cstrong\u003e非零向量\u003c/strong\u003e，不只是從現有基底挑最短那根；最近向量問題（CVP）尋找最接近目標點的格點。\u003ca href=\"#/sources/hs-007\"\u003eHS-007，PDF p.19–20\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003eLWE（Learning with Errors）的簡化關係為 \u003ccode\u003eb=A s+e mod q\u003c/code\u003e。A、b 可公開，s 是祕密向量，e 是小誤差；誤差使公開線性關係不再能直接照一般無誤差方程求解。這不是把任意大小的雜訊加進去就自動安全，參數與分布是構造的一部分。\u003ca href=\"#/sources/hs-007\"\u003eHS-007，PDF p.21\u003c/a\u003e\u003c/p\u003e\n\u003ch2 id=\"p-5008399e6d94-s5\"\u003e多項式環與 NTT 為什麼出現\u003c/h2\u003e\n\u003cp\u003eRing／Module 結構以多項式表示運算。教材考慮 \u003ccode\u003eZ_q[X]/(X^n+1)\u003c/code\u003e：係數模 q，且 \u003ccode\u003eX^n ≡ −1\u003c/code\u003e。高次項降階時有符號變化，不能只截掉超過 n 的係數。\u003ca href=\"#/sources/hs-007\"\u003eHS-007，PDF p.22–23\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e數論轉換（Number Theoretic Transform，NTT）把合適條件下的多項式乘法轉到轉換域，以加速核心運算。教材比較直接乘法的平方級運算量與轉換的 \u003ccode\u003eO(n log n)\u003c/code\u003e；這不是聲稱整套加解密每個步驟都只需同樣複雜度，轉換也需要相應有限域條件。\u003ca href=\"#/sources/hs-007\"\u003eHS-007，PDF p.24–26\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003eMontgomery 表示把 a 映射到 \u003ccode\u003eaR mod N\u003c/code\u003e，令 \u003ccode\u003eR\u003c/code\u003e 為與 N 互質的二次冪，降低特定模約減的成本。約減輸出帶有 \u003ccode\u003eR⁻¹\u003c/code\u003e 因子，需要維持表示域一致。教材 p.28 的最後減法邊界寫作 \u003ccode\u003et\u0026gt;N\u003c/code\u003e，若 t＝N 也須約減為 0，整理時依模數範圍採 \u003ccode\u003et≥N\u003c/code\u003e。\u003ca href=\"#/sources/hs-007\"\u003eHS-007，PDF p.27–28，本文邊界辨析\u003c/a\u003e\u003c/p\u003e\n\u003ch2 id=\"p-5008399e6d94-s6\"\u003eKEM 與內部 K-PKE 的關係\u003c/h2\u003e\n\u003cp\u003e金鑰封裝機制（Key-Encapsulation Mechanism，KEM）有三個介面：KeyGen 產生封裝／解封裝金鑰；Encaps 用封裝金鑰產生 ciphertext 與共享祕密；Decaps 用解封裝金鑰與 ciphertext 得到對應祕密。應用再用共享祕密進行對稱式保護。\u003ca href=\"#/sources/hs-010-standards\"\u003eHS-007，PDF p.29；EXT-001\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003eK-PKE 是 ML-KEM 的內部元件，講義明確說不可作為獨立密碼機制。不能把課堂的多項式加解密式子視為完整的 CCA 安全 KEM。\u003ca href=\"#/sources/hs-007\"\u003eHS-007，PDF p.30–34\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e忽略壓縮誤差以理解抵消時：若 \u003ccode\u003et=As+e\u003c/code\u003e、\u003ccode\u003eu=Aᵀy+e₁\u003c/code\u003e、\u003ccode\u003ev=tᵀy+e₂+μ\u003c/code\u003e，則 \u003ccode\u003ev−sᵀu=μ+eᵀy+e₂−sᵀe₁\u003c/code\u003e。講義 p.33 最後一項印成加號，依前面的減法展開應為減號；完整解碼還需考慮誤差界與壓縮。\u003ca href=\"#/sources/hs-007\"\u003eHS-007，PDF p.31–34，本文代數校正\u003c/a\u003e\u003c/p\u003e\n\u003ch2 id=\"p-5008399e6d94-s7\"\u003e參數與實作安全要分開\u003c/h2\u003e\n\u003cp\u003e講義列 ML-KEM 的 \u003ccode\u003en=256\u003c/code\u003e、\u003ccode\u003eq=3329\u003c/code\u003e，三種參數集 ML-KEM-512／768／1024 對應不同模組維度與安全類別；名稱數字不是共享祕密的 bit 長度。這些參數與 NTT、壓縮、種子展開共同影響效率。\u003ca href=\"#/sources/hs-007\"\u003eHS-007，PDF p.35–36\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003ePQC 換了數學基礎，仍會由真實程式與電路執行；因此前面課程的功耗、資料相依操作與實作假設仍值得檢查。此句是跨主題推論，不是宣稱已對使用者 PQC 程式做側通道實驗。\u003ca href=\"#/sources/hs-001\"\u003eHS-001，PDF p.26–36；HS-007，PDF p.24–36\u003c/a\u003e\u003c/p\u003e\n\u003ch2 id=\"p-5008399e6d94-s8\"\u003e來源與範圍\u003c/h2\u003e\n\u003cp\u003e\u003ca href=\"#/sources/hs-007\"\u003eHS-007\u003c/a\u003e：36 頁，整理三類基礎與 ML-KEM；\u003ca href=\"#/sources/hs-010-standards\"\u003eEXT-001～003\u003c/a\u003e僅核對官方名稱、用途與發布日期。講義的歷史預測、候選清單不當現行建議。\u003c/p\u003e", "text": "# 後量子密碼與 ML-KEM\n\n## PQC 的問題與邊界\n後量子密碼（Post-Quantum Cryptography，PQC）希望在傳統電腦上執行，並抵抗已知量子演算法的攻擊；它不是量子通訊，也不是使用量子硬體來加密。安全性依賴所採困難問題與分析，不代表已證明任何未來攻擊都無效。[HS-007，PDF p.2–11](../../../sources/hs-007.md)\n\nShor 演算法針對因數分解與離散對數，影響 RSA、DH、ECC 的核心假設；Grover 對通用搜尋提供平方根級加速，與 Shor 的效果不同。不能用「有量子電腦，所以所有密碼都立刻失效」概括。[HS-007，PDF p.3–6](../../../sources/hs-007.md)\n\n先蒐集、未來解密（Harvest Now, Decrypt Later）關係到長期機密資料。教材的量子硬體預測與競賽時間表是歷史背景，不能據此斷言哪一年一定出現特定能力。[HS-007，PDF p.4–9](../../../sources/hs-007.md)\n\n## 標準名稱與任務不要混用\n| 標準 | 演算法 | 任務 | 主要基礎 |\n| --- | --- | --- | --- |\n| FIPS 203 | ML-KEM | 建立共享祕密的金鑰封裝 | Module-LWE／模組格 |\n| FIPS 204 | ML-DSA | 數位簽章 | 模組格 |\n| FIPS 205 | SLH-DSA | 無狀態雜湊式數位簽章 | 雜湊；源自 SPHINCS+ |\n\n以上依講義 p.11，另核對 NIST 官方標準頁。三份均於 2024-08-13 發布；本文只補查這三份，不把它們說成完整的當前 PQC 清單。[HS-007，PDF p.11；EXT-001～003](../../../sources/hs-010-standards.md)\n\n講義 p.7 的家族與候選例子是歷史分類清單，不是可直接採用的推薦清單；候選名稱、標準名稱與安全狀態要分開。這裡不提供部署選型建議。\n\n## 雜湊式簽章：一次性與樹\nLamport 一次性簽章（One-time Signature，OTS）為每個訊息位元準備兩個祕密值，公開其雜湊；簽署依位元選擇揭露其中一個。重用會揭露更多材料，因此「一次性」是機制的重要條件。[HS-007，PDF p.12–14](../../../sources/hs-007.md)\n\nMerkle 樹把許多一次性驗證公鑰承諾到一個根；驗證時提供認證路徑（Authentication Path）。WOTS 以雜湊鏈減少大小，完整機制還有校驗等細節；不要把課堂簡圖當成完整規格。無狀態架構不等於任意重用同一把 OTS 金鑰。[HS-007，PDF p.15–18](../../../sources/hs-007.md)\n\n## 格、SVP、CVP 與 LWE\n格（Lattice）是基底向量整數線性組合形成的點集合。最短向量問題（SVP）尋找格中的最短**非零向量**，不只是從現有基底挑最短那根；最近向量問題（CVP）尋找最接近目標點的格點。[HS-007，PDF p.19–20](../../../sources/hs-007.md)\n\nLWE（Learning with Errors）的簡化關係為 `b=A s+e mod q`。A、b 可公開，s 是祕密向量，e 是小誤差；誤差使公開線性關係不再能直接照一般無誤差方程求解。這不是把任意大小的雜訊加進去就自動安全，參數與分布是構造的一部分。[HS-007，PDF p.21](../../../sources/hs-007.md)\n\n## 多項式環與 NTT 為什麼出現\nRing／Module 結構以多項式表示運算。教材考慮 `Z_q[X]/(X^n+1)`：係數模 q，且 `X^n ≡ −1`。高次項降階時有符號變化，不能只截掉超過 n 的係數。[HS-007，PDF p.22–23](../../../sources/hs-007.md)\n\n數論轉換（Number Theoretic Transform，NTT）把合適條件下的多項式乘法轉到轉換域，以加速核心運算。教材比較直接乘法的平方級運算量與轉換的 `O(n log n)`；這不是聲稱整套加解密每個步驟都只需同樣複雜度，轉換也需要相應有限域條件。[HS-007，PDF p.24–26](../../../sources/hs-007.md)\n\nMontgomery 表示把 a 映射到 `aR mod N`，令 `R` 為與 N 互質的二次冪，降低特定模約減的成本。約減輸出帶有 `R⁻¹` 因子，需要維持表示域一致。教材 p.28 的最後減法邊界寫作 `t\u003eN`，若 t＝N 也須約減為 0，整理時依模數範圍採 `t≥N`。[HS-007，PDF p.27–28，本文邊界辨析](../../../sources/hs-007.md)\n\n## KEM 與內部 K-PKE 的關係\n金鑰封裝機制（Key-Encapsulation Mechanism，KEM）有三個介面：KeyGen 產生封裝／解封裝金鑰；Encaps 用封裝金鑰產生 ciphertext 與共享祕密；Decaps 用解封裝金鑰與 ciphertext 得到對應祕密。應用再用共享祕密進行對稱式保護。[HS-007，PDF p.29；EXT-001](../../../sources/hs-010-standards.md)\n\nK-PKE 是 ML-KEM 的內部元件，講義明確說不可作為獨立密碼機制。不能把課堂的多項式加解密式子視為完整的 CCA 安全 KEM。[HS-007，PDF p.30–34](../../../sources/hs-007.md)\n\n忽略壓縮誤差以理解抵消時：若 `t=As+e`、`u=Aᵀy+e₁`、`v=tᵀy+e₂+μ`，則 `v−sᵀu=μ+eᵀy+e₂−sᵀe₁`。講義 p.33 最後一項印成加號，依前面的減法展開應為減號；完整解碼還需考慮誤差界與壓縮。[HS-007，PDF p.31–34，本文代數校正](../../../sources/hs-007.md)\n\n## 參數與實作安全要分開\n講義列 ML-KEM 的 `n=256`、`q=3329`，三種參數集 ML-KEM-512／768／1024 對應不同模組維度與安全類別；名稱數字不是共享祕密的 bit 長度。這些參數與 NTT、壓縮、種子展開共同影響效率。[HS-007，PDF p.35–36](../../../sources/hs-007.md)\n\nPQC 換了數學基礎，仍會由真實程式與電路執行；因此前面課程的功耗、資料相依操作與實作假設仍值得檢查。此句是跨主題推論，不是宣稱已對使用者 PQC 程式做側通道實驗。[HS-001，PDF p.26–36；HS-007，PDF p.24–36](../../../sources/hs-001.md)\n\n## 來源與範圍\n[HS-007](../../../sources/hs-007.md)：36 頁，整理三類基礎與 ML-KEM；[EXT-001～003](../../../sources/hs-010-standards.md)僅核對官方名稱、用途與發布日期。講義的歷史預測、候選清單不當現行建議。\n", "headings": [{"id": "p-5008399e6d94-s1", "text": "PQC 的問題與邊界"}, {"id": "p-5008399e6d94-s2", "text": "標準名稱與任務不要混用"}, {"id": "p-5008399e6d94-s3", "text": "雜湊式簽章：一次性與樹"}, {"id": "p-5008399e6d94-s4", "text": "格、SVP、CVP 與 LWE"}, {"id": "p-5008399e6d94-s5", "text": "多項式環與 NTT 為什麼出現"}, {"id": "p-5008399e6d94-s6", "text": "KEM 與內部 K-PKE 的關係"}, {"id": "p-5008399e6d94-s7", "text": "參數與實作安全要分開"}, {"id": "p-5008399e6d94-s8", "text": "來源與範圍"}], "sectionCount": 8, "searchText": "後量子密碼與 ML-KEM PQC 的問題與邊界 後量子密碼（Post-Quantum Cryptography，PQC）希望在傳統電腦上執行，並抵抗已知量子演算法的攻擊；它不是量子通訊，也不是使用量子硬體來加密。安全性依賴所採困難問題與分析，不代表已證明任何未來攻擊都無效。 HS-007，PDF p.2–11 Shor 演算法針對因數分解與離散對數，影響 RSA、DH、ECC 的核心假設；Grover 對通用搜尋提供平方根級加速，與 Shor 的效果不同。不能用「有量子電腦，所以所有密碼都立刻失效」概括。 HS-007，PDF p.3–6 先蒐集、未來解密（Harvest Now, Decrypt Later）關係到長期機密資料。教材的量子硬體預測與競賽時間表是歷史背景，不能據此斷言哪一年一定出現特定能力。 HS-007，PDF p.4–9 標準名稱與任務不要混用 標準 演算法 任務 主要基礎 FIPS 203 ML-KEM 建立共享祕密的金鑰封裝 Module-LWE／模組格 FIPS 204 ML-DSA 數位簽章 模組格 FIPS 205 SLH-DSA 無狀態雜湊式數位簽章 雜湊；源自 SPHINCS+ 以上依講義 p.11，另核對 NIST 官方標準頁。三份均於 2024-08-13 發布；本文只補查這三份，不把它們說成完整的當前 PQC 清單。 HS-007，PDF p.11；EXT-001～003 講義 p.7 的家族與候選例子是歷史分類清單，不是可直接採用的推薦清單；候選名稱、標準名稱與安全狀態要分開。這裡不提供部署選型建議。 雜湊式簽章：一次性與樹 Lamport 一次性簽章（One-time Signature，OTS）為每個訊息位元準備兩個祕密值，公開其雜湊；簽署依位元選擇揭露其中一個。重用會揭露更多材料，因此「一次性」是機制的重要條件。 HS-007，PDF p.12–14 Merkle 樹把許多一次性驗證公鑰承諾到一個根；驗證時提供認證路徑（Authentication Path）。WOTS 以雜湊鏈減少大小，完整機制還有校驗等細節；不要把課堂簡圖當成完整規格。無狀態架構不等於任意重用同一把 OTS 金鑰。 HS-007，PDF p.15–18 格、SVP、CVP 與 LWE 格（Lattice）是基底向量整數線性組合形成的點集合。最短向量問題（SVP）尋找格中的最短 非零向量 ，不只是從現有基底挑最短那根；最近向量問題（CVP）尋找最接近目標點的格點。 HS-007，PDF p.19–20 LWE（Learning with Errors）的簡化關係為 b=A s+e mod q 。A、b 可公開，s 是祕密向量，e 是小誤差；誤差使公開線性關係不再能直接照一般無誤差方程求解。這不是把任意大小的雜訊加進去就自動安全，參數與分布是構造的一部分。 HS-007，PDF p.21 多項式環與 NTT 為什麼出現 Ring／Module 結構以多項式表示運算。教材考慮 Z_q[X]/(X^n+1) ：係數模 q，且 X^n ≡ −1 。高次項降階時有符號變化，不能只截掉超過 n 的係數。 HS-007，PDF p.22–23 數論轉換（Number Theoretic Transform，NTT）把合適條件下的多項式乘法轉到轉換域，以加速核心運算。教材比較直接乘法的平方級運算量與轉換的 O(n log n) ；這不是聲稱整套加解密每個步驟都只需同樣複雜度，轉換也需要相應有限域條件。 HS-007，PDF p.24–26 Montgomery 表示把 a 映射到 aR mod N ，令 R 為與 N 互質的二次冪，降低特定模約減的成本。約減輸出帶有 R⁻¹ 因子，需要維持表示域一致。教材 p.28 的最後減法邊界寫作 t\u003eN ，若 t＝N 也須約減為 0，整理時依模數範圍採 t≥N 。 HS-007，PDF p.27–28，本文邊界辨析 KEM 與內部 K-PKE 的關係 金鑰封裝機制（Key-Encapsulation Mechanism，KEM）有三個介面：KeyGen 產生封裝／解封裝金鑰；Encaps 用封裝金鑰產生 ciphertext 與共享祕密；Decaps 用解封裝金鑰與 ciphertext 得到對應祕密。應用再用共享祕密進行對稱式保護。 HS-007，PDF p.29；EXT-001 K-PKE 是 ML-KEM 的內部元件，講義明確說不可作為獨立密碼機制。不能把課堂的多項式加解密式子視為完整的 CCA 安全 KEM。 HS-007，PDF p.30–34 忽略壓縮誤差以理解抵消時：若 t=As+e 、 u=Aᵀy+e₁ 、 v=tᵀy+e₂+μ ，則 v−sᵀu=μ+eᵀy+e₂−sᵀe₁ 。講義 p.33 最後一項印成加號，依前面的減法展開應為減號；完整解碼還需考慮誤差界與壓縮。 HS-007，PDF p.31–34，本文代數校正 參數與實作安全要分開 講義列 ML-KEM 的 n=256 、 q=3329 ，三種參數集 ML-KEM-512／768／1024 對應不同模組維度與安全類別；名稱數字不是共享祕密的 bit 長度。這些參數與 NTT、壓縮、種子展開共同影響效率。 HS-007，PDF p.35–36 PQC 換了數學基礎，仍會由真實程式與電路執行；因此前面課程的功耗、資料相依操作與實作假設仍值得檢查。此句是跨主題推論，不是宣稱已對使用者 PQC 程式做側通道實驗。 HS-001，PDF p.26–36；HS-007，PDF p.24–36 來源與範圍 HS-007 ：36 頁，整理三類基礎與 ML-KEM； EXT-001～003 僅核對官方名稱、用途與發布日期。講義的歷史預測、候選清單不當現行建議。 "}, {"id": "courses/hardware-security/assignments/index", "path": "/hs/assignments", "title": "硬體安全｜作業", "short": "硬體安全｜作業", "desc": "1. [作業一：AES 功耗軌跡與 SNR](assignment-01-snr.md)：已有 Notebook 保存輸出，原資料未重驗。", "courseId": "hardware-security", "sectionId": "assignments", "kind": "section", "status": "", "source": "", "pages": null, "questions": [], "trackReading": false, "metadata": {"title": "硬體安全｜作業"}, "readKey": "courses/hardware-security/assignments/index", "quizKey": "courses/hardware-security/assignments/index", "recordChapter": "courses/hardware-security/assignments/index", "html": "\u003ch1\u003e硬體安全｜作業\u003c/h1\u003e\n\u003col\u003e\n\u003cli\u003e\u003ca href=\"#/hs/assignments/1\"\u003e作業一：AES 功耗軌跡與 SNR\u003c/a\u003e：已有 Notebook 保存輸出，原資料未重驗。\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/hs/assignments/2\"\u003e作業二：CPA 與十六個 key bytes\u003c/a\u003e：題目已確認，實際成果待補。\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e\u003ca href=\"#/hs\"\u003e回硬體安全\u003c/a\u003e\u003c/p\u003e", "text": "# 硬體安全｜作業\n\n1. [作業一：AES 功耗軌跡與 SNR](assignment-01-snr.md)：已有 Notebook 保存輸出，原資料未重驗。\n2. [作業二：CPA 與十六個 key bytes](assignment-02-cpa.md)：題目已確認，實際成果待補。\n\n[回硬體安全](../index.md)\n", "headings": [], "sectionCount": 0, "searchText": "硬體安全｜作業 作業一：AES 功耗軌跡與 SNR ：已有 Notebook 保存輸出，原資料未重驗。 作業二：CPA 與十六個 key bytes ：題目已確認，實際成果待補。 回硬體安全 "}, {"id": "courses/hardware-security/assignments/assignment-01-snr", "path": "/hs/assignments/1", "title": "作業一：AES 功耗軌跡與 SNR", "short": "AES 功耗軌跡與 SNR", "desc": "51,200 條軌跡、十六個 S-box HW 與保存成果導讀", "courseId": "hardware-security", "sectionId": "assignments", "kind": "assignment", "status": "已有 Notebook 保存成果", "source": "HS-008／HS-009", "pages": null, "questions": [], "trackReading": false, "metadata": {"id": "hs-assignment-01-snr", "title": "作業一：AES 功耗軌跡與 SNR", "course": "hardware-security", "type": "assignment", "status": "needs-review", "created": "2026-11-06", "updated": "2026-11-06", "sources": ["HS-008", "HS-009", "HS-004"], "tags": ["硬體安全", "作業"]}, "readKey": "courses/hardware-security/assignments/assignment-01-snr", "quizKey": "courses/hardware-security/assignments/assignment-01-snr", "recordChapter": "courses/hardware-security/assignments/assignment-01-snr", "lessonPath": "/hs", "html": "\u003ch1\u003e作業一：AES 功耗軌跡與 SNR\u003c/h1\u003e\n\u003ch2 id=\"p-41ad8d66dea7-s1\"\u003e原始題目要求\u003c/h2\u003e\n\u003cp\u003e在 ChipWhisperer Nano 執行 AES-128，擷取 \u003cstrong\u003e51,200 條使用隨機明文的功耗軌跡\u003c/strong\u003e；針對第一輪 \u003cstrong\u003e16 個 S-box 輸出\u003c/strong\u003e的漢明重量（HW）各自計算並繪製 SNR trace。題目提到可參考課程 SCA101 的 Power and Hamming Weight Relationship Notebook，並用 matplotlib 繪圖。\u003ca href=\"#/sources/hs-009\"\u003eHS-009，分享對話內使用者貼上的作業一原題\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e本頁把題目、已保存的實作與缺少的原始資料分開。未提供正式截止日期、評分細則或交件檔名，不自行補上。\u003c/p\u003e\n\u003ch2 id=\"p-41ad8d66dea7-s2\"\u003e目前證據到哪裡\u003c/h2\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e項目\u003c/th\u003e\n\u003cth\u003e原 Notebook 保存內容\u003c/th\u003e\n\u003cth\u003e本輪確認的界線\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e目標平台\u003c/td\u003e\n\u003ctd\u003eCWNANO、TINYAES128C、SS_VER_2_1\u003c/td\u003e\n\u003ctd\u003e讀到設定，未重新連裝置\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e擷取設定\u003c/td\u003e\n\u003ctd\u003eTOTAL＝51200、BATCH＝1000\u003c/td\u003e\n\u003ctd\u003e有程式與保存輸出，未重新擷取\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e批次檔\u003c/td\u003e\n\u003ctd\u003e52 個 NPZ，欄位 t／p／k\u003c/td\u003e\n\u003ctd\u003e有檔案列表輸出，沒有實際批次資料\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e合併陣列\u003c/td\u003e\n\u003ctd\u003etraces \u003ccode\u003e(51200,5000)\u003c/code\u003e、plaintexts \u003ccode\u003e(51200,16)\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e保存輸出，不是本輪重新載入驗證\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e明文與 key 檢查\u003c/td\u003e\n\u003ctd\u003eunique plaintexts＝51200、duplicates＝0；same key＝True\u003c/td\u003e\n\u003ctd\u003e原執行的檢查結果\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eSNR\u003c/td\u003e\n\u003ctd\u003ecell 22 有完整計算與 Byte 0–15 的 4×4 圖\u003c/td\u003e\n\u003ctd\u003e已核對程式與保存圖片，未重算數值\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e來源：\u003ca href=\"#/sources/hs-008\"\u003eHS-008，cell 1、10–14、22\u003c/a\u003e。狀態是「已有作業一保存成果，可補原資料驗證」，不推定已交件或教師已評分。\u003c/p\u003e\n\u003ch2 id=\"p-41ad8d66dea7-s3\"\u003e資料欄位與一筆資料的意義\u003c/h2\u003e\n\u003cp\u003e\u003ccode\u003et[i,j]\u003c/code\u003e 是第 i 次 AES 運算在 sample j 的量測值；\u003ccode\u003ep[i,b]\u003c/code\u003e 是同一次運算的第 b 個明文 byte；k 保存實驗使用的金鑰。\u003cstrong\u003et 與 p 的第 i 列必須代表同一次運算\u003c/strong\u003e。批次串接順序若不一致，即使形狀正確也失去對應關係。\u003ca href=\"#/sources/hs-008\"\u003eHS-008，cell 10、12；本文欄位解讀\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e5000 是這份 Notebook 保存的每條取樣點數，不是題目對所有人的固定要求。沒有完整量測設定時，橫軸保留 sample index，不能自行換成秒。\u003ca href=\"#/sources/hs-008\"\u003eHS-008，cell 12、22\u003c/a\u003e\u003c/p\u003e\n\u003ch2 id=\"p-41ad8d66dea7-s4\"\u003e理解計算，不只看見一張圖\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e固定 byte b，從明文與已知實驗金鑰得到第一輪 S-box 輸出。\u003c/li\u003e\n\u003cli\u003e取該輸出的 HW，得到 0–8 的類別標籤。\u003c/li\u003e\n\u003cli\u003e對每個 sample，以類別平均的變異作訊號、類別內變異的平均作雜訊。\u003c/li\u003e\n\u003cli\u003e使用組別樣本數作權重，形成一條 SNR 曲線。\u003c/li\u003e\n\u003cli\u003e針對 byte 0–15 重複，圖說標明 byte、sample 與 SNR。\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e以上是原 Notebook cell 18–22 的邏輯導讀；SNR 定義與加權細節見\u003ca href=\"#/hs/lessons/4\"\u003e第四主題\u003c/a\u003e。\u003ca href=\"#/sources/hs-008\"\u003eHS-008，ID 0f814646、7aa13ab9；HS-004，PDF p.9–12\u003c/a\u003e\u003c/p\u003e\n\u003ch2 id=\"p-41ad8d66dea7-s5\"\u003e原 Notebook 保存的 SNR 圖\u003c/h2\u003e\n\u003cp\u003e\u003cimg alt=\"作業一 Notebook cell 22 保存的十六個 byte SNR 圖，非本輪重算\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABjYAAAPeCAYAAACvDyPsAAAAOnRFWHRTb2Z0d2FyZQBNYXRwbG90bGliIHZlcnNpb24zLjExLjIsIGh0dHBzOi8vbWF0cGxvdGxpYi5vcmcvgI3uAAAAAAlwSFlzAAAPYQAAD2EBqD+naQABAABJREFUeJzs3Qd8E+UbwPGnA8ose2/ZQwQRWQoCylJERVHcggo4/qKCijjAAW5QcYuIynCgIEsZMkQBlb2RXfamQKEz/8/zlotJSUuaJs36ff2cJZd7L3eXy7333vOOCJvNZhMAAAAAAAAAAIAgEOnvDQAAAAAAAAAAAHAXgQ0AAAAAAAAAABA0CGwAAAAAAAAAAICgQWADAAAAAAAAAAAEDQIbAAAAAAAAAAAgaBDYAAAAAAAAAAAAQYPABgAAAAAAAAAACBoENgAAAAAAAAAAQNAgsAEAAAAAAAAAAIJGtL83APCntWvXmskSEREhpUqVktq1a0uFChU8Xu8///wju3btkptuukl84cyZM/Lnn3/KqVOnpH79+lKjRg2ffA4A4HwTJ050ep0vXz6pWLGiXHLJJZInTx6PDtnZs2dl8uTJcumll0qtWrV8cth37twpS5culUKFCkmXLl188hkAgNAoc9hsNtm4caNs3bpVSpQoIfXq1ZMiRYp4/XMAAKFT5tD1a363d+9eKVeunFx88cVmuwFfibDpHQsQpoYMGSJDhw6VTp06mRt1/Tns3r1b/vrrL+nevbt8/vnn5gFQdvXt29dkQsePH/f6Nk+bNk3uueceqVSpkpnmzZsn1113nYwdO1ZiYmK8/nkAAGf6QEoLFa1atTKvExISzMOl6Ohoee+99+SGG27I9iHbv3+/ufkfMWKE9O/f36uHfMyYMfLpp5+azzhy5IiUL1/ePKwCAOSOYCtzaF42cuRIOXnypDRv3lz27Nkj//77rzz99NMyePBgkw8CAHwr2MocTz75pHz33XfmOVXJkiVl1apVplKu5n/9+vXz6mcBFlpsACLy5ptvSoMGDezHYvr06SZYULlyZXnjjTcC5hht2bJFbr75Zundu7d88MEHZt6GDRukadOm8tRTT8m7777r700EgLDQrFkzp1pUiYmJ0r59e7n99tslLi7O1G4NFFqgeOedd8zDKa01lZKS4u9NAoCwFCxljo8//lhuu+02eeGFF+w1bXWePpjSAIy3H4YBAIK/zFGzZk3ZtGmTFChQwLxOTU2V+++/Xx566CFTBrniiiv8vYkIQYyxAbhw7bXXSsGCBWX58uX2eRoZ//bbbyUtLe285bWZnWY2+nfBggWmyXZycrKZZ03aJM/RiRMnZM6cOfLTTz/J6tWr3foetOaUZg4vv/yyfV7dunVNCw4tbPiihQgA4MK0xZzWmtIgggaclV739fqf2TV+1qxZZtJWFFOmTDHzVqxYYc83NN/JaM2aNab5uKbTfMQdWpho0aIFNWwBIMAEaplDW/kNGzbMqfsQbR2iLf7GjRuX 麼寫\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003e自編寫作框架，請依實際數值補入\u003c/strong\u003e：先交代裝置、資料筆數、每條 sample 數與固定金鑰；再說明中間值與 HW 分組、組別權重及 SNR 公式；圖說指出各 byte 的可辨峰值與 y 軸差異；最後交代資料檢查、量測限制與是否重算。這不是教師指定格式，也不代填未取得的參數或結果。\u003c/p\u003e\n\u003ch2 id=\"p-41ad8d66dea7-s8\"\u003e待補與作業二的關聯\u003c/h2\u003e\n\u003cp\u003e若要重算並核對精確 SNR，需提供 \u003ccode\u003eaes128_batches/\u003c/code\u003e 或合併後的 NPZ，以及實際量測設定；只整理目前網頁不需要先補。作業二要求沿用同一批資料，不能把這張 SNR 圖當 CPA 交件圖。\u003ca href=\"#/sources/hs-009\"\u003eHS-009\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e接著讀\u003ca href=\"#/hs/assignments/2\"\u003e作業二：CPA 與兩類圖\u003c/a\u003e，或回\u003ca href=\"#/hs/lessons/4\"\u003e課程：SNR\u003c/a\u003e、\u003ca href=\"#/hs/lessons/2\"\u003e課程：AES\u003c/a\u003e。\u003c/p\u003e\n\u003ch2 id=\"p-41ad8d66dea7-s9\"\u003e來源\u003c/h2\u003e\n\u003cp\u003e\u003ca href=\"#/sources/hs-008\"\u003eHS-008\u003c/a\u003e：24-cell 原始 Notebook，含保存輸出；\u003ca href=\"#/sources/hs-009\"\u003eHS-009\u003c/a\u003e：作業原題；\u003ca href=\"#/sources/hs-004\"\u003eHS-004\u003c/a\u003e：SNR 理論。未操作硬體、未執行 Notebook、未重新驗證 51,200 條原始資料。\u003c/p\u003e", "text": "# 作業一：AES 功耗軌跡與 SNR\n\n## 原始題目要求\n在 ChipWhisperer Nano 執行 AES-128，擷取 **51,200 條使用隨機明文的功耗軌跡**；針對第一輪 **16 個 S-box 輸出**的漢明重量（HW）各自計算並繪製 SNR trace。題目提到可參考課程 SCA101 的 Power and Hamming Weight Relationship Notebook，並用 matplotlib 繪圖。[HS-009，分享對話內使用者貼上的作業一原題](../../../sources/hs-009.md)\n\n本頁把題目、已保存的實作與缺少的原始資料分開。未提供正式截止日期、評分細則或交件檔名，不自行補上。\n\n## 目前證據到哪裡\n| 項目 | 原 Notebook 保存內容 | 本輪確認的界線 |\n| --- | --- | --- |\n| 目標平台 | CWNANO、TINYAES128C、SS_VER_2_1 | 讀到設定，未重新連裝置 |\n| 擷取設定 | TOTAL＝51200、BATCH＝1000 | 有程式與保存輸出，未重新擷取 |\n| 批次檔 | 52 個 NPZ，欄位 t／p／k | 有檔案列表輸出，沒有實際批次資料 |\n| 合併陣列 | traces `(51200,5000)`、plaintexts `(51200,16)` | 保存輸出，不是本輪重新載入驗證 |\n| 明文與 key 檢查 | unique plaintexts＝51200、duplicates＝0；same key＝True | 原執行的檢查結果 |\n| SNR | cell 22 有完整計算與 Byte 0–15 的 4×4 圖 | 已核對程式與保存圖片，未重算數值 |\n\n來源：[HS-008，cell 1、10–14、22](../../../sources/hs-008.md)。狀態是「已有作業一保存成果，可補原資料驗證」，不推定已交件或教師已評分。\n\n## 資料欄位與一筆資料的意義\n`t[i,j]` 是第 i 次 AES 運算在 sample j 的量測值；`p[i,b]` 是同一次運算的第 b 個明文 byte；k 保存實驗使用的金鑰。**t 與 p 的第 i 列必須代表同一次運算**。批次串接順序若不一致，即使形狀正確也失去對應關係。[HS-008，cell 10、12；本文欄位解讀](../../../sources/hs-008.md)\n\n5000 是這份 Notebook 保存的每條取樣點數，不是題目對所有人的固定要求。沒有完整量測設定時，橫軸保留 sample index，不能自行換成秒。[HS-008，cell 12、22](../../../sources/hs-008.md)\n\n## 理解計算，不只看見一張圖\n1. 固定 byte b，從明文與已知實驗金鑰得到第一輪 S-box 輸出。\n2. 取該輸出的 HW，得到 0–8 的類別標籤。\n3. 對每個 sample，以類別平均的變異作訊號、類別內變異的平均作雜訊。\n4. 使用組別樣本數作權重，形成一條 SNR 曲線。\n5. 針對 byte 0–15 重複，圖說標明 byte、sample 與 SNR。\n\n以上是原 Notebook cell 18–22 的邏輯導讀；SNR 定義與加權細節見[第四主題](../lessons/04-trace-statistics.md)。[HS-008，ID 0f814646、7aa13ab9；HS-004，PDF p.9–12](../../../sources/hs-008.md)\n\n## 原 Notebook 保存的 SNR 圖\n![作業一 Notebook cell 22 保存的十六個 byte SNR 圖，非本輪重算](../../../assets/hs-assignment-01-snr-saved.png)\n\n這張圖直接來自使用者 Notebook 的保存輸出，**不是模擬資料，也不是本輪重新執行**。可見十六個 byte 均有曲線，較明顯峰值集中在前段 sample；各格 y 軸尺度不同，不能只比較視覺高度。精確峰值與位置需原始數值或重算，不能從截圖給出假精確數字。[HS-008，cell 22 圖像輸出](../../../sources/hs-008.md)\n\n高峰表示目前 HW 標籤能解釋該時刻的一部分量測變異；它不是恢復金鑰成功率，也不是訊號電壓。SNR 很低的區段也不能證明所有其他中間值都不洩漏。[HS-004，PDF p.9–12，圖表解讀](../../../sources/hs-004.md)\n\n## 原 Notebook 的定位與注意事項\n| 內容 | 從 1 起算的 cell／ID |\n| --- | --- |\n| 裝置與韌體目標 | 1／1fcd17ee |\n| 分批擷取 | 10／2e6436c3 |\n| 合併批次與形狀 | 12／3453e4d3 |\n| 明文不重複檢查 | 14／cec40738 |\n| S-box 與 HW | 18／0f814646 |\n| 加權 SNR 與繪圖 | 22／7aa13ab9 |\n\ncell 9 是較早的 500-trace 範例文字，不是目前 51,200-trace 程式。cell 15 的合併 NPZ 儲存片段位於 **Markdown cell**，不能因為看見 `np.savez` 就認定它執行過。cell 16 的載入有保存輸出，但目前沒有該 NPZ 檔可獨立驗證。[HS-008，cell 9–16](../../../sources/hs-008.md)\n\n原檔含相對路徑 `../Setup_Scripts/Setup_Generic.ipynb`、工具鏈與外部資料目錄；這份 Wiki 不會自動執行它，搬出原課程環境也不保證直接可跑。本輪只讀保存內容。[HS-008，cell 2、4、10、16](../../../sources/hs-008.md)\n\n## AI 建議：結果說明可以怎麼寫\n**自編寫作框架，請依實際數值補入**：先交代裝置、資料筆數、每條 sample 數與固定金鑰；再說明中間值與 HW 分組、組別權重及 SNR 公式；圖說指出各 byte 的可辨峰值與 y 軸差異；最後交代資料檢查、量測限制與是否重算。這不是教師指定格式，也不代填未取得的參數或結果。\n\n## 待補與作業二的關聯\n若要重算並核對精確 SNR，需提供 `aes128_batches/` 或合併後的 NPZ，以及實際量測設定；只整理目前網頁不需要先補。作業二要求沿用同一批資料，不能把這張 SNR 圖當 CPA 交件圖。[HS-009](../../../sources/hs-009.md)\n\n接著讀 ment-02-cpa", "recordChapter": "courses/hardware-security/assignments/assignment-02-cpa", "lessonPath": "/hs", "html": "\u003ch1\u003e作業二：CPA 與十六個 key bytes\u003c/h1\u003e\n\u003ch2 id=\"p-1d39fa495f52-s1\"\u003e原始題目要求\u003c/h2\u003e\n\u003cp\u003e沿用作業一的功耗軌跡，實作相關功耗分析（CPA）恢復祕密金鑰。對 \u003cstrong\u003e16 個 key bytes\u003c/strong\u003e，各提供 \u003ccode\u003ecorrelation vs. sample point\u003c/code\u003e 與 \u003ccode\u003emaximum correlation vs. number of traces\u003c/code\u003e 兩類圖。題目說 \u003cstrong\u003e200 條 traces 應足夠\u003c/strong\u003e。\u003ca href=\"#/sources/hs-009\"\u003eHS-009，分享對話內作業二原題與中文補充\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e「200 條應足夠」是教師題目中的預期，\u003cstrong\u003e不是已驗證的使用者結果\u003c/strong\u003e。兩類乘十六個 byte 共 32 個對應圖表單位，可排成多子圖；正式交件的張數、格式與版面尚未提供，不自行指定。\u003c/p\u003e\n\u003ch2 id=\"p-1d39fa495f52-s2\"\u003e目前狀態與已有資料\u003c/h2\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e類別\u003c/th\u003e\n\u003cth\u003e已確認\u003c/th\u003e\n\u003cth\u003e尚未取得\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e題目\u003c/td\u003e\n\u003ctd\u003eCPA、沿用作業一、十六個 byte、兩類圖、200 條預期\u003c/td\u003e\n\u003ctd\u003e正式期限與評分細則\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e作業一資料線索\u003c/td\u003e\n\u003ctd\u003eNotebook 保存 traces \u003ccode\u003e(51200,5000)\u003c/code\u003e 與明文對應\u003c/td\u003e\n\u003ctd\u003e實際批次或合併 NPZ\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e作業二程式\u003c/td\u003e\n\u003ctd\u003e分享對話有過往 AI 建議\u003c/td\u003e\n\u003ctd\u003e使用者實際完成並執行的 CPA Notebook\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e實測成果\u003c/td\u003e\n\u003ctd\u003e目前無可核對的 CPA 圖或 key recovery 輸出\u003c/td\u003e\n\u003ctd\u003e十六 byte 結果、圖表與驗證紀錄\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e\u003ca href=\"#/sources/hs-009\"\u003eHS-008，cell 12–14、22；HS-009\u003c/a\u003e。過往對話中的建議程式與「應該能跑」不作已執行證據。本頁先完成題意與圖表導讀。\u003c/p\u003e\n\u003ch2 id=\"p-1d39fa495f52-s3\"\u003e與作業一相同與不同之處\u003c/h2\u003e\n\u003cp\u003e作業一使用已知實驗金鑰形成 HW 標籤，量化資料相依的變異；CPA 則比較候選中間值與量測的相關性。使用相同資料不代表兩個統計量相同。原本的 SNR 圖能幫助理解時間區域，但不能當作 CPA 的兩類圖。\u003ca href=\"#/sources/hs-005\"\u003eHS-004，PDF p.9–12；HS-005，PDF p.9–15\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e第一輪模型涉及 \u003ccode\u003eS(p_b XOR k_b)\u003c/code\u003e；S-box、HW、key byte 與 sample index 分別代表非線性轉換、洩漏近似、待比較假設及量測時間位置。這四者要在報告中清楚區分。\u003ca href=\"#/sources/hs-005\"\u003eHS-005，PDF p.4、13–14\u003c/a\u003e\u003c/p\u003e\n\u003ch2 id=\"p-1d39fa495f52-s4\"\u003e圖一：correlation vs. sample point\u003c/h2\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e元素\u003c/th\u003e\n\u003cth\u003e應交代的內容\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e橫軸\u003c/td\u003e\n\u003ctd\u003esample point；有量測率才可另換算時間\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e縱軸\u003c/td\u003e\n\u003ctd\u003ePearson correlation，或明示 absolute correlation\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e每格\u003c/td\u003e\n\u003ctd\u003ebyte 編號與固定使用的 N\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e線條\u003c/td\u003e\n\u003ctd\u003e哪個候選／哪些比較曲線，圖例定義一致\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e圖說\u003c/td\u003e\n\u003ctd\u003e峰值位置、候選間是否可區分、是否有負相關\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e這是依題目與 HS-005 PDF p.12–16 的自編檢查方式，未宣稱教師要求特定配色或一定要畫所有候選。若只顯示選出的候選，需在文字交代選擇方式，避免把選擇過程藏起來。\u003c/p\u003e\n\u003cp\u003e相關係數的符號與量測方向可能有關；負峰不應直接被忽略。使用最大絕對相關作彙整時，縱軸應寫 \u003ccode\u003e|correlation|\u003c/code\u003e，不能把絕對值線說成保留正負號的原始相關。\u003ca href=\"#/sources/hs-005\"\u003eHS-005，PDF p.23–25，公式解讀\u003c/a\u003e\u003c/p\u003e\n\u003ch2 id=\"p-1d39fa495f52-s5\"\u003e圖二：maximum correlation vs. number of traces\u003c/h2\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e元素\u003c/th\u003e\n\u003cth\u003e應交代的內容\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e橫軸\u003c/td\u003e\n\u003ctd\u003e使用的 trace 數 N\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e縱軸\u003c/td\u003e\n\u003ctd\u003e跨 sample 的最大相關或最大絕對相關，明示定義\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e每格\u003c/td\u003e\n\u003ctd\u003e同一個 key byte\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e比較基準\u003c/td\u003e\n\u003ctd\u003e正確值／選出的值／其他候選的區別\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e固定條件\u003c/td\u003e\n\u003ctd\u003esample 範圍、資料順序與前處理\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e這一類圖討論「資料增加時，候選是否能穩定區分」，與圖一討論「何時發生相關」不同。資料前綴與隨機子集也不是同一實驗，圖說需明示選法。以上為原題的自編分析說明。\u003ca href=\"#/sources/hs-009\"\u003eHS-009；HS-005，PDF p.32–36\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e正確候選的估計相關不必單調上升。若不同 N 時反覆更換 sample 視窗或資料處理，分數變化會混入其他因素。有限樣本下的最高分也不能自動等同完整 key 已正確恢復。\u003ca href=\"#/sources/hs-005\"\u003eHS-005，PDF p.23–36，本文解讀\u003c/a\u003e\u003c/p\u003e\n\u003ch2 id=\"p-1d39fa495f52-s6\"\u003eAI 建議：結果紀錄框架\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003e以下是自編整理框架，尚未填入實測結果\u003c/strong\u003e：\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e欄位\u003c/th\u003e\n\u003cth\u003e記錄方式\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e實驗資料\u003c/td\u003e\n\u003ctd\u003e原檔、選取的 N、samples 範圍、t 與 p 的對應檢查\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e模型\u003c/td\u003e\n\u003ctd\u003e第一輪何種中間值、HW／其他模型與原因\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e每個 byte\u003c/td\u003e\n\u003ctd\u003e選出的候選、比較依據、兩類圖的對應位置\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e已知 key 驗證\u003c/td\u003e\n\u003ctd\u003e實驗 key 僅作結果比對，不把它預填為恢復輸出\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e全部 16 bytes\u003c/td\u003e\n\u003ctd\u003e全部是否一致；失敗 byte 個別列出，不只報成功者\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e限制\u003c/td\u003e\n\u003ctd\u003e雜訊、錯位、資料量、模型、數值例外等\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e這些欄位為可追溯紀錄建議，不是教師新增規定。若相關分母為零或出現 NaN，應列為未定義／需處理，不能默默當成可靠高分或低分。\u003ca href=\"#/sources/hs-004\"\u003eHS-004，PDF p.14；本文數值說明\u003c/a\u003e\u003c/p\u003e\n\u003ch2 id=\"p-1d39fa495f52-s7\"\u003e完成狀態不自動勾選\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e題目與課程概念：已整理。\u003c/li\u003e\n\u003cli\u003e原資料、已執行 CPA Notebook、十六個 byte 的兩類圖：待提供。\u003c/li\u003e\n\u003cli\u003e200 條是否足夠、恢復 key 是否全部正確：待實測證據。\u003c/li\u003e\n\u003cli\u003e正式交件、教師評分：未知。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e若要把\u003cstrong\u003e你的實際作業二成果\u003c/strong\u003e補進 Wiki，提供完成的 Notebook 或圖表與輸出即可；若要重新驗證則另外需要 NPZ。本輪完成網頁整理，不替你虛構量測結果。\u003c/p\u003e\n\u003ch2 id=\"p-1d39fa495f52-s8\"\u003e相關課程與來源\u003c/h2\u003e\n\u003cp\u003e先讀\u003ca href=\"#/hs/lessons/5\"\u003e第五主題：DPA 與 CPA\u003c/a\u003e，需要背景時回\u003ca href=\"#/hs/lessons/2\"\u003e第二主題：AES\u003c/a\u003e、\u003ca href=\"#/hs/lessons/4\"\u003e第四主題：相關與 SNR\u003c/a\u003e。\u003c/p\u003e\n\u003cp\u003e\u003ca href=\"#/sources/hs-009\"\u003eHS-009\u003c/a\u003e為兩份題目；\u003ca href=\"#/sources/hs-008\"\u003eHS-008\u003c/a\u003e只支持作業一保存狀態；\u003ca href=\"#/sources/hs-004\"\u003eHS-004\u003c/a\u003e、\u003ca href=\"#/sources/hs-005\"\u003eHS-005\u003c/a\u003e支持理論解讀。未執行 CPA 或操作裝置。\u003c/p\u003e", "text": "# 作業二：CPA 與十六個 key bytes\n\n## 原始題目要求\n沿用作業一的功耗軌跡，實作相關功耗分析（CPA）恢復祕密金鑰。對 **16 個 key bytes**，各提供 `correlation vs. sample point` 與 `maximum correlation vs. number of traces` 兩類圖。題目說 **200 條 traces 應足夠**。[HS-009，分享對話內作業二原題與中文補充](../../../sources/hs-009.md)\n\n「200 條應足夠」是教師題目中的預期，**不是已驗證的使用者結果**。兩類乘十六個 byte 共 32 個對應圖表單位，可排成多子圖；正式交件的張數、格式與版面尚未提供，不自行指定。\n\n## 目前狀態與已有資料\n| 類別 | 已確認 | 尚未取得 |\n| --- | --- | --- |\n| 題目 | CPA、沿用作業一、十六個 byte、兩類圖、200 條預期 | 正式期限與評分細則 |\n| 作業一資料線索 | Notebook 保存 traces `(51200,5000)` 與明文對應 | 實際批次或合併 NPZ |\n| 作業二程式 | 分享對話有過往 AI 建議 | 使用者實際完成並執行的 CPA Notebook |\n| 實測成果 | 目前無可核對的 CPA 圖或 key recovery 輸出 | 十六 byte 結果、圖表與驗證紀錄 |\n\n[HS-008，cell 12–14、22；HS-009](../../../sources/hs-009.md)。過往對話中的建議程式與「應該能跑」不作已執行證據。本頁先完成題意與圖表導讀。\n\n## 與作業一相同與不同之處\n作業一使用已知實驗金鑰形成 HW 標籤，量化資料相依的變異；CPA 則比較候選中間值與量測的相關性。使用相同資料不代表兩個統計量相同。原本的 SNR 圖能幫助理解時間區域，但不能當作 CPA 的兩類圖。[HS-004，PDF p.9–12；HS-005，PDF p.9–15](../../../sources/hs-005.md)\n\n第一輪模型涉及 `S(p_b XOR k_b)`；S-box、HW、key byte 與 sample index 分別代表非線性轉換、洩漏近似、待比較假設及量測時間位置。這四者要在報告中清楚區分。[HS-005，PDF p.4、13–14](../../../sources/hs-005.md)\n\n## 圖一：correlation vs. sample point\n| 元素 | 應交代的內容 |\n| --- | --- |\n| 橫軸 | sample point；有量測率才可另換算時間 |\n| 縱軸 | Pearson correlation，或明示 absolute correlation |\n| 每格 | byte 編號與固定使用的 N |\n| 線條 | 哪個候選／哪些比較曲線，圖例定義一致 |\n| 圖說 | 峰值位置、候選間是否可區分、是否有負相關 |\n\n這是依題目與 HS-005 PDF p.12–16 的自編檢查方式，未宣稱教師要求特定配色或一定要畫所有候選。若只顯示選出的候選，需在文字交代選擇方式，避免把選擇過程藏起來。\n\n相關係數的符號與量測方向可能有關；負峰不應直接被忽略。使用最大絕對相關作彙整時，縱軸應寫 `\\|correlation\\|`，不能把絕對值線說成保留正負號的原始相關。[HS-005，PDF p.23–25，公式解讀](../../../sources/hs-005.md)\n\n## 圖二：maximum correlation vs. number of traces\n| 元素 | 應交代的內容 |\n| --- | --- |\n| 橫軸 | 使用的 trace 數 N |\n| 縱軸 | 跨 sample 的最大相關或最大絕對相關，明示定義 |\n| 每格 | 同一個 key byte |\n| 比較基準 | 正確值／選出的值／其他候選的區別 |\n| 固定條件 | sample 範圍、資料順序與前處理 |\n\n這一類圖討論「資料增加時，候選是否能穩定區分」，與圖一討論「何時發生相關」不同。資料前綴與隨機子集也不是同一實驗，圖說需明示選法。以上為原題的自編分析說明。[HS-009；HS-005，PDF p.32–36](../../../sources/hs-009.md)\n\n正確候選的估計相關不必單調上升。若不同 N 時反覆更換 sample 視窗或資料處理，分數變化會混入其他因素。有限樣本下的最高分也不能自動等同完整 key 已正確恢復。[HS-005，PDF p.23–36，本文解讀](../../../sources/hs-005.md)\n\n## AI 建議：結果紀錄框架\n**以下是自編整理框架，尚未填入實測結果**：\n\n| 欄位 | 記錄方式 |\n| --- | --- |\n| 實驗資料 | 原檔、選取的 N、samples 範圍、t 與 p 的對應檢查 |\n| 模型 | 第一輪何種中間值、HW／其他模型與原因 |\n| 每個 byte | 選出的候選、比較依據、兩類圖的對應位置 |\n| 已知 key 驗證 | 實驗 key 僅作結果比對，不把它預填為恢復輸出 |\n| 全部 16 bytes | 全部是否一致；失敗 byte 個別列出，不只報成功者 |\n| 限制 | 雜訊、錯位、資料量、模型、數值例外等 |\n\n這些欄位為可追溯紀錄建議，不是教師新增規定。若相關分母為零或出現 NaN，應列為未定義／需處理，不能默默當成可靠高分或低分。[HS-004，PDF p.14；本文數值說明](../../../sources/hs-004.md)\n\n## 完成狀態不自動勾選\n- 題目與課程概念：已整理。\n- 原資料、已執行 CPA Notebook、十六個 byte 的兩類圖：待提供。\n- 200 條是否足夠、恢復 key 是否全部正確：待實測證據。\n- 正式交件、教師評分：未知。\n\n若要把**你的實際作業二成果**補進 Wiki，提供完成的 Notebook 或圖表與輸出即可；若要重新驗證則另外需要 NPZ。本輪完成網頁整理，不替你虛構量測結果。\n\n## 相關課程與來源\n先讀[第五主題：DPA 與 CPA](../lessons/05-dpa-cpa.md)，需要背景時回[第二主題：AES](../lessons/02-cryptography.md)、[第四主題：相關與 SNR](../lessons/04-trace-statistics.md)。\n\n[HS-009](../../../sources/hs-009.md)為兩份題目；[HS-008](../../../sources/hs-008.md)只支持作業一保存狀態；[HS-004](../../../sources/hs-004.md)、[HS-005](../../../sources/hs-005.md)支持理論解讀。未執行 CPA 或操作裝置。\n", "headings": [{"id": "p-1d39fa495f52-s1", "text": "原始題目要求"}, {"id": "p-1d39fa495f52-s2", "text": "目前狀態與已有資料"}, {"id": "p-1d39fa495f52-s3", "text": "與作業一相同與不同之處"}, {"id": "p-1d39fa495f52-s4", "text": "圖一：correlation vs. sample point"}, {"id": "p-1d39fa495f52-s5", "text": "圖二：maximum correlation vs. number of traces"}, {"id": "p-1d39fa495f52-s6", "text": "AI 建議：結果紀錄框架"}, {"id": "p-1d39fa495f52-s7", "text": "完成狀態不自動勾選"}, {"id": "p-1d39fa495f52-s8", "text": "相關課程與來源"}], "sectionCount": 8, "searchText": "作業二：CPA 與十六個 key bytes 原始題目要求 沿用作業一的功耗軌跡，實作相關功耗分析（CPA）恢復祕密金鑰。對 16 個 key bytes ，各提供 correlation vs. sample point 與 maximum correlation vs. number of traces 兩類圖。題目說 200 條 traces 應足夠 。 HS-009，分享對話內作業二原題與中文補充 「200 條應足夠」是教師題目中的預期， 不是已驗證的使用者結果 。兩類乘十六個 byte 共 32 個對應圖表單位，可排成多子圖；正式交件的張數、格式與版面尚未提供，不自行指定。 目前狀態與已有資料 類別 已確認 尚未取得 題目 CPA、沿用作業一、十六個 byte、兩類圖、200 條預期 正式期限與評分細則 作業一資料線索 Notebook 保存 traces (51200,5000) 與明文對應 實際批次或合併 NPZ 作業二程式 分享對話有過往 AI 建議 使用者實際完成並執行的 CPA Notebook 實測成果 目前無可核對的 CPA 圖或 key recovery 輸出 十六 byte 結果、圖表與驗證紀錄 HS-008，cell 12–14、22；HS-009 。過往對話中的建議程式與「應該能跑」不作已執行證據。本頁先完成題意與圖表導讀。 與作業一相同與不同之處 作業一使用已知實驗金鑰形成 HW 標籤，量化資料相依的變異；CPA 則比較候選中間值與量測的相關性。使用相同資料不代表兩個統計量相同。原本的 SNR 圖能幫助理解時間區域，但不能當作 CPA 的兩類圖。 HS-004，PDF p.9–12；HS-005，PDF p.9–15 第一輪模型涉及 S(p_b XOR k_b) ；S-box、HW、key byte 與 sample index 分別代表非線性轉換、洩漏近似、待比較假設及量測時間位置。這四者要在報告中清楚區分。 HS-005，PDF p.4、13–14 圖一：correlation vs. sample point 元素 應交代的內容 橫軸 sample point；有量測率才可另換算時間 縱軸 Pearson correlation，或明示 absolute correlation 每格 byte 編號與固定使用的 N 線條 哪個候選／哪些比較曲線，圖例定義一致 圖說 峰值位置、候選間是否可區分、是否有負相關 這是依題目與 HS-005 PDF p.12–16 的自編檢查方式，未宣稱教師要求特定配色或一定要畫所有候選。 pter": "index", "html": "\u003ch1\u003e課程複習 Wiki\u003c/h1\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/ase\"\u003eADVANCED SOFTWARE ENGINEERING｜高等軟體工程\u003c/a\u003e：課程與測驗，各四章。\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/hs\"\u003eHARDWARE SECURITY｜硬體安全\u003c/a\u003e：七個課程主題、兩份作業。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e新增課程時，在 \u003ccode\u003ewiki/courses/\u003c/code\u003e 建立課程目錄與 \u003ccode\u003eindex.md\u003c/code\u003e，並補上本頁入口；網頁首頁與側欄會在建置時自動更新，不限制課程數。\u003c/p\u003e\n\u003ch2 id=\"p-1bc04b5291c2-s1\"\u003e管理\u003c/h2\u003e\n\u003cp\u003e\u003ca href=\"#/wiki/sources\"\u003e來源登錄\u003c/a\u003e · \u003ca href=\"#/wiki/questions\"\u003e待釐清問題\u003c/a\u003e · \u003ca href=\"#/wiki/log\"\u003e操作紀錄\u003c/a\u003e · \u003ca href=\"#/wiki/review-progress\"\u003e複習進度\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e來源摘要：\u003ca href=\"#/sources/ase-001\"\u003eASE-001\u003c/a\u003e、\u003ca href=\"#/sources/ase-002\"\u003eASE-002\u003c/a\u003e、\u003ca href=\"#/sources/ase-003\"\u003eASE-003\u003c/a\u003e、\u003ca href=\"#/sources/ase-004\"\u003eASE-004\u003c/a\u003e。\u003c/p\u003e", "text": "# 課程複習 Wiki\n\n- [ADVANCED SOFTWARE ENGINEERING｜高等軟體工程](courses/advanced-software-engineering/index.md)：課程與測驗，各四章。\n- [HARDWARE SECURITY｜硬體安全](courses/hardware-security/index.md)：七個課程主題、兩份作業。\n\n新增課程時，在 `wiki/courses/` 建立課程目錄與 `index.md`，並補上本頁入口；網頁首頁與側欄會在建置時自動更新，不限制課程數。\n\n## 管理\n\n[來源登錄](sources.md) · [待釐清問題](questions.md) · [操作紀錄](log.md) · [複習進度](review-progress.md)\n\n來源摘要：[ASE-001](sources/ase-001.md)、[ASE-002](sources/ase-002.md)、[ASE-003](sources/ase-003.md)、[ASE-004](sources/ase-004.md)。\n", "headings": [{"id": "p-1bc04b5291c2-s1", "text": "管理"}], "sectionCount": 1, "searchText": "課程複習 Wiki ADVANCED SOFTWARE ENGINEERING｜高等軟體工程 ：課程與測驗，各四章。 HARDWARE SECURITY｜硬體安全 ：七個課程主題、兩份作業。 新增課程時，在 wiki/courses/ 建立課程目錄與 index.md ，並補上本頁入口；網頁首頁與側欄會在建置時自動更新，不限制課程數。 管理 來源登錄 · 待釐清問題 · 操作紀錄 · 複習進度 來源摘要： ASE-001 、 ASE-002 、 ASE-003 、 ASE-004 。 "}, {"id": "log", "path": "/wiki/log", "title": "操作紀錄", "short": "操作紀錄", "desc": "瀏覽課程筆記與相關內容。", "courseId": null, "sectionId": null, "kind": "article", "status": "", "source": "", "pages": null, "questions": [], "trackReading": false, "metadata": {"title": "操作紀錄"}, "readKey": "log", "quizKey": "log", "recordChapter": "log", "html": "\u003ch1\u003e操作紀錄\u003c/h1\u003e\n\u003ch2 id=\"p-836ff184e7b4-s1\"\u003e[2026-11-06] init | 課程 Wiki 初始化\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e讀取使用者提供的 LLM Wiki 方法文件，查核作者 Gist。\u003c/li\u003e\n\u003cli\u003e建立中文 AGENTS.md、兩門課程架構、來源與問題清單、頁面模板及網站後續規格。\u003c/li\u003e\n\u003cli\u003e尚未匯入課程教材，未執行硬體實驗，未實作或部署網站。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"p-836ff184e7b4-s2\"\u003e[2026-11-06] ingest | 高等軟體工程第一至四章\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e新增 ASE-001–004 原始 PDF，合計 374 頁，保存原始位元組與 SHA-256。\u003c/li\u003e\n\u003cli\u003e閱讀全章擷取文字與核心純圖片頁，整理四章主題式筆記，非逐頁逐圖詳解。\u003c/li\u003e\n\u003cli\u003e新增 EXAM-001 可見考試方向摘記；未完整取得分享對話的題目圖片與部分回覆。\u003c/li\u003e\n\u003cli\u003e新增五份跨章概念頁、四份分章題庫，共 81 題（40 單選、24 填空、17 手寫），附解析、頁碼與自評要點。\u003c/li\u003e\n\u003cli\u003e重新繪製六個 SVG 複習圖，建立可離線開啟的 index.html 與 Markdown 建置腳本。\u003c/li\u003e\n\u003cli\u003e導覽依使用者要求為課程 → ADVANCED SOFTWARE ENGINEERING → 課程／測驗 → 四章。\u003c/li\u003e\n\u003cli\u003e保留講義簡化或待查核處於 questions；未代替教師宣告正式考試範圍。\u003c/li\u003e\n\u003cli\u003e本機桌面未掛載；本輪提供可下載的 LLM_Course_Wiki 資料夾封裝，不宣稱已寫入 Mac 桌面。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"p-836ff184e7b4-s3\"\u003e2026-11-06｜硬體安全七個主題與兩份作業\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e匯入七份 PDF（293 頁）、原始 24-cell Notebook；既有原檔未覆寫。建立七個 lesson、兩個 assignment 與十個來源摘要／查核頁。\u003c/li\u003e\n\u003cli\u003e核對分享對話兩份原題與全部 16 bytes 補充；保存來源轉述。Notebook 只讀並抽取 cell 22 原保存圖，沒有執行硬體或重算資料。\u003c/li\u003e\n\u003cli\u003e課程按威脅模型、密碼學、IC 功耗、軌跡統計、DPA／CPA、模板、PQC 重整，附 PDF 頁次。標明已知教材歧義、公式邊界與歷史建議。\u003c/li\u003e\n\u003cli\u003e網頁更新硬體安全的課程／作業入口、全文搜尋、目錄、互連、閱讀標記及來源頁；軟工四章與 81 題保留。\u003c/li\u003e\n\u003cli\u003e限制：沒有原 NPZ，作業一僅核對保存證據；沒有已執行 CPA Notebook 或成果圖，作業二只完成題意導讀。論文未提供。驗證結果另見 docs/verification.md。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"p-836ff184e7b4-s4\"\u003e2026-11-06｜接手 Mac 桌面專案與可擴充課程導覽\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e直接讀取與維護 \u003ccode\u003e~/Desktop/TAICA_AI_work/LLM_Course_Wiki\u003c/code\u003e，閱讀代理規範、README、全域／課程索引、來源登錄、問題與既有紀錄。\u003c/li\u003e\n\u003cli\u003e首頁與側欄改由 \u003ccode\u003ewiki/courses/*/index.md\u003c/code\u003e 自動發現課程，不固定課程數。新增課程提供通用 Markdown 閱讀路由與搜尋；既有軟工課程／測驗四章、81 題，以及硬體安全七主題／兩份作業保留。\u003c/li\u003e\n\u003cli\u003e修正搜尋詞含 \u0026amp;、+、%、? 等字元時的解析錯誤；強化匯入及本機紀錄載入的型別、題目歸屬、草稿位置與模式檢查，避免損壞草稿使測驗出錯。\u003c/li\u003e\n\u003cli\u003e更新 README 與網站規格，修正過時的雲端交付說明；作業寫作框架明標為 AI 建議，與保存成果分開。\u003c/li\u003e\n\u003cli\u003e本次從 raw 直接抽查 ASE-003 PDF p.22、27、54，HS-004 PDF p.9–12、14；目視 p.22 NFR 分類圖與 p.9 訊號／雜訊公式。這是局部核對，不聲稱重新讀完全部教材。\u003c/li\u003e\n\u003cli\u003e原始教材未更動，Notebook 未執行；作業一仍為保存輸出，作業二實測成果仍待提供。\u003c/li\u003e\n\u003cli\u003e內建瀏覽器因 URL 安全政策拒絕 file://，本輪不聲稱已完成瀏覽器畫面實測；建置、程式回歸與原檔完整性結果見 docs/verification.md。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"p-836ff184e7b4-s5\"\u003e2026-11-06｜全面移除課程與內容數量寫死的實作\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e使用者明確要求「課程數量不可寫死」；更新 AGENTS.md 第 2、12–14 節，保留既有課程識別碼但取消固定課程集合與數量限制。\u003c/li\u003e\n\u003cli\u003e建置統一掃描 Wiki 課程目錄及各課程 course.json，分類可自行指定。頁面設定只覆寫 metadata 與相容別名，不是白名單；新增 Markdown 自動加入。\u003c/li\u003e\n\u003cli\u003e移除前端既有課程專用的首頁、分類、搜尋、來源、閱讀統計與數字範圍路由；改用共用頁面／課程／分類資料模型。所有來源摘要與跨章概念皆可追溯閱讀及搜尋。\u003c/li\u003e\n\u003cli\u003e為既有課程建立 course.json，保留舊網址、閱讀 key、測驗草稿 chapter 及題目 ID；瀏覽器儲存鍵 course-wiki-v1 與 version 1 備份格式不變。未出現在目前教材的舊紀錄保留，不以課程排序遷移資料。\u003c/li\u003e\n\u003cli\u003e任一課程可選用共用 JSON 題庫功能；章節、作業、報告、題數及各課程閱讀分母皆依實際內容計算。\u003c/li\u003e\n\u003cli\u003e新增 docs/course-configuration.md；保留舊 hardware-manifest 作歷史快照，建置不再使用。\u003c/li\u003e\n\u003cli\u003e擴充檢查使用暫存教材，涵蓋空課程清單、不同分類／路由、新增課程與內容、更名／排序、題數變動，以及搜尋、來源、判分與舊紀錄載入／匯入相容性。原始教材與 Notebook 不執行、不更動；瀏覽器畫面實測限制仍如前次紀錄。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"p-836ff184e7b4-s6\"\u003e2026-11-06｜新粗獷主義 × Zine 拼貼改版\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e直接修改既有 \u003ccode\u003eweb/template.html\u003c/code\u003e，新增共用 \u003ccode\u003eweb/styles.css\u003c/code\u003e；build.py 將樣式內嵌到離線 HTML，不依賴外部字體、圖示或素材。\u003c/li\u003e\n\u003cli\u003e全站改為白紙黑字、粗黑網格、無模糊硬陰影、粗體大標與貼紙標籤。首頁採黑白亮黃，加入獨立 SVG 拼貼紙張、星芒與波浪圓形，裝飾不接收點擊。\u003c/li\u003e\n\u003cli\u003e課程點綴色使用穩定 ID 雜湊與固定亮色調色盤；分類、正文、作業、測驗及來源使用相同課程色。課程更名、排序或重新載入不改色，首頁與工具頁回到亮黃；新增課程無須修改前端或路由。\u003c/li\u003e\n\u003cli\u003e正文維持白底舒適行距，表格／公式／程式碼局部捲動，來源圖表不重畫或裁切。新增清楚的按鈕互動、鍵盤焦點、跳至正文入口、窄版單欄及減少動態效果規則。\u003c/li\u003e\n\u003cli\u003e將確定設計規則加入 AGENTS.md 第 15 節；README、網站規格及驗證文件同步更新。\u003c/li\u003e\n\u003cli\u003e原始教材、課程 Markdown、來源摘要與題庫未修改；既有網址、閱讀／測驗 key 與 version 1 紀錄格式保留。程式回歸涵蓋原功能、配色穩定與文字對比。\u003c/li\u003e\n\u003cli\u003e瀏覽器先前已因安全政策拒絕 file://；本輪未繞過限制，未宣稱實測桌面／手機畫面、實際檔案選擇器或手寫畫布。具體驗證與限制見 docs/verification.md。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"p-836ff184e7b4-s7\"\u003e2026-11-07｜高等軟體工程指定亮藍色\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e依使用者偏好，在課程 course.json 設定 accent 為 #52a9ff，所有該課內頁沿用亮藍；桃紅保留供未來課程使用，首頁仍為亮黃。\u003c/li\u003e\n\u003cli\u003e共用配色支援各課程設定覆寫，不在前端加入課名特例；未指定者保留原有穩定雜湊配色。建置驗證指定色碼及黑字對比，既有內容與紀錄識別碼不變。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"p-836ff184e7b4-s8\"\u003e2026-11-07｜準備 GitHub 公開發布\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e使用者要求 GitHub 公開連結，並明確確認既有原始講義與 Notebook 可一併公開。\u003c/li\u003e\n\u003cli\u003e準備公開儲存庫與靜態網站：保留 raw、Wiki、題庫與版面來源；排除快取、derived 與重複 dist，加入 .nojekyll 供靜態網站使用。\u003c/li\u003e\n\u003cli\u003e常見憑證格式掃描未發現金鑰；未代替第三方教材變更授權。發布結果待遠端驗證後記錄。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"p-836ff184e7b4-s9\"\u003e2026-11-07｜GitHub 公開儲存庫與 Pages\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e完整專案已推送至 https://github.com/dodoooooooo/LLM-Course-Wiki ，遠端可見性為 public，包含使用者已授權公開的原始講義及 Notebook。\u003c/li\u003e\n\u003cli\u003e啟用 GitHub Pages：main 分支、根目錄；網站網址為 https://dodoooooooo.github.io/LLM-Course-Wiki/ 。README 加入線上入口與後續更新流程。\u003c/li\u003e\n\u003cli\u003e本機原檔保留，Git 作者使用 GitHub noreply 信箱；原瀏覽器紀錄不會跨來源自動同步，仍以匯出／匯入搬移。網站實際可用性於發布後另驗證。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"p-836ff184e7b4-s10\"\u003e2026-11-07｜公開遠端驗證與 Pages 狀態\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e已確認公開儲存庫的 main 與本機提交一致，完整 raw 檔案逐一對照 Git 物件相符。\u003c/li\u003e\n\u003cli\u003eGitHub Pages 的建置與檔案上傳成功，但首次部署最後一步回報「Deployment failed, try again later」。重試失敗工作仍停在平台佇列、未產生工作，因此另以正常提交觸發完整發布。\u003c/li\u003e\n\u003cli\u003eREADME 加入 Actions 部署狀態入口與暫時 404 說明。公開儲存庫已可用，網站可用性以平台部署及實際瀏覽驗證為準，不將啟用設定當作已上線。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"p-836ff184e7b4-s11\"\u003e2026-11-07｜Pages 改用專用發布產物\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e分支直接發布兩次均在平台 deploy 最後一步失敗，未將問題誤報為網站已成功上線。\u003c/li\u003e\n\u003cli\u003e依 GitHub 官方 Static HTML 工作流程新增 .github/workflows/pages.yml，推送 main 時 build／check，再只發布 dist/ 的自包含 index.html。Pages 來源改為 GitHub Actions，不再發布整個原始碼與教材目錄；原始教材仍在公開儲存庫完整保存。\u003c/li\u003e\n\u003cli\u003e網站正文仍唯一維護於 Wiki，未另建手寫網站。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"p-836ff184e7b4-s12\"\u003e2026-11-07｜公開儲存庫完成、網站發布受限\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e完整專案與原始教材已公開上傳，遠端 main 可存取，來源及紀錄識別碼保留。\u003c/li\u003e\n\u003cli\u003e專用 Pages 工作流程在執行任何步驟前遭平台拒絕啟動，須先由使用者處理平台端限制；不宣稱站點上線，也不記錄或公開帳戶私密資訊。\u003c/li\u003e\n\u003cli\u003eREADME 已將網站入口標為尚未上線；公開儲存庫及本機離線網站可使用。發布設定保留，平台恢復後可重新執行工作流程。\u003c/li\u003e\n\u003c/ul\u003e", "text": "# 操作紀錄\n\n## [2026-11-06] init | 課程 Wiki 初始化\n- 讀取使用者提供的 LLM Wiki 方法文件，查核作者 Gist。\n- 建立中文 AGENTS.md、兩門課程架構、來源與問題清單、頁面模板及網站後續規格。\n- 尚未匯入課程教材，未執行硬體實驗，未實作或部署網站。\n\n## [2026-11-06] ingest | 高等軟體工程第一至四章\n- 新增 ASE-001–004 原始 PDF，合計 374 頁，保存原始位元組與 SHA-256。\n- 閱讀全章擷取文字與核心純圖片頁，整理四章主題式筆記，非逐頁逐圖詳解。\n- 新增 EXAM-001 可見考試方向摘記；未完整取得分享對話的題目圖片與部分回覆。\n- 新增五份跨章概念頁、四份分章題庫，共 81 題（40 單選、24 填空、17 手寫），附解析、頁碼與自評要點。\n- 重新繪製六個 SVG 複習圖，建立可離線開啟的 index.html 與 Markdown 建置腳本。\n- 導覽依使用者要求為課程 → ADVANCED SOFTWARE ENGINEERING → 課程／測驗 → 四章。\n- 保留講義簡化或待查核處於 questions；未代替教師宣告正式考試範圍。\n- 本機桌面未掛載；本輪提供可下載的 LLM_Course_Wiki 資料夾封裝，不宣稱已寫入 Mac 桌面。\n\n## 2026-11-06｜硬體安全七個主題與兩份作業\n- 匯入七份 PDF（293 頁）、原始 24-cell Notebook；既有原檔未覆寫。建立七個 lesson、兩個 assignment 與十個來源摘要／查核頁。\n- 核對分享對話兩份原題與全部 16 bytes 補充；保存來源轉述。Notebook 只讀並抽取 cell 22 原保存圖，沒有執行硬體或重算資料。\n- 課程按威脅模型、密碼學、IC 功耗、軌跡統計、DPA／CPA、模板、PQC 重整，附 PDF 頁次。標明已知教材歧義、公式邊界與歷史建議。\n- 網頁更新硬體安全的課程／作業入口、全文搜尋、目錄、互連、閱讀標記及來源頁；軟工四章與 81 題保留。\n- 限制：沒有原 NPZ，作業一僅核對保存證據；沒有已執行 CPA Notebook 或成果圖，作業二只完成題意導讀。論文未提供。驗證結果另見 docs/verification.md。\n\n## 2026-11-06｜接手 Mac 桌面專案與可擴充課程導覽\n- 直接讀取與維護 `~/Desktop/TAICA_AI_work/LLM_Course_Wiki`，閱讀代理規範、README、全域／課程索引、來源登錄、問題與既有紀錄。\n- 首頁與側欄改由 `wiki/courses/*/index.md` 自動發現課程，不固定課程數。新增課程提供通用 Markdown 閱讀路由與搜尋；既有軟工課程／測驗四章、81 題，以及硬體安全七主題／兩份作業保留。\n- 修正搜尋詞含 \u0026、+、%、? 等字元時的解析錯誤；強化匯入及本機紀錄載入的型別、題目歸屬、草稿位置與模式檢查，避免損壞草稿使測驗出錯。\n- 更新 README 與網站規格，修正過時的雲端交付說明；作業寫作框架明標為 AI 建議，與保存成果分開。\n- 本次從 raw 直接抽查 ASE-003 PDF p.22、27、54，HS-004 PDF p.9–12、14；目視 p.22 NFR 分類圖與 p.9 訊號／雜訊公式。這是局部核對，不聲稱重新讀完全部教材。\n- 原始教材未更動，Notebook 未執行；作業一仍為保存輸出，作業二實測成果仍待提供。\n- 內建瀏覽器因 URL 安全政策拒絕 file://，本輪不聲稱已完成瀏覽器畫面實測；建置、程式回歸與原檔完整性結果見 docs/verification.md。\n\n## 2026-11-06｜全面移除課程與內容數量寫死的實作\n- 使用者明確要求「課程數量不可寫死」；更新 AGENTS.md 第 2、12–14 節，保留既有課程識別碼但取消固定課程集合與數量限制。\n- 建置統一掃描 Wiki 課程目錄及各課程 course.json，分類可自行指定。頁面設定只覆寫 metadata 與相容別名，不是白名單；新增 Markdown 自動加入。\n- 移除前端既有課程專用的首頁、分類、搜尋、來源、閱讀統計與數字範圍路由；改用共用頁面／課程／分類資料模型。所有來源摘要與跨章概念皆可追溯閱讀及搜尋。\n- 為既有課程建立 course.json，保留舊網址、閱讀 key、測驗草稿 chapter 及題目 ID；瀏覽器儲存鍵 course-wiki-v1 與 version 1 備份格式不變。未出現在目前教材的舊紀錄保留，不以課程排序遷移資料。\n- 任一課程可選用共用 JSON 題庫功能；章節、作業、報告、題數及各課程閱讀分母皆依實際內容計算。\n- 新增 docs/course-configuration.md；保留舊 hardware-manifest 作歷史快照，建置不再使用。\n- 擴充檢查使用暫存教材，涵蓋空課程清單、不同分類／路由、新增課程與內容、更名／排序、題數變動，以及搜尋、來源、判分與舊紀錄載入／匯入相容性。原始教材與 Notebook 不執行、不更動；瀏覽器畫面實測限制仍如前次紀錄。\n\n## 2026-11-06｜新粗獷主義 × Zine 拼貼改版\n- 直接修改既有 `web/template.html`，新增共用 `web/styles.css`；build.py 將樣式內嵌到離線 HTML，不依賴外部字體、圖示或素材。\n- 全站改為白紙黑字、粗黑網格、無模糊硬陰影、粗體大標與貼紙標籤。首頁採黑白亮黃，加入獨立 SVG 拼貼紙張、星芒與波浪圓形，裝飾不接收點擊。\n- 課程點綴色使用穩定 ID 雜湊與固定亮色調色盤；分類、正文、作業、測驗及來源使用相同課程色。課程更名、排序或重新載入不改色，首頁與工具頁回到亮黃；新增課程無須修改前端或路由。\n- 正文維持白底舒適行距，表格／公式／程式碼局部捲動，來源圖表不重畫或裁切。新增清楚的按鈕互動、鍵盤焦點、跳至正文入口、窄版單欄及減少動態效果規則。\n- 將確定設計規則加入 AGENTS.md 第 15 節；README、網站規格及驗證文件同步更新。\n- 原始教材、課程 Markdown、來源摘要與題庫未修改；既有網址、閱讀／測驗 key 與 version 1 紀錄格式保留。程式回歸涵蓋原功能、配色穩定與文字對比。\n- 瀏覽器先前已因安全政策拒絕 file://；本輪未繞過限制，未宣稱實測桌面／手機畫面、實際檔案選擇器或手寫畫布。具體驗證與限制見 docs/verification.md。\n\n## 2026-11-07｜高等軟體工程指定亮藍色\n- 依使用者偏好，在課程 course.json 設定 accent 為 #52a9ff，所有該課內頁沿用亮藍；桃紅保留供未來課程使用，首頁仍為亮黃。\n- 共用配色支援各課程設定覆寫，不在前端加入課名特例；未指定者保留原有穩定雜湊配色。建置驗證指定色碼及黑字對比，既有內容與紀錄識別碼不變。\n\n## 2026-11-07｜準備 GitHub 公開發布\n- 使用者要求 GitHub 公開連結，並明確確認既有原始講義與 Notebook 可一併公開。\n- 準備公開儲存庫與靜態網站：保留 raw、Wiki、題庫與版面來源；排除快取、derived 與重複 dist，加入 .nojekyll 供靜態網站使用。\n- 常見憑證格式掃描未發現金鑰；未代替第三方教材變更授權。發布結果待遠端驗證後記錄。\n\n## 2026-11-07｜GitHub 公開儲存庫與 Pages\n- 完整專案已推送至 https://github.com/dodoooooooo/LLM-Course-Wiki ，遠端可見性為 public，包含使用者已授權公開的原始講義及 Notebook。\n- 啟用 GitHub Pages：main 分支、根目錄；網站網址為 https://dodoooooooo.github.io/LLM-Course-Wiki/ 。README 加入線上入口與後續更新流程。\n- 本機原檔保留，Git 作者使用 GitHub noreply 信箱；原瀏覽器紀錄不會跨來源自動同步，仍以匯出／匯入搬移。網站實際可用性於發布後另驗證。\n\n## 2026-11-07｜公開遠端驗證與 Pages 狀態\n- 已確認公開儲存庫的 main 與本機提交一致，完整 raw 檔案逐一對照 Git 物件相符。\n- GitHub Pages 的建置與檔案上傳成功，但首次部署最後一步回報「Deployment failed, try again later」。重試失敗工作仍停在平台佇列、未產生工作，因此另以正常提交觸發完整發布。\n- README 加入 Actions 部署狀態入口與暫時 404 說明。公開儲存庫已可用，網站可用性以平台部署及實際瀏覽驗證為準，不將啟用設定當作已上線。\n\n## 2026-11-07｜Pages 改用專用發布產物\n- 分支直接發布兩次均在平台 deploy 最後一步失敗，未將問題誤報為網站已成功上線。\n- 依 GitHub 官方 Static HTML 工作流程新增 .github/workflows/pages.yml，推送 main 時 build／check，再只發布 dist/ 的自包含 index.html。Pages 來源改為 GitHub Actions，不再發布整個原始碼與教材目錄；原始教材仍在公開儲存庫完整保存。\n- 網站正文仍唯一維護於 Wiki，未另建手寫網站。\n\n## 2026-11-07｜公開儲存庫完成、網站發布受限\n- 完整專案與原始教材已公開上傳，遠端 main 可存取，來源及紀錄識別碼保留。\n- 專用 Pages 工作流程在執行任何步驟前遭平台拒絕啟動，須先由使用者處理平台端限制；不宣稱站點上線，也不記錄或公開帳戶私密資訊。\n- README 已將網站入口標為尚未上線；公開儲存庫及本機離線網站可使用。發布設定保留，平台恢復後可重新執行工作流程。\n", "headings": [{"id": "p-836ff184e7b4-s1", "text": "[2026-11-06] init | 課程 Wiki 初始化"}, {"id": "p-836ff184e7b4-s2", "text": "[2026-11-06] ingest | 高等軟體工程第一至四章"}, {"id": "p-836ff184e7b4-s3", "text": "2026-11-06｜硬體安全七個主題與兩份作業"}, {"id": "p-836ff184e7b4-s4", "text": "2026-11-06｜接手 Mac 桌面專案與可擴充課程導覽"}, {"id": "p-836ff184e7b4-s5", "text": "2026-11-06｜全面移除課程與內容數量寫死的實作"}, {"id": "p-836ff184e7b4-s6", "text": "2026-11-06｜新粗獷主義 × Zine 拼貼改版"}, {"id": "p-836ff184e7b4-s7", "tex const ACCENT_PALETTE=Object.freeze(['#52a9ff','#ff71bc','#baff39','#ff9843']),DEFAULT_ACCENT='#ffe500';

const pageById=id=>pagesById.get(id),courseFor=p=>coursesById.get(p.courseId),quizFor=key=>quizzes.find(p=>p.quizKey===String(key));

function validateState(data){
 const object=v=>v!==null&&typeof v==='object'&&!Array.isArray(v),integer=v=>Number.isInteger(v)&&v>=0;

 for(const v of Object.values(data.read))require(typeof v==='boolean','閱讀標記格式不符');

 for(const h of data.history)require(object(h)&&['string','number'].includes(typeof h.chapter)&&[h.right,h.total,h.written,h.unanswered??0].every(integer)&&h.right+(h.unanswered??0)<=h.total&&['practice','exam'].includes(h.mode)&&typeof h.time==='string'&&Number.isFinite(Date.parse(h.time)),'歷史紀錄格式不符');
 for(const [key,d]of Object.entries(data.drafts)){
  require(object(d)&&String(d.chapter)===key&&Array.isArray(d.ids)&&d.ids.every(id=>typeof id==='string')&&new Set(d.ids).size===d.ids.length&&integer(d.pos)&&d.pos<Math.max(1,d.ids.length)&&['practice','exam'].includes(d.mode)&&['all','choice','fill','written'].includes(d.filter)&&[d.onlyWrong,d.shuffle,d.submitted].every(v=>typeof v==='boolean')&&[d.answers,d.graded,d.self,d.drawings].every(object)&&typeof d.started==='string'&&Number.isFinite(Date.parse(d.started)),'草稿資料格式不符');

function sectionPage(c,s){return crumb([[c.title,c.path],[s.label]])+tabs(c,s.id)+hero(c.title,s.label,s.pageIds.length+' 篇內容；新增內容後會在建置時更新。')+'<div class="hs-grid">'+s.pageIds.map((id,i)=>{const p=pageById(id);return `<a class="card" href="#${esc(p.path)}"><div class="card-top"><span class="card-index" aria-hidden="true">${String(i+1).padStart(2,'0')}</span><span class="label">${esc(s.label)}</span></div><h3>${esc(p.short)}</h3><p>${esc(p.desc)}</p><div class="foot"><span>${p.kind==='quiz'?p.questions.length+' 題練習':p.sectionCount+' 節重點'}${p.pages?' · '+p.pages+' 頁來源':''}</span><span>→</span></div></a>`}).join('')+'</div>'+(!s.pageIds.length?empty('尚未加入內容','可在此分類新增 Markdown 內容後重新建置。'):'')+footer()}
function article(p){const c=courseFor(p),s=c?.sections.find(s=>s.id===p.sectionId),list=s?.pageIds||[],pos=list.indexOf(p.id);return crumb([...(c?[[c.title,c.path]]:[]),...(s?[[s.label,s.path]]:[]),[p.short]])+(s?tabs(c,s.id):'')+`<div class="sectionhead"><div class="chips"><span class="chip">${esc(p.source)}</span><span class="chip">${esc(p.status)}</span></div>${p.trackReading?`<button class="pillbtn" id="readToggle" data-key="${esc(p.readKey)}">${state.read[p.readKey]?'已閱讀，取消標記':'標記為已閱讀'}</button>`:''}</div><div class="lesson-layout"><article class="article">${p.html}${pos>=0?`<nav class="reading-nav">${pos>0?`<a href="#${esc(pageById(list[pos-1]).path)}">← 上一篇</a>`:'<span></span>'}${pos<list.length-1?`<a href="#${esc(pageById(list[pos+1]).path)}">下一篇 →</a>`:`<a href="#${esc(s.path)}">返回${esc(s.label)}</a>`}</nav>`:''}</article><aside class="toc"><div class="navtitle">本文目錄</div>${p.headings.map(h=>`<a href="#" data-scroll="${esc(h.id)}">${esc(h.text)}</a>`).join('')}<p class="note">閱讀不代表已掌握，亦不表示作業完成或已交件。</p></aside></div>`+footer()}
function sources(){const sourcePages=DATA.pages.filter(p=>p.kind==='source'),groups=[...DATA.courses.map(c=>({title:c.title,pages:sourcePages.filter(p=>p.courseId===c.id)})),{title:'共用與其他來源',pages:sourcePages.filter(p=>!coursesById.has(p.courseId))}];return hero('來源與方法','每個重點，都能回到來源。','來源摘要依課程歸屬列出；頁次、已讀範圍與限制請見各來源。')+groups.filter(g=>g.pages.length).map(g=>`<article class="article" style="margin-bottom:20px"><h2>${esc(g.title)}</h2>${g.pages.map(p=>`<a class="search-result" href="#${esc(p.path)}">${esc(p.short)}</a>`).join('')}</article>`).join('')+`<p><a href="#/wiki/sources">完整來源登錄</a></p>`+footer()}
function stat(){return DATA.courses.map(c=>{const pages=DATA.pages.filter(p=>p.courseId===c.id),reading=pages.filter(p=>p.trackReading),ids=new Set(pages.flatMap(p=>p.questions.map(q=>q.id))),outcomes=Object.entries(state.outcomes).filter(([id])=>ids.has(id)).map(([,v])=>v);return {course:c,read:reading.filter(p=>state.read[p.readKey]).length,total:reading.length,answered:outcomes.length,wrong:outcomes.filter(v=>v.correct===false).length}})}
function records(){return hero('學習紀錄','看見自己的複習軌跡。','紀錄只保存在這個瀏覽器，沒有跨裝置同步。閱讀與作答不會自動代表已掌握。')+stat().map(s=>`<section class="article" style="margin-bottom:20px"><h2>${esc(s.course.title)}</h2><div class="statrow"><div class="stat"><strong>${s.read} / ${s.total}</strong><span>已閱讀／可標記內容</span></div><div class="stat"><strong>${s.answered}</strong><span>已批改不同自動題</span></div><div class="stat"><strong>${s.wrong}</strong><span>仍需複習的錯題</span></div></div><p class="note">${esc(summary(s.course))}。作業與報告完成狀態不從閱讀推定。</p></section>`).join('')+`<div class="actions"><button id="export" class="primary">匯出學習紀錄</button><label class="pillbtn uploadlabel" for="importFile">匯入紀錄</label><input type="file" id="importFile" accept=".json" class="hidden"></div><p class="note">匯入會取代目前紀錄，請先匯出備份。未出現在目前教材的歷史紀錄仍保留在備份中。</p><div class="sectionhead"><h2>最近完成的練習</h2></div>`+(state.history.length?state.history.slice().reverse().map(h=>{const q=quizFor(h.chapter),c=q&&courseFor(q);return `<div class="search-result"><div class="label">${esc(new Date(h.time).toLocaleString('zh-TW'))}</div><strong>${esc(q?c.title+' · '+q.short:'已封存測驗：'+h.chapter)} · ${h.mode==='exam'?'測驗':'練習'}</strong><p>自動題 ${h.right} / ${h.total} 答對 · ${h.unanswered||0} 題未答 · 手寫 ${h.written} 題另行自評</p></div>`}).join(''):'<div class="empty"><p>尚未完成一輪練習。</p></div>')+footer()}
function searchPage(){const v=query.trim().toLowerCase();if(!v)return hero('搜尋 Wiki','查找一個概念。','搜尋所有已匯入課程、分類、筆記與來源摘要。');const results=DATA.pages.filter(p=>(p.searchText+p.short).toLowerCase().includes(v));return hero('搜尋 Wiki',`搜尋「${query}」`,`找到 ${results.length} 篇內容。`)+results.map(p=>{const pos=p.searchText.toLowerCase().indexOf(v),start=Math.max(0,pos-55),c=courseFor(p);return `<a class="search-result" href="#${esc(p.path)}"><span class="label">${esc(c?c.title:'Wiki')}</span><h3>${esc(p.short)}</h3><p>…${esc(p.searchText.slice(start,start+170))}…</p></a>`}).join('')+(!results.length?empty('沒有找到相關內容','試試縮短關鍵字或改用英文術語。'):'')+footer()}
function wrongPage(){const list=quizzes.flatMap(c=>c.questions.filter(q=>state.outcomes[q.id]?.correct===false).map(q=>({c,q})));return hero('錯題複習','錯的地方，是下一次的重點。','這裡收集最近一次仍答錯的自動題；未作答與手寫自評分開記錄。')+(list.length?list.map(({c,q})=>`<a class="search-result" href="#${esc(c.path)}"><span class="label">${esc(courseFor(c).title)} · ${esc(c.short)}</span><h3>${esc(q.prompt)}</h3><p>進入測驗後勾選「只練錯題」並重新開始。</p></a>`).join(''):empty('目前沒有待複習錯題','完成單選或填空後，答錯的題目會出現在這裡。'))+footer()}
function fresh(c,mode='practice',filter='all',onlyWrong=false,shuffle=false){let list=c.questions.filter(q=>filter==='all'||q.type===filter);if(onlyWrong)list=list.filter(q=>state.outcomes[q.id]?.correct===false);if(shuffle){list=list.slice();for(let i=list.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[list[i],list[j]]=[list[j],list[i]]}}return {chapter:c.recordChapter,mode,filter,onlyWrong,shuffle,ids:list.map(q=>q.id),pos:0,answers:{},graded:{},self:{},drawings:{},submitted:false,started:new Date().toISOString()}}
function getQ(id){return questionMap.get(id)}
function answered(q){return q.type==='choice'?Number.isInteger(session.answers[q.id]):Boolean((session.answers[q.id]||'').trim()||session.drawings[q.id])}
function norm(s){return String(s).normalize('NFKC').trim().toLowerCase().replace(/[–—−]/g,'-').replace(/\s+/g,'')}
function correct(q){return q.type==='choice'?session.answers[q.id]===q.answer:q.answers.some(a=>norm(a)===norm(session.answers[q.id]||''))}
function record(q){if(q.type==='written')return;const old=state.outcomes[q.id]||{};state.outcomes[q.id]={correct:correct(q),attempts:(old.attempts||0)+1,last:new Date().toISOString()};persist()}
function saveDraft(){if(session){state.drafts[String(session.chapter)]=session;persist()}}
function startQuiz(c){if(!session||String(session.chapter)!==c.quizKey){const d=state.drafts[c.quizKey];session=d&&d.ids.every(id=>c.questions.some(q=>q.id===id))?structuredClone(d):fresh(c)}return quiz(c)}
function quiz(c){const s=session,items=s.ids.map(getQ),q=items[s.pos],course=courseFor(c),section=course.sections.find(s=>s.id===c.sectionId);let html=crumb([[course.title,course.path],[section.label,section.path],[c.short]])+`<h1>${esc(c.short)}</h1><p class="note">AI 編寫練習題；簡答與繪圖另行自評。</p><div class="quizsetup"><div class="actions"><label>模式 <select id="quizmode"><option value="practice" ${s.mode==='practice'?'selected':''}>練習：單題看解析</option><option value="exam" ${s.mode==='exam'?'selected':''}>測驗：交卷後看解析</option></select></label><label>題型 <select id="quizfilter"><option value="all">全部題型</option><option value="choice" ${s.filter==='choice'?'selected':''}>單選</option><option value="fill" ${s.filter==='fill'?'selected':''}>英文填空</option><option value="written" ${s.filter==='written'?'selected':''}>簡答與繪圖</option></select></label><label><input type="checkbox" id="onlywrong" ${s.onlyWrong?'checked':''}> 只練錯題</label><label><input type="checkbox" id="shuffle" ${s.shuffle?'checked':''}> 隨機題序</label><button id="restart" class="pillbtn">依設定重新開始</button></div><p class="note">重新開始會清除本次草稿；歷次紀錄保留。${s.mode==='exam'?'交卷前不顯示答案。':'送出單題後即可看解析。'}</p></div>`;
if(!q)return html+empty('目前沒有符合條件的題目','尚無錯題，或所選題型沒有可複習的錯題。調整設定並重新開始。');
if(s.submitted){const obj=items.filter(q=>q.type!=='written'),right=obj.filter(correct).length;html+=`<div class="result" aria-live="polite"><h2>本次自動題：${right} / ${obj.length} 題答對${obj.length?' · '+Math.round(right/obj.length*100)+'%':''}</h2><p>手寫題 ${items.length-obj.length} 題，依答案要點另行自評，不併入自動分數。本輪自動題 ${obj.filter(q=>!answered(q)).length} 題未答。</p><div class="actions"><button class="pillbtn" id="retryWrong">再練此測驗錯題</button><a href="#${esc(c.lessonPath)}" class="quiet">閱讀對應重點</a></div></div>`}
const done=items.filter(answered).length,visible=!!s.graded[q.id]||s.submitted,locked=visible&&q.type!=='written';
html+=`<div class="quiztop"><div><strong>第 ${s.pos+1} / ${items.length} 題</strong><span class="sourcepage" style="margin-left:12px">已作答 ${done} 題</span></div><span class="sourcepage">${esc(q.source)} · PDF p.${q.pages.join('、')}</span></div><div class="progressrail"><span style="width:${done/items.length*100}%"></span></div><section class="qcard" aria-label="測驗題目"><div class="qmeta"><span>${({choice:'單選題',fill:'英文填空',written:'手寫／自評'})[q.type]} · ${esc(q.level||'')}</span><span>${esc(q.id)}</span></div><h2 class="qprompt">${esc(q.prompt)}</h2>`;
if(q.type==='choice')html+='<div role="radiogroup" aria-label="答案選項">'+q.options.map((o,i)=>`<label class="option ${s.answers[q.id]===i?'selected':''} ${visible&&i===q.answer?'correct':''} ${visible&&s.answers[q.id]===i&&i!==q.answer?'incorrect':''}"><input type="radio" name="answer" value="${i}" ${s.answers[q.id]===i?'checked':''} ${locked?'disabled':''}><span>${String.fromCharCode(65+i)}. ${esc(o)}</span></label>`).join('')+'</div>';
else if(q.type==='fill')html+=`<label class="note" for="answertext">輸入答案；英文不分大小寫，術語依題幹要求。</label><input id="answertext" class="answerinput" autocomplete="off" value="${esc(s.answers[q.id]||'')}" ${locked?'disabled':''} placeholder="輸入英文名詞或指定符號">`;
else {html+=`<label class="note" for="answertext">先自行作答，再對照參考答案。可在紙上練習後用文字記錄。</label><textarea id="answertext" placeholder="寫下你的答案、判斷理由或繪圖假設…">${esc(s.answers[q.id]||'')}</textarea>`;if(q.answerImage)html+='<details id="drawDetails"><summary style="font-size:12px;cursor:pointer;margin-top:14px">展開繪圖區（也可用紙筆）</summary><div class="canvas-wrap"><div class="canvas-toolbar"><span>畫筆</span><button id="undoDraw">上一步</button><button id="clearDraw">清空畫布</button><span>離開題目會保留草稿</span></div><canvas class="draw" id="drawCanvas" aria-label="手寫繪圖畫布"></canvas></div></details>'}
if(visible)html+=feedback(q,answered(q));
html+='</section><div class="quizbottom"><div class="actions"><button class="pillbtn" id="prevq" '+(s.pos===0?'disabled':'')+'>← 上一題</button><button class="pillbtn" id="nextq" '+(s.pos===items.length-1?'disabled':'')+'>下一題 →</button></div><div class="actions">';
if(!s.submitted&&s.mode==='practice')html+=`<button class="primary" id="gradeq">${q.type==='written'?'顯示參考答案與自評要點':visible?'已批改':'送出本題'}</button>`;
if(!s.submitted)html+='<button class="pillbtn" id="submitall">'+(s.mode==='exam'?'交卷並看解析':'結束本輪並看結果')+'</button>';
html+='</div></div><nav class="qnav" aria-label="題目跳轉">'+items.map((q,i)=>`<button aria-label="第 ${i+1} 題" data-qpos="${i}" class="${s.pos===i?'current':''} ${answered(q)?'answered':''} ${(s.submitted||s.graded[q.id])&&q.type!=='written'&&answered(q)&&!correct(q)?'wrong':''}">${i+1}</button>`).join('')+'</nav><p class="note">自動判分只依目前題庫答案；簡答與繪圖不會使用文字比對冒充語意評分。可將本題提問與來源頁次提供給代理，繼續釐清。</p>'+footer();return html}
function feedback(q,hasAnswer){if(q.type==='written')return `<div class="feedback self"><strong>參考答案 · 請自行評估</strong><div>${esc(q.model)}</div><ul>${q.rubric.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>${q.answerImage?`<details><summary style="cursor:pointer">查看參考圖例</summary><img src="${DATA.images[q.answerImage]}" alt="${esc(q.prompt)} 的參考解答圖"></details>`:''}<div class="actions" style="margin-top:16px"><button class="pillbtn selfbtn ${session.self[q.id]==='good'?'active':''}" data-self="good">我能說明了</button><button class="pillbtn selfbtn ${session.self[q.id]==='review'?'active':''}" data-self="review">仍需加強</button></div><div class="source">${esc(q.source)} · PDF p.${q.pages.join('、')} · <a href="#${esc(quizFor(session.chapter).lessonPath)}">閱讀對應重點</a></div></div>`;const right=correct(q);return `<div class="feedback ${right?'':'bad'}" role="status"><strong>${!hasAnswer?'未作答':right?'回答正確':'再釐清這個觀念'}</strong><div>參考答案：${q.type==='choice'?String.fromCharCode(65+q.answer)+'. '+esc(q.options[q.answer]):esc(q.answers[0])}</div><p style="margin:10px 0 0">${esc(q.explanation)}</p><div class="source">${esc(q.source)} · PDF p.${q.pages.join('、')} · <a href="#${esc(quizFor(session.chapter).lessonPath)}">閱讀對應重點</a></div></div>`}
function render(){
 const raw=route(),p=raw.split('?')[0],params=new URLSearchParams(raw.includes('?')?raw.slice(raw.indexOf('?')+1):'');
 const target=DATA.routes[p],page=target?.kind==='page'?pageById(target.id):null;
 const active=page?courseFor(page):target?.courseId?coursesById.get(target.courseId):target?.kind==='course'?coursesById.get(target.id):null;
 applyTheme(active);
 $('#courseNav').innerHTML=DATA.courses.map((c,i)=>`<button class="navitem" data-route="${esc(c.path)}"><span class="num">${String(i+1).padStart(2,'0')}</span>${esc(c.title)}</button>${active===c?c.sections.map(s=>`<button class="navitem" data-route="${esc(s.path)}" style="padding-left:43px;font-size:12px">${esc(s.label)}</button>`).join(''):''}`).join('');
 $('#topcrumb').textContent='我的學習空間 / '+(p==='/'?'所有課程':active?active.title:'複習工具');
 let output;
 if(p==='/')output=home();
 else if(p==='/sources')output=sources();
 else if(p==='/records')output=records();
 else if(p==='/wrong')output=wrongPage();
 else if(p==='/search'){query=params.get('q')||'';output=searchPage()}
 else if(target?.kind==='course')output=coursePage(active);
 else if(target?.kind==='section')output=sectionPage(active,active.sections.find(s=>s.id===target.id));
 else if(page)output=page.kind==='quiz'&&page.questions.length?startQuiz(page):article(page);
 else output=empty('找不到這個頁面','請從課程入口重新選擇。');
 $('#app').innerHTML=output;
 document.querySelectorAll('[data-route]').forEach(b=>{const path=b.dataset.route;b.classList.toggle('active',path==='/'?p==='/':p===path||p.startsWith(path+'/'));b.onclick=()=>go(path)});
 bind();document.title='LLM Wiki｜'+(active?active.title:'課程複習');
}
function bind(){document.querySelectorAll('[data-scroll]').forEach(a=>a.onclick=e=>{e.preventDefault();document.getElementById(a.dataset.scroll)?.scrollIntoView({behavior:'smooth'})});if($('#readToggle'))$('#readToggle').onclick=()=>{const key=$('#readToggle').dataset.key;state.read[key]=!state.read[key];persist();render()};if($('#restart')){
 $('#restart').onclick=()=>{const mode=$('#quizmode').value,filter=$('#quizfilter').value,only=$('#onlywrong').checked,shuffle=$('#shuffle').checked;if(session.ids.some(id=>answered(getQ(id)))&&!session.submitted&&!confirm('重新開始會清除這一章未交卷的草稿，確定重新開始？'))return;session=fresh(quizFor(session.chapter),mode,filter,only,shuffle);saveDraft();render()};
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.onchange=()=>{session.answers[session.ids[session.pos]]=Number(x.value);saveDraft();document.querySelectorAll('.option').forEach(a=>a.classList.toggle('selected',a.querySelector('input').checked))});if($('#answertext'))$('#answertext').oninput=e=>{session.answers[session.ids[session.pos]]=e.target.value;saveDraft()};
 if($('#gradeq'))$('#gradeq').onclick=()=>{const q=getQ(session.ids[session.pos]);if(session.graded[q.id])return;if(q.type!=='written'&&!answered(q)){toast('請先輸入或選擇答案。');return}session.graded[q.id]=true;if(q.type!=='written')record(q);saveDraft();render()};
 if($('#prevq'))$('#prevq').onclick=()=>{session.pos--;saveDraft();render()};if($('#nextq'))$('#nextq').onclick=()=>{session.pos++;saveDraft();render()};document.querySelectorAll('[data-qpos]').forEach(b=>b.onclick=()=>{session.pos=Number(b.dataset.qpos);saveDraft();render()});
 if($('#submitall'))$('#submitall').onclick=submit;
 if($('#retryWrong'))$('#retryWrong').onclick=()=>{session=fresh(quizFor(session.chapter),'practice','all',true);saveDraft();render()};document.querySelectorAll('[data-self]').forEach(b=>b.onclick=()=>{session.self[session.ids[session.pos]]=b.dataset.self;saveDraft();render()});
 if($('#drawDetails')){const d=$('#drawDetails');d.ontoggle=()=>{if(d.open)initCanvas()}}
 }
 if($('#export'))$('#export').onclick=()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='llm-wiki-learning-record.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
 if($('#importFile'))$('#importFile').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>15000000)throw Error('檔案過大');const data=validateState(JSON.parse(await file.text()));
 if(!confirm('匯入將取代目前學習紀錄，是否已完成需要的備份？'))return;state=data;session=null;persist();render();toast('已匯入紀錄。')}catch(e){toast('無法匯入：'+e.message)}}}
function submit(){const list=session.ids.map(getQ),obj=list.filter(q=>q.type!=='written'),missing=obj.filter(q=>!answered(q)).length;if(!confirm(missing?`還有 ${missing} 題自動題未答，仍要交卷？未答將單獨標示。`:'結束本輪並顯示所有解析？'))return;for(const q of obj){if(!session.graded[q.id]&&answered(q))record(q);session.graded[q.id]=true}session.submitted=true;state.history.push({time:new Date().toISOString(),chapter:session.chapter,mode:session.mode,right:obj.filter(correct).length,total:obj.length,unanswered:missing,written:list.length-obj.length});state.history=state.history.slice(-50);saveDraft();render();window.scrollTo({top:0,behavior:'smooth'})}
function initCanvas(){const canvas=$('#drawCanvas');if(!canvas||canvas.dataset.ready)return;canvas.dataset.ready='1';const ratio=window.devicePixelRatio||1,w=canvas.clientWidth;canvas.width=w*ratio;canvas.height=330*ratio;const ctx=canvas.getContext('2d');ctx.scale(ratio,ratio);ctx.strokeStyle='#243d34';ctx.lineWidth=2;ctx.lineCap='round';let drawing=false,stack=[];const id=session.ids[session.pos];function imageLoad(data){ctx.clearRect(0,0,w,330);if(data){const im=new Image();im.onload=()=>ctx.drawImage(im,0,0,w,330);im.src=data}}function stash(){session.drawings[id]=canvas.toDataURL('image/png');saveDraft()}imageLoad(session.drawings[id]);canvas.onpointerdown=e=>{stack.push(canvas.toDataURL('image/png'));drawing=true;canvas.setPointerCapture(e.pointerId);ctx.beginPath();const r=canvas.getBoundingClientRect();ctx.moveTo(e.clientX-r.left,e.clientY-r.top)};canvas.onpointermove=e=>{if(!drawing)return;const r=canvas.getBoundingClientRect();ctx.lineTo(e.clientX-r.left,e.clientY-r.top);ctx.stroke()};canvas.onpointerup=canvas.onpointercancel=()=>{if(drawing){drawing=false;stash()}};$('#clearDraw').onclick=()=>{stack.push(canvas.toDataURL('image/png'));ctx.clearRect(0,0,w,330);delete session.drawings[id];saveDraft()};$('#undoDraw').onclick=()=>{if(!stack.length)return;const data=stack.pop();imageLoad(data);session.drawings[id]=data;saveDraft()}}
$('#skipLink').onclick=e=>{e.preventDefault();$('#app').focus()};
$('#menuButton').onclick=()=>$('#side').classList.toggle('open');$('#searchform').onsubmit=e=>{e.preventDefault();query=$('#searchInput').value.trim();go('/search?q='+encodeURIComponent(query))};window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#side').classList.remove('open')});render();
</script></body></html>

dy\u003e\n\u003c/table\u003e\n\u003cp\u003e來源：[ASE-002，PDF p.14–23、25–30]。安全關鍵也不等於完全不能疊代；本課案例重點是嚴謹驗證與追溯。\u003c/p\u003e\n\u003ch2 id=\"p-78df9685cd54-s4\"\u003e2.3 增量、疊代與 MVP\u003c/h2\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e比較\u003c/th\u003e\n\u003cth\u003eIncremental 增量\u003c/th\u003e\n\u003cth\u003eIterative 疊代\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e主要改變\u003c/td\u003e\n\u003ctd\u003e擴大功能範圍\u003c/td\u003e\n\u003ctd\u003e反覆修正與精煉\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e自編例\u003c/td\u003e\n\u003ctd\u003e先可查課，再加選，再退選\u003c/td\u003e\n\u003ctd\u003e查課先純文字，再改善篩選與速度\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e提問方式\u003c/td\u003e\n\u003ctd\u003e這次多交付什麼？\u003c/td\u003e\n\u003ctd\u003e這次把什麼做得更準、更好？\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e來源：[ASE-002，PDF p.25–33]。兩者可以同時使用。\u003cstrong\u003e垂直切片（Vertical Slicing）\u003c/strong\u003e是一項功能貫穿 UI、邏輯與資料，使它可端到端驗證；先做完所有 DB、再 API、最後 UI，是水平分層，早期未必能給使用者價值。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eMVP（Minimum Viable Product）\u003c/strong\u003e的目的，是以最小投入驗證核心假設與取得真實回饋，不是單純少做功能，也不是犧牲必要安全。滑板可以立即代步，單一車輪卻不能驗證代步體驗。雕塑從粗輪廓到細節，則幫助理解疊代精煉。[ASE-002，PDF p.26–34]\u003c/p\u003e\n\u003ch2 id=\"p-78df9685cd54-s5\"\u003e2.4 敏捷宣言\u003c/h2\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e更重視\u003c/th\u003e\n\u003cth\u003e相較於\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003eIndividuals and Interactions 個人與互動\u003c/td\u003e\n\u003ctd\u003eProcesses and Tools 流程與工具\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eWorking Software 可運行軟體\u003c/td\u003e\n\u003ctd\u003eComprehensive Documentation 詳盡文件\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eCustomer Collaboration 客戶合作\u003c/td\u003e\n\u003ctd\u003eContract Negotiation 合約協商\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eResponding to Change 回應變更\u003c/td\u003e\n\u003ctd\u003eFollowing a Plan 遵循計畫\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e來源：[ASE-002，PDF p.39–43]。右側仍有價值；敏捷沒有取消規格、文件或計畫。十二原則可用四組理解：早期持續交付與接受變更、業務與開發協作、可持續步調與技術品質、簡約與定期反省。可運行軟體是進度的主要衡量，會議次數與文件頁數不是交付價值。[ASE-002，PDF p.42–44]\u003c/p\u003e\n\u003ch2 id=\"p-78df9685cd54-s6\"\u003e2.5 Scrum 與 Kanban\u003c/h2\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eScrum 責任\u003c/th\u003e\n\u003cth\u003e角色\u003c/th\u003e\n\u003cth\u003e常見混淆\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e最大化價值、排序 Product Backlog\u003c/td\u003e\n\u003ctd\u003eProduct Owner（PO）\u003c/td\u003e\n\u003ctd\u003e不等於指定每項技術實作\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e協助流程有效運作、移除障礙\u003c/td\u003e\n\u003ctd\u003eScrum Master（SM）\u003c/td\u003e\n\u003ctd\u003e不是產品優先級唯一決策者\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e規劃實作並交付符合品質的增量\u003c/td\u003e\n\u003ctd\u003eDevelopers\u003c/td\u003e\n\u003ctd\u003e不只是被動接單打字\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e來源：[ASE-002，PDF p.47–50]。\u003c/p\u003e\n\u003cp\u003e三個工件為 \u003cstrong\u003eProduct Backlog\u003c/strong\u003e（產品待辦清單）、\u003cstrong\u003eSprint Backlog\u003c/strong\u003e（本衝刺目標相關工作與計畫）、\u003cstrong\u003eIncrement\u003c/strong\u003e（符合完成定義 DoD 的可用增量）。Sprint 是固定時間盒（Timebox）；講義以 1–4 週介紹。[ASE-002，PDF p.48–50]\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e事件\u003c/th\u003e\n\u003cth\u003e核心目的\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003eSprint Planning\u003c/td\u003e\n\u003ctd\u003e規劃本輪目標、選擇與安排工作\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eDaily Scrum\u003c/td\u003e\n\u003ctd\u003e開發者檢視朝目標的進展並調整計畫；15 分鐘\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eSprint Review\u003c/td\u003e\n\u003ctd\u003e檢視產品成果並取得利害關係人回饋\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eSprint Retrospective\u003c/td\u003e\n\u003ctd\u003e改善團隊協作與工程流程\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e來源：[ASE-002，PDF p.50]。\u003cstrong\u003eReview 看產品；Retrospective 看做事方式\u003c/strong\u003e。講義將 Sprint 內範疇描述為凍結，這裡保留為課內比較用語；精確實務規則的版本差異列待確認，不以此出「所有變更一律禁止」的客觀題。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eKanban 看板\u003c/strong\u003e強調連續流（Continuous Flow）與拉動（Pull）：下游有容量才拉新工作。\u003cstrong\u003eWIP = Work in Progress\u003c/strong\u003e；WIP Limit 限制同時進行的工作，讓團隊先完成舊工作、暴露瓶頸，減少多工切換。限制不是要求每人寫更少程式碼。[ASE-002，PDF p.51–55]\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e比較\u003c/th\u003e\n\u003cth\u003eScrum\u003c/th\u003e\n\u003cth\u003eKanban\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e節奏\u003c/td\u003e\n\u003ctd\u003e固定 Sprint\u003c/td\u003e\n\u003ctd\u003e持續流動\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e角色\u003c/td\u003e\n\u003ctd\u003ePO、SM、Developers\u003c/td\u003e\n\u003ctd\u003e不強制 Scrum 角色\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e工作限制\u003c/td\u003e\n\u003ctd\u003eSprint 計畫與目標\u003c/td\u003e\n\u003ctd\u003e明確 WIP 上限\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e常用觀察\u003c/td\u003e\n\u003ctd\u003eSprint 成果與改進\u003c/td\u003e\n\u003ctd\u003eLead Time、Cycle Time、瓶頸\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e來源：[ASE-002，PDF p.47–55]。\u003c/p\u003e\n\u003ch2 id=\"p-78df9685cd54-s7\"\u003e2.6–2.7 技術債與 XP\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eTechnical Debt 技術債\u003c/strong\u003e是今日省下的設計／實作品質成本，轉為未來每次理解、修改與除錯的額外負擔。「利息」是反覆付出的維護代價，不是雲端租金。\u003cstrong\u003eFlaccid Scrum\u003c/strong\u003e 指只保留會議與看板等管理外殼，卻缺乏測試與重構的技術實踐。[ASE-002，PDF p.58–62]\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eExtreme Programming（XP）\u003c/strong\u003e將良好工程實踐持續執行：測試先行、結對編程、簡單設計、重構、持續整合、小型發布與集體所有權。[ASE-002，PDF p.66–74]\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eTDD 階段\u003c/th\u003e\n\u003cth\u003e要做的事\u003c/th\u003e\n\u003cth\u003e不應混淆\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003eRed\u003c/td\u003e\n\u003ctd\u003e先寫測試並確認因預期原因失敗\u003c/td\u003e\n\u003ctd\u003e不是先寫完整實作\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eGreen\u003c/td\u003e\n\u003ctd\u003e寫最少實作使測試通過\u003c/td\u003e\n\u003ctd\u003e不需一次完成所有未來功能\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eRefactor\u003c/td\u003e\n\u003ctd\u003e維持測試通過，改善內部結構\u003c/td\u003e\n\u003ctd\u003e不改外部可觀察行為\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e來源：[ASE-002，PDF p.68–70]。測試提供回歸防護，但「全部通過」不構成所有需求皆正確的數學保證。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003ePair Programming\u003c/strong\u003e：Driver 實際操作與編碼；Navigator 審查全局、邊界與設計，並交換角色。集體所有權降低只有單一人理解模組的風險（Bus Factor）。[ASE-002，PDF p.71–73]\u003c/p\u003e\n\u003ch2 id=\"p-78df9685cd54-s8\"\u003e2.8 DevOps 與 CI/CD\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eDevOps\u003c/strong\u003e 整合開發與維運責任，配合自動化與營運回饋。它不是只安裝某個部署工具。[ASE-002，PDF p.77–81]\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e實踐\u003c/th\u003e\n\u003cth\u003e英文\u003c/th\u003e\n\u003cth\u003e主要特徵\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e持續整合\u003c/td\u003e\n\u003ctd\u003eContinuous Integration\u003c/td\u003e\n\u003ctd\u003e頻繁整合並自動建置、測試\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e持續交付\u003c/td\u003e\n\u003ctd\u003eContinuous Delivery\u003c/td\u003e\n\u003ctd\u003e通過驗證後保持可發布；發布可保留人工決策\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e持續部署\u003c/td\u003e\n\u003ctd\u003eContinuous Deployment\u003c/td\u003e\n\u003ctd\u003e通過關卡後自動發布至正式環境\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e來源：[ASE-002，PDF p.78–82]。\u003cstrong\u003eIaC（Infrastructure as Code）\u003c/strong\u003e以可版本控制的描述管理環境，降低設定漂移；可觀測性的三個常見面向是 \u003cstrong\u003eMetrics、Logs、Traces\u003c/strong\u003e。自動化降低風險，不代表環境必然百分之百相同或發布永遠零故障。[ASE-002，PDF p.81；後句為整理提醒]\u003c/p\u003e\n\u003ch2 id=\"p-78df9685cd54-s9\"\u003e2.9 規格驅動 AI 與 Harness\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eEngineering Harness\u003c/strong\u003e 指包圍模型的規格、權限邊界、執行環境與驗證機制。講義分為上游規格導軌（Context \u0026amp; Spec Rails）、隔離執行沙盒（Execution Sandbox）、下游驗證守門員（Verification Gatekeepers）。[ASE-002，PDF p.85–91]\u003c/p\u003e\n\u003cp\u003e工作迴路為：人定規格 → AI 實作 → 編譯、靜態分析與測試 → 失敗則修正 → 人工審查。提示詞不能代替確定性工具檢查；工具檢查也不能代替對規格與測試設計的人工判斷。\u003c/p\u003e\n\u003ch2 id=\"p-78df9685cd54-s10\"\u003e手寫回答策略\u003c/h2\u003e\n\u003cp\u003e遇到流程選型題，寫「情境特性 → 模型 → 關鍵機制 → 代價」。例如：需求穩定且須嚴格追溯的系統，可選 V-Model，因為能早期規劃與追溯各層測試；代價是前期文件及變更成本。這比只寫「醫療所以 V-Model」更完整。[ASE-002，PDF p.20–23；答題架構為自編]\u003c/p\u003e\n\u003ch2 id=\"p-78df9685cd54-s11\"\u003e來源與延伸\u003c/h2\u003e\n\u003cp\u003e\u003ca href=\"#/sources\" title=\"原始教材保存在專案 raw 資料夾\"\u003eASE-002 原始講義\u003c/a\u003e。\u003c/p\u003e\n\u003cp\u003e\u003ca href=\"#/ase/tests/2\"\u003e本章測驗\u003c/a\u003e · \u003ca href=\"#/ase\"\u003e課程首頁\u003c/a\u003e\u003c/p\u003e", "text": "# 第二章｜軟體流程與開發方法學\n\n\u003e 依講義重新整理；頁碼一律指 PDF 頁次。例子標為自編；整理稿尚待使用者複核。\n\n## 本章主線\n\n所有流程都含規格、設計實作、驗證與演化，差別在活動何時發生、多久重複，以及如何取得回饋。流程選型要看需求穩定度、風險、交付時間與變更代價，不能只背「敏捷比較新」。[ASE-002，PDF p.7–9]\n\n## 2.1 Process 與 Process Model\n\n**Software Process** 是實際做的一組活動、方法與實踐；**Process Model** 是對流程的抽象描述，交代活動順序、負責角色、產出工件（Artifacts）及驗證時機。模型是理解與管理流程的藍圖，不等同某一套工具。[ASE-002，PDF p.7–8]\n\n## 2.2 瀑布與 V-Model\n\n**Waterfall 瀑布模型**依序完成需求定義、系統與軟體設計、實作與單元測試、整合與系統測試、維運與維護。階段工件與簽核清楚；風險是可用產品與客戶回饋太晚出現，需求誤解累積到後期才被發現。[ASE-002，PDF p.11–16]\n\n**V-Model** 在定義或設計時就規劃對應測試。重點是測試左移（Shift-Left）與雙向追溯（Traceability），不是最後才補測試。[ASE-002，PDF p.17–21]\n\n| 左側開發層級 | 右側測試層級 | 要確認什麼 |\n| --- | --- | --- |\n| User Requirements 使用者需求 | Acceptance Testing 驗收測試 | 是否達成使用者要求 |\n| System Requirements 系統規格 | System Testing 系統測試 | 整體系統是否符合規格 |\n| Architecture Design 架構設計 | Integration Testing 整合測試 | 子系統介面與協作是否正確 |\n| Detailed / Module Design 詳細設計 | Unit Testing 單元測試 | 個別模組是否符合設計 |\n\n來源：[ASE-002，PDF p.19]。**圖題提醒**：PDF p.18 的簡化圖把層級合併，分享對話的範例也把架構對應測試寫成 Integration \u0026 System Testing。作答時先看該圖的層級切分；詳細四層版按上表，不要只靠某一個選項字面。\n\n![自編 V-Model 複習圖](../../../assets/v-model.svg)\n\n| 模型 | 適合情境 | 主要代價 |\n| --- | --- | --- |\n| Waterfall | 需求穩定、需明確階段工件 | 後期變更與整合昂貴 |\n| V-Model | 重視安全、驗證追溯與審查 | 前期規格及測試規劃成本高 |\n| 增量／疊代 | 需要早期可用成果與回饋 | 需管理架構演化與整合品質 |\n\n來源：[ASE-002，PDF p.14–23、25–30]。安全關鍵也不等於完全不能疊代；本課案例重點是嚴謹驗證與追溯。\n\n## 2.3 增量、疊代與 MVP\n\n| 比較 | Incremental 增量 | Iterative 疊代 |\n| --- | --- | --- |\n| 主要改變 | 擴大功能範圍 | 反覆修正與精煉 |\n| 自編例 | 先可查課，再加選，再退選 | 查課先純文字，再改善篩選與速度 |\n| 提問方式 | 這次多交付什麼？ | 這次把什麼做得更準、更好？ |\n\n來源：[ASE-002，PDF p.25–33]。兩者可以同時使用。**垂直切片（Vertical Slicing）**是一項功能貫穿 UI、邏輯與資料，使它可端到端驗證；先做完所有 DB、再 API、最後 UI，是水平分層，早期未必能給使用者價值。\n\n**MVP（Minimum Viable Product）**的目的，是以最小投入驗證核心假設與取得真實回饋，不是單純少做功能，也不是犧牲必要安全。滑板可以立即代步，單一車輪卻不能驗證代步體驗。雕塑從粗輪廓到細節，則幫助理解疊代精煉。[ASE-002，PDF p.26–34]\n\n## 2.4 敏捷宣言\n\n| 更重視 | 相較於 |\n| --- | --- |\n| Individuals and Interactions 個人與互動 | Processes and Tools 流程與工具 |\n| Working Software 可運行軟體 | Comprehensive Documentation 詳盡文件 |\n| Customer Collaboration 客戶合作 | Contract Negotiation 合約協商 |\n| Responding to Change 回應變更 | Following a Plan 遵循計畫 |\n\n來源：[ASE-002，PDF p.39–43]。右側仍有價值；敏捷沒有取消規格、文件或計畫。十二原則可用四組理解：早期持續交付與接受變更、業務與開發協作、可持續步調與技術品質、簡約與定期反省。可運行軟體是進度的主要衡量，會議次數與文件頁數不是交付價值。[ASE-002，PDF p.42–44]\n\n## 2.5 Scrum 與 Kanban\n\n| Scrum 責任 | 角色 | 常見混淆 |\n| --- | --- | --- |\n| 最大化價值、排序 Product Backlog | Product Owner（PO） | 不等於指定每項技術實作 |\n| 協助流程有效運作、移除障礙 | Scrum Master（SM） | 不是產品優先級唯一決策者 |\n| 規劃實作並交付符合品質的增量 | Developers | 不只是被動接單打字 |\n\n來源：[ASE-002，PDF p.47–50]。\n\n三個工件為 **Product Backlog**（產品待辦清單）、**Sprint Backlog**（本衝刺目標相關工作與計畫）、**Increment**（符合完成定義 DoD 的可用增量）。Sprint 是固定時間盒（Timebox）；講義以 1–4 週介紹。[ASE-002，PDF p.48–50]\n\n| 事件 | 核心目的 |\n| --- | --- |\n| Sprint Planning | 規劃本輪目標、選擇與安排工作 |\n| Daily Scrum | 開發者檢視朝目標的進展並調整計畫；15 分鐘 |\n| Sprint Review | 檢視產品成果並取得利害關係人回饋 |\n| Sprint Retrospective | 改善團隊協作與工程流程 |\n\n來源：[ASE-002，PDF p.50]。**Review 看產品；Retrospective 看做事方式**。講義將 Sprint 內範疇描述為凍結，這裡保留為課內比較用語；精確實務規則的版本差異列待確認，不以此出「所有變更一律禁止」的客觀題。\n\n**Kanban 看板**強調連續流（Continuous Flow）與拉動（Pull）：下游有容量才拉新工作。**WIP = Work in Progress**；WIP Limit 限制同時進行的工作，讓團隊先完成舊工作、暴露瓶頸，減少多工切換。限制不是要求每人寫更少程式碼。[ASE-002，PDF p.51–55]\n\n| 比較 | Scrum | Kanban |\n| --- | --- | --- |\n| 節奏 | 固定 Sprint | 持續流動 |\n| 角色 | PO、SM、Developers | 不強制 Scrum 角色 |\n| 工作限制 | Sprint 計畫與目標 | 明確 WIP 上限 |\n| 常用觀察 | Sprint 成果與改進 | Lead Time、Cycle Time、瓶頸 |\n\n來源：[ASE-002，PDF p.47–55]。\n\n## 2.6–2.7 技術債與 XP\n\n**Technical Debt 技術債**是今日省下的設計／實作品質成本，轉為未來每次理解、修改與除錯的額外負擔。「利息」是反覆付出的維護代價，不是雲端租金。**Flaccid Scrum** 指只保留會議與看板等管理外殼，卻缺乏測試與重構的技術實踐。[ASE-002，PDF p.58–62]\n\n**Extreme Programming（XP）**將良好工程實踐持續執行：測試先行、結對編程、簡單設計、重構、持續整合、小型發布與集體所有權。[ASE-002，PDF p.66–74]\n\n| TDD 階段 | 要做的事 | 不應混淆 |\n| --- | --- | --- |\n| Red | 先寫測試並確認因預期原因失敗 | 不是先寫完整實作 |\n| Green | 寫最少實作使測試通過 | 不需一次完成所有未來功能 |\n| Refactor | 維持測試通過，改善內部結構 | 不改外部可觀察行為 |\n\n來源：[ASE-002，PDF p.68–70]。測試提供回歸防護，但「全部通過」不構成所有需求皆正確的數學保證。\n\n**Pair Programming**：Driver 實際操作與編碼；Navigator 審查全局、邊界與設計，並交換角色。集體所有權降低只有單一人理解模組的風險（Bus Factor）。[ASE-002，PDF p.71–73]\n\n## 2.8 DevOps 與 CI/CD\n\n**DevOps** 整合開發與維運責任，配合自動化與營運回饋。它不是只安裝某個部署工具。[ASE-002，PDF p.77–81]\n\n| 實踐 | 英文 | 主要特徵 |\n| --- | --- | --- |\n| 持續整合 | Continuous Integration | 頻繁整合並自動建置、測試 |\n| 持續交付 | Continuous Delivery | 通過驗證後保持可發布；發布可保留人工決策 |\n| 持續部署 | Continuous Deployment | 通過關卡後自動發布至正式環境 |\n\n來源：[ASE-002，PDF p.78–82]。**IaC（Infrastructure as Code）**以可版本控制的描述管理環境，降低設定漂移；可觀測性的三個常見面向是 **Metrics、Logs、Traces**。自動化降低風險，不代表環境必然百分之百相同或發布永遠零故障。[ASE-002，PDF p.81；後句為整理提醒]\n\n## 2.9 規格驅動 AI 與 Harness\n\n**Engineering Harness** 指包圍模型的規格、權限邊界、執行環境與驗證機制。講義分為上游規格導軌（Context \u0026 Spec Rails）、隔離執行沙盒（Execution Sandbox）、下游驗證守門員（Verification Gatekeepers）。[ASE-002，PDF p.85–91]\n\n工作迴路為：人定規格 → AI 實作 → 編譯、靜態分析與測試 → 失敗則修正 → 人工審查。提示詞不能代替確定性工具檢查；工具檢查也不能代替對規格與測試設計的人工判斷。\n\n## 手寫回答策略\n\n遇到流程選型題，寫「情境特性 → 模型 → 關鍵機制 → 代價」。例如：需求穩定且須嚴格追溯的系統，可選 V-Model，因為能早期規劃與追溯各層測試；代價是前期文件及變更成本。這比只寫「醫療所以 V-Model」更完整。[ASE-002，PDF p.20–23；答題架構為自編]\n\n\n## 來源與延伸\n\n[ASE-002 原始講義](../../../../raw/advanced-software-engineering/lectures/slide02t_process.pdf)。\n\n[本章測驗](../reviews/chapter-02.md) · [課程首頁](../index.md)\n", "headings": [{"id": "p-78df9685cd54-s1", "text": "本章主線"}, {"id": "p-78df9685cd54-s2", "text": "2.1 Process 與 Process Model"}, {"id": "p-78df9685cd54-s3", "text": "2.2 瀑布與 V-Model"}, {"id": "p-78df9685cd54-s4", "text": "2.3 增量、疊代與 MVP"}, {"id": "p-78df9685cd54-s5", "text": "2.4 敏捷宣言"}, {"id": "p-78df9685cd54-s6", "text": "2.5 Scrum 與 Kanban"}, {"id": "p-78df9685cd54-s7", "text": "2.6–2.7 技術債與 XP"}, {"id": "p-78df9685cd54-s8", "text": "2.8 DevOps 與 CI/CD"}, {"id": "p-78df9685cd54-s9", "text": "2.9 規格驅動 AI 與 Harness"}, {"id": "p-78df9685cd54-s10", "text": "手寫回答策略"}, {"id": "p-78df9685cd54-s11", "text": "來源與延伸"}], "sectionCount": 11, "searchText": "第二章｜軟體流程與開發方法學 依講義重新整理；頁碼一律指 PDF 頁次。例子標為自編；整理稿尚待使用者複核。 本章主線 所有流程都含規格、設計實作、驗證與演化，差別在活動何時發生、多久重複，以及如何取得回饋。流程選型要看需求穩定度、風險、交付時間與變更代價，不能只背「敏捷比較新」。[ASE-002，PDF p.7–9] 2.1 Process 與 Process Model Software Process 是實際做的一組活動、方法與實踐； Process Model 是對流程的抽象描述，交代活動順序、負責角色、產出工件（Artifacts）及驗證時機。模型是理解與管理流程的藍圖，不等同某一套工具。[ASE-002，PDF p.7–8] 2.2 瀑布與 V-Model Waterfall 瀑布模型 依序完成需求定義、系統與軟體設計、實作與單元測試、整合與系統測試、維運與維護。階段工件與簽核清楚；風險是可用產品與客戶回饋太晚出現，需求誤解累積到後期才被發現。[ASE-002，PDF p.11–16] V-Model 在定義或設計時就規劃對應測試。重點是測試左移（Shift-Left）與雙向追溯（Traceability），不是最後才補測試。[ASE-002，PDF p.17–21] 左側開發層級 右側測試層級 要確認什麼 User Requirements 使用者需求 Acceptance Testing 驗收測試 是否達成使用者要求 System Requirements 系統規格 System Testing 系統測試 整體系統是否符合規格 Architecture Design 架構設計 Integration Testing 整合測試 子系統介面與協作是否正確 Detailed / Module Design 詳細設計 Unit Testing 單元測試 個別模組是否符合設計 來源：[ASE-002，PDF p.19]。 圖題提醒 ：PDF p.18 的簡化圖把層級合併，分享對話的範例也把架構對應測試寫成 Integration \u0026 System Testing。作答時先看該圖的層級切分；詳細四層版按上表，不要只靠某一個選項字面。 模型 適合情境 主要代價 Waterfall 需求穩定、需明確階段工件 後期變更與整合昂貴 V-Model 重視安全、驗證追溯與審查 前期規格及測試規劃成本高 增量／疊代 需要早期可用成果與回饋 需管理架構演化與整合品質 來源：[ASE-002，PDF p.14–23、25–30]。安全關鍵也不等於完全不能疊代；本課案例重點是嚴謹驗證與追溯。 2.3 增量、疊代與 MVP 比較 Incremental 增量 Iterative 疊代 主要改變 擴大功能範圍 反覆修正與精煉 自編例 先可查課，再加選，再退選 查課先純文字，再改善篩選與速度 提問方式 這次多交付什麼？ 這次把什麼做得更準、更好？ 來源：[ASE-002，PDF p.25–33]。兩者可以同時使用。 垂直切片（Vertical Slicing） 是一項功能貫穿 UI、邏輯與資料，使它可端到端驗證；先做完所有 DB、再 API、最後 UI，是水平分層，早期未必能給使用者價值。 MVP（Minimum Viable Product） 的目的，是以最小投入驗證核心假設與取得真實回饋，不是單純少做功能，也不是犧牲必要安全。滑板可以立即代步，單一車輪卻不能驗證代步體驗。雕塑從粗輪廓到細節，則幫助理解疊代精煉。[ASE-002，PDF p.26–34] 2.4 敏捷宣言 更重視 相較於 Individuals and Interactions 個人與互動 Processes and Tools 流程與工具 Working Software 可運行軟體 Comprehensive Documentation 詳盡文件 Customer Collaboration 客戶合作 Contract Negotiation 合約協商 Responding to Change 回應變更 Following a Plan 遵循計畫 來源：[ASE-002，PDF p.39–43]。右側仍有價值；敏捷沒有取消規格、文件或計畫。十二原則可用四組理解：早期持續交付與接受變更、業務與開發協作、可持續步調與技術品質、簡約與定期反省。可運行軟體是進度的主要衡量，會議次數與文件頁數不是交付價值。[ASE-002，PDF p.42–44] 2.5 Scrum 與 Kanban Scrum 責任 角色 常見混淆 最大化價值、排序 Product Backlog Product Owner（PO） 不等於指定每項技術實作 協助流程有效運作、移除障礙 Scrum Master（SM） 不是產品優先級唯一決策者 規劃實作並交付符合品質的增量 Developers 不只是被動接單打字 來源：[ASE-002，PDF p.47–50]。 三個工件為 Product Backlog （產品待辦清單）、 Sprint Backlog （本衝刺目標相關工作與計畫）、 Increment （符合完成定義 DoD 的可用增量）。Sprint 是固定時間盒（Timebox）；講義以 1–4 週介紹。[ASE-002，PDF p.48–50] 事件 核心目的 Sprint Planning 規劃本輪目標、選擇與安排工作 Daily Scrum 開發者檢視朝目標的進展並調整計畫；15 分鐘 Sprint Review 檢視產品成果並取得利害關係人回饋 Sprint Retrospective 改善團隊協作與工程流程 來源：[ASE-002，PDF p.50]。 Review 看產品；Retrospective 看做事方式 。講義將 Sprint 內範疇描述為凍結，這裡保留為課內比較用語；精確實務規則的版本差異列待確認，不以此出「所有變更一律禁止」的客觀題。 Kanban 看板 強調連續流（Continuous Flow）與拉動（Pull）：下游有容量才拉新工作。 WIP = Work in Progress ；WIP Limit 限制同時進行的工作，讓團隊先完成舊工作、暴露瓶頸，減少多工切換。限制不是要求每人寫更少程式碼。[ASE-002，PDF p.51–55] 比較 Scrum Kanban 節奏 固定 Sprint 持續流動 角色 PO、SM、Developers 不強制 Scrum 角色 工作限制 Sprint 計畫與目標 明確 WIP 上限 常用觀察 Sprint 成果與改進 Lead Time、Cycle Time、瓶頸 來源：[ASE-002，PDF p.47–55]。 2.6–2.7 技術債與 XP Technical Debt 技術債 是今日省下的設計／實作品質成本，轉為未來每次理解、修改與除錯的額外負擔。「利息」是反覆付出的維護代價，不是雲端租金。 Flaccid Scrum 指只保留會議與看板等管理外殼，卻缺乏測試與重構的技術實踐。[ASE-002，PDF p.58–62] Extreme Programming（XP） 將良好工程實踐持續執行：測試先行、結對編程、簡單設計、重構、持續整合、小型發布與集體所有權。[ASE-002，PDF p.66–74] TDD 階段 要做的事 不應混淆 Red 先寫測試並確認因預期原因失敗 不是先寫完整實作 Green 寫最少實作使測試通過 不需一次完成所有未來功能 Refactor 維持測試通過，改善內部結構 不改外部可觀察行為 來源：[ASE-002，PDF p.68–70]。測試提供回歸防護，但「全部通過」不構成所有需求皆正確的數學保證。 Pair Programming ：Driver 實際操作與編碼；Navigator 審查全局、邊界與設計，並交換角色。集體所有權降低只有單一人理解模組的風險（Bus Factor）。[ASE-002，PDF p.71–73] 2.8 DevOps 與 CI/CD DevOps 整合開發與維運責任，配合自動化與營運回饋。它不是只安裝某個部署工具。[ASE-002，PDF p.77–81] 實踐 英文 主要特徵 持續整合 Continuous Integration 頻繁整合並自動建置、測試 持續交付 Continuous Delivery 通過驗證後保持可發布；發布可保留人工決策 持續部署 Continuous Deployment 通過關卡後自動發布至正式環境 來源：[ASE-002，PDF p.78–82]。 IaC（Infrastructure as Code） 以可版本控制的描述管理環境，降低設定漂移；可觀測性的三個常見面向是 Metrics、Logs、Traces 。自動化降低風險，不代表環境必然百分之百相同或發布永遠零故障。[ASE-002，PDF p.81；後句為整理提醒] 2.9 規格驅動 AI 與 Harness Engineering Harness 指包圍模型的規格、權限邊界、執行環境與驗證機制。講義分為上游規格導軌（Context \u0026 Spec Rails）、隔離執行沙盒（Execution Sandbox）、下游驗證守門員（Verification Gatekeepers）。[ASE-002，PDF p.85–91] 工作迴路為：人定規格 → AI 實作 → 編譯、靜態分析與測試 → 失敗則修正 → 人工審查。提示詞不能代替確定性工具檢查；工具檢查也不能代替對規格與測試設計的人工判斷。 手寫回答策略 遇到流程選型題，寫「情境特性 → 模型 → 關鍵機制 → 代價」。例如：需求穩定且須嚴格追溯的系統，可選 V-Model，因為能早期規劃與追溯各層測試；代價是前期文件及變更成本。這比只寫「醫療所以 V-Model」更完整。[ASE-002，PDF p.20–23；答題架構為自編] 來源與延伸 ASE-002 原始講義 。 本章測驗 · 課程首頁 "}, {"id": "courses/advanced-software-engineering/lessons/chapter-03", "path": "/ase/lessons/3", "title": "第三章｜需求工程", "short": "需求工程", "desc": "分類、擷取與需求驗證", "courseId": "advanced-software-engineering", "sectionId": "lessons", "kind": "lesson", "status": "needs-review", "source": "ASE-003", "pages": 71, "questions": [], "trackReading": true, "metadata": {"id": "ASE-CH03", "title": "第三章｜需求工程", "course": "advanced-software-engineering", "type": "lesson", "status": "needs-review", "created": "2026-11-06", "updated": "2026-11-06", "sources": ["ASE-003"], "tags": ["期中複習", "第3章"]}, "file": "slide03t_reqt.pdf", "readKey": "3", "quizKey": "courses/advanced-software-engineering/lessons/chapter-03", "recordChapter": "courses/advanced-software-engineering/lessons/chapter-03", "lessonPath": "/ase/lessons/3", "html": "\u003ch1\u003e第三章｜需求工程\u003c/h1\u003e\n\u003cblockquote\u003e\n\u003cp\u003e依講義重新整理；頁碼一律指 PDF 頁次。例子標為自編；整理稿尚待使用者複核。\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003ch2 id=\"p-c27a7de52074-s1\"\u003e本章主線：把期望變成能驗收的規格\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eRequirements Engineering（RE）需求工程\u003c/strong\u003e把利害關係人要的服務與限制，轉為可理解、可協商、可實作及可驗證的描述。越晚發現需求錯誤，越可能重做架構、程式、測試與部署。講義的 100 倍曲線用來強調晚改的代價，本頁不把該倍率當所有專案通則。[ASE-003，PDF p.5–9、54、59]\u003c/p\u003e\n\u003ch2 id=\"p-c27a7de52074-s2\"\u003e3.1 需求層次與分類是兩個問題\u003c/h2\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e層次\u003c/th\u003e\n\u003cth\u003e讀者與重點\u003c/th\u003e\n\u003cth\u003e自編例\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003eUser Requirements 使用者需求\u003c/td\u003e\n\u003ctd\u003e使用者／主管，較高階的服務意圖\u003c/td\u003e\n\u003ctd\u003e學生可以查詢可加選課程\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eSystem Requirements 系統需求\u003c/td\u003e\n\u003ctd\u003e開發與測試人員，精確行為與限制\u003c/td\u003e\n\u003ctd\u003e查詢依課號回傳班級、時段與剩餘名額\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e來源：[ASE-003，PDF p.8–11]。分享對話中的 Business → User → System 是\u003cstrong\u003e抽象層級\u003c/strong\u003e的題型；Business 表達組織目標。此延伸用來理解範例，不要將它與下方「功能／非功能／領域」混成同一分類。[EXAM-001，分享對話試題23；ASE-003，PDF p.8–9]\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e類型\u003c/th\u003e\n\u003cth\u003e問的是什麼？\u003c/th\u003e\n\u003cth\u003e自編例\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003eFunctional Requirement（FR）功能性需求\u003c/td\u003e\n\u003ctd\u003e系統提供什麼服務或反應？\u003c/td\u003e\n\u003ctd\u003e系統可在學生加選時檢查先修資格\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eNon-Functional Requirement（NFR）非功能性需求\u003c/td\u003e\n\u003ctd\u003e品質、流程或其他限制？\u003c/td\u003e\n\u003ctd\u003e在指定負載下，95% 查詢兩秒內完成\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eDomain Requirement 領域需求\u003c/td\u003e\n\u003ctd\u003e哪些要求來自業務、環境或規範？\u003c/td\u003e\n\u003ctd\u003e學校規定未通過先修不得加選\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e來源：[ASE-003，PDF p.8、15–18、20]。領域需求描述\u003cstrong\u003e來源與背景\u003c/strong\u003e，可能落實為功能或非功能限制；判讀時不要只因出現數字就說一定是 NFR。上表門檻為自編示例。\u003c/p\u003e\n\u003ch2 id=\"p-c27a7de52074-s3\"\u003e3.2 利害關係人與衝突\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eStakeholder\u003c/strong\u003e 不只使用者，還包含管理者、維運、安全、外部監管與其他受系統影響的人。訂餐消費者想隨時取消、餐廳想確保已備餐能獲補償，必須協商條件與責任，而不是兩句都照收。[ASE-003，PDF p.13–16]\u003c/p\u003e\n\u003cp\u003e常見需求問題有：語意模糊（取消是否代表退款？）、完整性不足（漏了付款失敗）、一致性不足（同一情境同時允許及禁止）。解法是釐清名詞、條件、例外與優先順序，持續精煉，而非期待第一次訪談就完美。[ASE-003，PDF p.16、33–34]\u003c/p\u003e\n\u003ch2 id=\"p-c27a7de52074-s4\"\u003e3.3 非功能性需求三大家族\u003c/h2\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e家族\u003c/th\u003e\n\u003cth\u003e英文\u003c/th\u003e\n\u003cth\u003e辨識線索\u003c/th\u003e\n\u003cth\u003e自編例\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e產品需求\u003c/td\u003e\n\u003ctd\u003eProduct\u003c/td\u003e\n\u003ctd\u003e交付產品的品質\u003c/td\u003e\n\u003ctd\u003e查課延遲、可用率\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e組織需求\u003c/td\u003e\n\u003ctd\u003eOrganizational\u003c/td\u003e\n\u003ctd\u003e組織內部政策與開發規範\u003c/td\u003e\n\u003ctd\u003e公司要求所有變更經 PR 審查\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e外部需求\u003c/td\u003e\n\u003ctd\u003eExternal\u003c/td\u003e\n\u003ctd\u003e法規、監管、外部環境與倫理\u003c/td\u003e\n\u003ctd\u003e題目要求符合 HIPAA 隱私規範\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e來源：[ASE-003，PDF p.22–24]。\u003cstrong\u003e判斷關鍵是要求的來源\u003c/strong\u003e：題目明說「法律規定」，優先辨識 External；不能因它談安全就只回答 Product。這是課堂分類練習，不提供實際法律合規判斷。\u003c/p\u003e\n\u003ch2 id=\"p-c27a7de52074-s5\"\u003e3.3 延伸：將 Goal 寫成可驗證 NFR\u003c/h2\u003e\n\u003cp\u003e「系統很快、很好用」是目標（Goal），尚缺測量方法。可驗收陳述至少交代\u003cstrong\u003e對象／情境、負載或資料量、測量指標、門檻與觀察期間\u003c/strong\u003e。[ASE-003，PDF p.25–28；欄位清單為整理]\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e模糊目標\u003c/th\u003e\n\u003cth\u003e自編可測試示例\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e查詢要快\u003c/td\u003e\n\u003ctd\u003e於 100 名同時使用者、指定測試網路下，95% 查課請求兩秒內收到完整結果\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e系統穩定\u003c/td\u003e\n\u003ctd\u003e以每分鐘探測核心 API 計算，月服務可用率至少 99.9%；維護排除時段需另外定義\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e容易學\u003c/td\u003e\n\u003ctd\u003e首次使用者接受 20 分鐘教學後，至少 90% 能在五分鐘內完成查詢與加選任務\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e以上數值皆為自編，不是教師指定標準。只寫 p95 而未定測量邊界，或只寫可用率卻未定計算方式，仍可能產生驗收爭議。\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e品質\u003c/th\u003e\n\u003cth\u003e英文指標\u003c/th\u003e\n\u003cth\u003e用途\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e速度\u003c/td\u003e\n\u003ctd\u003eTPS、p95 / p99 Latency\u003c/td\u003e\n\u003ctd\u003e每秒交易量、延遲分布\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e容量\u003c/td\u003e\n\u003ctd\u003eRAM / Disk usage\u003c/td\u003e\n\u003ctd\u003e記憶體與儲存占用\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e易用性\u003c/td\u003e\n\u003ctd\u003eTraining time、錯誤／求助次數\u003c/td\u003e\n\u003ctd\u003e學習與操作負擔\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e可靠性\u003c/td\u003e\n\u003ctd\u003eMTBF、Availability\u003c/td\u003e\n\u003ctd\u003e故障間隔與可用程度\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e恢復能力\u003c/td\u003e\n\u003ctd\u003eMTTR\u003c/td\u003e\n\u003ctd\u003e故障後恢復所需時間\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e可移植性\u003c/td\u003e\n\u003ctd\u003e支援平台數、平台相依程式比例\u003c/td\u003e\n\u003ctd\u003e換環境所需調整\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e來源：[ASE-003，PDF p.27]。指標不能互換：高 TPS 不等同低延遲；MTBF 與 MTTR 分別關心故障間隔與修復時間。\u003c/p\u003e\n\u003ch2 id=\"p-c27a7de52074-s6\"\u003e3.4 需求擷取與分析\u003c/h2\u003e\n\u003cp\u003e需求工程包含 Elicitation \u0026amp; Analysis、Specification、Validation、Management，四者交織疊代。不要與「四種擷取技術」混背。[ASE-003，PDF p.34–35]\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e技術\u003c/th\u003e\n\u003cth\u003e最能取得什麼？\u003c/th\u003e\n\u003cth\u003e限制與適用判斷\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003eInterviews 訪談\u003c/td\u003e\n\u003ctd\u003e目標、理由、主觀痛點\u003c/td\u003e\n\u003ctd\u003e可能說不出習以為常的操作\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eWorkshops / JAD 工作坊\u003c/td\u003e\n\u003ctd\u003e多方協商與共識\u003c/td\u003e\n\u003ctd\u003e要防少數人壟斷發言\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eEthnography 民族誌／現場觀察\u003c/td\u003e\n\u003ctd\u003e內隱知識、實際工作與非正式捷徑\u003c/td\u003e\n\u003ctd\u003e花時間，須觀察真實脈絡\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eScenarios / Stories / Storyboards\u003c/td\u003e\n\u003ctd\u003e具體旅程、正常與例外路徑\u003c/td\u003e\n\u003ctd\u003e不可因此漏掉全系統 NFR\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eDocument Analysis 文件分析\u003c/td\u003e\n\u003ctd\u003eSOP、舊系統、表單的業務規則\u003c/td\u003e\n\u003ctd\u003e舊規格可能已過時\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e來源：[ASE-003，PDF p.36–43]。講義將訪談與工作坊合為一類，故圖上稱四種技術，本表為比較拆成五列。\u003c/p\u003e\n\u003cp\u003e訪談要問「為什麼需要這件事」；客戶說想用區塊鏈，先探究是否真正需要防竄改與稽核。\u003cstrong\u003e5 Whys\u003c/strong\u003e 是深入原因的手法。觀察則回答「他實際如何工作」：這是 Ethnography 能補足訪談的地方。[ASE-003，PDF p.37–38、44–45]\u003c/p\u003e\n\u003ch2 id=\"p-c27a7de52074-s7\"\u003e3.4 延伸：從故事到使用案例\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eUser Story\u003c/strong\u003e 常用「身為某角色，我想要某能力，以便達成某價值」；\u003cstrong\u003eGiven–When–Then\u003c/strong\u003e 把情境、事件與可觀察結果連起來。它不是只把句子分三行，Then 必須可判定。[ASE-003，PDF p.39]\u003c/p\u003e\n\u003cp\u003e自編例：Given 學生在選課時段內且已修畢先修；When 申請仍有名額且不衝堂的課程；Then 系統新增選課紀錄並將名額減一。另須補名額已滿、重複送出等例外。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eScenario\u003c/strong\u003e 是一次具體執行路徑；\u003cstrong\u003eUse Case\u003c/strong\u003e 統整同一目標的成功、替代與例外情境。圖只顯示參與者、功能與關係，文字規格還要有前置條件、後置條件、主要流程與例外。[ASE-003，PDF p.46–51]\u003c/p\u003e\n\u003cp\u003eActor 位於系統外；Use Case 用橢圓；System Boundary 用矩形。必要共用功能用 include，條件式擴充用 extend，箭頭詳見第四章。[ASE-003，PDF p.47–50]\u003c/p\u003e\n\u003ch2 id=\"p-c27a7de52074-s8\"\u003e3.5 五項需求檢查\u003c/h2\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e檢查\u003c/th\u003e\n\u003cth\u003e英文\u003c/th\u003e\n\u003cth\u003e要問的問題\u003c/th\u003e\n\u003cth\u003e自編錯誤例\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e有效性\u003c/td\u003e\n\u003ctd\u003eValidity\u003c/td\u003e\n\u003ctd\u003e是真正需要的功能嗎？\u003c/td\u003e\n\u003ctd\u003e給醫師做用不到的排班報表\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e一致性\u003c/td\u003e\n\u003ctd\u003eConsistency\u003c/td\u003e\n\u003ctd\u003e條文互相矛盾嗎？\u003c/td\u003e\n\u003ctd\u003e同一時間可取消也不可取消\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e完整性\u003c/td\u003e\n\u003ctd\u003eCompleteness\u003c/td\u003e\n\u003ctd\u003e漏了服務、限制或例外嗎？\u003c/td\u003e\n\u003ctd\u003e沒定義扣款失敗\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e現實性／可行性\u003c/td\u003e\n\u003ctd\u003eRealism\u003c/td\u003e\n\u003ctd\u003e資源與技術上做得到嗎？\u003c/td\u003e\n\u003ctd\u003e有限預算卻要求不可能期限\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e可驗證性\u003c/td\u003e\n\u003ctd\u003eVerifiability\u003c/td\u003e\n\u003ctd\u003e能客觀判定通過嗎？\u003c/td\u003e\n\u003ctd\u003e只寫「超級順暢」\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e來源：[ASE-003，PDF p.54–56]。\u003cstrong\u003e條文衝突選 Consistency；漏情況選 Completeness；不可測選 Verifiability\u003c/strong\u003e。一段需求可能同時有多個問題，單選題需辨認其指定焦點。\u003c/p\u003e\n\u003ch2 id=\"p-c27a7de52074-s9\"\u003e3.5 延伸：追溯與變更管理\u003c/h2\u003e\n\u003cp\u003e為需求建立唯一 ID，連到設計元件、程式與測試。\u003cstrong\u003eRTM（Requirements Traceability Matrix）\u003c/strong\u003e可回答「這項需求由哪些測試驗證？」與「改這條需求會影響什麼？」。變更先做 Impact Analysis，再評估成本與核准，並同步修改相依工件。[ASE-003，PDF p.57–59]\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e自編需求 ID\u003c/th\u003e\n\u003cth\u003e設計／實作\u003c/th\u003e\n\u003cth\u003e測試\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003eFR-01 查課\u003c/td\u003e\n\u003ctd\u003eCourseQueryService\u003c/td\u003e\n\u003ctd\u003eTC-01 有結果；TC-02 無結果\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eNFR-01 查詢延遲\u003c/td\u003e\n\u003ctd\u003e查詢與快取架構\u003c/td\u003e\n\u003ctd\u003ePERF-01 指定負載測試\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e這是示例追溯表，不代表已開發或測試系統。\u003c/p\u003e\n\u003ch2 id=\"p-c27a7de52074-s10\"\u003e3.6 AI 輔助需求工程\u003c/h2\u003e\n\u003cp\u003eAI 可草擬故事、檢查歧義與衝突、建議追溯關係、模擬利害關係人。\u003cstrong\u003eHuman-in-the-Loop\u003c/strong\u003e 要求人類確認業務規則、例外、法規與資料隱私；模擬訪談不等於真的訪談。語意相似的連結也不等同已證明需求覆蓋。[ASE-003，PDF p.61–68]\u003c/p\u003e\n\u003ch2 id=\"p-c27a7de52074-s11\"\u003e期中手寫練習重點\u003c/h2\u003e\n\u003cp\u003e給定系統時，先寫 FR，再寫有情境與門檻的 NFR；指出領域規則來源；用五項檢查找缺陷；提出適合的擷取技術與理由。每題應能說出判斷依據，避免只抄英文名詞。\u003c/p\u003e\n\u003ch2 id=\"p-c27a7de52074-s12\"\u003e來源與延伸\u003c/h2\u003e\n\u003cp\u003e\u003ca href=\"#/sources\" title=\"原始教材保存在專案 raw 資料夾\"\u003eASE-003 原始講義\u003c/a\u003e。\u003c/p\u003e\n\u003cp\u003e\u003ca href=\"#/ase/tests/3\"\u003e本章測驗\u003c/a\u003e · \u003ca href=\"#/ase\"\u003e課程首頁\u003c/a\u003e\u003c/p\u003e", "text": "# 第三章｜需求工程\n\n\u003e 依講義重新整理；頁碼一律指 PDF 頁次。例子標為自編；整理稿尚待使用者複核。\n\n## 本章主線：把期望變成能驗收的規格\n\n**Requirements Engineering（RE）需求工程**把利害關係人要的服務與限制，轉為可理解、可協商、可實作及可驗證的描述。越晚發現需求錯誤，越可能重做架構、程式、測試與部署。講義的 100 倍曲線用來強調晚改的代價，本頁不把該倍率當所有專案通則。[ASE-003，PDF p.5–9、54、59]\n\n## 3.1 需求層次與分類是兩個問題\n\n| 層次 | 讀者與重點 | 自編例 |\n| --- | --- | --- |\n| User Requirements 使用者需求 | 使用者／主管，較高階的服務意圖 | 學生可以查詢可加選課程 |\n| System Requirements 系統需求 | 開發與測試人員，精確行為與限制 | 查詢依課號回傳班級、時段與剩餘名額 |\n\n來源：[ASE-003，PDF p.8–11]。分享對話中的 Business → User → System 是**抽象層級**的題型；Business 表達組織目標。此延伸用來理解範例，不要將它與下方「功能／非功能／領域」混成同一分類。[EXAM-001，分享對話試題23；ASE-003，PDF p.8–9]\n\n| 類型 | 問的是什麼？ | 自編例 |\n| --- | --- | --- |\n| Functional Requirement（FR）功能性需求 | 系統提供什麼服務或反應？ | 系統可在學生加選時檢查先修資格 |\n| Non-Functional Requirement（NFR）非功能性需求 | 品質、流程或其他限制？ | 在指定負載下，95% 查詢兩秒內完成 |\n| Domain Requirement 領域需求 | 哪些要求來自業務、環境或規範？ | 學校規定未通過先修不得加選 |\n\n來源：[ASE-003，PDF p.8、15–18、20]。領域需求描述**來源與背景**，可能落實為功能或非功能限制；判讀時不要只因出現數字就說一定是 NFR。上表門檻為自編示例。\n\n## 3.2 利害關係人與衝突\n\n**Stakeholder** 不只使用者，還包含管理者、維運、安全、外部監管與其他受系統影響的人。訂餐消費者想隨時取消、餐廳想確保已備餐能獲補償，必須協商條件與責任，而不是兩句都照收。[ASE-003，PDF p.13–16]\n\n常見需求問題有：語意模糊（取消是否代表退款？）、完整性不足（漏了付款失敗）、一致性不足（同一情境同時允許及禁止）。解法是釐清名詞、條件、例外與優先順序，持續精煉，而非期待第一次訪談就完美。[ASE-003，PDF p.16、33–34]\n\n## 3.3 非功能性需求三大家族\n\n| 家族 | 英文 | 辨識線索 | 自編例 |\n| --- | --- | --- | --- |\n| 產品需求 | Product | 交付產品的品質 | 查課延遲、可用率 |\n| 組織需求 | Organizational | 組織內部政策與開發規範 | 公司要求所有變更經 PR 審查 |\n| 外部需求 | External | 法規、監管、外部環境與倫理 | 題目要求符合 HIPAA 隱私規範 |\n\n來源：[ASE-003，PDF p.22–24]。**判斷關鍵是要求的來源**：題目明說「法律規定」，優先辨識 External；不能因它談安全就只回答 Product。這是課堂分類練習，不提供實際法律合規判斷。\n\n## 3.3 延伸：將 Goal 寫成可驗證 NFR\n\n「系統很快、很好用」是目標（Goal），尚缺測量方法。可驗收陳述至少交代**對象／情境、負載或資料量、測量指標、門檻與觀察期間**。[ASE-003，PDF p.25–28；欄位清單為整理]\n\n| 模糊目標 | 自編可測試示例 |\n| --- | --- |\n| 查詢要快 | 於 100 名同時使用者、指定測試網路下，95% 查課請求兩秒內收到完整結果 |\n| 系統穩定 | 以每分鐘探測核心 API 計算，月服務可用率至少 99.9%；維護排除時段需另外定義 |\n| 容易學 | 首次使用者接受 20 分鐘教學後，至少 90% 能在五分鐘內完成查詢與加選任務 |\n\n以上數值皆為自編，不是教師指定標準。只寫 p95 而未定測量邊界，或只寫可用率卻未定計算方式，仍可能產生驗收爭議。\n\n| 品質 | 英文指標 | 用途 |\n| --- | --- | --- |\n| 速度 | TPS、p95 / p99 Latency | 每秒交易量、延遲分布 |\n| 容量 | RAM / Disk usage | 記憶體與儲存占用 |\n| 易用性 | Training time、錯誤／求助次數 | 學習與操作負擔 |\n| 可靠性 | MTBF、Availability | 故障間隔與可用程度 |\n| 恢復能力 | MTTR | 故障後恢復所需時間 |\n| 可移植性 | 支援平台數、平台相依程式比例 | 換環境所需調整 |\n\n來源：[ASE-003，PDF p.27]。指標不能互換：高 TPS 不等同低延遲；MTBF 與 MTTR 分別關心故障間隔與修復時間。\n\n## 3.4 需求擷取與分析\n\n需求工程包含 Elicitation \u0026 Analysis、Specification、Validation、Management，四者交織疊代。不要與「四種擷取技術」混背。[ASE-003，PDF p.34–35]\n\n| 技術 | 最能取得什麼？ | 限制與適用判斷 |\n| --- | --- | --- |\n| Interviews 訪談 | 目標、理由、主觀痛點 | 可能說不出習以為常的操作 |\n| Workshops / JAD 工作坊 | 多方協商與共識 | 要防少數人壟斷發言 |\n| Ethnography 民族誌／現場觀察 | 內隱知識、實際工作與非正式捷徑 | 花時間，須觀察真實脈絡 |\n| Scenarios / Stories / Storyboards | 具體旅程、正常與例外路徑 | 不可因此漏掉全系統 NFR |\n| Document Analysis 文件分析 | SOP、舊系統、表單的業務規則 | 舊規格可能已過時 |\n\n來源：[ASE-003，PDF p.36–43]。講義將訪談與工作坊合為一類，故圖上稱四種技術，本表為比較拆成五列。\n\n訪談要問「為什麼需要這件事」；客戶說想用區塊鏈，先探究是否真正需要防竄改與稽核。**5 Whys** 是深入原因的手法。觀察則回答「他實際如何工作」：這是 Ethnography 能補足訪談的地方。[ASE-003，PDF p.37–38、44–45]\n\n## 3.4 延伸：從故事到使用案例\n\n**User Story** 常用「身為某角色，我想要某能力，以便達成某價值」；**Given–When–Then** 把情境、事件與可觀察結果連起來。它不是只把句子分三行，Then 必須可判定。[ASE-003，PDF p.39]\n\n自編例：Given 學生在選課時段內且已修畢先修；When 申請仍有名額且不衝堂的課程；Then 系統新增選課紀錄並將名額減一。另須補名額已滿、重複送出等例外。\n\n**Scenario** 是一次具體執行路徑；**Use Case** 統整同一目標的成功、替代與例外情境。圖只顯示參與者、功能與關係，文字規格還要有前置條件、後置條件、主要流程與例外。[ASE-003，PDF p.46–51]\n\nActor 位於系統外；Use Case 用橢圓；System Boundary 用矩形。必要共用功能用 include，條件式擴充用 extend，箭頭詳見第四章。[ASE-003，PDF p.47–50]\n\n## 3.5 五項需求檢查\n\n| 檢查 | 英文 | 要問的問題 | 自編錯誤例 |\n| --- | --- | --- | --- |\n| 有效性 | Validity | 是真正需要的功能嗎？ | 給醫師做用不到的排班報表 |\n| 一致性 | Consistency | 條文互相矛盾嗎？ | 同一時間可取消也不可取消 |\n| 完整性 | Completeness | 漏了服務、限制或例外嗎？ | 沒定義扣款失敗 |\n| 現實性／可行性 | Realism | 資源與技術上做得到嗎？ | 有限預算卻要求不可能期限 |\n| 可驗證性 | Verifiability | 能客觀判定通過嗎？ | 只寫「超級順暢」 |\n\n來源：[ASE-003，PDF p.54–56]。**條文衝突選 Consistency；漏情況選 Completeness；不可測選 Verifiability**。一段需求可能同時有多個問題，單選題需辨認其指定焦點。\n\n## 3.5 延伸：追溯與變更管理\n\n為需求建立唯一 ID，連到設計元件、程式與測試。**RTM（Requirements Traceability Matrix）**可回答「這項需求由哪些測試驗證？」與「改這條需求會影響什麼？」。變更先做 Impact Analysis，再評估成本與核准，並同步修改相依工件。[ASE-003，PDF p.57–59]\n\n| 自編需求 ID | 設計／實作 | 測試 |\n| --- | --- | --- |\n| FR-01 查課 | CourseQueryService | TC-01 有結果；TC-02 無結果 |\n| NFR-01 查詢延遲 | 查詢與快取架構 | PERF-01 指定負載測試 |\n\n這是示例追溯表，不代表已開發或測試系統。\n\n## 3.6 AI 輔助需求工程\n\nAI 可草擬故事、檢查歧義與衝突、建議追溯關係、模擬利害關係人。**Human-in-the-Loop** 要求人類確認業務規則、例外、法規與資料隱私；模擬訪談不等於真的訪談。語意相似的連結也不等同已證明需求覆蓋。[ASE-003，PDF p.61–68]\n\n## 期中手寫練習重點\n\n給定系統時，先寫 FR，再寫有情境與門檻的 NFR；指出領域規則來源；用五項檢查找缺陷；提出適合的擷取技術與理由。每題應能說出判斷依據，避免只抄英文名詞。\n\n\n## 來源與延伸\n\n[ASE-003 原始講義](../../../../raw/advanced-software-engineering/lectures/slide03t_reqt.pdf)。\n\n[本章測驗](../reviews/chapter-03.md) · [課程首頁](../index.md)\n", "headings": [{"id": "p-c27a7de52074-s1", "text": "本章主線：把期望變成能驗收的規格"}, {"id": "p-c27a7de52074-s2", "text": "3.1 需求層次與分類是兩個問題"}, {"id": "p-c27a7de52074-s3", "text": "3.2 利害關係人與衝突"}, {"id": "p-c27a7de52074-s4", "text": "3.3 非功能性需求三大家族"}, {"id": "p-c27a7de52074-s5", "text": "3.3 延伸：將 Goal 寫成可驗證 NFR"}, {"id": "p-c27a7de52074-s6", "text": "3.4 需求擷取與分析"}, {"id": "p-c27a7de52074-s7", "text": "3.4 延伸：從故事到使用案例"}, {"id": "p-c27a7de52074-s8", "text": "3.5 五項需求檢查"}, {"id": "p-c27a7de52074-s9", "text": "3.5 延伸：追溯與變更管理"}, {"id": "p-c27a7de52074-s10", "text": "3.6 AI 輔助需求工程"}, {"id": "p-c27a7de52074-s11", "text": "期中手寫練習重點"}, {"id": "p-c27a7de52074-s12", "text": "來源與延伸"}], "sectionCount": 12, "searchText": "第三章｜需求工程 依講義重新整理；頁碼一律指 PDF 頁次。例子標為自編；整理稿尚待使用者複核。 本章主線：把期望變成能驗收的規格 Requirements Engineering（RE）需求工程 把利害關係人要的服務與限制，轉為可理解、可協商、可實作及可驗證的描述。越晚發現需求錯誤，越可能重做架構、程式、測試與部署。講義的 100 倍曲線用來強調晚改的代價，本頁不把該倍率當所有專案通則。[ASE-003，PDF p.5–9、54、59] 3.1 需求層次與分類是兩個問題 層次 讀者與重點 自編例 User Requirements 使用者需求 使用者／主管，較高階的服務意圖 學生可以查詢可加選課程 System Requirements 系統需求 開發與測試人員，精確行為與限制 查詢依課號回傳班級、時段與剩餘名額 來源：[ASE-003，PDF p.8–11]。分享對話中的 Business → User → System 是 抽象層級 的題型；Business 表達組織目標。此延伸用來理解範例，不要將它與下方「功能／非功能／領域」混成同一分類。[EXAM-001，分享對話試題23；ASE-003，PDF p.8–9] 類型 問的是什麼？ 自編例 Functional Requirement（FR）功能性需求 系統提供什麼服務或反應？ 系統可在學生加選時檢查先修資格 Non-Functional Requirement（NFR）非功能性需求 品質、流程或其他限制？ 在指定負載下，95% 查詢兩秒內完成 Domain Requirement 領域需求 哪些要求來自業務、環境或規範？ 學校規定未通過先修不得加選 來源：[ASE-003，PDF p.8、15–18、20]。領域需求描述 來源與背景 ，可能落實為功能或非功能限制；判讀時不要只因出現數字就說一定是 NFR。上表門檻為自編示例。 3.2 利害關係人與衝突 Stakeholder 不只使用者，還包含管理者、維運、安全、外部監管與其他受系統影響的人。訂餐消費者想隨時取消、餐廳想確保已備餐能獲補償，必須協商條件與責任，而不是兩句都照收。[ASE-003，PDF p.13–16] 常見需求問題有：語意模糊（取消是否代表退款？）、完整性不足（漏了付款失敗）、一致性不足（同一情境同時允許及禁止）。解法是釐清名詞、條件、例外與優先順序，持續精煉，而非期待第一次訪談就完美。[ASE-003，PDF p.16、33–34] 3.3 非功能性需求三大家族 家族 英文 辨識線索 自編例 產品需求 Product 交付產品的品質 查課延遲、可用率 組織需求 Organizational 組織內部政策與開發規範 公司要求所有變更經 PR 審查 外部需求 External 法規、監管、外部環境與倫理 題目要求符合 HIPAA 隱私規範 來源：[ASE-003，PDF p.22–24]。 判斷關鍵是要求的來源 ：題目明說「法律規定」，優先辨識 External；不能因它談安全就只回答 Product。這是課堂分類練習，不提供實際法律合規判斷。 3.3 延伸：將 Goal 寫成可驗證 NFR 「系統很快、很好用」是目標（Goal），尚缺測量方法。可驗收陳述至少交代 對象／情境、負載或資料量、測量指標、門檻與觀察期間 。[ASE-003，PDF p.25–28；欄位清單為整理] 模糊目標 自編可測試示例 查詢要快 於 100 名同時使用者、指定測試網路下，95% 查課請求兩秒內收到完整結果 系統穩定 以每分鐘探測核心 API 計算，月服務可用率至少 99.9%；維護排除時段需另外定義 容易學 首次使用者接受 20 分鐘教學後，至少 90% 能在五分鐘內完成查詢與加選任務 以上數值皆為自編，不是教師指定標準。只寫 p95 而未定測量邊界，或只寫可用率卻未定計算方式，仍可能產生驗收爭議。 品質 英文指標 用途 速度 TPS、p95 / p99 Latency 每秒交易量、延遲分布 容量 RAM / Disk usage 記憶體與儲存占用 易用性 Training time、錯誤／求助次數 學習與操作負擔 可靠性 MTBF、Availability 故障間隔與可用程度 恢復能力 MTTR 故障後恢復所需時間 可移植性 支援平台數、平台相依程式比例 換環境所需調整 來源：[ASE-003，PDF p.27]。指標不能互換：高 TPS 不等同低延遲；MTBF 與 MTTR 分別關心故障間隔與修復時間。 3.4 需求擷取與分析 需求工程包含 Elicitation \u0026 Analysis、Specification、Validation、Management，四者交織疊代。不要與「四種擷取技術」混背。[ASE-003，PDF p.34–35] 技術 最能取得什麼？ 限制與適用判斷 Interviews 訪談 目標、理由、主觀痛點 可能說不出習以為常的操作 Workshops / JAD 工作坊 多方協商與共識 要防少數人壟斷發言 Ethnography 民族誌／現場觀察 內隱知識、實際工作與非正式捷徑 花時間，須觀察真實脈絡 Scenarios / Stories / Storyboards 具體旅程、正常與例外路徑 不可因此漏掉全系統 NFR Document Analysis 文件分析 SOP、舊系統、表單的業務規則 舊規格可能已過時 來源：[ASE-003，PDF p.36–43]。講義將訪談與工作坊合為一類，故圖上稱四種技術，本表為比較拆成五列。 訪談要問「為什麼需要這件事」；客戶說想用區塊鏈，先探究是否真正需要防竄改與稽核。 5 Whys 是深入原因的手法。觀察則回答「他實際如何工作」：這是 Ethnography 能補足訪談的地方。[ASE-003，PDF p.37–38、44–45] 3.4 延伸：從故事到使用案例 User Story 常用「身為某角色，我想要某能力，以便達成某價值」； Given–When–Then 把情境、事件與可觀察結果連起來。它不是只把句子分三行，Then 必須可判定。[ASE-003，PDF p.39] 自編例：Given 學生在選課時段內且已修畢先修；When 申請仍有名額且不衝堂的課程；Then 系統新增選課紀錄並將名額減一。另須補名額已滿、重複送出等例外。 Scenario 是一次具體執行路徑； Use Case 統整同一目標的成功、替代與例外情境。圖只顯示參與者、功能與關係，文字規格還要有前置條件、後置條件、主要流程與例外。[ASE-003，PDF p.46–51] Actor 位於系統外；Use Case 用橢圓；System Boundary 用矩形。必要共用功能用 include，條件式擴充用 extend，箭頭詳見第四章。[ASE-003，PDF p.47–50] 3.5 五項需求檢查 檢查 英文 要問的問題 自編錯誤例 有效性 Validity 是真正需要的功能嗎？ 給醫師做用不到的排班報表 一致性 Consistency 條文互相矛盾嗎？ 同一時間可取消也不可取消 完整性 Completeness 漏了服務、限制或例外嗎？ 沒定義扣款失敗 現實性／可行性 Realism 資源與技術上做得到嗎？ 有限預算卻要求不可能期限 可驗證性 Verifiability 能客觀判定通過嗎？ 只寫「超級順暢」 來源：[ASE-003，PDF p.54–56]。 條文衝突選 Consistency；漏情況選 Completeness；不可測選 Verifiability 。一段需求可能同時有多個問題，單選題需辨認其指定焦點。 3.5 延伸：追溯與變更管理 為需求建立唯一 ID，連到設計元件、程式與測試。 RTM（Requirements Traceability Matrix） 可回答「這項需求由哪些測試驗證？」與「改這條需求會影響什麼？」。變更先做 Impact Analysis，再評估成本與核准，並同步修改相依工件。[ASE-003，PDF p.57–59] 自編需求 ID 設計／實作 測試 FR-01 查課 CourseQueryService TC-01 有結果；TC-02 無結果 NFR-01 查詢延遲 查詢與快取架構 PERF-01 指定負載測試 這是示例追溯表，不代表已開發或測試系統。 3.6 AI 輔助需求工程 AI 可草擬故事、檢查歧義與衝突、建議追溯關係、模擬利害關係人。 Human-in-the-Loop 要求人類確認業務規則、例外、法規與資料隱私；模擬訪談不等於真的訪談。語意相似的連結也不等同已證明需求覆蓋。[ASE-003，PDF p.61–68] 期中手寫練習重點 給定系統時，先寫 FR，再寫有情境與門檻的 NFR；指出領域規則來源；用五項檢查找缺陷；提出適合的擷取技術與理由。每題應能說出判斷依據，避免只抄英文名詞。 來源與延伸 ASE-003 原始講義 。 本章測驗 · 課程首頁 "}, {"id": "courses/advanced-software-engineering/lessons/chapter-04", "path": "/ase/lessons/4", "title": "第四章｜系統塑模與 UML", "short": "系統塑模與 UML", "desc": "模型用途、箭頭與圖表判讀", "courseId": "advanced-software-engineering", "sectionId": "lessons", "kind": "lesson", "status": "needs-review", "source": "ASE-004", "pages": 136, "questions": [], "trackReading": true, "metadata": {"id": "ASE-CH04", "title": "第四章｜系統塑模與 UML", "course": "advanced-software-engineering", "type": "lesson", "status": "needs-review", "created": "2026-11-06", "updated": "2026-11-06", "sources": ["ASE-004"], "tags": ["期中複習", "第4章"]}, "file": "slide04t_model.pdf", "readKey": "4", "quizKey": "courses/advanced-software-engineering/lessons/chapter-04", "recordChapter": "courses/advanced-software-engineering/lessons/chapter-04", "lessonPath": "/ase/lessons/4", "html": "\u003ch1\u003e第四章｜系統塑模與 UML\u003c/h1\u003e\n\u003cblockquote\u003e\n\u003cp\u003e依講義重新整理；頁碼一律指 PDF 頁次。例子標為自編；整理稿尚待使用者複核。\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003ch2 id=\"p-64c081b47509-s1\"\u003e4.1 先學會選圖，再背符號\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eSystem Modeling 系統塑模\u003c/strong\u003e以抽象模型描述系統的不同面向，隱藏當下不需要的細節。模型要服務溝通、檢查與實作；單一圖無法代表全部系統。[ASE-004，PDF p.4–8]\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e視角\u003c/th\u003e\n\u003cth\u003e英文\u003c/th\u003e\n\u003cth\u003e關心的問題\u003c/th\u003e\n\u003cth\u003e典型模型\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e外部\u003c/td\u003e\n\u003ctd\u003eExternal\u003c/td\u003e\n\u003ctd\u003e邊界及外部環境在哪？\u003c/td\u003e\n\u003ctd\u003e系統環境／邊界\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e互動\u003c/td\u003e\n\u003ctd\u003eInteraction\u003c/td\u003e\n\u003ctd\u003e誰與誰互動？\u003c/td\u003e\n\u003ctd\u003eUse Case、Sequence\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e結構\u003c/td\u003e\n\u003ctd\u003eStructural\u003c/td\u003e\n\u003ctd\u003e資料與類別如何組織？\u003c/td\u003e\n\u003ctd\u003eClass\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e行為\u003c/td\u003e\n\u003ctd\u003eBehavioral\u003c/td\u003e\n\u003ctd\u003e流程與事件反應如何運作？\u003c/td\u003e\n\u003ctd\u003eActivity、State Machine\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e來源：[ASE-004，PDF p.6–7]。四個分析視角與 UML 官方圖表分類是不同層次的說法；不要把所有動態圖一律當作同一個用途。\u003c/p\u003e\n\u003ch2 id=\"p-64c081b47509-s2\"\u003e4.2 UML 是語言，不是開發流程\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eUnified Modeling Language（UML）\u003c/strong\u003e統一模型記號以利溝通。講義將三位先驅的側重整理為 Jacobson（Use Case、OOSE、Why）、Rumbaugh（OMT、領域與資料、What）、Booch（設計與實作、How）。OMG 推動標準化。[ASE-004，PDF p.10–16]\u003c/p\u003e\n\u003ch2 id=\"p-64c081b47509-s3\"\u003e4.3 使用案例圖：角色要達成什麼\u003c/h2\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e元素\u003c/th\u003e\n\u003cth\u003e畫法\u003c/th\u003e\n\u003cth\u003e語意\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003eActor\u003c/td\u003e\n\u003ctd\u003e火柴人或角色標記，放邊界外\u003c/td\u003e\n\u003ctd\u003e外部人員角色或外部系統\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eUse Case\u003c/td\u003e\n\u003ctd\u003e橢圓，放邊界內\u003c/td\u003e\n\u003ctd\u003e能產生可觀察價值的功能目標\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eSystem Boundary\u003c/td\u003e\n\u003ctd\u003e矩形外框\u003c/td\u003e\n\u003ctd\u003e本系統負責的範圍\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eAssociation\u003c/td\u003e\n\u003ctd\u003e角色與案例間的實線\u003c/td\u003e\n\u003ctd\u003e參與互動，不代表資料流或時序\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e來源：[ASE-004，PDF p.18–26]。以「加選課程」「查詢課表」命名；「點擊送出」通常只是操作步驟。內部資料庫通常不是本系統外部 Actor；是否外部取決於先定義的邊界。\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e關係\u003c/th\u003e\n\u003cth\u003e使用時機\u003c/th\u003e\n\u003cth\u003e箭頭方向\u003c/th\u003e\n\u003cth\u003e線型\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003einclude\u003c/td\u003e\n\u003ctd\u003e基礎案例納入必要共用行為\u003c/td\u003e\n\u003ctd\u003e基礎案例指向被包含案例\u003c/td\u003e\n\u003ctd\u003e虛線開放箭頭，標 «include»\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eextend\u003c/td\u003e\n\u003ctd\u003e在擴充點、特定條件下加入行為\u003c/td\u003e\n\u003ctd\u003e擴充案例指向基礎案例\u003c/td\u003e\n\u003ctd\u003e虛線開放箭頭，標 «extend»\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eGeneralization\u003c/td\u003e\n\u003ctd\u003e特化角色／案例可視為一般者的一種\u003c/td\u003e\n\u003ctd\u003e子者指向父者\u003c/td\u003e\n\u003ctd\u003e實線空心三角\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e來源：[ASE-004，PDF p.20、24、28–31、126]。\u003cstrong\u003einclude 與 extend 都不能拿來畫步驟先後\u003c/strong\u003e。基礎案例不需依賴選用擴充即可有意義地執行。\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"自編使用案例例圖\" src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI4MTAiIGhlaWdodD0iNDEwIiB2aWV3Qm94PSIwIDAgODEwIDQxMCIgcm9sZT0iaW1nIiBhcmlhLWxhYmVsPSJ1c2UtY2FzZS5zdmciPjxkZWZzPjxtYXJrZXIgaWQ9ImFycm93IiB2aWV3Qm94PSIwIDAgMTAgMTAiIHJlZlg9IjkiIHJlZlk9IjUiIG1hcmtlcldpZHRoPSI3IiBtYXJrZXJIZWlnaHQ9IjciIG9yaWVudD0iYXV0by1zdGFydC1yZXZlcnNlIj48cGF0aCBkPSJNIDAgMCBMIDEwIDUgTCAwIDEwIHoiIGZpbGw9IiMzMTViNTMiLz48L21hcmtlcj48bWFya2VyIGlkPSJvcGVuIiB2aWV3Qm94PSIwIDAgMTAgMTAiIHJlZlg9IjkiIHJlZlk9IjUiIG1hcmtlcldpZHRoPSI4IiBtYXJrZXJIZWlnaHQ9IjgiIG9yaWVudD0iYXV0byI+PHBhdGggZD0i /td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e~\u003c/td\u003e\n\u003ctd\u003ePackage\u003c/td\u003e\n\u003ctd\u003e套件可見\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e來源：[ASE-004，PDF p.40、116]。具體程式語言的存取規則仍需按語言判讀。\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e關係\u003c/th\u003e\n\u003cth\u003e語意\u003c/th\u003e\n\u003cth\u003e線型與方向\u003c/th\u003e\n\u003cth\u003ePlantUML\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003eAssociation 關聯\u003c/td\u003e\n\u003ctd\u003e物件間結構性連結\u003c/td\u003e\n\u003ctd\u003e實線；可加導覽方向\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eA -- B\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eDependency 依賴\u003c/td\u003e\n\u003ctd\u003eA 使用 B\u003c/td\u003e\n\u003ctd\u003e虛線開放箭頭指向被依賴者 B\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eA ..\u0026gt; B\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eGeneralization 泛化／繼承\u003c/td\u003e\n\u003ctd\u003e子類別 is-a 父類別\u003c/td\u003e\n\u003ctd\u003e實線空心三角指向父類別\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eParent \u0026lt;|-- Child\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eRealization 實現\u003c/td\u003e\n\u003ctd\u003e類別實現介面契約\u003c/td\u003e\n\u003ctd\u003e虛線空心三角指向介面\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eInterface \u0026lt;|.. Implementation\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eAggregation 聚合\u003c/td\u003e\n\u003ctd\u003e較弱的整體／部分關係\u003c/td\u003e\n\u003ctd\u003e空心菱形在整體端\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eWhole o-- Part\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eComposition 組合\u003c/td\u003e\n\u003ctd\u003e部分受整體生命週期管理\u003c/td\u003e\n\u003ctd\u003e實心菱形在整體端\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eWhole *-- Part\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e來源：[ASE-004，PDF p.41–43、117]。\u003cstrong\u003e三角看父類別／介面；菱形看整體端\u003c/strong\u003e。部分可獨立存在，不代表一律必須用聚合；若只表示參照，一般關聯也可能更適合。講義例子中的選擇仍要看其題設。\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e重數\u003c/th\u003e\n\u003cth\u003e意義\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e1\u003c/td\u003e\n\u003ctd\u003e恰好一個\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e0..1\u003c/td\u003e\n\u003ctd\u003e可有可無，最多一個\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e* 或 0..*\u003c/td\u003e\n\u003ctd\u003e零到多個\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e1..*\u003c/td\u003e\n\u003ctd\u003e至少一個\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e2..5\u003c/td\u003e\n\u003ctd\u003e兩到五個\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e來源：[ASE-004，PDF p.44、51–52]。\u003cstrong\u003e讀靠近 B 端的數字，是一個 A 可連到幾個 B\u003c/strong\u003e。自編 \u003ccode\u003eCustomer \"1\" -- \"0..*\" Order\u003c/code\u003e：一位顧客可有零到多筆訂單；每筆訂單恰好對應一位顧客。\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"自編類別圖\" src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI4MTUiIGhlaWdodD0iMzQwIiB2aWV3Qm94PSIwIDAgODE1IDM0MCIgcm9sZT0iaW1nIiBhcmlhLWxhYmVsPSJjbGFzcy1tb2RlbC5zdmciPjxkZWZzPjxtYXJrZXIgaWQ9ImFycm93IiB2aWV3Qm94PSIwIDAgMTAgMTAiIHJlZlg9IjkiIHJlZlk9IjUiIG1hcmtlcldpZHRoPSI3IiBtYXJrZXJIZWlnaHQ9IjciIG9yaWVudD0iYXV0by1zdGFydC1yZXZlcnNlIj48cGF0aCBkPSJNIDAgMCBMIDEwIDUgTCAwIDEwIHoiIGZpbGw9IiMzMTViNTMiLz48L21hcmtlcj48bWFya2VyIGlkPSJvcGVuIiB2aWV3Qm94PSIwIDAgMTAgMTAiIHJlZlg9IjkiIHJlZlk9IjUiIG1hcmtlcldpZHRoPSI4IiBtYXJrZXJIZWlnaHQ9IjgiIG9yaWVudD0iYXV0byI+PHBhdGggZD0iTTEgMSBMOSA1IEwxIDkiIGZpbGw9Im5vbmUiIHN0cm9rZT0iIzMxNWI1MyIgc3Ryb2tlLXdpZHRoPSIxLjUiLz48L21hcmtlcj48bWFya2VyIGlkPSJkaWFtb25kIiB2aWV3Qm94PSIwIDAgMTYgMTIiIHJlZlg9IjAiIHJlZlk9IjYiIG1hcmtlcldpZHRoPSIxNCIgbWFya2VySGVpZ2h0PSIxMiIgb3JpZW e常見錯誤：把 has-a 畫成 is-a；把與整體獨立的實體畫成組合；漏兩端重數；將敏感屬性全部公開。組合的圖示是模型的生命週期規則，不會單憑畫圖就自動實作資料庫刪除行為。[ASE-004，PDF p.48–53；末句為整理提醒]\u003c/p\u003e\n\u003ch2 id=\"p-64c081b47509-s5\"\u003e4.5 循序圖：跨物件訊息時序\u003c/h2\u003e\n\u003cp\u003e時間由上向下；Lifeline 是參與者的生命線；Activation Bar 表示正在執行操作的期間。呼叫與回傳必須符合因果關係，例如持久化成功後才顯示成功。[ASE-004，PDF p.56–67]\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e訊息\u003c/th\u003e\n\u003cth\u003e視覺辨識\u003c/th\u003e\n\u003cth\u003ePlantUML\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e同步呼叫\u003c/td\u003e\n\u003ctd\u003e實線、實心箭頭；呼叫者等待\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eA -\u0026gt; B: request()\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e非同步訊號\u003c/td\u003e\n\u003ctd\u003e實線、開放箭頭；發送者不等完成\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eA -\u0026gt;\u0026gt; B: event\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e回傳\u003c/td\u003e\n\u003ctd\u003e虛線箭頭，回原呼叫端\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eB --\u0026gt; A: result\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e自呼叫\u003c/td\u003e\n\u003ctd\u003e箭頭折回自身生命線\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eA -\u0026gt; A: validate()\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e銷毀\u003c/td\u003e\n\u003ctd\u003e生命線結尾的 X\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003edestroy B\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e來源：[ASE-004，PDF p.60–61、68、118–119]。\u003cstrong\u003e虛線回傳不是非同步的判斷依據\u003c/strong\u003e；要連同線型、箭頭與上下文一起看。\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e片段\u003c/th\u003e\n\u003cth\u003e語意\u003c/th\u003e\n\u003cth\u003e對應邏輯\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003ealt\u003c/td\u003e\n\u003ctd\u003e互斥替代分支\u003c/td\u003e\n\u003ctd\u003eif / else\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eopt\u003c/td\u003e\n\u003ctd\u003e單一可選分支\u003c/td\u003e\n\u003ctd\u003eif，無 else\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eloop\u003c/td\u003e\n\u003ctd\u003e重複執行\u003c/td\u003e\n\u003ctd\u003efor / while\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003epar\u003c/td\u003e\n\u003ctd\u003e並行片段\u003c/td\u003e\n\u003ctd\u003e多條互動並發\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e來源：[ASE-004，PDF p.62–64]。題目有 APPROVED 與 DECLINED 兩個互斥分支，應選 alt，不是 opt 或 par。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eBCE\u003c/strong\u003e：Boundary 處理外部互動；Control 協調流程；Entity 保存領域狀態。前端點擊後，由 UI 將請求轉給控制器，再驗證、付款與更新狀態；不要讓 UI 直接下 SQL。[ASE-004，PDF p.65–70]\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"自編循序圖\" src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI4MjAiIGhlaWdodD0iNTMwIiB2aWV3Qm94PSIwIDAgODIwIDUzMCIgcm9sZT0iaW1nIiBhcmlhLWxhYmVsPSJzZXF1ZW5jZS5zdmciPjxkZWZzPjxtYXJrZXIgaWQ9ImFycm93IiB2aWV3Qm94PSIwIDAgMTAgMTAiIHJlZlg9IjkiIHJlZlk9IjUiIG1hcmtlcldpZHRoPSI3IiBtYXJrZXJIZWlnaHQ9IjciIG9yaWVudD0iYXV0by1zdGFydC1yZXZlcnNlIj48cGF0aCBkPSJNIDAgMCBMIDEwIDUgTCAwIDEwIHoiIGZpbGw9IiMzMTViNTMiLz48L21hcmtlcj48bWFya2VyIGlkPSJvcGVuIiB2aWV3Qm94PSIwIDAgMTAgMTAiIHJlZlg9IjkiIHJlZlk9IjUiIG1hcmtlcldpZHRoPSI4IiBtYXJrZXJIZWlnaHQ9IjgiIG9yaWVudD0iYXV0byI+PHBhdGggZD0iTTEgMSBMOSA1IEwxIDkiIGZpbGw9Im5vbmUiIHN0cm9rZT0iIzMxNWI1MyIgc3Ryb2tlLXdpZHRoPSIxLjUiLz48L21hcmtlcj48bWFya2VyIGlkPSJkaWFtb25kIiB2aWV3Qm94PSIwIDAgMTYgMTIiIHJlZlg9IjAiIHJlZlk9IjYiIG1hcmtlcldpZHRoPSIxNCIgbWFya2VySGVpZ2h0PSIxMiIgb3JpZW50PSJhdXRvIj48cGF0aCBkPSJNMCA2IEw4IDAgTDE2IDYgTDggMTIgWiIgZmlsbD0iIzMxNWI1MyIvPjwvbWFya2VyPjwvZGVmcz48cmVjdCB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiByeD0iMTgiIGZpbGw9IiNmNWY4ZjYiLz48ZyBmaWxsPSJub25lIiBzdHJva2U9IiMzMTViNTMiIHN0cm9rZS13aWR0aD0iMS44Ij48cmVjdCB4PSIzNSIgeT0iMjUiIHdpZHRoPSIxMzAiIGhlaWdodD0iNDIiIHJ4PSI4IiBmaWxsPSJ3aGl0ZSIvPjx0 td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003ewhen(condition)\u003c/td\u003e\n\u003ctd\u003e條件由假變真所觸發的變化事件\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eH、H*\u003c/td\u003e\n\u003ctd\u003e淺歷史／深歷史，用於復原先前子狀態配置\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e來源：[ASE-004，PDF p.94–101]。另有 Signal Event、Call Event。講義用「瞬間、不可中斷」幫助區分 action 與 do activity；不要把示意當作真實付款 I/O 真的零耗時或必然具有資料庫原子性。未標觸發的完成轉移也存在。[ASE-004，PDF p.95、97；I/O 說明為整理提醒]\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"自編狀態機\" src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI4MjUiIGhlaWdodD0iMzg1IiB2aWV3Qm94PSIwIDAgODI1IDM4NSIgcm9sZT0iaW1nIiBhcmlhLWxhYmVsPSJzdGF0ZS5zdmciPjxkZWZzPjxtYXJrZXIgaWQ9ImFycm93IiB2aWV3Qm94PSIwIDAgMTAgMTAiIHJlZlg9IjkiIHJlZlk9IjUiIG1hcmtlcldpZHRoPSI3IiBtYXJrZXJIZWlnaHQ9IjciIG9yaWVudD0iYXV0by1zdGFydC1yZXZlcnNlIj48cGF0aCBkPSJNIDAgMCBMIDEwIDUgTCAwIDEwIHoiIGZpbGw9IiMzMTViNTMiLz48L21hcmtlcj48bWFya2VyIGlkPSJvcGVuIiB2aWV3Qm94PSIwIDAgMTAgMTAiIHJlZlg9IjkiIHJlZlk9IjUiIG1hcmtlcldpZHRoPSI4IiBtYXJrZXJIZWlnaHQ9IjgiIG9yaWVudD0iYXV0byI+PHBhdGggZD0iTTEgMSBMOSA1IEwxIDkiIGZpbGw9Im5vbmUiIHN0cm9rZT0iIzMxNWI1MyIgc3Ryb2tlLXdpZHRoPSIxLjUiLz48L21hcmtlcj48bWFya2VyIGlkPSJkaWFtb25kIiB2aWV3Qm94PSIwIDAgMTYgMTIiIHJlZlg9IjAiIHJlZlk9IjYiIG1hcmtlcldpZHRoPSIxNCIgbWFya2VySGVpZ2h0PSIxMiIgb3JpZW50PSJhdXRvIj48cGF0aCBkPSJNMCA2IEw4IDAgTDE2IDYgTDggMTIgWiIgZmlsbD0iIzMxNWI1MyIvPjwvbWFya2VyPjwvZGVmcz48cmVjdCB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiByeD0iMTgiIGZpbGw9IiNmNWY4ZjYiLz48ZyBmaWxsPSJub25lIiBzdHJva2U9IiMzMTViNTMiIHN0cm9rZS13aWR0aD0iMS44Ij48Y2lyY2xlIGN4PSI2OCIgY3k9IjcxIiByPSI5IiBmaWxsPSIjMzE1YjUzIi8+PHBhdGggZD0iTTc4IDcxIEwxMjUgNzEiIG1hcmtlci1lbmQ9InVybCgjYXJyb3cpIi8+PHJlY3QgeD0iMTI2IiB5PSI0OCIgd2lkdGg9IjE1MCIgaGVpZ2h0PSI0OCIgcng9IjgiIGZpbGw9IndoaXRlIi8+PHRleHQgeD0iMjAxLjAiIHk9Ijc3LjAiIHRleHQtYW5jaG9yPSJtaWRkbGUiIHN0cm9rZT0ibm9uZSIgZmlsbD0iIzI2M2QzOCIgZm9udC1mYW1pbHk9IkFyaWFsLCBOb3RvIFNhbnMgVEMsIHNhbnMtc2VyaWYiIGZvbnQtc2l6ZT0iMTU p\u003e來源：[ASE-004，PDF p.7、92、102、114]。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003ePlantUML\u003c/strong\u003e 讓模型以文字保存，可進 Git、diff、PR 與自動產圖流程。文字化不保證語意正確，AI 產出的程式與圖片仍須一起檢查。[ASE-004，PDF p.110–122]\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"language-plantuml\"\u003e@startuml\nclass Customer\nclass Order\nclass OrderItem\nCustomer \u0026quot;1\u0026quot; -- \u0026quot;0..*\u0026quot; Order\nOrder \u0026quot;1\u0026quot; *-- \u0026quot;1..*\u0026quot; OrderItem\n@enduml\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e此為自編例。\u003ccode\u003e@startuml\u003c/code\u003e / \u003ccode\u003e@enduml\u003c/code\u003e 包住圖；\u003ccode\u003eactor\u003c/code\u003e、\u003ccode\u003eusecase\u003c/code\u003e、\u003ccode\u003eclass\u003c/code\u003e、\u003ccode\u003eparticipant\u003c/code\u003e、\u003ccode\u003estate\u003c/code\u003e 定義不同模型元素。活動圖用 \u003ccode\u003estart\u003c/code\u003e、\u003ccode\u003e:動作;\u003c/code\u003e、\u003ccode\u003eif\u003c/code\u003e 與 \u003ccode\u003estop\u003c/code\u003e；泳道用 \u003ccode\u003e|角色|\u003c/code\u003e；狀態圖的 \u003ccode\u003e[*]\u003c/code\u003e 依連線位置代表起始或結束。[ASE-004，PDF p.115–121]\u003c/p\u003e\n\u003ch2 id=\"p-64c081b47509-s9\"\u003e手寫繪圖順序\u003c/h2\u003e\n\u003cp\u003e先圈出實體、角色、行為、條件，再依問題選圖；寫出題設假設，畫主要路徑，補必要關係與例外；最後檢查箭頭方向、重數、guard 與出口。先確保模型語意正確，再調整排版。本章測驗有五種圖的紙筆練習與參考圖，作答前不顯示答案。\u003c/p\u003e\n\u003ch2 id=\"p-64c081b47509-s10\"\u003e講義閱讀限制與待確認\u003c/h2\u003e\n\u003cp\u003e本輪讀取全部頁面的文字，並檢視上述核心圖例與純圖片頁。部分投影片中的 AI 生成插圖有重複名稱、截斷文字或不一致記號；本頁使用重新繪製的例子，沒有直接貼原圖。進階案例並非逐圖轉錄；講義 p.63 的部分延伸運算子名稱、p.45 的領域關係與 p.66 訊息批註保留待確認，不作爭議題的判分依據。\u003c/p\u003e\n\u003ch2 id=\"p-64c081b47509-s11\"\u003e來源與延伸\u003c/h2\u003e\n\u003cp\u003e\u003ca href=\"#/sources\" title=\"原始教材保存在專案 raw 資料夾\"\u003eASE-004 原始講義\u003c/a\u003e。\u003c/p\u003e\n\u003cp\u003e\u003ca href=\"#/ase/tests/4\"\u003e本章測驗\u003c/a\u003e · \u003ca href=\"#/ase\"\u003e課程首頁\u003c/a\u003e\u003c/p\u003e", "text": "# 第四章｜系統塑模與 UML\n\n\u003e 依講義重新整理；頁碼一律指 PDF 頁次。例子標為自編；整理稿尚待使用者複核。\n\n## 4.1 先學會選圖，再背符號\n\n**System Modeling 系統塑模**以抽象模型描述系統的不同面向，隱藏當下不需要的細節。模型要服務溝通、檢查與實作；單一圖無法代表全部系統。[ASE-004，PDF p.4–8]\n\n| 視角 | 英文 | 關心的問題 | 典型模型 |\n| --- | --- | --- | --- |\n| 外部 | External | 邊界及外部環境在哪？ | 系統環境／邊界 |\n| 互動 | Interaction | 誰與誰互動？ | Use Case、Sequence |\n| 結構 | Structural | 資料與類別如何組織？ | Class |\n| 行為 | Behavioral | 流程與事件反應如何運作？ | Activity、State Machine |\n\n來源：[ASE-004，PDF p.6–7]。四個分析視角與 UML 官方圖表分類是不同層次的說法；不要把所有動態圖一律當作同一個用途。\n\n## 4.2 UML 是語言，不是開發流程\n\n**Unified Modeling Language（UML）**統一模型記號以利溝通。講義將三位先驅的側重整理為 Jacobson（Use Case、OOSE、Why）、Rumbaugh（OMT、領域與資料、What）、Booch（設計與實作、How）。OMG 推動標準化。[ASE-004，PDF p.10–16]\n\n## 4.3 使用案例圖：角色要達成什麼\n\n| 元素 | 畫法 | 語意 |\n| --- | --- | --- |\n| Actor | 火柴人或角色標記，放邊界外 | 外部人員角色或外部系統 |\n| Use Case | 橢圓，放邊界內 | 能產生可觀察價值的功能目標 |\n| System Boundary | 矩形外框 | 本系統負責的範圍 |\n| Association | 角色與案例間的實線 | 參與互動，不代表資料流或時序 |\n\n來源：[ASE-004，PDF p.18–26]。以「加選課程」「查詢課表」命名；「點擊送出」通常只是操作步驟。內部資料庫通常不是本系統外部 Actor；是否外部取決於先定義的邊界。\n\n| 關係 | 使用時機 | 箭頭方向 | 線型 |\n| --- | --- | --- | --- |\n| include | 基礎案例納入必要共用行為 | 基礎案例指向被包含案例 | 虛線開放箭頭，標 «include» |\n| extend | 在擴充點、特定條件下加入行為 | 擴充案例指向基礎案例 | 虛線開放箭頭，標 «extend» |\n| Generalization | 特化角色／案例可視為一般者的一種 | 子者指向父者 | 實線空心三角 |\n\n來源：[ASE-004，PDF p.20、24、28–31、126]。**include 與 extend 都不能拿來畫步驟先後**。基礎案例不需依賴選用擴充即可有意義地執行。\n\n![自編使用案例例圖](../../../assets/use-case.svg)\n\n自編：學生加選時必須檢查資格，故加選 include 檢查資格；名額已滿時可加入候補，故加入候補 extend 加選。手寫先畫邊界、角色與主要目標，再補必要與可選關係。\n\n文字規格還要記錄 Actor、Preconditions、Postconditions、Main Flow、Extensions。圖不應塞入所有例外步驟。[ASE-004，PDF p.27]\n\n## 4.4 類別圖：靜態結構\n\nClass 是藍圖，Object 是實例；方框由類別名、屬性、操作三層組成。屬性可寫 `-studentId: String`；操作可寫 `+enroll(courseId: String): Boolean`。概念模型可較簡潔，實作模型才需進一步細化程式細節。[ASE-004，PDF p.37–40、116]\n\n| 符號 | 英文 | 意義 |\n| --- | --- | --- |\n| + | Public | 公開 |\n| - | Private | 類別內部可見 |\n| # | Protected | 受保護，允許子類別等規定範圍 |\n| ~ | Package | 套件可見 |\n\n來源：[ASE-004，PDF p.40、116]。具體程式語言的存取規則仍需按語言判讀。\n\n| 關係 | 語意 | 線型與方向 | PlantUML |\n| --- | --- | --- | --- |\n| Association 關聯 | 物件間結構性連結 | 實線；可加導覽方向 | `A -- B` |\n| Dependency 依賴 | A 使用 B | 虛線開放箭頭指向被依賴者 B | `A ..\u003e B` |\n| Generalization 泛化／繼承 | 子類別 is-a 父類別 | 實線空心三角指向父類別 | `Parent \u003c\\|-- Child` |\n| Realization 實現 | 類別實現介面契約 | 虛線空心三角指向介面 | `Interface \u003c\\|.. Implementation` |\n| Aggregation 聚合 | 較弱的整體／部分關係 | 空心菱形在整體端 | `Whole o-- Part` |\n| Composition 組合 | 部分受整體生命週期管理 | 實心菱形在整體端 | `Whole *-- Part` |\n\n來源：[ASE-004，PDF p.41–43、117]。**三角看父類別／介面；菱形看整體端**。部分可獨立存在，不代表一律必須用聚合；若只表示參照，一般關聯也可能更適合。講義例子中的選擇仍要看其題設。\n\n| 重數 | 意義 |\n| --- | --- |\n| 1 | 恰好一個 |\n| 0..1 | 可有可無，最多一個 |\n| * 或 0..* | 零到多個 |\n| 1..* | 至少一個 |\n| 2..5 | 兩到五個 |\n\n來源：[ASE-004，PDF p.44、51–52]。**讀靠近 B 端的數字，是一個 A 可連到幾個 B**。自編 `Customer \"1\" -- \"0..*\" Order`：一位顧客可有零到多筆訂單；每筆訂單恰好對應一位顧客。\n\n![自編類別圖](../../../assets/class-model.svg)\n\n常見錯誤：把 has-a 畫成 is-a；把與整體獨立的實體畫成組合；漏兩端重數；將敏感屬性全部公開。組合的圖示是模型的生命週期規則，不會單憑畫圖就自動實作資料庫刪除行為。[ASE-004，PDF p.48–53；末句為整理提醒]\n\n## 4.5 循序圖：跨物件訊息時序\n\n時間由上向下；Lifeline 是參與者的生命線；Activation Bar 表示正在執行操作的期間。呼叫與回傳必須符合因果關係，例如持久化成功後才顯示成功。[ASE-004，PDF p.56–67]\n\n| 訊息 | 視覺辨識 | PlantUML |\n| --- | --- | --- |\n| 同步呼叫 | 實線、實心箭頭；呼叫者等待 | `A -\u003e B: request()` |\n| 非同步訊號 | 實線、開放箭頭；發送者不等完成 | `A -\u003e\u003e B: event` |\n| 回傳 | 虛線箭頭，回原呼叫端 | `B --\u003e A: result` |\n| 自呼叫 | 箭頭折回自身生命線 | `A -\u003e A: validate()` |\n| 銷毀 | 生命線結尾的 X | `destroy B` |\n\n來源：[ASE-004，PDF p.60–61、68、118–119]。**虛線回傳不是非同步的判斷依據**；要連同線型、箭頭與上下文一起看。\n\n| 片段 | 語意 | 對應邏輯 |\n| --- | --- | --- |\n| alt | 互斥替代分支 | if / else |\n| opt | 單一可選分支 | if，無 else |\n| loop | 重複執行 | for / while |\n| par | 並行片段 | 多條互動並發 |\n\n來源：[ASE-004，PDF p.62–64]。題目有 APPROVED 與 DECLINED 兩個互斥分支，應選 alt，不是 opt 或 par。\n\n**BCE**：Boundary 處理外部互動；Control 協調流程；Entity 保存領域狀態。前端點擊後，由 UI 將請求轉給控制器，再驗證、付款與更新狀態；不要讓 UI 直接下 SQL。[ASE-004，PDF p.65–70]\n\n![自編循序圖](../../../assets/sequence.svg)\n\n## 4.6 活動圖：流程、選擇與並行\n\n| 節點 | 畫法 | 用途 |\n| --- | --- | --- |\n| Initial | 實心圓 | 起點 |\n| Action | 圓角矩形 | 執行動作 |\n| Activity Final | 靶心圓 | 結束整個活動 |\n| Decision | 菱形，通常一入多出 | 依 guard 分支 |\n| Merge | 菱形，通常多入一出 | 合併替代路徑，不等待全部 |\n| Fork | 粗橫／直條，一入多出 | 展開並行分支 |\n| Join | 粗橫／直條，多入一出 | 一般用法等待各並行分支完成 |\n| Swimlane / Partition | 橫或直的分區 | 區分角色與責任 |\n\n來源：[ASE-004，PDF p.76–83]。**Decision / Merge 管選擇；Fork / Join 管並行**。不能用 Join 接只會擇一執行的兩條路徑，否則可能等待永遠不會到的另一條。\n\n![自編活動圖](../../../assets/activity.svg)\n\n自編例：付款成功後，「備餐」與「尋找外送員」可並行；兩者完成後才能交餐。付款失敗則結束或返回修正，不應進入備餐。畫泳道時每個動作依執行者歸屬，不是把畫面分好看而已。[ASE-004，PDF p.77–85；例子自編]\n\n## 4.7 狀態機：單一實體如何回應事件\n\n**State** 是物件維持某種條件、等待事件或執行活動的期間；**Transition** 是狀態間轉移。與活動圖的流程步驟不同，狀態機聚焦同一實體的生命週期。[ASE-004，PDF p.91–103]\n\n標準標籤為 `Event [Guard] / Action`。例如 `cancelOrder [elapsed \u003c= 120s] / refund()`：收到取消事件、條件符合才執行退款並轉移。Event 是觸發，Guard 是布林條件，Action 是轉移效果。[ASE-004，PDF p.95–96]\n\n| 語法 | 意義 |\n| --- | --- |\n| entry / action | 進入狀態時執行 |\n| do / activity | 留在狀態期間進行的活動 |\n| exit / action | 離開狀態時執行 |\n| after(30s) | 時間事件 |\n| when(condition) | 條件由假變真所觸發的變化事件 |\n| H、H* | 淺歷史／深歷史，用於復原先前子狀態配置 |\n\n來源：[ASE-004，PDF p.94–101]。另有 Signal Event、Call Event。講義用「瞬間、不可中斷」幫助區分 action 與 do activity；不要把示意當作真實付款 I/O 真的零耗時或必然具有資料庫原子性。未標觸發的完成轉移也存在。[ASE-004，PDF p.95、97；I/O 說明為整理提醒]\n\n![自編狀態機](../../../assets/state.svg)\n\n自編例中，只允許 Paid 在備餐前取消。**Invariant 不變量**是模型必須維持的條件；例如 Preparing 之後不可走一般取消。審查要找不可達狀態、非終局卻無出口的陷阱、重疊 guard、終止節點向外轉移。終止狀態不能再拉出「重開」箭頭；若業務能重開，應建模成可恢復的普通狀態。[ASE-004，PDF p.104–109]\n\n## 4.8 五圖比較與文字塑模\n\n| 想回答 | 適合圖型 |\n| --- | --- |\n| 外部角色能完成哪些目標？ | Use Case Diagram |\n| 有哪些類別、屬性與關係？ | Class Diagram |\n| 這個場景誰先呼叫誰？ | Sequence Diagram |\n| 工作如何分支、並行、交接？ | Activity Diagram |\n| 訂單在哪個狀態可接受哪個事件？ | State Machine Diagram |\n\n來源：[ASE-004，PDF p.7、92、102、114]。\n\n**PlantUML** 讓模型以文字保存，可進 Git、diff、PR 與自動產圖流程。文字化不保證語意正確，AI 產出的程式與圖片仍須一起檢查。[ASE-004，PDF p.110–122]\n\n```plantuml\n@startuml\nclass Customer\nclass Order\nclass OrderItem\nCustomer \"1\" -- \"0..*\" Order\nOrder \"1\" *-- \"1..*\" OrderItem\n@enduml\n```\n\n此為自編例。`@startuml` / `@enduml` 包住圖；`actor`、`usecase`、`class`、`participant`、`state` 定義不同模型元素。活動圖用 `start`、`:動作;`、`if` 與 `stop`；泳道用 `\\|角色\\|`；狀態圖的 `[*]` 依連線位置代表起始或結束。[ASE-004，PDF p.115–121]\n\n## 手寫繪圖順序\n\n先圈出實體、角色、行為、條件，再依問題選圖；寫出題設假設，畫主要路徑，補必要關係與例外；最後檢查箭頭方向、重數、guard 與出口。先確保模型語意正確，再調整排版。本章測驗有五種圖的紙筆練習與參考圖，作答前不顯示答案。\n\n## 講義閱讀限制與待確認\n\n本輪讀取全部頁面的文字，並檢視上述核心圖例與純圖片頁。部分投影片中的 AI 生成插圖有重複名稱、截斷文字或不一致記號；本頁使用重新繪製的例子，沒有直接貼原圖。進階案例並非逐圖轉錄；講義 p.63 的部分延伸運算子名稱、p.45 的領域關係與 p.66 訊息批註保留待確認，不作爭議題的判分依據。\n\n\n## 來源與延伸\n\n[ASE-004 原始講義](../../../../raw/advanced-software-engineering/lectures/slide04t_model.pdf)。\n\n[本章測驗](../reviews/chapter-04.md) · [課程首頁](../index.md)\n", "headings": [{"id": "p-64c081b47509-s1", "text": "4.1 先學會選圖，再背符號"}, {"id": "p-64c081b47509-s2", "text": "4.2 UML 是語言，不是開發流程"}, {"id": "p-64c081b47509-s3", "text": "4.3 使用案例圖：角色要達成什麼"}, {"id": "p-64c081b47509-s4", "text": "4.4 類別圖：靜態結構"}, {"id": "p-64c081b47509-s5", "text": "4.5 循序圖：跨物件訊息時序"}, {"id": "p-64c081b47509-s6", "text": "4.6 活動圖：流程、選擇與並行"}, {"id": "p-64c081b47509-s7", "text": "4.7 狀態機：單一實體如何回應事件"}, {"id": "p-64c081b47509-s8", "text": "4.8 五圖比較與文字塑模"}, {"id": "p-64c081b47509-s9", "text": "手寫繪圖順序"}, {"id": "p-64c081b47509-s10", "text": "講義閱讀限制與待確認"}, {"id": "p-64c081b47509-s11", "text": "來源與延伸"}], "sectionCount": 11, "searchText": "第四章｜系統塑模與 UML 依講義重新整理；頁碼一律指 PDF 頁次。例子標為自編；整理稿尚待使用者複核。 4.1 先學會選圖，再背符號 System Modeling 系統塑模 以抽象模型描述系統的不同面向，隱藏當下不需要的細節。模型要服務溝通、檢查與實作；單一圖無法代表全部系統。[ASE-004，PDF p.4–8] 視角 英文 關心的問題 典型模型 外部 External 邊界及外部環境在哪？ 系統環境／邊界 互動 Interaction 誰與誰互動？ Use Case、Sequence 結構 Structural 資料與類別如何組織？ Class 行為 Behavioral 流程與事件反應如何運作？ Activity、State Machine 來源：[ASE-004，PDF p.6–7]。四個分析視角與 UML 官方圖表分類是不同層次的說法；不要把所有動態圖一律當作同一個用途。 4.2 UML 是語言，不是開發流程 Unified Modeling Language（UML） 統一模型記號以利溝通。講義將三位先驅的側重整理為 Jacobson（Use Case、OOSE、Why）、Rumbaugh（OMT、領域與資料、What）、Booch（設計與實作、How）。OMG 推動標準化。[ASE-004，PDF p.10–16] 4.3 使用案例圖：角色要達成什麼 元素 畫法 語意 Actor 火柴人或角色標記，放邊界外 外部人員角色或外部系統 Use Case 橢圓，放邊界內 能產生可觀察價值的功能目標 System Boundary 矩形外框 本系統負責的範圍 Association 角色與案例間的實線 參與互動，不代表資料流或時序 來源：[ASE-004，PDF p.18–26]。以「加選課程」「查詢課表」命名；「點擊送出」通常只是操作步驟。內部資料庫通常不是本系統外部 Actor；是否外部取決於先定義的邊界。 關係 使用時機 箭頭方向 線型 include 基礎案例納入必要共用行為 基礎案例指向被包含案例 虛線開放箭頭，標 «include» extend 在擴充點、特定條件下加入行為 擴充案例指向 utside the software definition used in this course?", "options": ["部署與復原程序", "資料庫綱要", "CPU 實體晶片", "需求與操作文件"], "answer": 2, "explanation": "軟體包含程式、資料、程序與文件；CPU 是實體硬體。", "pages": [14, 18], "level": "理解", "id": "ASE-C1-Q01", "source": "ASE-001"}, {"type": "choice", "prompt": "系統程式通過單元測試，更新時卻因錯誤的部署步驟覆蓋資料。最直接缺失是哪一部分？", "options": ["Operational Procedures", "Programs 的語法", "CPU 設計", "螢幕效能"], "answer": 0, "explanation": "描述焦點是部署程序；測試程式不會自動驗證所有維運步驟。", "pages": [14, 15, 16], "level": "理解", "id": "ASE-C1-Q02", "source": "ASE-001"}, {"type": "choice", "prompt": "軟體危機為何無法只靠更快的硬體解決？", "options": ["硬體更快一定會增加程式錯誤", "危機涉及需求、規模與團隊協作", "軟體不能使用新硬體", "只要改用高階語言即可解決"], "answer": 1, "explanation": "系統複雜度及協作方式是核心問題，與單一機器速度不同。", "pages": [8, 11], "level": "理解", "id": "ASE-C1-Q03", "source": "ASE-001"}, {"type": "choice", "prompt": "A third-party service fails and the whole application stops. Which quality attribute is most directly implicated?", "options": ["Portability / Installability", "Usability / Learnability", "Maintainability / Testability", "Reliability / Fault Tolerance"], "answer": 3, "explanation": "故障時能否繼續提供服務是可靠性與容錯性；不是更換平台是否容易。", "pages": [43, 44, 45], "level": "理解", "id": "ASE-C1-Q04", "source": "ASE-001"}, {"type": "choice", "prompt": "模組彼此高度耦合，難以替資料庫建立測試替身。焦點是哪項品質？", "options": ["Compatibility", "Maintainability", "Portability", "Functional Suitability"], "answer": 1, "explanation": "模組化與可測試性屬可維護性。相容性偏向共存及資訊交換。", "pages": [42, 43, 44], "level": "理解", "id": "ASE-C1-Q05", "source": "ASE-001"}, {"type": "choice", "prompt": "開發團隊將產品移至另一作業系統，安裝及替換十分困難。最直接對應？", "options": ["Security", "Reliability", "Portability", "Performance Efficiency"], "answer": 2, "explanation": "安裝、適應與替換環境的容易程度屬可移植性。", "pages": [43, 44], "level": "理解", "id": "ASE-C1-Q06", "source": "ASE-001"}, {"type": "choice", "prompt": "規格說每月產生報表，系統做到；但使用者真正需要每日風險警示。缺少哪個檢視？", "options": ["Validation", "只有編譯檢查", "只有效能調優", "只有程式格式檢查"], "answer": 0, "explanation": "符合錯誤的規格不等於解決真正需求；Validation 要確認是否做對產品。", "pages": [26, 28, 69], "level": "理解", "id": "ASE-C1-Q07", "source": "ASE-001"}, {"type": "choice", "prompt": "雇主要求偽造合規測試結果，工程師應優先依據何者判斷？", "options": ["團隊當月提交次數", "主管的絕對命令", "個人的升遷利益", "Public 公眾利益與安全"], "answer": 3, "explanation": "ACM/IEEE 倫理以公眾利益為最高考量，不能以服從雇主合理化造假。", "pages": [48, 50, 54], "level": "理解", "id": "ASE-C1-Q08", "source": "ASE-001"}, {"type": "choice", "prompt": "同一 AI 在沒有明確規格下產生程式與測試，所有測試都通過。主要風險？", "options": ["全部測試必然沒有執行", "測試與實作可能共用錯誤假設", "自動測試一定比人工慢", "只要改名測試函式就能消除問題"], "answer": 1, "explanation": "Echo-Chamber Testing 指測試可能只證明自己的假設，而非真正需求。", "pages": [64, 65, 67], "level": "理解", "id": "ASE-C1-Q09", "source": "ASE-001"}, {"type": "choice", "prompt": "在已延期專案加入新人，卻讓資深成員花更多時間培訓與協調，對應哪個概念？", "options": ["YAGNI", "Dark Patterns", "Brooks’s Law", "Portability"], "answer": 2, "explanation": "布魯克斯法則提醒加人存在培訓與溝通代價，不能當立即增加產能。", "pages": [34, 36], "level": "理解", "id": "ASE-C1-Q10", "source": "ASE-001"}, {"type": "fill", "prompt": "Complete the fourth component: Programs, Data, Procedures, and _____.", "answers": ["Documentation"], "explanation": "文件記錄需求、設計、操作等，是軟體構成的一部分。", "pages": [14], "level": "識記", "id": "ASE-C1-Q11", "source": "ASE-001"}, {"type": "fill", "prompt": "Software engineering applies systematic, disciplined and _____ approaches. 請填可量化的英文形容詞。", "answers": ["Quantifiable"], "explanation": "工程要求可度量的方法，不能只靠主觀感覺。", "pages": [20, 24], "level": "識記", "id": "ASE-C1-Q12", "source": "ASE-001"}, {"type": "fill", "prompt": "Are we building the product right? 這個檢查稱為 _____.", "answers": ["Verification"], "explanation": "Verification 檢查是否符合規格；Validation 檢查是否解決真正需求。", "pages": [28], "level": "識記", "id": "ASE-C1-Q13", "source": "ASE-001"}, {"type": "fill", "prompt": "在四大活動中，因新需求持續調整既有系統稱為 Software _____.", "answers": ["Evolution"], "explanation": "軟體演化包含上線後的修改與適應。", "pages": [29], "level": "識記", "id": "ASE-C1-Q14", "source": "ASE-001"}, {"type": "fill", "prompt": "只能靠提示詞生成且不理解實作，講義稱 Vibe _____（依題幹 Programming 用語填單字）。", "answers": ["Programming"], "explanation": "講義使用 Vibe Programming 與 Vibe Coding；本題指定 Programming 用語。", "pages": [57], "level": "識記", "id": "ASE-C1-Q15", "source": "ASE-001"}, {"type": "fill", "prompt": "訂閱容易、取消困難的模式稱 Roach _____.", "answers": ["Motel"], "explanation": "Roach Motel 藉退出流程障礙困住使用者。", "pages": [53], "level": "識記", "id": "ASE-C1-Q16", "source": "ASE-001"}, {"type": "written", "prompt": "用選課系統說明軟體四大組成，並解釋為何程式沒錯仍可能出事故。", "model": "程式檢查加選；資料保存名額與課表；程序負責部署及備份；文件定義業務與介面。若遷移或復原程序錯誤，仍可能破壞名額資料，即使單一函式測試正確。", "rubric": ["列出程式、資料、程序、文件", "四項各有具體例子", "指出程式測試無法代替其他部分驗證"], "pages": [14, 15, 16, 17], "level": "應用", "id": "ASE-C1-Q17", "source": "ASE-001"}, {"type": "written", "prompt": "用同一情境區分 Verification 與 Validation。", "model": "驗證選課系統依規格擋掉衝堂是 Verification；與學生確認此系統真的支援選課目標及實務流程是 Validation。兩者互補，符合規格不保證規格本身合適。", "rubric": ["兩個英文名詞正確", "分清規格符合與實際需求", "給出同一情境的不同檢視"], "pages": [28], "level": "應用", "id": "ASE-C1-Q18", "source": "ASE-001"}, {"type": "written", "prompt": "兩週內做校園訂餐 MVP，說明一項合理工程權衡與不能省略的品質要求。", "model": "先交付菜單、下單與必要的付款處理，延後推薦功能以符合時程。仍保留付款正確性及必要驗證；權衡是減少範圍而非把未驗證系統當完成。", "rubric": ["明示時間／資源限制", "具體範圍取捨與價值", "保留重要品質要求並說明理由"], "pages": [20, 21, 22, 46], "level": "應用", "id": "ASE-C1-Q19", "source": "ASE-001"}, {"type": "written", "prompt": "發現 AI 產生的結帳程式通過兩個正常流程測試，是否能直接上線？列三個應檢視的事項。", "model": "不足以決定。應回到業務規格確認折扣與金額規則；測試失敗、重複送出、並行等邊界；審查安全與資料處理。生成程式與測試可能共用盲點，仍需人工及獨立驗證。", "rubric": ["明確指出證據不足", "至少三項具體檢視", "提及共同假設或人類責任"], "pages": [64, 65, 67, 68], "level": "應用", "id": "ASE-C1-Q20", "source": "ASE-001"}], "trackReading": false, "metadata": {"id": "ASE-REVIEW-01", "title": "第1章期中複習測驗", "course": "advanced-software-engineering", "type": "review", "status": "needs-review", "created": "2026-11-06", "updated": "2026-11-06", "sources": ["ASE-001", "EXAM-001"], "tags": ["期中測驗", "AI練習題"]}, "quizKey": "1", "recordChapter": 1, "lesson": "lessons/chapter-01.md", "readKey": "courses/advanced-software-engineering/reviews/chapter-01", "lessonPath": "/ase/lessons/1", "html": "\u003ch1\u003e第1章｜期中複習測驗\u003c/h1\u003e\n\u003cp\u003e本題庫為依講義重新 I 產生的結帳程式通過兩個正常流程測試，是否能直接上線？列三個應檢視的事項。"}, {"id": "courses/advanced-software-engineering/reviews/chapter-02", "path": "/ase/tests/2", "title": "第2章期中複習測驗", "short": "軟體流程與開發方法學", "desc": "本題庫為依講義重新編寫的 AI 練習題，不代表教師正式考卷。英文敘述、術語填空與圖表判讀參考 EXAM-001 的可見題型。每題 pages 指本章講義 PDF 頁次。", "courseId": "advanced-software-engineering", "sectionId": "reviews", "kind": "quiz", "status": "needs-review", "source": "ASE-002", "pages": 96, "questions": [{"type": "choice", "prompt": "依講義 p.19 的四層 V-Model，Architecture Design 對應哪個測試？", "options": ["Integration Testing", "Acceptance Testing", "只有語法檢查", "Unit Testing"], "answer": 0, "explanation": "架構層重點是模組／子系統介面整合；詳細設計對應單元測試，系統規格對應系統測試。", "pages": [17, 19], "level": "理解", "id": "ASE-C2-Q01", "source": "ASE-002"}, {"type": "choice", "prompt": "Waterfall 最容易讓哪個問題延遲到後期才被發現？", "options": ["程式語言是否有分號", "原始需求理解偏差", "團隊是否有姓名", "是否能建立資料夾"], "answer": 1, "explanation": "客戶較晚看到可用軟體，需求誤解未能早期被回饋修正。", "pages": [12, 14, 16], "level": "理解", "id": "ASE-C2-Q02", "source": "ASE-002"}, {"type": "choice", "prompt": "第一版可查課，第二版再加入加選。這次擴充主要是？", "options": ["Verification", "Refactoring", "Incremental Development", "只有部署"], "answer": 2, "explanation": "增加可用功能範圍是增量；反覆改善既有功能則偏疊代。", "pages": [25, 26, 33], "level": "理解", "id": "ASE-C2-Q03", "source": "ASE-002"}, {"type": "choice", "prompt": "哪個版本最符合垂直切片？", "options": ["先做全部資料表", "先做所有 API 但無可用介面", "只完成所有視覺稿", "完成可實際使用的查課介面、查詢邏輯與資料存取"], "answer": 3, "explanation": "垂直切片貫穿必要層次，交付可端到端驗證的功能。", "pages": [26], "level": "理解", "id": "ASE-C2-Q04", "source": "ASE-002"}, {"type": "choice", "prompt": "Working software over comprehensive documentation 意味著？", "options": ["文件完全無價值", "更重視可運行成果，同時保留必要文件", "只看文件頁數驗收", "不需任何驗收條件"], "answer": 1, "explanation": "敏捷偏重左項，但右項仍有價值；不是取消文件。", "pages": [40, 42, 43], "level": "理解", "id": "ASE-C2-Q05", "source": "ASE-002"}, {"type": "choice", "prompt": "Who orders the Product Backlog to maximize product value?", "options": ["Product Owner", "Scrum Master", "只有資料庫管理員", "自動編譯器"], "answer": 0, "explanation": "PO 負責產品價值與待辦優先級；SM 支援流程，Developers 負責如何實作。", "pages": [48], "level": "理解", "id": "ASE-C2-Q06", "source": "ASE-002"}, {"type": "choice", "prompt": "團隊討論這次部署交接為何失敗、下次如何改善，最符合哪個事件？", "options": ["Sprint Review", "只做產品展示", "Sprint Retrospective", "使用者驗收"], "answer": 2, "explanation": "Retrospective 檢視工作方式；Review 檢視產品成果及回饋。", "pages": [50, 55], "level": "理解", "id": "ASE-C2-Q07", "source": "ASE-002"}, {"type": "choice", "prompt": "看板審查欄已達 WIP 上限。較合理的下一步是？", "options": ["繼續塞工作以增加忙碌度", "刪掉限制", "讓所有人同時開新任務", "協助完成審查、處理瓶頸後再拉工作"], "answer": 3, "explanation": "WIP 上限促進先完成而非不斷開始，並暴露瓶頸。", "pages": [51, 52, 54], "level": "理解", "id": "ASE-C2-Q08", "source": "ASE-002"}, {"type": "choice", "prompt": "Which TDD step improves internal structure while keeping tests passing?", "options": ["Red", "Refactor", "取消全部測試", "新增未驗證功能"], "answer": 1, "explanation": "Refactor 維持既有行為與測試通過，改善結構；Green 是先以最少實作通過測試。", "pages": [68, 70, 74], "level": "理解", "id": "ASE-C2-Q09", "source": "ASE-002"}, {"type": "choice", "prompt": "通過測試後仍由人決定是否發布正式環境，最符合？", "options": ["Continuous Deployment", "只做手動編譯", "Continuous Delivery", "完全沒有 CI"], "answer": 2, "explanation": "Delivery 保持可發布並保留發布決策；Deployment 進一步自動發布。", "pages": [79, 82], "level": "理解", "id": "ASE-C2-Q10", "source": "ASE-002"}, {"type": "fill", "prompt": "In a Kanban pull system, the three-letter abbreviation in _____ Limit is?", "answers": ["WIP"], "explanation": "WIP 是 Work in Progress，限制同時進行工作以降低切換與瓶頸。", "pages": [51, 54], "level": "識記", "id": "ASE-C2-Q11", "source": "ASE-002"}, {"type": "fill", "prompt": "請依序填完整循環：Red → Green → _____.", "answers": ["Refactor", "Refactoring"], "explanation": "重構改善內部結構，同時維持測試通過。", "pages": [68, 69], "level": "識記", "id": "ASE-C2-Q12", "source": "ASE-002"}, {"type": "fill", "prompt": "「改善內部結構、不改外部可觀察行為」稱 _____（英文）。", "answers": ["Refactoring"], "explanation": "重構不是新增業務功能或修改驗收結果。", "pages": [70], "level": "識記", "id": "ASE-C2-Q13", "source": "ASE-002"}, {"type": "fill", "prompt": "固定開發週期的時間盒，在 Scrum 中稱 _____.", "answers": ["Sprint"], "explanation": "Sprint 提供固定節奏；Kanban 則偏連續流。", "pages": [47, 50], "level": "識記", "id": "ASE-C2-Q14", "source": "ASE-002"}, {"type": "fill", "prompt": "CI stands for Continuous _____.", "answers": ["Integration"], "explanation": "持續整合強調頻繁合併、自動建置與測試。", "pages": [78], "level": "識記", "id": "ASE-C2-Q15", "source": "ASE-002"}, {"type": "fill", "prompt": "模型外的規格、沙盒與驗證保護機制，講義稱 Engineering _____.", "answers": ["Harness"], "explanation": "Harness 將工程紀律落實為環境與檢查，而不是只加長提示詞。", "pages": [86, 88, 91], "level": "識記", "id": "ASE-C2-Q16", "source": "ASE-002"}, {"type": "written", "prompt": "畫出 V-Model 四層對應，並解釋測試左移。", "model": "使用者需求↔驗收；系統規格↔系統；架構設計↔整合；詳細設計↔單元。底部實作。左移是在各需求／設計形成時就規劃對應測試，不是等實作全部結束才想如何測。", "rubric": ["四組對應正確", "底部實作與兩側細化／整合方向合理", "說明提早規劃測試與追溯"], "pages": [17, 19], "level": "應用", "answerImage": "v-model.svg", "id": "ASE-C2-Q17", "source": "ASE-002"}, {"type": "written", "prompt": "同一功能持續改進與每版新增不同功能可否並用？以本複習網站為例。", "model": "可以。先提供一章課程與測驗，後續加入其他章節是增量；反覆改善第一章解說、題目難度與錯題回饋是疊代。每版須有可實際使用的價值，不只是孤立 UI 或資料庫。", "rubric": ["分清增加範圍與精煉", "同一專案各舉一例", "提到可用價值切片"], "pages": [25, 26, 28, 30], "level": "應用", "id": "ASE-C2-Q18", "source": "ASE-002"}, {"type": "written", "prompt": "新創需求尚不明確、三週內要取得使用者回饋。選擇流程並說明代價。", "model": "可採敏捷的增量與疊代，先交付能驗證核心服務的 MVP，依回饋調整需求。要管理架構演化、自動測試與技術債，避免只顧速度；嚴格一次凍結所有細節會延後學習。", "rubric": ["明示不確定性與早期回饋", "說明流程機制", "列出品質／技術債代價"], "pages": [22, 23, 30, 58, 59], "level": "應用", "id": "ASE-C2-Q19", "source": "ASE-002"}, {"type": "written", "prompt": "Scrum 會議都正常，但每次改需求都引發大量回歸錯誤。診斷並提出兩項工程改善。", "model": "可能只有 Scrum 管理外殼而缺乏工程紀律，即 Flaccid Scrum。可建立自動回歸測試與 CI，並在測試保護下持續重構高耦合模組；單加會議不能解決技術債。", "rubric": ["辨識技術債／Flaccid Scrum", "兩項具體技術改善", "說明改善如何降低後續成本"], "pages": [58, 59, 62, 68, 70, 78], "level": "應用", "id": "ASE-C2-Q20", "source": "ASE-002"}], "trackReading": false, "metadata": {"id": "ASE-REVIEW-02", "title": "第2章期中複習測驗", "course": "advanced-software-engineering", "type": "review", "status": "needs-review", "created": "2026-11-06", "updated": "2026-11-06", "so

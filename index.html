<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="從 Wiki 課程內容產生的私人學習知識庫。"><title>LLM Wiki｜課程複習</title><style>/* 共用設計來源；build.py 內嵌於 HTML，離線不載入外部資源。 */
:root {
  --ink: #111111;
  --muted: #494949;
  --paper: #ffffff;
  --accent: #ffe500;
  --line: #111111;
  --rule: 3px solid var(--ink);
  --shadow: 5px 5px 0 var(--ink);
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif;
}
* { box-sizing: border-box; }
html { scroll-padding-top: 90px; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.75 var(--sans); }
::selection { background: var(--ink); color: var(--paper); }
a { color: inherit; text-decoration-thickness: 2px; text-underline-offset: 4px; }
button, input, select, textarea { font: inherit; color: inherit; }
button, summary, .uploadlabel { cursor: pointer; }
button { border-radius: 0; }
button, .card, .search-result, .tabs a, .pillbtn, .primary { transition: transform 100ms ease, box-shadow 100ms ease, background-color 100ms ease; }
:where(a,button,input,select,textarea,summary):focus-visible { outline: 3px solid var(--ink); outline-offset: 5px; }
button:disabled { cursor: default; color: #555; background: #eee; box-shadow: none; transform: none; }
input::placeholder, textarea::placeholder { color: #595959; opacity: 1; }
input[type="checkbox"], input[type="radio"] { accent-color: var(--ink); width: 18px; height: 18px; flex-shrink: 0; }
.shell { display: flex; min-height: 100vh; }
.side { width: 238px; position: fixed; inset: 0 auto 0 0; overflow-y: auto; background: var(--paper); border-right: var(--rule); padding: 28px 18px 22px; display: flex; flex-direction: column; z-index: 20; }
.brand { display: flex; align-items: center; gap: 10px; font-size: 25px; font-weight: 950; letter-spacing: -1.5px; text-decoration: none; }
.brandmark { display: grid; place-items: center; width: 42px; height: 42px; border: var(--rule); background: var(--accent); color: var(--ink); font: 900 28px/1 var(--sans); box-shadow: 3px 3px 0 var(--ink); transform: rotate(-5deg); }
.subbrand { font: 700 11px/1.7 var(--mono); letter-spacing: 1px; border-bottom: var(--rule); padding: 17px 0 22px; margin-bottom: 16px; }
.navtitle { font-size: 11px; font-weight: 900; letter-spacing: 2px; margin: 27px 6px 9px; }
.navitem { border: 2px solid transparent; background: var(--paper); width: 100%; text-align: left; padding: 11px 9px; margin: 4px 0; display: flex; gap: 10px; align-items: center; font-size: 14px; font-weight: 750; min-height: 46px; overflow-wrap: anywhere; }
.navitem:hover:not(:disabled) { border-color: var(--ink); }
.navitem.active { background: var(--accent); border-color: var(--ink); box-shadow: 3px 3px 0 var(--ink); }
.navitem:active:not(:disabled) { transform: translate(2px,2px); box-shadow: none; }
.navitem .num { font: 800 12px/1.4 var(--mono); border: 2px solid var(--ink); background: var(--paper); min-width: 26px; padding: 2px; text-align: center; }
.sidefoot { margin-top: auto; padding: 35px 5px 0; font-size: 11px; color: var(--muted); }
.sidefoot strong { font-size: 13px; font-weight: 850; color: var(--ink); }
.main { margin-left: 238px; flex: 1; min-width: 0; }
.topbar { min-height: 80px; padding: 16px 36px; border-bottom: var(--rule); display: flex; align-items: center; justify-content: space-between; gap: 22px; background: var(--paper); }
.topcrumb { font: 700 11px/1.6 var(--mono); overflow-wrap: anywhere; }
.toptools { min-width: 0; }
.search { display: flex; align-items: center; gap: 9px; border: 2px solid var(--ink); box-shadow: 3px 3px 0 var(--ink); background: var(--paper); padding: 8px 11px; width: 310px; max-width: 100%; }
.search:focus-within { background: var(--accent); }
.search input { border: 0; outline: 0; background: transparent; min-width: 0; width: 100%; font-size: 12px; }
.search:has(input:focus-visible) { outline: 3px solid var(--ink); outline-offset: 5px; }
.search kbd { border: 1px solid var(--ink); background: var(--paper); font: 700 10px var(--mono); padding: 2px 4px; }
.mobilemenu { display: none; min-width: 44px; min-height: 44px; border: 2px solid var(--ink); background: var(--accent); font-size: 22px; }
.content { max-width: 1280px; margin: auto; padding: 44px 46px 72px; min-width: 0; }
.content > h1 { font-weight: 950; font-size: clamp(28px,3vw,42px); line-height: 1.35; letter-spacing: -1px; overflow-wrap: anywhere; margin: 12px 0 20px; }
.eyebrow { display: inline-block; background: var(--ink); color: var(--paper); font: 800 11px/1.7 var(--mono); padding: 4px 10px; letter-spacing: 1.5px; }
.hero { display: grid; grid-template-columns: minmax(0,1fr) 120px; align-items: center; gap: 28px; border-bottom: 4px solid var(--ink); padding: 5px 0 32px; margin-bottom: 32px; }
.hero > div { min-width: 0; }
.hero h1 { font-size: clamp(36px,4.7vw,62px); line-height: 1.2; letter-spacing: -2px; font-weight: 950; margin: 20px 0; overflow-wrap: anywhere; }
.hero p { max-width: 58ch; font-size: 15px; line-height: 1.9; color: var(--muted); margin: 0; }
.heroart { width: 112px; height: 112px; display: grid; place-items: center; border: 3px solid var(--ink); background: var(--accent); border-radius: 50%; box-shadow: 5px 5px 0 var(--ink); transform: rotate(8deg); }
.heroart span { font: 950 50px/1 var(--sans); }
.hero-home { grid-template-columns: minmax(0,1fr) 245px; gap: 14px; border: 0; padding: 12px 0 34px; margin: 0; }
.hero-home h1 { font-size: clamp(44px,5.8vw,76px); line-height: 1.17; letter-spacing: -3px; margin: 25px 0 23px; }
.hero-home h1 .headline-mark { display: inline-block; background: var(--accent); border: 3px solid var(--ink); padding: 3px 10px 9px; margin-top: 8px; box-shadow: 5px 5px 0 var(--ink); transform: rotate(-1deg); }
.hero-home p { max-width: 38ch; font-size: 16px; }
.poster-art { width: 100%; height: auto; display: block; pointer-events: none; user-select: none; }
.zine-strip { display: flex; gap: 18px; justify-content: space-between; flex-wrap: wrap; border-top: var(--rule); border-bottom: var(--rule); padding: 12px 4px; margin: 12px 0 34px; font: 850 11px/1.6 var(--mono); letter-spacing: 1px; }
.zine-strip span { display: flex; gap: 13px; align-items: center; }
.zine-strip span::before { content: "+"; font: 950 23px/1 var(--sans); }
.sectionhead { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin: 28px 0 24px; min-width: 0; }
.sectionhead h2 { font-size: 27px; line-height: 1.4; font-weight: 950; margin: 0; letter-spacing: -1px; }
.sectionhead small, .count-sticker { border: 2px solid var(--ink); background: var(--accent); padding: 5px 10px; box-shadow: 3px 3px 0 var(--ink); font-size: 12px; font-weight: 850; transform: rotate(2deg); }
.grid2, .hs-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 24px; }
.card { display: flex; flex-direction: column; width: 100%; min-width: 0; border: var(--rule); padding: 25px; box-shadow: var(--shadow); color: var(--ink); background: var(--paper); text-decoration: none; position: relative; overflow-wrap: anywhere; }
.card:hover { transform: translate(-2px,-2px); box-shadow: 7px 7px 0 var(--ink); }
.card:active { transform: translate(3px,3px); box-shadow: 2px 2px 0 var(--ink); }
.card:focus-visible { outline-offset: 8px; }
.card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 14px; margin-bottom: 16px; }
.card-index { font: 950 49px/1 var(--mono); letter-spacing: -3px; }
.card-top .label { border: 2px solid var(--ink); background: var(--accent); padding: 3px 8px; transform: rotate(-3deg); margin: 5px 4px 0 0; }
.card h3 { font-size: 23px; font-weight: 950; line-height: 1.35; margin: 9px 0 15px; letter-spacing: -.7px; }
.card p { font-size: 14px; line-height: 1.85; color: var(--muted); margin: 0 0 27px; }
.card .foot { margin-top: auto; border-top: 2px solid var(--ink); padding-top: 15px; display: flex; justify-content: space-between; align-items: center; gap: 12px; font: 750 11px/1.7 var(--mono); }
.card .arrow, .card .foot > span:last-child { font-size: 24px; flex-shrink: 0; }
.course-card { min-height: 295px; border-top-width: 10px; }
.course-card h3 { font-size: 32px; margin-top: 0; }
.course-card .card-index { font-size: 58px; }
.course-card .foot > span:first-child { font: 750 12px/1.8 var(--sans); }
.label { font: 800 11px/1.6 var(--mono); letter-spacing: .7px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; min-width: 0; }
.chip { border: 2px solid var(--ink); background: var(--paper); padding: 3px 8px; font: 700 11px/1.7 var(--mono); overflow-wrap: anywhere; }
.chip.green { background: var(--accent); }
.breadcrumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 28px; font-size: 12px; font-weight: 700; overflow-wrap: anywhere; }
.breadcrumbs a { text-decoration-thickness: 1px; }
.breadcrumbs > span:last-child { background: var(--accent); padding: 1px 6px; }
.tabs { display: flex; flex-wrap: wrap; gap: 10px; max-width: 100%; margin: 0 0 30px; }
.tabs a { display: block; border: 2px solid var(--ink); padding: 9px 24px; text-decoration: none; font-size: 14px; font-weight: 850; background: var(--paper); box-shadow: 3px 3px 0 var(--ink); }
.tabs a.active, .tabs a:hover { background: var(--accent); }
.tabs a.active { border-width: 3px; padding: 8px 23px; }
.tabs a:active { transform: translate(2px,2px); box-shadow: 1px 1px 0 var(--ink); }
.actions { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.pillbtn, .primary, .quiet { display: inline-block; min-height: 43px; padding: 10px 16px; border: 2px solid var(--ink); border-radius: 0; background: var(--paper); color: var(--ink); font-size: 13px; line-height: 1.45; font-weight: 850; text-decoration: none; box-shadow: 3px 3px 0 var(--ink); text-align: center; overflow-wrap: anywhere; }
.primary, .pillbtn.active { background: var(--accent); }
.quiet { border-color: transparent; box-shadow: none; text-decoration: underline; }
:is(.primary,.pillbtn,.quiet):hover:not(:disabled) { background: var(--accent); transform: translate(-1px,-1px); box-shadow: 4px 4px 0 var(--ink); }
:is(.primary,.pillbtn,.quiet):active:not(:disabled) { transform: translate(2px,2px); box-shadow: 1px 1px 0 var(--ink); }
.lesson-layout { display: grid; grid-template-columns: minmax(0,1fr) 174px; align-items: start; gap: 26px; }
.article { min-width: 0; background: var(--paper); border: var(--rule); padding: 34px 36px; overflow-wrap: anywhere; }
.article h1 { font-size: clamp(28px,3vw,39px); font-weight: 950; line-height: 1.4; letter-spacing: -.8px; margin: 0 0 28px; }
.article h1::after { content: ""; display: block; width: 76px; height: 9px; margin-top: 17px; border: 2px solid var(--ink); background: var(--accent); }
.article h2 { border-top: 3px solid var(--ink); padding-top: 19px; margin: 39px 0 16px; font-size: 23px; line-height: 1.5; font-weight: 900; scroll-margin-top: 24px; }
.article h3 { font-size: 19px; line-height: 1.6; font-weight: 850; margin: 28px 0 12px; scroll-margin-top: 24px; }
.article p, .article li { font-size: 17px; line-height: 1.95; }
.article ul, .article ol { padding-left: 24px; }
.article p { margin: 16px 0; }
.article strong { font-weight: 850; }
.article blockquote { margin: 24px 0; border: 2px solid var(--ink); border-left: 9px solid var(--accent); padding: 12px 18px; background: var(--paper); }
.article blockquote p { font-size: 14px; line-height: 1.85; margin: 5px 0; }
.article table { display: block; border-collapse: collapse; width: 100%; max-width: 100%; overflow-x: auto; margin: 24px 0; font-size: 14px; line-height: 1.8; }
.article th, .article td { border: 2px solid var(--ink); padding: 10px 12px; min-width: 100px; vertical-align: top; }
.article th { background: var(--accent); text-align: left; font-weight: 850; }
.article td { background: var(--paper); }
.article code { font: 14px/1.8 var(--mono); background: #f0f0f0; border: 1px solid #ccc; padding: 1px 4px; white-space: pre-wrap; overflow-wrap: anywhere; }
.article pre { max-width: 100%; overflow: auto; border: 2px solid var(--ink); background: var(--ink); color: var(--paper); padding: 19px; margin: 24px 0; }
.article pre code { border: 0; background: transparent; color: inherit; padding: 0; white-space: pre; overflow-wrap: normal; }
.article img { display: block; width: 100%; max-width: 100%; height: auto; margin: 24px 0; border: 2px solid var(--ink); background: var(--paper); }
.formula { max-width: 100%; padding: 18px; border: 2px solid var(--ink); border-left: 9px solid var(--accent); background: var(--paper); font: 18px/1.8 Georgia, serif; overflow-x: auto; white-space: nowrap; margin: 24px 0; }
.article details { border-top: 2px solid var(--ink); padding-top: 12px; margin-top: 20px; }
summary { font-weight: 850; line-height: 1.8; }
.toc { position: sticky; top: 24px; max-height: 85vh; overflow-y: auto; padding: 13px 0; border-top: 8px solid var(--ink); }
.toc .navtitle { margin: 0 0 14px; padding: 4px 8px; background: var(--accent); display: inline-block; color: var(--ink); }
.toc a { display: block; font-size: 12px; line-height: 1.7; margin: 0; padding: 9px 2px; border-bottom: 1px solid #c9c9c9; text-decoration: none; overflow-wrap: anywhere; }
.toc a:hover { text-decoration: underline; text-decoration-thickness: 2px; }
.note { color: var(--muted); font-size: 12px; line-height: 1.85; margin-top: 17px; overflow-wrap: anywhere; }
.reading-nav { border-top: 3px solid var(--ink); margin-top: 36px; padding-top: 20px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 15px; font-size: 14px; font-weight: 850; }
.quizsetup { border: var(--rule); padding: 23px; margin: 26px 0; background: var(--paper); }
.quizsetup label { font-size: 12px; font-weight: 750; }
.quizsetup select { max-width: 100%; padding: 8px; border: 2px solid var(--ink); border-radius: 0; background: var(--paper); font-size: 13px; }
.quizsetup .actions { align-items: center; gap: 15px; }
.quiztop { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin: 24px 0 16px; }
.quiztop strong { font: 900 21px/1.6 var(--mono); }
.sourcepage { font: 700 11px/1.7 var(--mono); overflow-wrap: anywhere; }
.progressrail { border: 2px solid var(--ink); height: 11px; background: var(--paper); margin-bottom: 28px; }
.progressrail span { display: block; height: 100%; background: var(--accent); }
.qcard { min-width: 0; border: var(--rule); padding: 32px; box-shadow: var(--shadow); background: var(--paper); }
.qmeta { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; margin-bottom: 24px; font: 700 11px/1.8 var(--mono); overflow-wrap: anywhere; }
.qmeta > span:first-child { border: 2px solid var(--ink); background: var(--accent); padding: 2px 7px; }
.qprompt { font-size: 23px; font-weight: 850; line-height: 1.8; white-space: pre-wrap; overflow-wrap: anywhere; margin: 0 0 24px; }
.option { display: flex; align-items: center; gap: 13px; border: 2px solid var(--ink); padding: 13px 16px; margin: 13px 0; cursor: pointer; font-size: 16px; line-height: 1.8; overflow-wrap: anywhere; }
.option > span { min-width: 0; flex: 1; }
.option:focus-within { outline: 3px solid var(--ink); outline-offset: 4px; }
.option:hover, .option.selected { background: var(--accent); }
.option.selected { box-shadow: 3px 3px 0 var(--ink); }
.option.correct { color: var(--paper); background: var(--ink); }
.option.correct input { accent-color: var(--paper); }
.option.incorrect { border: 3px dashed var(--ink); background: var(--paper); }
.option.incorrect::after { content: "待釐清"; font-size: 11px; font-weight: 850; flex-shrink: 0; }
.answerinput, textarea { display: block; width: 100%; min-width: 0; border: 2px solid var(--ink); border-radius: 0; background: var(--paper); padding: 14px; font-size: 16px; line-height: 1.8; }
textarea { min-height: 150px; resize: vertical; }
.feedback { border: 2px solid var(--ink); border-left: 9px solid var(--accent); background: var(--paper); padding: 21px; margin-top: 27px; font-size: 15px; line-height: 1.9; overflow-wrap: anywhere; }
.feedback.bad { border-left: 9px double var(--ink); }
.feedback.self { border-left: 9px solid var(--ink); }
.feedback strong { display: block; font-size: 18px; margin-bottom: 12px; }
.feedback .source { font-size: 12px; margin-top: 16px; }
.feedback img { width: 100%; height: auto; margin-top: 18px; border: 2px solid var(--ink); }
.feedback ul { padding-left: 20px; }
.quizbottom { display: flex; justify-content: space-between; gap: 20px; flex-wrap: wrap; margin-top: 26px; }
.qnav { display: flex; flex-wrap: wrap; gap: 10px; margin: 30px 0; }
.qnav button { min-width: 39px; min-height: 39px; border: 2px solid var(--ink); background: var(--paper); font: 800 12px var(--mono); }
.qnav button.current { outline: 2px solid var(--ink); outline-offset: 2px; }
.qnav button.answered { background: var(--accent); }
.qnav button.wrong { border-style: dashed; }
.result { border: var(--rule); padding: 24px; background: var(--accent); box-shadow: var(--shadow); margin: 24px 0 30px; }
.result h2 { font-size: 25px; line-height: 1.5; margin: 0 0 14px; }
.result p { font-size: 14px; }
.empty { border: 3px dashed var(--ink); padding: 38px 25px; background: var(--paper); text-align: center; }
.empty h2 { font-size: 26px; font-weight: 900; }
.empty p { color: var(--muted); font-size: 14px; }
.search-result { display: block; min-width: 0; background: var(--paper); border: 2px solid var(--ink); border-left: 8px solid var(--ink); padding: 20px; margin: 18px 0; text-decoration: none; overflow-wrap: anywhere; }
a.search-result:hover { border-left-color: var(--accent); transform: translate(-2px,-2px); box-shadow: 4px 4px 0 var(--ink); }
.search-result h3 { font-size: 20px; font-weight: 850; line-height: 1.5; margin: 10px 0; }
.search-result p { font-size: 14px; line-height: 1.85; color: var(--muted); margin: 8px 0 0; }
.statrow { display: flex; flex-wrap: wrap; gap: 24px; margin: 24px 0; }
.stat { border-left: 5px solid var(--ink); padding-left: 13px; }
.stat strong { display: inline-block; font: 900 34px/1.4 var(--mono); background: var(--accent); padding: 0 5px; }
.stat span { display: block; font-size: 12px; margin-top: 7px; }
.canvas-wrap { margin-top: 17px; border: 2px solid var(--ink); }
.canvas-toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 9px; border-bottom: 2px solid var(--ink); font-size: 12px; }
.canvas-toolbar button { border: 2px solid var(--ink); background: var(--paper); padding: 4px 8px; }
.draw { display: block; width: 100%; height: 330px; background: var(--paper); touch-action: none; }
.footerline { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px; border-top: 3px solid var(--ink); padding-top: 17px; margin-top: 48px; font: 700 10px/1.8 var(--mono); letter-spacing: .5px; }
.storage-warning { border-bottom: var(--rule); background: var(--accent); padding: 13px 24px; font-size: 13px; font-weight: 750; }
.message { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); max-width: calc(100vw - 32px); background: var(--accent); color: var(--ink); border: var(--rule); box-shadow: var(--shadow); padding: 12px 20px; z-index: 40; font-size: 14px; font-weight: 800; }
.hidden { display: none !important; }
@media (min-width: 1600px) { .content { padding-top: 58px; } }
@media (max-width: 1180px) {
  .side { width: 216px; padding: 25px 14px; }
  .main { margin-left: 216px; }
  .content { padding: 34px 28px 65px; }
  .topbar { padding: 15px 28px; }
  .topcrumb { max-width: 200px; }
  .hero-home { grid-template-columns: minmax(0,1fr) 190px; }
  .hero-home h1 { font-size: 53px; }
  .lesson-layout { grid-template-columns: minmax(0,1fr); }
  .toc { position: static; max-height: none; border-top-width: 3px; }
  .toc a { display: inline-block; margin-right: 14px; padding: 6px 0; }
  .toc .note { display: none; }
  .article { padding: 30px; }
  .grid2, .hs-grid { gap: 20px; }
  .course-card h3 { font-size: 28px; }
}
@media (max-width: 900px) {
  .topcrumb { display: none; }
  .toptools, .search { width: 100%; }
  .hero-home { grid-template-columns: minmax(0,1fr); }
  .hero-home .poster-art { display: none; }
  .hero-home h1 { font-size: clamp(44px,6.5vw,58px); }
  .course-card { min-height: 270px; }
  .grid2, .hs-grid { grid-template-columns: minmax(0,1fr); }
}
@media (max-width: 720px) {
  .side { width: min(292px,85vw); transform: translateX(-110%); box-shadow: 8px 0 0 var(--ink); }
  .side.open { transform: translateX(0); }
  .main { margin-left: 0; }
  .mobilemenu { display: block; }
  .topbar { padding: 13px 18px; min-height: 74px; gap: 13px; }
  .search { min-height: 43px; }
  .search kbd { display: none; }
  .content { padding: 28px 20px 54px; }
  .hero { grid-template-columns: minmax(0,1fr); padding-bottom: 25px; }
  .heroart { display: none; }
  .hero h1 { font-size: 39px; letter-spacing: -1.5px; }
  .hero-home h1 { font-size: clamp(38px,9.8vw,62px); line-height: 1.2; }
  .hero-home h1 .headline-mark { box-shadow: 4px 4px 0 var(--ink); padding: 3px 6px 7px; }
  .hero p, .hero-home p { font-size: 15px; }
  .zine-strip { gap: 8px 15px; margin-top: 0; font-size: 10px; }
  .sectionhead { align-items: flex-start; gap: 12px; flex-wrap: wrap; }
  .sectionhead h2 { font-size: 25px; }
  .sectionhead small { margin-right: 5px; }
  .card { padding: 22px; }
  .course-card { min-height: 260px; }
  .course-card h3 { font-size: 31px; }
  .card-index, .course-card .card-index { font-size: 47px; }
  .tabs { gap: 9px; }
  .tabs a { padding: 9px 17px; }
  .tabs a.active { padding: 8px 16px; }
  .article { padding: 25px 19px; }
  .article h1 { font-size: 29px; }

 "searchText": "ADVANCED SOFTWARE ENGINEERING 從工程觀念、開發流程、需求到系統模型，依講義整理主題式複習內容。 內容入口 課程 ：章節重點、名詞、比較與重畫圖例。 測驗 ：分章複習練習，區分自動批改與手寫自評。 維護內容 跨章概念索引 作業 來源登錄 待釐清問題 返回所有課程 "}, {"id": "courses/advanced-software-engineering/lessons/index", "path": "/ase/lessons", "title": "高等軟體工程｜課程", "short": "高等軟體工程｜課程", "desc": "瀏覽課程筆記與相關內容。", "courseId": "advanced-software-engineering", "sectionId": "lessons", "kind": "section", "status": "", "source": "", "pages": null, "questions": [], "trackReading": false, "metadata": {"title": "高等軟體工程｜課程"}, "readKey": "courses/advanced-software-engineering/lessons/index", "quizKey": "courses/advanced-software-engineering/lessons/index", "recordChapter": "courses/advanced-software-engineering/lessons/index", "html": "\u003ch1\u003e高等軟體工程｜課程\u003c/h1\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#/ase/lessons/1\"\u003e第1章：軟體工程導論\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/ase/lessons/2\"\u003e第2章：軟體流程與開發方法學\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/ase/lessons/3\"\u003e第3章：需求工程\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#/ase/lessons/4\"\u003e第4章：系統塑模與 UML\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003ca href=\"#/ase\"\u003e課程首頁\u003c/a\u003e\u003c/p\u003e", "text": "# 高等軟體工程｜課程\n\n- [第1章：軟體工程導論](chapter-01.md)\n- [第2章：軟體流程與開發方法學](chapter-02.md)\n- [第3章：需求工程](chapter-03.md)\n- [第4章：系統塑模與 UML](chapter-04.md)\n\n[課程首頁](../index.md)\n", "headings": [], "sectionCount": 0, "searchText": "高等軟體工程｜課程 第1章：軟體工程導論 第2章：軟體流程與開發方法學 第3章：需求工程 第4章：系統塑模與 UML 課程首頁 "}, {"id": "courses/advanced-software-engineering/lessons/chapter-01", "path": "/ase/lessons/1", "title": "第一章｜軟體工程導論", "short": "軟體工程導論", "desc": "軟體定義、品質與工程責任", "courseId": "advanced-software-engineering", "sectionId": "lessons", "kind": "lesson", "status": "needs-review", "source": "ASE-001", "pages": 71, "questions": [], "trackReading": true, "metadata": {"id": "ASE-CH01", "title": "第一章｜軟體工程導論", "course": "advanced-software-engineering", "type": "lesson", "status": "needs-review", "created": "2026-11-06", "updated": "2026-11-06", "sources": ["ASE-001"], "tags": ["期中複習", "第1章"]}, "file": "slide01t_intro.pdf", "readKey": "1", "quizKey": "courses/advanced-software-engineering/lessons/chapter-01", "recordChapter": "courses/advanced-software-engineering/lessons/chapter-01", "lessonPath": "/ase/lessons/1", "html": "\u003ch1\u003e第一章｜軟體工程導論\u003c/h1\u003e\n\u003cblockquote\u003e\n\u003cp\u003e依講義重新整理；頁碼一律指 PDF 頁次。例子標為自編；整理稿尚待使用者複核。\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003ch2 id=\"p-fda419344588-s1\"\u003e先掌握本章的問題\u003c/h2\u003e\n\u003cp\u003e程式可以執行，為什麼專案仍可能失敗？因為真正交付的系統還依賴資料、部署程序、文件、團隊協作與長期維護。讀完本章要能區分「軟體的組成」「工程的做法」「開發活動」與「品質特徵」，這四組分類不可混背。[ASE-001，PDF p.14–29]\u003c/p\u003e\n\u003ch2 id=\"p-fda419344588-s2\"\u003e1.1–1.2 軟體發展與軟體危機\u003c/h2\u003e\n\u003cp\u003e大型主機將批次計算自動化；個人電腦帶來文書與試算表；網際網路串連資訊與交易；行動裝置與雲端提供隨時可用的服務；生成式 AI 則加入自然語言互動與內容生成。考試判讀時，要把技術演變連到使用方式改變，而非只背年代。[ASE-001，PDF p.3–6]\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e軟體危機（Software Crisis）\u003c/strong\u003e是系統愈大，原本靠個人經驗寫程式的方法愈無法控制時程、預算與品質。症狀包含延期、超支、缺陷與難以維護；根因是複雜度與協作管理能力跟不上規模。1968 年 NATO 會議是講義強調的軟體工程發展節點。換更快的電腦，無法直接解決需求誤解或團隊溝通問題。[ASE-001，PDF p.8–11]\u003c/p\u003e\n\u003cp\u003e講義用飛行模式衝突、數值溢位、英制／公制不一致說明失效的不同來源。複習應抓「介面或假設沒有對齊」，事件數字並非本整理的核心背誦項目。[ASE-001，PDF p.10]\u003c/p\u003e\n\u003ch2 id=\"p-fda419344588-s3\"\u003e1.3 軟體四大組成：軟體冰山\u003c/h2\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e組成\u003c/th\u003e\n\u003cth\u003e英文\u003c/th\u003e\n\u003cth\u003e自編例子：選課系統\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e程式\u003c/td\u003e\n\u003ctd\u003ePrograms\u003c/td\u003e\n\u003ctd\u003e檢查衝堂、提交加選的程式\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e資料與結構\u003c/td\u003e\n\u003ctd\u003eData \u0026amp; Schemas\u003c/td\u003e\n\u003ctd\u003e名額、課程表、資料庫綱要\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e運作程序\u003c/td\u003e\n\u003ctd\u003eOperational Procedures\u003c/td\u003e\n\u003ctd\u003e部署、備份、故障回復步驟\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e文件\u003c/td\u003e\n\u003ctd\u003eDocumentation\u003c/td\u003e\n\u003ctd\u003e需求規格、API 契約、操作說明\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e來源：[ASE-001，PDF p.14–17]。CPU、記憶體模組是硬體，不是以上的軟體組成。單元測試全通過，仍不能保證資料遷移、部署或備份程序正確。四大組成回答「軟體包含什麼」，四大活動則回答「工程過程做什麼」。\u003c/p\u003e\n\u003ch2 id=\"p-fda419344588-s4\"\u003e1.4 工程與軟體工程\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003e工程（Engineering）\u003c/strong\u003e是在現實約束與有限資源下，運用科學與經驗，設計可用方案。方法須系統化（Systematic）、紀律化（Disciplined）、可量測（Quantifiable / Measurable）。限制可來自期限、預算、平台與規範；資源則包含人力、工具與領域知識。[ASE-001，PDF p.20–24]\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e權衡（Trade-off）\u003c/strong\u003e是說明選擇理由，而非單純選最先進的技術。\u003cstrong\u003e滿意化（Satisficing）\u003c/strong\u003e指在限制下找足以達成目標的方案。自編例：兩週內交付校內點餐系統，可先提供菜單與下單，再擴充推薦功能，但不能為了趕工捨棄必要的付款正確性。\u003c/p\u003e\n\u003ch2 id=\"p-fda419344588-s5\"\u003e1.5 四大核心活動與 V\u0026amp;V\u003c/h2\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e活動\u003c/th\u003e\n\u003cth\u003e核心問題\u003c/th\u003e\n\u003cth\u003e典型產出\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003eSpecification 規格說明\u003c/td\u003e\n\u003ctd\u003e系統要提供什麼？受哪些限制？\u003c/td\u003e\n\u003ctd\u003eSRS、使用者故事、驗收準則\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eDesign \u0026amp; Implementation 設計與實作\u003c/td\u003e\n\u003ctd\u003e如何組織並實現系統？\u003c/td\u003e\n\u003ctd\u003e架構、介面、資料模型、程式\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eValidation 驗證與確認\u003c/td\u003e\n\u003ctd\u003e是否符合規格與實際需求？\u003c/td\u003e\n\u003ctd\u003e測試與審查結果\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eEvolution 軟體演化\u003c/td\u003e\n\u003ctd\u003e上線後如何修正與適應改變？\u003c/td\u003e\n\u003ctd\u003e修補、遷移、版本更新\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e來源：[ASE-001，PDF p.26–29]。四個活動不代表只能線性各做一次；第二章的流程模型決定其順序與頻率。\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e術語\u003c/th\u003e\n\u003cth\u003e問句\u003c/th\u003e\n\u003cth\u003e判斷依據\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003eVerification 驗證\u003c/td\u003e\n\u003ctd\u003eAre we building the product right?\u003c/td\u003e\n\u003ctd\u003e是否符合已定義規格\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eValidation 確認\u003c/td\u003e\n\u003ctd\u003eAre we building the right product?\u003c/td\u003e\n\u003ctd\u003e是否解決真正需求\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e來源：[ASE-001，PDF p.28]。自編例：報表欄位符合規格是 Verification；主管確認這份報表確實支援決策則是 Validation。\u003c/p\u003e\n\u003cp\u003e維護可分：Corrective（修錯）、Adaptive（適應新環境）、Perfective（改善功能或品質）、Preventive（預防未來問題）。例如修登入崩潰、支援新版作業系統、改善查詢效能、重構高風險模組，依序對應四類。[ASE-001，PDF p.29]\u003c/p\u003e\n\u003ch2 id=\"p-fda419344588-s6\"\u003e1.5 延伸：工程原則與工具\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003e關注點分離（Separation of Concerns）\u003c/strong\u003e避免單一模組同時處理畫面、付款、資料查詢與郵件；\u003cstrong\u003e模組化（Modularity）\u003c/strong\u003e建立可理解的邊界；\u003cstrong\u003eDRY\u003c/strong\u003e避免重複知識；\u003cstrong\u003eKISS\u003c/strong\u003e維持簡單；\u003cstrong\u003eYAGNI\u003c/strong\u003e避免實作尚未需要的功能。[ASE-001，PDF p.32–38]\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e布魯克斯法則（Brooks’s Law）\u003c/strong\u003e提醒：對已延期專案加人，可能因培訓、工作拆分與溝通而更慢。不能把人數與產能當成單純線性關係。講義中的溝通複雜度強調成長風險，不應推導成所有專案都必然指數成長。[ASE-001，PDF p.34–36；後句為整理提醒]\u003c/p\u003e\n\u003cp\u003eGit 支援版本與審查；CI/CD 將建置、測試與交付制度化；靜態分析找潛在問題；監控與可觀測性回饋營運狀態。工具的價值在於讓工程規則可持續執行。[ASE-001，PDF p.38]\u003c/p\u003e\n\u003ch2 id=\"p-fda419344588-s7\"\u003e1.6 ISO/IEC 25010 八大品質特徵\u003c/h2\u003e\n\u003cp\u003e本課使用講義列出的\u003cstrong\u003e八大特徵模型\u003c/strong\u003e；講義參考文獻列 ISO/IEC 25010:2011。本頁按課內版本複習，不把它宣稱為所有後續版本都相同的分類。[ASE-001，PDF p.41–44、71]\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e特徵\u003c/th\u003e\n\u003cth\u003e英文\u003c/th\u003e\n\u003cth\u003e辨識線索\u003c/th\u003e\n\u003cth\u003e典型子特徵\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e功能適合性\u003c/td\u003e\n\u003ctd\u003eFunctional Suitability\u003c/td\u003e\n\u003ctd\u003e做的功能對不對、齊不齊\u003c/td\u003e\n\u003ctd\u003e完整性、正確性、適切性\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e效能效率\u003c/td\u003e\n\u003ctd\u003ePerformance Efficiency\u003c/td\u003e\n\u003ctd\u003e快不快、耗多少資源\u003c/td\u003e\n\u003ctd\u003e時間行為、資源利用、容量\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e相容性\u003c/td\u003e\n\u003ctd\u003eCompatibility\u003c/td\u003e\n\u003ctd\u003e能否共存或交換資訊\u003c/td\u003e\n\u003ctd\u003eCo-existence、Interoperability\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e易用性\u003c/td\u003e\n\u003ctd\u003eUsability\u003c/td\u003e\n\u003ctd\u003e易學、易操作、防誤操作\u003c/td\u003e\n\u003ctd\u003eLearnability、Operability、Accessibility\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e可靠性\u003c/td\u003e\n\u003ctd\u003eReliability\u003c/td\u003e\n\u003ctd\u003e故障下是否維持或恢復服務\u003c/td\u003e\n\u003ctd\u003eAvailability、Fault Tolerance、Recoverability\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e資訊安全\u003c/td\u003e\n\u003ctd\u003eSecurity\u003c/td\u003e\n\u003ctd\u003e防未授權讀取或竄改\u003c/td\u003e\n\u003ctd\u003eConfidentiality、Integrity、Authenticity\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e可維護性\u003c/td\u003e\n\u003ctd\u003eMaintainability\u003c/td\u003e\n\u003ctd\u003e易分析、修改與測試\u003c/td\u003e\n\u003ctd\u003eModularity、Testability、Modifiability\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e可攜／可移植性\u003c/td\u003e\n\u003ctd\u003ePortability\u003c/td\u003e\n\u003ctd\u003e更換環境、安裝或替換是否容易\u003c/td\u003e\n\u003ctd\u003eAdaptability、Installability、Replaceability\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e來源：[ASE-001，PDF p.42–44]。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e考題辨識法\u003c/strong\u003e：先找題目描述的問題，不要被技術名詞吸走。外部服務故障造成系統停擺，焦點是 Reliability／Fault Tolerance；模組耦合導致測試困難是 Maintainability；換平台無法安裝是 Portability；查詢太慢是 Performance Efficiency。技術相同也可能改善不同品質，須看情境。[ASE-001，PDF p.44–45；辨識步驟為整理]\u003c/p\u003e\n\u003ch2 id=\"p-fda419344588-s8\"\u003e1.7 倫理與黑暗模式\u003c/h2\u003e\n\u003cp\u003e倫理判斷先守住\u003cstrong\u003e公眾利益（Public）\u003c/strong\u003e，不能以雇主命令合理化危害或造假。其餘原則為 Client \u0026amp; Employer、Product、Judgment、Management、Profession、Colleagues、Self。[ASE-001，PDF p.48–54]\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e黑暗模式\u003c/th\u003e\n\u003cth\u003e英文\u003c/th\u003e\n\u003cth\u003e辨識線索\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e訂閱容易退訂難\u003c/td\u003e\n\u003ctd\u003eRoach Motel\u003c/td\u003e\n\u003ctd\u003e用流程障礙困住使用者\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e確認羞辱\u003c/td\u003e\n\u003ctd\u003eConfirmshaming\u003c/td\u003e\n\u003ctd\u003e用拒絕文案羞辱使用者\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e偷塞購物車\u003c/td\u003e\n\u003ctd\u003eSneak into Basket\u003c/td\u003e\n\u003ctd\u003e未主動選擇卻加入付費品項\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e偽造緊迫感\u003c/td\u003e\n\u003ctd\u003eFabricated Urgency\u003c/td\u003e\n\u003ctd\u003e假倒數或假庫存壓力\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e來源：[ASE-001，PDF p.53]。手寫回答可用「行為 → 被損害的自主／安全利益 → 透明替代流程」三步說明。\u003c/p\u003e\n\u003ch2 id=\"p-fda419344588-s9\"\u003e1.8 AI 輔助開發的判斷\u003c/h2\u003e\n\u003cp\u003e講義以 \u003cstrong\u003eVibe Programming / Vibe Coding\u003c/strong\u003e 描述只靠自然語言生成、很少理解與檢查實作的開發方式。風險不是「用了 AI」，而是把能執行誤認為已符合規格、品質與安全要求。[ASE-001，PDF p.57–65]\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eAutomation Bias 自動化偏誤\u003c/strong\u003e：因輸出流暢自信而不再檢查。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eEcho-Chamber Testing 同溫層測試\u003c/strong\u003e：實作與測試沿用同一個錯誤假設，全部通過仍可能做錯需求。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eCode Churn 程式碼流失／頻繁改寫\u003c/strong\u003e：短時間大量改寫可作為品質風險線索，不能單憑一項數值判定原因。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e來源：[ASE-001，PDF p.58、64–67]。防護方式是先定義規格與驗收條件、獨立檢驗關鍵假設、執行測試與人工審查。AI 在需求、設計、編程、測試與維護都可協助，責任仍由工程團隊承擔。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e待查核提醒\u003c/strong\u003e：講義中的 AI 成效百分比、產業事故歸因與 Software 1.0／2.0／3.0 分期，未在本輪另查原始研究；不將它們改寫成已獨立驗證的普遍事實，也不作客觀題的唯一答案依據。[ASE-001，PDF p.58–61]\u003c/p\u003e\n\u003ch2 id=\"p-fda419344588-s10\"\u003e考前快速自問\u003c/h2\u003e\n\u003cp\u003e能否不看表格寫出軟體四組成、工程四活動、八項品質？能否用同一個系統各舉出資料失誤、程序失誤與程式失誤？能否分清「可復原」與「可移植」？能否解釋為何全部測試通過仍要檢查需求？\u003c/p\u003e\n\u003ch2 id=\"p-fda419344588-s11\"\u003e來源與延伸\u003c/h2\u003e\n\u003cp\u003e\u003ca href=\"#/sources\" title=\"原始教材保存在專案 raw 資料夾\"\u003eASE-001 原始講義\u003c/a\u003e。\u003c/p\u003e\n\u003cp\u003e\u003ca href=\"#/ase/tests/1\"\u003e本章測驗\u003c/a\u003e · \u003ca href=\"#/ase\"\u003e課程首頁\u003c/a\u003e\u003c/p\u003e", "text": "# 第一章｜軟體工程導論\n\n\u003e 依講義重新整理；頁碼一律指 PDF 頁次。例子標為自編；整理稿尚待使用者複核。\n\n## 先掌握本章的問題\n\n程式可以執行，為什麼專案仍可能失敗？因為真正交付的系統還依賴資料、部署程序、文件、團隊協作與長期維護。讀完本章要能區分「軟體的組成」「工程的做法」「開發活動」與「品質特徵」，這四組分類不可混背。[ASE-001，PDF p.14–29]\n\n## 1.1–1.2 軟體發展與軟體危機\n\n大型主機將批次計算自動化；個人電腦帶來文書與試算表；網際網路串連資訊與交易；行動裝置與雲端提供隨時可用的服務；生成式 AI 則加入自然語言互動與內容生成。考試判讀時，要把技術演變連到使用方式改變，而非只背年代。[ASE-001，PDF p.3–6]\n\n**軟體危機（Software Crisis）**是系統愈大，原本靠個人經驗寫程式的方法愈無法控制時程、預算與品質。症狀包含延期、超支、缺陷與難以維護；根因是複雜度與協作管理能力跟不上規模。1968 年 NATO 會議是講義強調的軟體工程發展節點。換更快的電腦，無法直接解決需求誤解或團隊溝通問題。[ASE-001，PDF p.8–11]\n\n講義用飛行模式衝突、數值溢位、英制／公制不一致說明失效的不同來源。複習應抓「介面或假設沒有對齊」，事件數字並非本整理的核心背誦項目。[ASE-001，PDF p.10]\n\n## 1.3 軟體四大組成：軟體冰山\n\n| 組成 | 英文 | 自編例子：選課系統 |\n| --- | --- | --- |\n| 程式 | Programs | 檢查衝堂、提交加選的程式 |\n| 資料與結構 | Data \u0026 Schemas | 名額、課程表、資料庫綱要 |\n| 運作程序 | Operational Procedures | 部署、備份、故障回復步驟 |\n| 文件 | Documentation | 需求規格、API 契約、操作說明 |\n\n來源：[ASE-001，PDF p.14–17]。CPU、記憶體模組是硬體，不是以上的軟體組成。單元測試全通過，仍不能保證資料遷移、部署或備份程序正確。四大組成回答「軟體包含什麼」，四大活動則回答「工程過程做什麼」。\n\n## 1.4 工程與軟體工程\n\n**工程（Engineering）**是在現實約束與有限資源下，運用科學與經驗，設計可用方案。方法須系統化（Systematic）、紀律化（Disciplined）、可量測（Quantifiable / Measurable）。限制可來自期限、預算、平台與規範；資源則包含人力、工具與領域知識。[ASE-001，PDF p.20–24]\n\n**權衡（Trade-off）**是說明選擇理由，而非單純選最先進的技術。**滿意化（Satisficing）**指在限制下找足以達成目標的方案。自編例：兩週內交付校內點餐系統，可先提供菜單與下單，再擴充推薦功能，但不能為了趕工捨棄必要的付款正確性。\n\n## 1.5 四大核心活動與 V\u0026V\n\n| 活動 | 核心問題 | 典型產出 |\n| --- | --- | --- |\n| Specification 規格說明 | 系統要提供什麼？受哪些限制？ | SRS、使用者故事、驗收準則 |\n| Design \u0026 Implementation 設計與實作 | 如何組織並實現系統？ | 架構、介面、資料模型、程式 |\n| Validation 驗證與確認 | 是否符合規格與實際需求？ | 測試與審查結果 |\n| Evolution 軟體演化 | 上線後如何修正與適應改變？ | 修補、遷移、版本更新 |\n\n來源：[ASE-001，PDF p.26–29]。四個活動不代表只能線性各做一次；第二章的流程模型決定其順序與頻率。\n\n| 術語 | 問句 | 判斷依據 |\n| --- | --- | --- |\n| Verification 驗證 | Are we building the product right? | 是否符合已定義規格 |\n| Validation 確認 | Are we building the right product? | 是否解決真正需求 |\n\n來源：[ASE-001，PDF p.28]。自編例：報表欄位符合規格是 Verification；主管確認這份報表確實支援決策則是 Validation。\n\n維護可分：Corrective（修錯）、Adaptive（適應新環境）、Perfective（改善功能或品質）、Preventive（預防未來問題）。例如修登入崩潰、支援新版作業系統、改善查詢效能、重構高風險模組，依序對應四類。[ASE-001，PDF p.29]\n\n## 1.5 延伸：工程原則與工具\n\n**關注點分離（Separation of Concerns）**避免單一模組同時處理畫面、付款、資料查詢與郵件；**模組化（Modularity）**建立可理解的邊界；**DRY**避免重複知識；**KISS**維持簡單；**YAGNI**避免實作尚未需要的功能。[ASE-001，PDF p.32–38]\n\n**布魯克斯法則（Brooks’s Law）**提醒：對已延期專案加人，可能因培訓、工作拆分與溝通而更慢。不能把人數與產能當成單純線性關係。講義中的溝通複雜度強調成長風險，不應推導成所有專案都必然指數成長。[ASE-001，PDF p.34–36；後句為整理提醒]\n\nGit 支援版本與審查；CI/CD 將建置、測試與交付制度化；靜態分析找潛在問題；監控與可觀測性回饋營運狀態。工具的價值在於讓工程規則可持續執行。[ASE-001，PDF p.38]\n\n## 1.6 ISO/IEC 25010 八大品質特徵\n\n本課使用講義列出的**八大特徵模型**；講義參考文獻列 ISO/IEC 25010:2011。本頁按課內版本複習，不把它宣稱為所有後續版本都相同的分類。[ASE-001，PDF p.41–44、71]\n\n| 特徵 | 英文 | 辨識線索 | 典型子特徵 |\n| --- | --- | --- | --- |\n| 功能適合性 | Functional Suitability | 做的功能對不對、齊不齊 | 完整性、正確性、適切性 |\n| 效能效率 | Performance Efficiency | 快不快、耗多少資源 | 時間行為、資源利用、容量 |\n| 相容性 | Compatibility | 能否共存或交換資訊 | Co-existence、Interoperability |\n| 易用性 | Usability | 易學、易操作、防誤操作 | Learnability、Operability、Accessibility |\n| 可靠性 | Reliability | 故障下是否維持或恢復服務 | Availability、Fault Tolerance、Recoverability |\n| 資訊安全 | Security | 防未授權讀取或竄改 | Confidentiality、Integrity、Authenticity |\n| 可維護性 | Maintainability | 易分析、修改與測試 | Modularity、Testability、Modifiability |\n| 可攜／可移植性 | Portability | 更換環境、安裝或替換是否容易 | Adaptability、Installability、Replaceability |\n\n來源：[ASE-001，PDF p.42–44]。\n\n**考題辨識法**：先找題目描述的問題，不要被技術名詞吸走。外部服務故障造成系統停擺，焦點是 Reliability／Fault Tolerance；模組耦合導致測試困難是 Maintainability；換平台無法安裝是 Portability；查詢太慢是 Performance Efficiency。技術相同也可能改善不同品質，須看情境。[ASE-001，PDF p.44–45；辨識步驟為整理]\n\n## 1.7 倫理與黑暗模式\n\n倫理判斷先守住**公眾利益（Public）**，不能以雇主命令合理化危害或造假。其餘原則為 Client \u0026 Employer、Product、Judgment、Management、Profession、Colleagues、Self。[ASE-001，PDF p.48–54]\n\n| 黑暗模式 | 英文 | 辨識線索 |\n| --- | --- | --- |\n| 訂閱容易退訂難 | Roach Motel | 用流程障礙困住使用者 |\n| 確認羞辱 | Confirmshaming | 用拒絕文案羞辱使用者 |\n| 偷塞購物車 | Sneak into Basket | 未主動選擇卻加入付費品項 |\n| 偽造緊迫感 | Fabricated Urgency | 假倒數或假庫存壓力 |\n\n來源：[ASE-001，PDF p.53]。手寫回答可用「行為 → 被損害的自主／安全利益 → 透明替代流程」三步說明。\n\n## 1.8 AI 輔助開發的判斷\n\n講義以 **Vibe Programming / Vibe Coding** 描述只靠自然語言生成、很少理解與檢查實作的開發方式。風險不是「用了 AI」，而是把能執行誤認為已符合規格、品質與安全要求。[ASE-001，PDF p.57–65]\n\n- **Automation Bias 自動化偏誤**：因輸出流暢自信而不再檢查。\n- **Echo-Chamber Testing 同溫層測試**：實作與測試沿用同一個錯誤假設，全部通過仍可能做錯需求。\n- **Code Churn 程式碼流失／頻繁改寫**：短時間大量改寫可作為品質風險線索，不能單憑一項數值判定原因。\n\n來源：[ASE-001，PDF p.58、64–67]。防護方式是先定義規格與驗收條件、獨立檢驗關鍵假設、執行測試與人工審查。AI 在需求、設計、編程、測試與維護都可協助，責任仍由工程團隊承擔。\n\n**待查核提醒**：講義中的 AI 成效百分比、產業事故歸因與 Software 1.0／2.0／3.0 分期，未在本輪另查原始研究；不將它們改寫成已獨立驗證的普遍事實，也不作客觀題的唯一答案依據。[ASE-001，PDF p.58–61]\n\n## 考前快速自問\n\n能否不看表格寫出軟體四組成、工程四活動、八項品質？能否用同一個系統各舉出資料失誤、程序失誤與程式失誤？能否分清「可復原」與「可移植」？能否解釋為何全部測試通過仍要檢查需求？\n\n\n## 來源與延伸\n\n[ASE-001 原始講義](../../../../raw/advanced-software-engineering/lectures/slide01t_intro.pdf)。\n\n[本章測驗](../reviews/chapter-01.md) · [課程首頁](../index.md)\n", "headings": [{"id": "p-fda419344588-s1", "text": "先掌握本章的問題"}, {"id": "p-fda419344588-s2", "text": "1.1–1.2 軟體發展與軟體危機"}, {"id": "p-fda419344588-s3", "text": "1.3 軟體四大組成：軟體冰山"}, {"id": "p-fda419344588-s4", "text": "1.4 工程與軟體工程"}, {"id": "p-fda419344588-s5", "text": "1.5 四大核心活動與 V\u0026V"}, {"id": "p-fda419344588-s6", "text": "1.5 延伸：工程原則與工具"}, {"id": "p-fda419344588-s7", "text": "1.6 ISO/IEC 25010 八大品質特徵"}, {"id": "p-fda419344588-s8", "text": "1.7 倫理與黑暗模式"}, {"id": "p-fda419344588-s9", "text": "1.8 AI 輔助開發的判斷"}, {"id": "p-fda419344588-s10", "text": "考前快速自問"}, {"id": "p-fda419344588-s11", "text": "來源與延伸"}], "sectionCount": 11, "searchText": "第一章｜軟體工程導論 依講義重新整理；頁碼一律指 PDF 頁次。例子標為自編；整理稿尚待使用者複核。 先掌握本章的問題 程式可以執行，為什麼專案仍可能失敗？因為真正交付的系統還依賴資料、部署程序、文件、團隊協作與長期維護。讀完本章要能區分「軟體的組成」「工程的做法」「開發活動」與「品質特徵」，這四組分類不可混背。[ASE-001，PDF p.14–29] 1.1–1.2 軟體發展與軟體危機 大型主機將批次計算自動化；個人電腦帶來文書與試算表；網際網路串連資訊與交易；行動裝置與雲端提供隨時可用的服務；生成式 AI 則加入自然語言互動與內容生成。考試判讀時，要把技術演變連到使用方式改變，而非只背年代。[ASE-001，PDF p.3–6] 軟體危機（Software Crisis） 是系統愈大，原本靠個人經驗寫程式的方法愈無法控制時程、預算與品質。症狀包含延期、超支、缺陷與難以維護；根因是複雜度與協作管理能力跟不上規模。1968 年 NATO 會議是講義強調的軟體工程發展節點。換更快的電腦，無法直接解決需求誤解或團隊溝通問題。[ASE-001，PDF p.8–11] 講義用飛行模式衝突、數值溢位、英制／公制不一致說明失效的不同來源。複習應抓「介面或假設沒有對齊」，事件數字並非本整理的核心背誦項目。[ASE-001，PDF p.10] 1.3 軟體四大組成：軟體冰山 組成 英文 自編例子：選課系統 程式 Programs 檢查衝堂、提交加選的程式 資料與結構 Data \u0026 Schemas 名額、課程表、資料庫綱要 運作程序 Operational Procedures 部署、備份、故障回復步驟 文件 Documentation 需求規格、API 契約、操作說明 來源：[ASE-001，PDF p.14–17]。CPU、記憶體模組是硬體，不是以上的軟體組成。單元測試全通過，仍不能保證資料遷移、部署或備份程序正確。四大組成回答「軟體包含什麼」，四大活動則回答「工程過程做什麼」。 1.4 工程與軟體工程 工程（Engineering） 是在現實約束與有限資源下，運用科學與經驗，設計可用方案。方法須系統化（Systematic）、紀律化（Disciplined）、可量測（Quantifiable / Measurable）。限制可來自期限、預算、平台與規範；資源則包含人力、工具與領域知識。[ASE-001，PDF p.20–24] 權衡（Trade-off） 是說明選擇理由，而非單純選最先進的技術。 滿意化（Satisficing） 指在限制下找足以達成目標的方案。自編例：兩週內交付校內點餐系統，可先提供菜單與下單，再擴充推薦功能，但不能為了趕工捨棄必要的付款正確性。 1.5 四大核心活動與 V\u0026V 活動 核心問題 典型產出 Specification 規格說明 系統要提供什麼？受哪些限制？ SRS、使用者故事、驗收準則 Design \u0026 Implementation 設計與實作 如何組織並實現系統？ 架構、介面、資料模型、程式 Validation 驗證與確認 是否符合規格與實際需求？ 測試與審查結果 Evolution 軟體演化 上線後如何修正與適應改變？ 修補、遷移、版本更新 來源：[ASE-001，PDF p.26–29]。四個活動不代表只能線性各做一次；第二章的流程模型決定其順序與頻率。 術語 問句 判斷依據 Verification 驗證 Are we building the product right? 是否符合已定義規格 Validation 確認 Are we building the right product? 是否解決真正需求 來源：[ASE-001，PDF p.28]。自編例：報表欄位符合規格是 Verification；主管確認這份報表確實支援決策則是 Validation。 維護可分：Corrective（修錯）、Adaptive（適應新環境）、Perfective（改善功能或品質）、Preventive（預防未來問題）。例如修登入崩潰、支援新版作業系統、改善查詢效能、重構高風險模組，依序對應四類。[ASE-001，PDF p.29] 1.5 延伸：工程原則與工具 關注點分離（Separation of Concerns） 避免單一模組同時處理畫面、付款、資料查詢與郵件； 模組化（Modularity） 建立可理解的邊界； DRY 避免重複知識； KISS 維持簡單； YAGNI 避免實作尚未需要的功能。[ASE-001，PDF p.32–38] 布魯克斯法則（Brooks’s Law） 提醒：對已延期專案加人，可能因培訓、工作拆分與溝通而更慢。不能把人數與產能當成單純線性關係。講義中的溝通複雜度強調成長風險，不應推導成所有專案都必然指數成長。[ASE-001，PDF p.34–36；後句為整理提醒] Git 支援版本與審查；CI/CD 將建置、測試與交付制度化；靜態分析找潛在問題；監控與可觀測性回饋營運狀態。工具的價值在於讓工程規則可持續執行。[ASE-001，PDF p.38] 1.6 ISO/IEC 25010 八大品質特徵 本課使用講義列出的 八大特徵模型 ；講義參考文獻列 ISO/IEC 25010:2011。本頁按課內版本複習，不把它宣稱為所有後續版本都相同的分類。[ASE-001，PDF p.41–44、71] 特徵 英文 辨識線索 典型子特徵 功能適合性 Functional Suitability 做的功能對不對、齊不齊 完整性、正確性、適切性 效能效率 Performance Efficiency 快不快、耗多少資源 時間行為、資源利用、容量 相容性 Compatibility 能否共存或交換資訊 Co-existence、Interoperability 易用性 Usability 易學、易操作、防誤操作 Learnability、Operability、Accessibility 可靠性 Reliability 故障下是否維持或恢復服務 Availability、Fault Tolerance、Recoverability 資訊安全 Security 防未授權讀取或竄改 Confidentiality、Integrity、Authenticity 可維護性 Maintainability 易分析、修改與測試 Modularity、Testability、Modifiability 可攜／可移植性 Portability 更換環境、安裝或替換是否容易 Adaptability、Installability、Replaceability 來源：[ASE-001，PDF p.42–44]。 考題辨識法 ：先找題目描述的問題，不要被技術名詞吸走。外部服務故障造成系統停擺，焦點是 Reliability／Fault Tolerance；模組耦合導致測試困難是 Maintainability；換平台無法安裝是 Portability；查詢太慢是 Performance Efficiency。技術相同也可能改善不同品質，須看情境。[ASE-001，PDF p.44–45；辨識步驟為整理] 1.7 倫理與黑暗模式 倫理判斷先守住 公眾利益（Public） ，不能以雇主命令合理化危害或造假。其餘原則為 Client \u0026 Employer、Product、Judgment、Management、Profession、Colleagues、Self。[ASE-001，PDF p.48–54] 黑暗模式 英文 辨識線索 訂閱容易退訂難 Roach Motel 用流程障礙困住使用者 確認羞辱 Confirmshaming 用拒絕文案羞辱使用者 偷塞購物車 Sneak into Basket 未主動選擇卻加入付費品項 偽造緊迫感 Fabricated Urgency 假倒數或假庫存壓力 來源：[ASE-001，PDF p.53]。手寫回答可用「行為 → 被損害的自主／安全利益 → 透明替代流程」三步說明。 1.8 AI 輔助開發的判斷 講義以 Vibe Programming / Vibe Coding 描述只靠自然語言生成、很少理解與檢查實作的開發方式。風險不是「用了 AI」，而是把能執行誤認為已符合規格、品質與安全要求。[ASE-001，PDF p.57–65] Automation Bias 自動化偏誤 ：因輸出流暢自信而不再檢查。 Echo-Chamber Testing 同溫層測試 ：實作與測試沿用同一個錯誤假設，全部通過仍可能做錯需求。 Code Churn 程式碼流失／頻繁改寫 ：短時間大量改寫可作為品質風險線索，不能單憑一項數值判定原因。 來源：[ASE-001，PDF p.58、64–67]。防護方式是先定義規格與驗收條件、獨立檢驗關鍵假設、執行測試與人工審查。AI 在需求、設計、編程、測試與維護都可協助，責任仍由工程團隊承擔。 待查核提醒 ：講義中的 AI 成效百分比、產業事故歸因與 Software 1.0／2.0／3.0 分期，未在本輪另查原始研究；不將它們改寫成已獨立驗證的普遍事實，也不作客觀題的唯一答案依據。[ASE-001，PDF p.58–61] 考前快速自問 能否不看表格寫出軟體四組成、工程四活動、八項品質？能否用同一個系統各舉出資料失誤、程序失誤與程式失誤？能否分清「可復原」與「可移植」？能否解釋為何全部測試通過仍要檢查需求？ 來源與延伸 ASE-001 原始講義 。 本章測驗 · 課程首頁 "}, {"id": "courses/advanced-software-engineering/lessons/chapter-02", "path": "/ase/lessons/2", "title": "第二章｜軟體流程與開發方法學", "short": "軟體流程與開發方法學", "desc": "模型、敏捷與工程實踐", "courseId": "advanced-software-engineering", "sectionId": "lessons", "kind": "lesson", "status": "needs-review", "source": "ASE-002", "pages": 96, "questions": [], "trackReading": true, "metadata": {"id": "ASE-CH02", "title": "第二章｜軟體流程與開發方法學", "course": "advanced-software-engineering", "type": "lesson", "status": "needs-review", "created": "2026-11-06", "updated": "2026-11-06", "sources": ["ASE-002"], "tags": ["期中複習", "第2章"]}, "file": "slide02t_process.pdf", "readKey": "2", "quizKey": "courses/advanced-software-engineering/lessons/chapter-02", "recordChapter": "courses/advanced-software-engineering/lessons/chapter-02", "lessonPath": "/ase/lessons/2", "html": "\u003ch1\u003e第二章｜軟體流程與開發方法學\u003c/h1\u003e\n\u003cblockquote\u003e\n\u003cp\u003e依講義重新整理；頁碼一律指 PDF 頁次。例子標為自編；整理稿尚待使用者複核。\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003ch2 id=\"p-78df9685cd54-s1\"\u003e本章主線\u003c/h2\u003e\n\u003cp\u003e所有流程都含規格、設計實作、驗證與演化，差別在活動何時發生、多久重複，以及如何取得回饋。流程選型要看需求穩定度、風險、交付時間與變更代價，不能只背「敏捷比較新」。[ASE-002，PDF p.7–9]\u003c/p\u003e\n\u003ch2 id=\"p-78df9685cd54-s2\"\u003e2.1 Process 與 Process Model\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eSoftware Process\u003c/strong\u003e 是實際做的一組活動、方法與實踐；\u003cstrong\u003eProcess Model\u003c/strong\u003e 是對流程的抽象描述，交代活動順序、負責角色、產出工件（Artifacts）及驗證時機。模型是理解與管理流程的藍圖，不等同某一套工具。[ASE-002，PDF p.7–8]\u003c/p\u003e\n\u003ch2 id=\"p-78df9685cd54-s3\"\u003e2.2 瀑布與 V-Model\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eWaterfall 瀑布模型\u003c/strong\u003e依序完成需求定義、系統與軟體設計、實作與單元測試、整合與系統測試、維運與維護。階段工件與簽核清楚；風險是可用產品與客戶回饋太晚出現，需求誤解累積到後期才被發現。[ASE-002，PDF p.11–16]\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eV-Model\u003c/strong\u003e 在定義或設計時就規劃對應測試。重點是測試左移（Shift-Left）與雙向追溯（Traceability），不是最後才補測試。[ASE-002，PDF p.17–21]\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e左側開發層級\u003c/th\u003e\n\u003cth\u003e右側測試層級\u003c/th\u003e\n\u003cth\u003e要確認什麼\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003eUser Requirements 使用者需求\u003c/td\u003e\n\u003ctd\u003eAcceptance Testing 驗收測試\u003c/td\u003e\n\u003ctd\u003e是否達成使用者要求\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eSystem Requirements 系統規格\u003c/td\u003e\n\u003ctd\u003eSystem Testing 系統測試\u003c/td\u003e\n\u003ctd\u003e整體系統是否符合規格\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eArchitecture Design 架構設計\u003c/td\u003e\n\u003ctd\u003eIntegration Testing 整合測試\u003c/td\u003e\n\u003ctd\u003e子系統介面與協作是否正確\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eDetailed / Module Design 詳細設計\u003c/td\u003e\n\u003ctd\u003eUnit Testing 單元測試\u003c/td\u003e\n\u003ctd\u003e個別模組是否符合設計\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e來源：[ASE-002，PDF p.19]。\u003cstrong\u003e圖題提醒\u003c/strong\u003e：PDF p.18 的簡化圖把層級合併，分享對話的範例也把架構對應測試寫成 Integration \u0026amp; System Testing。作答時先看該圖的層級切分；詳細四層版按上表，不要只靠某一個選項字面。\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"自編 V-Model 複習圖\" src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI4MjAiIGhlaWdodD0iNDQwIiB2aWV3Qm94PSIwIDAgODIwIDQ0MCIgcm9sZT0iaW1nIiBhcmlhLWxhYmVsPSJ2LW1vZGVsLnN2ZyI+PGRlZnM+PG1hcmtlciBpZD0iYXJyb3ciIHZpZXdCb3g9IjAgMCAxMCAxMCIgcmVmWD0iOSIgcmVmWT0iNSIgbWFya2VyV2lkdGg9IjciIG1hcmtlckhlaWdodD0iNyIgb3JpZW50PSJhdXRvLXN0YXJ0LXJldmVyc2UiPjxwYXRoIGQ9Ik0gMCAwIEwgMTAgNSBMIDAgMTAgeiIgZmlsbD0iIzMxNWI1MyIvPjwvbWFya2VyPjxtYXJrZXIgaWQ9Im9wZW4iIHZpZXdCb3g9IjAgMCAxMCAxMCIgcmVmWD0iOSIgcmVmWT0iNSIgbWFya2VyV2lkdGg9Ijgi
